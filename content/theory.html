 <section>
  <h2>Cloud storage features</h2>
  <div class="clfeat"><div class="clf"><b>Synchronisation</b><span>Your files are kept in step across all your devices. Edit a document on your laptop, and the updated version is on your phone too.</span></div><div class="clf"><b>24/7 availability</b><span>Files can be accessed at any time, from anywhere with an internet connection.</span></div><div class="clf"><b>Redundancy</b><span>Several copies of each file are stored in different places, so if one copy is lost or a server fails, the data is still safe.</span></div><div class="clf"><b>Multiple file versions</b><span>Older versions of files are kept, so you can go back to an earlier version if you make a mistake or a file is damaged.</span></div><div class="clf"><b>Pay for what you use</b><span>You&#39;re normally charged only for the amount of storage you use, e.g. a monthly fee per GB.</span></div><div class="clf"><b>Scalability</b><span>Storage can easily be increased (or decreased) when you need more, without buying new hardware.</span></div></div>
 </section>
 <section>
  <h2>Redundancy</h2>
  <p><b>Storage redundancy</b> means keeping several copies of files in different locations, so that if one copy is lost the data isn&#39;t.</p>
  <ul class="obj"><li>With <b>local storage</b>, this is usually done by keeping copies on two different hard drives, often in the same computer or server. If the building has a fire or flood, both copies could be lost.</li>
   <li>With <b>cloud storage</b>, the copies can be in data centres <b>anywhere in the world</b>, so a disaster in one place doesn&#39;t destroy the data.</li></ul>
 </section>
 <section>
  <h2>Scalability</h2>
  <p><b>Scalability</b> is the ability of a storage system to <b>increase in size</b> when more space is needed.</p>
  <ul class="obj"><li>A home computer <b>isn&#39;t</b> very scalable. You might fit two or three hard drives in it, but not two or three hundred. Increasing local storage usually means <b>buying new drives</b>.</li>
   <li>Cloud storage is very scalable. You simply pay for more space, and you&#39;re normally charged only for the <b>amount of storage you use</b>.</li></ul>
 </section>
 <section>
  <h2>Data centres</h2>
  <p>Data centres are buildings dedicated to housing <b>physical servers</b>.</p>
  <ul class="obj"><li>Each server contains a large array of <b>hard drives</b>.</li><li><b>Professional engineers</b> manage and maintain the computers.</li><li>The buildings have <b>temperature control</b> and air conditioning to stop the servers overheating.</li><li>Data centres are very reliable: they&#39;re often available more than <b>99.99%</b> of the time (called <b>uptime</b>).</li></ul>
 </section>
 <section>
  <h2>Privacy and security</h2>
  <p>When data is stored in the cloud, its security and privacy are controlled by an <b>external company</b>. Data stored locally is under the control of a single person or organisation.</p>
  <p>Both cloud storage and local storage can be hacked. Cloud providers usually have strong security, often stronger than an individual or small business could manage. But a company or organisation has to decide how far it <b>trusts</b> an external company to look after its data.</p>
 </section>
 <section>
  <h2>Data transfer speeds</h2>
  <p>To use a file stored in the cloud, it first has to be <b>downloaded</b> over the internet, and saving it means <b>uploading</b> it again.</p>
  <ul class="obj"><li>With a fast connection and a small file, such as a document, this takes a few seconds.</li><li>With very large files, such as those used in video editing, it can take <b>hours</b> to open or save them.</li></ul>
  <p>Local storage is <b>much faster</b>. A typical solid-state drive can read and write data at around <b>500 MB per second</b>. A typical home internet connection of around 70 Mb/s (mega<b>bits</b> per second) transfers less than <b>10 MB</b> (mega<b>bytes</b>) per second, because there are 8 bits in a byte.</p>
  <h3>Try it: how long will it take?</h3>
  <div class="xferdemo" id="xferdemo"></div>
 </section>
 <section>
  <h2>Cloud vs local storage</h2>
  <div class="kpgrid2">
   <div class="keypts ssd"><h3>Cloud storage</h3><h4>Advantages</h4><ul><li>Access files from <b>anywhere</b>, on any device, with an internet connection</li><li>Files are <b>synchronised</b> across devices</li><li><b>Redundancy</b>: copies kept in many remote locations, so it&#39;s a good off-site backup</li><li><b>Managed by the provider</b>, so you don&#39;t need to maintain any hardware</li><li><b>Scalable</b>: pay only for the storage you use</li></ul>
    <h4>Disadvantages</h4><ul><li><b>Needs an internet connection</b> to access files</li><li><b>Slower</b> to transfer data, especially large files or a full restore after data loss</li><li>Not suitable for large files that need quick access</li><li>An <b>ongoing cost</b>, e.g. a monthly fee</li><li>Privacy and security are controlled by an <b>external company</b></li></ul></div>
   <div class="keypts mag"><h3>Local storage</h3><h4>Advantages</h4><ul><li><b>Much faster</b> data transfer</li><li><b>No internet connection</b> needed</li><li>You keep <b>full control</b> of your data&#39;s privacy</li><li>Usually a <b>one-off cost</b> to buy the drive</li></ul>
    <h4>Disadvantages</h4><ul><li>Can be <b>lost, stolen or damaged</b>, along with the only copy of the data</li><li>You have to make and manage your own <b>backups</b></li><li><b>Limited capacity</b>: more space means buying more drives</li><li>Files are only on that device, unless you copy them</li></ul></div>
  </div>
  <div class="callout"><span class="k">Key points</span><ul class="obj">
   <li>Cloud storage keeps data on <b>physical servers</b> in data centres, accessed <b>remotely</b> over the internet.</li>
   <li>Its main features are synchronisation, 24/7 availability, redundancy, file versions, paying for what you use, and scalability.</li>
   <li>The biggest drawbacks are <b>needing the internet</b>, <b>slower transfers</b>, ongoing costs, and trusting a <b>third party</b> with your data.</li>
   <li>Local storage is faster and under your control, but can be lost or damaged and is harder to scale.</li></ul></div>
 </section>
</div>
</template>
<template id="th-4-2-levels">
<div class="theory airy">
 <section>
  <p class="lede">Computers represent everything in <b>binary</b>. Program instructions, such as IF … THEN … ELSE, have to be converted into binary before the CPU can run them. Binary instructions that the CPU can run directly are called <b>machine code</b>.</p>
  <p>Programmers don&#39;t usually write machine code. They write in languages such as Python, Java or Visual Basic, called <b>high-level languages</b>.</p>
 </section>
 <section>
  <h2>High-level languages</h2>
  <p>High-level languages are called &quot;high level&quot; because they&#39;re <b>close to human language</b> and very different from machine code. They use English words such as IF, THEN, ELSE, WHILE and FOR, which makes them easier to read, write and understand. Most applications are written in a high-level language. Examples include <b>Python</b>, <b>Java</b>, <b>Visual Basic</b>, <b>C#</b> and <b>Ruby</b>.</p>
  <h3>Example</h3>
  <div class="codewin"><div class="cwh"><i></i><i></i><i></i><span>High-level code · Python</span></div><pre>Temperature1 = <span class="ck">int</span>(<span class="ck">input</span>(<span class="cs">"Input temp 1: "</span>))
Temperature2 = <span class="ck">int</span>(<span class="ck">input</span>(<span class="cs">"Input temp 2: "</span>))
Temperature3 = <span class="ck">int</span>(<span class="ck">input</span>(<span class="cs">"Input temp 3: "</span>))

AverageTemperature = (Temperature1 + Temperature2 + Temperature3) / <span class="cn">3</span>

<span class="ck">print</span>(<span class="cs">"Average temperature is:"</span>, AverageTemperature)</pre></div>
  <p>This uses English words and punctuation, so it&#39;s easy for people to understand. The machine code for the same program might look like this:</p>
  <div class="binwall" aria-label="A long string of binary digits">1100111000011101100101101101010100101011100101001101010010101111101000010101110101101010100011010100100100101110100101011000110101001110100011110101010011010110</div>
  <p>That&#39;s very difficult for anybody to understand!</p>
  <div class="callout tip"><span class="k">Spot the bug</span><p>Notice the <b>brackets</b> round the three temperatures. Without them, only Temperature3 would be divided by 3, because division happens before addition.</p></div>
  <p>Another advantage of high-level languages is that they&#39;re <b>machine independent</b> (portable). Unlike machine code and assembly language, a high-level program isn&#39;t tied to one type of processor. It can be translated to run on many different computers.</p>
 </section>
 <section>
  <h2>Low-level languages: machine code</h2>
  <p>Low-level languages are close to the binary the CPU actually runs. There are two: <b>machine code</b> and <b>assembly language</b>.</p>
  <p><b>Machine code</b> is a set of binary instructions that is executed directly by the CPU. Each instruction does one very specific job, such as LOAD, STORE, ADD or SUBTRACT. Each type of CPU has its own set of machine code instructions, called its <b>instruction set</b>.</p>
  <p>A machine code instruction is often 2 bytes (16 bits) long, and is split into parts:</p>
  <div class="stepline"><b>Opcode</b><span>The operation code: what the instruction has to do, e.g. ADD, LOAD, STORE or SUBTRACT.</span></div>
  <div class="stepline"><b>Register</b><span>Which small, fast memory location inside the CPU to use for the calculation.</span></div>
  <div class="stepline"><b>Operand</b><span>Either the value to be operated on, or the address that holds the value.</span></div>
  <div class="ifmt"><div class="ifb op" style="flex:4"><b>Opcode</b><span>4 bits</span><code>0011</code></div><div class="ifb rg" style="flex:2"><b>Register</b><span>2 bits</span><code>01</code></div><div class="ifb od" style="flex:10"><b>Operand</b><span>10 bits</span><code>0000001100</code></div></div><p class="vfoot" style="text-align:center">An example 16-bit (2-byte) machine code instruction: <b>ADD</b> the value at address 12 to register 1.</p>
  <h3>How many bits for each part?</h3>
  <p>The size of each part depends on the processor, and an instruction can be more than 2 bytes long. The more bits a part has, the more it can represent:</p>
  <ul class="obj"><li>If the operand has <b>4 bits</b>, the largest value it can hold is <b>15</b> (16 different values, 0 to 15). With <b>8 bits</b>, it could hold up to <b>255</b>.</li>
   <li>If the register part has <b>2 bits</b>, the processor can use <b>4</b> registers, because 2 bits give 4 combinations: 00, 01, 10 and 11. With <b>3 bits</b>, it could use <b>8</b> registers.</li>
   <li>In general, <b>n bits</b> give <b>2ⁿ</b> combinations.</li></ul>
  <h3>Try it: design an instruction</h3>
  <p>Change how many of the 16 bits each part gets, then click the bits to build an instruction:</p>
  <div class="ifdemo" id="ifdemo"></div>
  <p>It&#39;s possible to write programs in machine code, but it&#39;s very tedious and it&#39;s easy to make mistakes. That&#39;s why most programs today are written in a high-level language, then translated into machine code by a <b>compiler</b> or an <b>interpreter</b>. Assembly language is translated by an <b>assembler</b>.</p>
 </section>
 <section>
  <h2>High-level vs low-level languages</h2>
  <div class="tscroll"><table class="pvt deftab"><tr><th></th><th>High-level languages</th><th>Low-level languages</th></tr>
   <tr><td><b>Reading and writing code</b></td><td>Easier: uses English-like words</td><td>Harder: binary or mnemonics</td></tr>
   <tr><td><b>Debugging</b></td><td>Easier to find and fix errors</td><td>Harder to find and fix errors</td></tr>
   <tr><td><b>Machine independence</b></td><td>Portable: can run on different types of processor</td><td>Machine dependent: written for one type of processor</td></tr>
   <tr><td><b>Direct control of hardware</b></td><td>Usually not possible</td><td>Can directly manipulate hardware and memory addresses</td></tr>
   <tr><td><b>Translation</b></td><td>Needs a compiler or interpreter</td><td>Machine code needs none. Assembly needs an assembler</td></tr>
   <tr><td><b>Speed and memory</b></td><td>Programs may be larger and slower</td><td>Programs can be faster and use less memory</td></tr></table></div>
 </section>
</div>
</template>
<template id="th-4-2-assembly">
<div class="theory airy">
 <section>
  <h2>Assembly language</h2>
  <p class="lede">Machine code is often called a <b>first-generation language</b>. <b>Assembly language</b> is a <b>second-generation language</b>. Both are low-level languages.</p>
  <p>Programming in machine code is possible, but very time-consuming. Assembly language is the next step up: it uses short words called <b>mnemonics</b> to represent each opcode, and denary numbers for the operands. For example, <span class="mono">LDA</span> means &quot;load&quot; and <span class="mono">ADD</span> means &quot;add&quot;.</p>
 </section>
 <section>
  <h2>Example</h2>
  <p>In this example, assume Score1 is stored at memory address 10, Score2 at address 11, Score3 at address 12, and Total at address 15.</p>
  <div class="codecmp"><div><div class="codewin"><div class="cwh"><i></i><i></i><i></i><span>Assembly language</span></div><pre><span class="ck">LDA</span> <span class="cn">10</span>   <span class="cc">; load Score1 (address 10) into the accumulator</span>
<span class="ck">ADD</span> <span class="cn">11</span>   <span class="cc">; add Score2 (address 11)</span>
<span class="ck">ADD</span> <span class="cn">12</span>   <span class="cc">; add Score3 (address 12)</span>
<span class="ck">STA</span> <span class="cn">15</span>   <span class="cc">; store the result in Total (address 15)</span></pre></div></div><div><div class="codewin"><div class="cwh"><i></i><i></i><i></i><span>Machine code</span></div><pre>0001 1010
0011 1011
0011 1100
0010 1111</pre></div></div></div>
  <p>Each line of assembly language matches <b>one</b> machine code instruction. The same program in a high-level language is just one line:</p>
  <div class="codewin"><div class="cwh"><i></i><i></i><i></i><span>High-level code</span></div><pre>Total = Score1 + Score2 + Score3</pre></div>
  <p>Each type of processor has its own set of instructions, and they can&#39;t deal with high-level statements such as IF … THEN … ELSE or WHILE. To test conditions, assembly language uses <b>COMPARE</b> and <b>BRANCH</b> instructions, which jump to a different instruction depending on the result.</p>
 </section>
 <section>
  <h2>The assembler</h2>
  <p>The CPU can only run machine code, so an assembly language program has to be translated. The translator for assembly language is called an <b>assembler</b>. Because each assembly instruction matches one machine code instruction, translation is simple: each mnemonic is swapped for its opcode, and each denary operand for its binary value.</p>
  <h3>Try it: be the assembler</h3>
  <p>Type some assembly language, using the instruction set in the table, and watch it being translated into 8-bit machine code: a 4-bit opcode and a 4-bit operand (address 0 to 15).</p>
  <div class="asmdemo" id="asmdemo"></div>
 </section>
 <section>
  <h2>Pros and cons of assembly language</h2>
  <div class="kpgrid2">
   <div class="keypts ssd"><h3>Advantages</h3><ul><li>Lets the programmer <b>directly manipulate hardware</b>, individual bits and bytes, and memory addresses</li><li>Programs can <b>run very fast</b>, often faster than translated high-level code</li><li>Programs can use <b>less memory</b></li><li>Easier to read than machine code, because of the mnemonics</li></ul></div>
   <div class="keypts mag"><h3>Disadvantages</h3><ul><li><b>Harder to learn</b> and read than a high-level language such as Python</li><li>Errors can be <b>hard to debug</b></li><li>It takes <b>much longer</b> to write a program</li><li><b>Machine dependent</b>: it only works on one type of processor</li></ul></div>
  </div>
 </section>
 <section>
  <h2>Uses of assembly language</h2>
  <div class="stepline"><b>Real-time systems</b><span>Where speed is key and an instant response is needed, e.g. medical equipment such as life-support machines.</span></div>
  <div class="stepline"><b>Embedded systems</b><span>Control programs in devices such as digital watches, washing machines, air conditioning and routers.</span></div>
  <div class="stepline"><b>Device drivers</b><span>Programs that tell the computer how to communicate with a piece of hardware and use it correctly.</span></div>
 </section>
</div>
</template>
<template id="th-4-2-translators">
<div class="theory airy">
 <section>
  <h2>Assemblers, compilers and interpreters</h2>
  <p class="lede">The CPU can only run machine code, so every other kind of code has to be <b>translated</b> first. There are three types of translator, and each can only translate certain kinds of code.</p>
  <figure class="srfig enfig"><svg viewBox="0 0 700 380" role="img" aria-label="Three boxes: high-level code, assembly language and machine code. The assembler connects assembly language to machine code. The compiler and the interpreter each connect high-level code to machine code."><polyline points="330,128 330,200 590,200 590,128" stroke="var(--ink)" stroke-width="3" fill="none"/><polyline points="120,128 120,270 610,270 610,128" stroke="var(--ink)" stroke-width="3" fill="none"/><polyline points="70,128 70,340 630,340 630,128" stroke="var(--ink)" stroke-width="3" fill="none"/><rect x="25" y="25" width="200" height="108" rx="10" fill="#000" opacity=".15"/><rect x="20" y="20" width="200" height="108" rx="10" fill="#B9F2A0" stroke="#14232A" stroke-width="2.5"/><text x="120.0" y="50" text-anchor="middle" class="trt">High-level code</text><text x="120.0" y="78" text-anchor="middle" class="trc">IF … THEN … ELSE</text><text x="120.0" y="100" text-anchor="middle" class="trc">WHILE X &lt; Y</text><rect x="255" y="25" width="200" height="108" rx="10" fill="#000" opacity=".15"/><rect x="250" y="20" width="200" height="108" rx="10" fill="#F3D3F6" stroke="#14232A" stroke-width="2.5"/><text x="350.0" y="50" text-anchor="middle" class="trt">Assembly language</text><text x="350.0" y="78" text-anchor="middle" class="trc">LDA 10</text><text x="350.0" y="100" text-anchor="middle" class="trc">ADD 11</text><rect x="485" y="25" width="200" height="108" rx="10" fill="#000" opacity=".15"/><rect x="480" y="20" width="200" height="108" rx="10" fill="#FFFFFF" stroke="#14232A" stroke-width="2.5"/><text x="580.0" y="50" text-anchor="middle" class="trt">Machine code</text><text x="580.0" y="78" text-anchor="middle" class="trc">0001 1010</text><text x="580.0" y="100" text-anchor="middle" class="trc">0011 1011</text><rect x="398.75" y="183" width="122.5" height="34" rx="8" fill="#14232A"/><text x="460" y="206" text-anchor="middle" class="trtag">Assembler</text><rect x="309.0" y="253" width="112.0" height="34" rx="8" fill="#14232A"/><text x="365" y="276" text-anchor="middle" class="trtag">Compiler</text><rect x="278.25" y="323" width="143.5" height="34" rx="8" fill="#14232A"/><text x="350" y="346" text-anchor="middle" class="trtag">Interpreter</text></svg></figure>
  <ul class="obj"><li>The <b>compiler</b> and <b>interpreter</b> only translate <b>high-level code</b> into machine code. They never translate assembly language.</li><li>The <b>assembler</b> only translates <b>assembly language</b> into machine code. It never translates high-level code.</li></ul>
 </section>
 <section>
  <h2>Assemblers</h2>
  <p>An assembler translates assembly language into machine code. The process is quite simple, because each assembly statement matches one machine code instruction. For example:</p>
  <div class="codecmp"><div><div class="codewin"><div class="cwh"><i></i><i></i><i></i><span>Assembly code statement</span></div><pre>LDA 10</pre></div></div><div><div class="codewin"><div class="cwh"><i></i><i></i><i></i><span>Machine code statement</span></div><pre>0001 1010</pre></div></div></div>
  <div class="callout warnbox"><span class="k">Note</span><p>High-level languages have complex statements. One high-level statement might need <b>many</b> machine code instructions, so an assembler can&#39;t translate it. A compiler or an interpreter is needed instead.</p></div>
 </section>
 <section>
  <h2>Compilers</h2>
  <p>A compiler translates the <b>whole</b> high-level program into machine code <b>at once</b>, before it runs. It produces an <b>executable file</b> (object code), which can then be run.</p>
  <ul class="obj"><li>If errors are found, the compiler gives an <b>error report for the whole program</b>, listing all the errors. No executable file is produced, so none of the program runs until every error is fixed.</li>
   <li>Compiling can be slow, because every line is translated first. But once it&#39;s compiled, the program <b>runs quickly</b>, as many times as needed, without translating it again.</li></ul>
 </section>
 <section>
  <h2>Interpreters</h2>
  <p>Like a compiler, an interpreter converts a high-level language into machine code. But it works through the program <b>line by line</b>: it translates a line, executes it, then moves on to the next line.</p>
  <ul class="obj"><li>When an interpreter finds an error, it <b>stops</b> and displays an error message for that line. All the lines before it have already run.</li>
   <li>No executable file is produced, so the program has to be translated again <b>every time</b> it runs, which is slower.</li></ul>
  <h3>Try it: compile or interpret?</h3>
  <p>Run the same program with a compiler and with an interpreter. Then add an error and compare what happens.</p>
  <div class="trdemo" id="trdemo"></div>
 </section>
 <section>
  <h2>When to use each</h2>
  <div class="kpgrid2">
   <div class="keypts kcmp"><h3>Use a compiler when…</h3><p>…the program is <b>finished, error-free and ready to distribute</b>.</p><ul><li>It produces an <b>executable file</b> that can be run over and over again without being translated again.</li><li>The executable can be run on other computers, which is ideal for selling or sharing the program.</li><li>Users don&#39;t need the programming language or translator installed.</li><li>The source code doesn&#39;t have to be shared.</li></ul></div>
   <div class="keypts kitp"><h3>Use an interpreter when…</h3><p>…the program is still being <b>developed</b>.</p><ul><li>If there&#39;s an error on, say, line 59, lines 1 to 58 still run. You can see how far the program got, which helps you find and understand the error.</li><li>Errors are reported one at a time, at the line where they happen, so they&#39;re easier to fix.</li><li>You don&#39;t have to wait for the whole program to be compiled each time you test it.</li><li>But anyone who runs the code needs the interpreter installed.</li></ul></div>
  </div>
  <div class="tscroll"><table class="pvt deftab"><tr><th></th><th>Compiler</th><th>Interpreter</th></tr>
   <tr><td><b>Translates</b></td><td>The whole program at once</td><td>One line at a time, then runs it</td></tr>
   <tr><td><b>Output</b></td><td>An executable file</td><td>No executable file</td></tr>
   <tr><td><b>Errors</b></td><td>An error report for the whole program</td><td>Stops at the first error</td></tr>
   <tr><td><b>Running speed</b></td><td>Fast, once compiled</td><td>Slower: translated every time</td></tr>
   <tr><td><b>Mostly used</b></td><td>For the final program</td><td>While developing a program</td></tr></table></div>
 </section>
</div>
</template>
<template id="th-3-1-instructions">
<div class="theory airy">
 <section>
  <h2>Instruction sets</h2>
  <p class="lede">An <b>instruction set</b> is the <b>list of all the commands</b> (operations) that a particular CPU can process. The commands are <b>machine code</b>: the low-level binary instructions the CPU is built to handle.</p>
  <p>Each machine code instruction is split into two main parts:</p>
  <div class="stepline"><b>Opcode</b><span>The operation: what the CPU has to do, e.g. ADD, LOAD, STORE or SUBTRACT.</span></div>
  <div class="stepline"><b>Operand</b><span>Either the value to be operated on, or the address of the memory location that holds the value.</span></div>
  <p>Each CPU has only a <b>limited number of opcodes</b>. The set of opcodes it has is its instruction set.</p>
  <div class="callout tip"><span class="k">Interesting point</span><p>The operations are <b>hard-wired</b> into each CPU as electronic circuits made of transistors. Each instruction switches on the transistors needed to carry out that task. Because they&#39;re built into the hardware, new instructions <b>can&#39;t be added with a software update</b>.</p></div>
 </section>
 <section>
  <h2>Example instructions</h2>
  <p>These are typical of the instructions found in an instruction set:</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Operation</th><th>Purpose</th></tr><tr><td><b class="mono">ADD</b></td><td>Add two numbers</td></tr><tr><td><b class="mono">SUB</b></td><td>Subtract one number from another</td></tr><tr><td><b class="mono">MUL</b></td><td>Multiply two numbers</td></tr><tr><td><b class="mono">DIV</b></td><td>Divide one number by another</td></tr><tr><td><b class="mono">IN</b></td><td>Allow input from a device</td></tr><tr><td><b class="mono">OUT</b></td><td>Send a value to an output device</td></tr><tr><td><b class="mono">LOAD</b></td><td>Load a value from memory</td></tr><tr><td><b class="mono">STORE</b></td><td>Store a value in a given memory location</td></tr><tr><td><b class="mono">HALT</b></td><td>Stop the program</td></tr></table></div>
  <h3>Try it: run some instructions</h3>
  <p>Build a short program from the instruction set, then run it. The <b>accumulator (ACC)</b> holds the current value.</p>
  <div class="isdemo" id="isdemo"></div>
 </section>
 <section>
  <h2>Why instruction sets matter</h2>
  <ul class="obj">
   <li>Different types of CPU, e.g. the processors in most laptops and those in most phones, have <b>different instruction sets</b>. A program translated into machine code for one type of CPU <b>won&#39;t run</b> on another.</li>
   <li>This is why machine code and assembly language are <b>machine dependent</b>, but high-level languages can be translated to run on many types of CPU. See the lesson on high-level and low-level languages.</li>
   <li>Every program, however complicated, is eventually broken down into these simple instructions, which the CPU carries out in the fetch–decode–execute cycle. The control unit <b>decodes</b> each opcode to work out which operation to perform.</li>
  </ul>
 </section>
</div>

<template id="th-3-1-embedded">
<div class="theory airy">
 <section>
  <h2>What is an embedded system?</h2>
  <p class="lede">When you think of a computer, you probably picture a laptop or a desktop PC. But most of the computers in the world don&#39;t look like computers at all. They&#39;re hidden <b>inside</b> other devices, such as your washing machine, your car or a vending machine. These are <b>embedded systems</b>.</p>
  <div class="callout"><span class="k">Definition</span><p>An <b>embedded system</b> is a computer system built <b>inside a larger device</b> to perform a <b>dedicated function</b>: one specific job, or a small set of related jobs.</p></div>
  <p>A <b>general purpose computer</b>, such as a PC or a laptop, is different. It&#39;s designed to perform <b>many different functions</b>: you can write an essay, edit a photo, play a game and browse the web, all on the same machine, just by installing and running different software.</p>
  <p>An embedded system in a microwave, on the other hand, only ever controls the microwave. You can&#39;t install a word processor on it!</p>
 </section>
 <section>
  <h2>How an embedded system works</h2>
  <p>An embedded system is built around a <b>microcontroller</b> or <b>microprocessor</b>: a small chip that contains a processor and some memory. Its program, called <b>firmware</b>, is stored in <b>ROM</b> or <b>flash memory</b>, so it&#39;s still there when the device is switched off and runs as soon as it&#39;s switched on.</p>
  <p>Like any computer, it takes <b>inputs</b>, <b>processes</b> them and produces <b>outputs</b>. Many embedded systems take readings from <b>sensors</b> and control <b>actuators</b> (devices that cause movement, such as motors and valves). Here&#39;s the embedded system in a washing machine:</p>

rx="8" fill="#F8EBCF" stroke="#14232A" stroke-width="2"/><text x="605.0" y="63.0" text-anchor="middle" class="embt">Drum motor</text><text x="605.0" y="80.0" text-anchor="middle" class="embs">actuator</text><line x1="432" y1="190" x2="518" y2="66" class="srarr" stroke-width="2.5" marker-end="url(#emA)"/><rect x="520" y="110" width="170" height="52" rx="8" fill="#F8EBCF" stroke="#14232A" stroke-width="2"/><text x="605.0" y="133.0" text-anchor="middle" class="embt">Water heater</text><text x="605.0" y="150.0" text-anchor="middle" class="embs">actuator</text><line x1="432" y1="190" x2="518" y2="136" class="srarr" stroke-width="2.5" marker-end="url(#emA)"/><rect x="520" y="180" width="170" height="52" rx="8" fill="#F8EBCF" stroke="#14232A" stroke-width="2"/><text x="605.0" y="203.0" text-anchor="middle" class="embt">Water valve</text><text x="605.0" y="220.0" text-anchor="middle" class="embs">actuator</text><line x1="432" y1="190" x2="518" y2="206" class="srarr" stroke-width="2.5" marker-end="url(#emA)"/><rect x="520" y="250" width="170" height="52" rx="8" fill="#F8EBCF" stroke="#14232A" stroke-width="2"/><text x="605.0" y="273.0" text-anchor="middle" class="embt">Display</text><text x="605.0" y="290.0" text-anchor="middle" class="embs">output</text><line x1="432" y1="190" x2="518" y2="276" class="srarr" stroke-width="2.5" marker-end="url(#emA)"/><rect x="270" y="110" width="160" height="160" rx="12" fill="#C9F1C0" stroke="#14232A" stroke-width="2.5"/><text x="350" y="150" text-anchor="middle" class="embt">Microcontroller</text><text x="350" y="170" text-anchor="middle" class="embs">processor + memory</text><rect x="290" y="186" width="120" height="66" rx="6" fill="#fff" stroke="#14232A" stroke-width="1.5"/><text x="350" y="208" text-anchor="middle" class="embs">Program stored in</text><text x="350" y="224" text-anchor="middle" class="embs">ROM / flash memory</text><text x="350" y="242" text-anchor="middle" class="embs">(firmware)</text><text x="95" y="24" text-anchor="middle" class="embh">INPUTS</text><text x="605" y="24" text-anchor="middle" class="embh">OUTPUTS</text><text x="350" y="296" text-anchor="middle" class="embh">PROCESS</text></svg></figure>
  <p>The program runs in a <b>continuous loop</b> for as long as the device is on: read the inputs, decide what to do, set the outputs, repeat. For example, the washing machine keeps checking the water level sensor and closes the valve when the drum is full.</p>
  <h3>Try it: a thermostat&#39;s embedded system</h3>
  <p>A heating thermostat has one dedicated job: keep a room at the temperature the user chose. Set a target, then press <b>Run</b> and watch the system loop round, reading the temperature sensor and switching the heater on or off.</p>
  <div class="thdemo" id="thdemo"></div>
 </section>
 <section>
  <h2>Characteristics of embedded systems</h2>
  <div class="stepline"><b>Dedicated function</b><span>Designed to do one specific job, or a small set of related jobs, very well.</span></div>
  <div class="stepline"><b>Part of a larger device</b><span>Built inside the device it controls. Users often don&#39;t realise there&#39;s a computer there at all.</span></div>
  <div class="stepline"><b>Small and low power</b><span>Often physically tiny, and uses very little electricity, so it can run on batteries for a long time.</span></div>
  <div class="stepline"><b>Cheap to make</b><span>Only the hardware needed for the job is included, so it can be mass-produced cheaply, in millions of devices.</span></div>
  <div class="stepline"><b>Firmware in ROM or flash</b><span>The program is fixed for its job and is rarely changed by the user. Some devices can receive firmware updates.</span></div>
  <div class="stepline"><b>Simple interface</b><span>Usually controlled with a few buttons, a dial or a small display, rather than a keyboard, mouse and full screen.</span></div>
  <div class="stepline"><b>Reliable and real-time</b><span>Often has to respond instantly and run for years without crashing, e.g. a car&#39;s airbag or anti-lock brakes.</span></div>
 </section>
 <section>
  <h2>Where are embedded systems used?</h2>
  <p>Embedded systems are everywhere. Here are some of the most common places you&#39;ll find them:</p>
  <div class="clfeat"><div class="clf"><b><span aria-hidden="true">🏠</span> Domestic appliances</b><span>Washing machines, microwaves, dishwashers, fridges and smart thermostats</span></div><div class="clf"><b><span aria-hidden="true">🚗</span> Cars</b><span>Engine management, anti-lock brakes (ABS), airbags, parking sensors and cruise control</span></div><div class="clf"><b><span aria-hidden="true">🔒</span> Security systems</b><span>Burglar alarms, CCTV cameras, smart door locks and motion-sensing lights</span></div><div class="clf"><b><span aria-hidden="true">💡</span> Lighting systems</b><span>Street lights that switch on at dusk, smart bulbs and traffic lights</span></div><div class="clf"><b><span aria-hidden="true">🥤</span> Vending machines</b><span>Accepting payment, checking stock, releasing the item and giving change</span></div><div class="clf"><b><span aria-hidden="true">⌚</span> Everyday devices</b><span>Digital watches, TV remote controls, printers, routers and fitness trackers</span></div></div>
  <div class="callout tip"><span class="k">Exam tip</span><p>To decide if something is an embedded system, ask: <b>does it have one dedicated job inside a larger device?</b> A smartphone or a laptop runs many different apps, so it&#39;s a <b>general purpose</b> computer. But a smartphone still contains embedded systems, e.g. the chip that controls its camera or battery charging.</p></div>
 </section>
 <section>
  <h2>Embedded vs general purpose computers</h2>
  <div class="tscroll"><table class="pvt deftab"><tr><th></th><th>Embedded system</th><th>General purpose computer</th></tr>
   <tr><td><b>Purpose</b></td><td>One dedicated function</td><td>Many different functions</td></tr>
   <tr><td><b>Software</b></td><td>Fixed firmware, in ROM or flash memory</td><td>Users install and run many different programs</td></tr>
   <tr><td><b>Size and power</b></td><td>Small, low power</td><td>Larger, uses more power</td></tr>
   <tr><td><b>Cost</b></td><td>Cheap to mass-produce</td><td>More expensive</td></tr>
   <tr><td><b>Interface</b></td><td>Simple: buttons, dials, a small display</td><td>Keyboard, mouse, touchscreen, full display</td></tr>
   <tr><td><b>Examples</b></td><td>Washing machine, car ABS, vending machine</td><td>PC, laptop</td></tr></table></div>
  <div class="kpgrid2">
   <div class="keypts ssd"><h3>Advantages of embedded systems</h3><ul><li>Small, so they fit inside devices</li><li>Cheap to mass-produce</li><li>Use very little power</li><li>Fast and reliable at their one job</li><li>Can respond in real time</li></ul></div>
   <div class="keypts mag"><h3>Disadvantages of embedded systems</h3><ul><li>Can only do the job they were designed for</li><li>Difficult to upgrade, and some can&#39;t be updated at all</li><li>If they fail, the whole device may need to be repaired or replaced</li><li>Devices connected to the internet can be a security risk if they&#39;re not updated</li></ul></div>
  </div>
 </section>
</div>

<template id="th-4-2-ides">
<div class="theory airy">
 <section>
  <p class="lede">You <i>could</i> write a program in a basic text editor such as Notepad. But you&#39;d soon run into problems: there are no line numbers to help you find an error, everything is the same colour, you can&#39;t run the code, and nothing tells you where you went wrong.</p>
  <p>That&#39;s why programmers use an <b>IDE</b>.</p>
 </section>
 <section>
  <h2>What is an IDE?</h2>
  <div class="callout"><span class="k">Definition</span><p>An <b>integrated development environment (IDE)</b> is a piece of software that brings together all the tools a programmer needs to <b>write, translate, run, test and debug</b> program code, in one place.</p></div>
  <p>Examples of IDEs include <b>IDLE</b> (which comes with Python), <b>Visual Studio</b>, <b>Visual Studio Code</b>, <b>Eclipse</b> and <b>Thonny</b>.</p>
  <p>The syllabus lists seven common functions of an IDE. You&#39;ll meet each one in this lesson:</p>
  <div class="clfeat">
   <div class="clf"><b>Code editor</b><span>Where the code is written and edited.</span></div>
   <div class="clf"><b>Run-time environment</b><span>Lets the program be run and tested inside the IDE.</span></div>
   <div class="clf"><b>Translator</b><span>A built-in compiler or interpreter.</span></div>
   <div class="clf"><b>Error diagnostics</b><span>Finds errors and shows where they are.</span></div>
   <div class="clf"><b>Auto-completion</b><span>Suggests code as you type.</span></div>
   <div class="clf"><b>Auto-correction</b><span>Fixes common typing mistakes.</span></div>
   <div class="clf"><b>Prettyprint</b><span>Formats code so it&#39;s neat and easy to read.</span></div>
  </div>
 </section>
 <section>
  <h2>Try it: a mock IDE</h2>
  <p>This is a small program that asks the user to guess a secret number. Use the switches to turn each IDE feature on and off, and see how much easier the code is to work with.</p>
  <div class="idedemo" id="idedemo"></div>
 </section>
 <section>
  <h2>The code editor</h2>
  <p>The <b>code editor</b> is where the programmer types and edits their code. It&#39;s like a word processor, but designed for code. As well as basic editing, an IDE&#39;s code editor usually has:</p>
  <div class="stepline"><b>Line numbers</b><span>Each line is numbered, so the programmer can quickly find a line, and error messages can say exactly which line has a problem.</span></div>
  <div class="stepline"><b>Syntax highlighting</b><span>Different parts of the code are shown in different colours, e.g. keywords, strings and numbers. This makes code easier to read and helps spot mistakes, such as a string that hasn&#39;t been closed.</span></div>
  <div class="stepline"><b>Code folding</b><span>Blocks of code, such as a function, can be collapsed (folded) to hide them while working on another part. Notice how the line numbers jump when code is folded. Mark schemes call this <b>expanding and collapsing blocks</b>.</span></div>
  <div class="stepline"><b>Auto-documentation</b><span>Some IDEs can produce documentation for a program automatically, e.g. a list of its functions and the comments that describe them.</span></div>
 </section>
 <section>
  <h2>Prettyprint</h2>
  <p><b>Prettyprint</b> formats the code so it&#39;s <b>neat and consistent</b>: for example, the same indentation everywhere, spaces around operators, and keywords in a consistent colour or style.</p>
  <ul class="obj"><li>Well-formatted code is much <b>easier to read</b>, so it&#39;s easier to understand and to spot errors.</li><li>When several programmers work on the same program, prettyprint keeps everyone&#39;s code in the <b>same style</b>.</li></ul>
  <p>Switch <b>Prettyprint</b> off and on in the mock IDE above to compare messy and neat versions of the same code.</p>
 </section>
 <section>
  <h2>Error diagnostics</h2>
  <p><b>Error diagnostics</b> help the programmer find and fix errors. The IDE <b>highlights</b> or <b>underlines</b> errors in the code, and lists them with the <b>line number</b> and a message explaining what&#39;s wrong.</p>
  <p>Press <b>Add errors</b> in the mock IDE, then turn <b>Error diagnostics</b> on to see the problems pointed out.</p>
  <h3>Debugging tools</h3>
  <p>Many IDEs also include a <b>debugger</b>. This finds <b>logic errors</b>, where the program runs but gives the wrong result:</p>
  <div class="stepline"><b>Breakpoints</b><span>The programmer marks a line. When the program reaches it, it <b>pauses</b>.</span></div>
  <div class="stepline"><b>Stepping</b><span>The program can then be run <b>one line at a time</b>, to see exactly which path it takes.</span></div>
  <div class="stepline"><b>Variable watch</b><span>Shows the value of each variable as it changes, so the programmer can check the values are what they expect.</span></div>
  <p>Try it. Click a line number to add a breakpoint, then press <b>Continue</b> to run to it, or <b>Step</b> to go one line at a time. The user&#39;s guesses are 4, 9 and then 7.</p>
  <div class="dbgdemo" id="dbgdemo"></div>
 </section>
 <section>
  <h2>Run-time environment and translators</h2>
  <p>The <b>run-time environment</b> lets the programmer <b>run the program inside the IDE</b> and test it, without having to leave the IDE. It provides everything the program needs to run, such as access to the language&#39;s built-in libraries, and if the program crashes it reports what went wrong.</p>
  <p>IDEs also include a <b>translator</b>, because the code has to be turned into machine code before it can run:</p>
  <ul class="obj"><li>If the IDE uses an <b>interpreter</b>, pressing Run translates and runs the code line by line, stopping at the first error. This is helpful while debugging.</li><li>If it uses a <b>compiler</b>, pressing Run compiles the whole program first (often into a temporary file), then runs it.</li></ul>
 </section>
 <section>
  <h2>Auto-completion and auto-correction</h2>
  <div class="stepline"><b>Auto-completion</b><span>As the programmer types, the IDE <b>suggests</b> keywords, function names and variable names that match. Pressing Tab or Enter fills in the rest. It can also add the closing bracket or quote automatically. This speeds up typing and stops names being misspelled.</span></div>
  <div class="stepline"><b>Auto-correction</b><span>The IDE <b>automatically fixes</b> common mistakes, such as a misspelled keyword like <span class="mono">pirnt</span> → <span class="mono">print</span>.</span></div>
  <div class="callout warnbox"><span class="k">Be careful</span><p>Some programmers turn auto-correction off. If it &quot;fixes&quot; something that wasn&#39;t actually wrong, it can quietly add a new error that&#39;s hard to spot.</p></div>
  <h3>Try it</h3>
  <p>Start typing a keyword (try <span class="mono">pr</span>, <span class="mono">in</span> or <span class="mono">wh</span>), or type a common typo such as <span class="mono">pirnt</span> or <span class="mono">whlie</span> followed by a space.</p>
  <div class="acdemo" id="acdemo"></div>
 </section>
 <section>
  <h2>Summary</h2>
  <div class="tscroll"><table class="pvt deftab"><tr><th>IDE function</th><th>What it does</th></tr>
   <tr><td><b>Code editor</b></td><td>Lets code be written and edited, with tools such as line numbers, syntax highlighting and code folding</td></tr>
   <tr><td><b>Run-time environment</b></td><td>Lets the program be run and tested within the IDE</td></tr>
   <tr><td><b>Translator</b></td><td>A built-in compiler or interpreter that turns the code into machine code</td></tr>
   <tr><td><b>Error diagnostics</b></td><td>Highlights errors and reports them with line numbers, to help find and fix them</td></tr>
   <tr><td><b>Auto-completion</b></td><td>Suggests and fills in keywords and names as the programmer types</td></tr>
   <tr><td><b>Auto-correction</b></td><td>Automatically corrects common mistakes, such as misspelled keywords</td></tr>
   <tr><td><b>Prettyprint</b></td><td>Formats code with consistent indentation, spacing and colour, so it&#39;s easier to read</td></tr></table></div>
 </section>
</div>
</template>
<template id="th-4-1-interrupts">
<div class="theory airy">
 <section>
  <p class="lede">Imagine you&#39;re doing your homework and your phone buzzes. You finish the sentence you&#39;re writing, remember where you were, answer the message, then go back to your homework exactly where you left off. That&#39;s how a CPU deals with an <b>interrupt</b>.</p>
 </section>
 <section>
  <h2>What is an interrupt?</h2>
  <div class="callout"><span class="k">Definition</span><p>An <b>interrupt</b> is a <b>signal</b> sent to the CPU to tell it that an <b>event needs attention</b>.</p></div>
  <p>Interrupts can be generated by <b>hardware</b> devices or by <b>software</b>. For example:</p>
  <ul class="obj"><li>A key is pressed on the keyboard, or the mouse is clicked</li><li>The printer runs out of paper or has a paper jam</li><li>Data arrives from the network</li><li>A program tries to <b>divide by zero</b></li><li>A timer signals that it&#39;s time to switch to another program</li></ul>
  <h3>Why are interrupts needed?</h3>
  <p>Without interrupts, the CPU would have to keep checking every device again and again to see if anything needed attention. This is called <b>polling</b>, and it wastes a lot of processing time, because most of the time nothing has happened.</p>
  <p>With interrupts, the CPU can get on with running programs, and devices <b>tell it</b> when they need attention. Interrupts also let the computer respond <b>straight away</b> to important events, and let it switch between programs to <b>multitask</b>.</p>
 </section>
 <section>
  <h2>Hardware and software interrupts</h2>
  <div class="kpgrid2">
   <div class="keypts ssd"><h3>Hardware interrupts</h3><p>Generated by a <b>physical device</b> outside the CPU.</p><ul><li>A key is pressed or the mouse is moved</li><li>The printer is out of paper or has jammed</li><li>The network card receives data</li><li>A device has finished a task, e.g. a file has finished saving</li><li>A hardware fault, e.g. power failure</li></ul></div>
   <div class="keypts mag"><h3>Software interrupts</h3><p>Generated by a <b>running program</b> or the <b>operating system</b>.</p><ul><li><b>Division by zero</b></li><li>A program asks the operating system for a service, e.g. to open a file</li><li>A program tries to access memory it isn&#39;t allowed to use</li><li>A timer interrupt tells the OS to switch to another program (multitasking)</li></ul></div>
  </div>
 </section>
 <section>
  <h2>Interrupt service routines (ISRs)</h2>
  <p>Each type of interrupt has its own <b>interrupt service routine (ISR)</b>, sometimes called an interrupt handler. An ISR is a short program that deals with that particular interrupt.</p>
  <p>For example, the ISR for a key press reads which key was pressed and passes it to the program. The ISR for &quot;printer out of paper&quot; displays a message asking the user to add paper.</p>
  <p>Handling interrupts and running ISRs is one of the jobs of the <b>operating system</b>.</p>
 </section>
 <section>
  <h2>What happens when an interrupt occurs?</h2>
  <p>At the end of each fetch–decode–execute cycle, the CPU checks whether any interrupts are waiting. If there is one, it follows these steps:</p>
  <div class="stepline"><b>Step 1</b><span>An <b>interrupt</b> signal is sent to the CPU by a device or a program.</span></div><div class="stepline"><b>Step 2</b><span>The CPU <b>finishes the instruction</b> it is currently carrying out.</span></div><div class="stepline"><b>Step 3</b><span>The CPU <b>saves the state</b> of the current program: the contents of the registers, including the program counter.</span></div><div class="stepline"><b>Step 4</b><span>The CPU identifies the interrupt and runs the matching <b>interrupt service routine (ISR)</b>.</span></div><div class="stepline"><b>Step 5</b><span>When the ISR has finished, the CPU <b>restores the saved state</b> by loading the values back into the registers.</span></div><div class="stepline"><b>Step 6</b><span>The CPU <b>resumes</b> the original program from exactly where it stopped.</span></div>
  <div class="callout tip"><span class="k">Why save the state?</span><p>The ISR uses the same registers as the program. If the CPU didn&#39;t save the program counter and the other registers first, it would lose its place, and the program couldn&#39;t carry on from where it stopped.</p></div>
 </section>
 <section>
  <h2>Interrupt queues and priorities</h2>
  <p>Sometimes several interrupts arrive at once, or while the CPU is already dealing with one. They wait in an <b>interrupt queue</b>.</p>
  <ul class="obj"><li>Each interrupt is given a <b>priority</b>. Interrupts with a <b>higher priority</b> are dealt with <b>first</b>. A power failure is far more urgent than a key press!</li><li>Interrupts with the <b>same priority</b> are dealt with in the order they arrived: <b>first in, first out (FIFO)</b>.</li></ul>
  <div class="callout"><span class="k">The rule</span><p><b>Priority first, then first in, first out.</b></p></div>
  <h3>Try it: the interrupt simulator</h3>
  <p>The CPU is running a program. Send it some interrupts, then step through to watch it finish its instruction, save its state, run each ISR in priority order, restore its state and carry on.</p>
  <div class="intdemo" id="intdemo"></div>
 </section>
 <section>
  <h2>Exam technique</h2>
  <div class="callout tip"><span class="k">A full-mark answer</span><p>If you&#39;re asked to describe what happens when an interrupt occurs, make sure you mention:</p>
   <ul class="obj"><li>An interrupt signal is sent to the CPU</li><li>The CPU finishes its current instruction</li><li>The current state (registers, program counter) is saved</li><li>The interrupt is identified and its ISR is run (higher priority interrupts first)</li><li>The saved state is restored</li><li>The original program resumes from where it stopped</li></ul></div>
  <div class="callout warnbox"><span class="k">Common mistakes</span><ul class="obj"><li>Saying the CPU stops <b>immediately</b>. It finishes the current instruction first.</li><li>Forgetting to <b>save</b> and then <b>restore</b> the state.</li><li>Mixing up interrupts and <b>polling</b>. With polling, the CPU keeps checking. With interrupts, the device tells the CPU.</li></ul></div>
 </section>
</div>
</template>
<template id="th-4-1-software">
<div class="theory airy">
 <section>
  <p class="lede"><b>Hardware</b> is the physical parts of a computer that you can touch. <b>Software</b> is the programs that run on it: the sets of instructions that tell the hardware what to do. Without software, the hardware is useless.</p>
  <p>There are two main types of software: <b>system software</b> and <b>application software</b>.</p>
  <div class="swsplit">
   <div class="swcol sys"><span class="eyebrow">System software</span><p>Provides the services that the <b>computer</b> needs to run effectively.</p><small>e.g. operating systems, anti-virus, defragmentation</small></div>
   <div class="swcol app"><span class="eyebrow">Application software</span><p>Provides the services that the <b>user</b> needs, so they can do useful tasks.</p><small>e.g. word processors, photo editors, games</small></div>
  </div>
 </section>
 <section>
  <h2>System software</h2>
  <p>System software is the set of programs that are <b>needed for the computer to run</b>, and to keep it running smoothly and securely. Users often don&#39;t notice it, because it works in the background. There are two kinds you need to know:</p>
  <div class="stepline"><b>Operating system</b><span>The most important piece of software. It manages the hardware and provides a platform for applications to run on. Examples include <b>Windows</b>, <b>macOS</b>, <b>Linux</b>, <b>Android</b> and <b>iOS</b>.</span></div>
  <div class="stepline"><b>Utility software</b><span>Small programs that help to <b>maintain</b>, <b>protect</b> and <b>optimise</b> the computer.</span></div>
  <h3>Examples of utility software</h3>
  <div class="clfeat"><div class="clf"><b><span aria-hidden="true">🛡️</span> Anti-virus</b><span>Scans files and memory for viruses and other malware, then quarantines or deletes anything it finds.</span></div><div class="clf"><b><span aria-hidden="true">🧱</span> Firewall</b><span>Monitors the data coming into and out of a computer or network, and blocks anything that isn't allowed.</span></div><div class="clf"><b><span aria-hidden="true">🧩</span> Defragmentation</b><span>Rearranges the pieces of files on a hard disk drive so each file is stored together, making files quicker to read. It isn't needed on an SSD.</span></div><div class="clf"><b><span aria-hidden="true">💾</span> Backup</b><span>Makes copies of files, so they can be restored if the originals are lost, damaged or deleted.</span></div><div class="clf"><b><span aria-hidden="true">🗜️</span> Compression</b><span>Makes files smaller, so they take up less storage space and are quicker to send.</span></div><div class="clf"><b><span aria-hidden="true">🔐</span> Encryption</b><span>Scrambles data so it can't be understood without the key, if it's stolen or intercepted.</span></div><div class="clf"><b><span aria-hidden="true">🧹</span> Disk clean-up</b><span>Finds and deletes temporary and unwanted files to free up storage space.</span></div><div class="clf"><b><span aria-hidden="true">📁</span> File management</b><span>Lets the user copy, move, rename, delete and organise files and folders.</span></div></div>
 </section>
 <section>
  <h2>Application software</h2>
  <p>Application software, often called <b>apps</b>, is the programs that let the <b>user</b> do useful tasks. For example, Microsoft Word lets users word process, Photoshop lets them edit images, and SketchUp lets them create 3D models.</p>
  <div class="clfeat"><div class="clf"><b><span aria-hidden="true">📝</span> Word processor</b><span>Writing letters, essays and reports</span></div><div class="clf"><b><span aria-hidden="true">📊</span> Spreadsheet</b><span>Calculations, budgets and charts</span></div><div class="clf"><b><span aria-hidden="true">🖼️</span> Photo editor</b><span>Editing and enhancing images</span></div><div class="clf"><b><span aria-hidden="true">🌐</span> Web browser</b><span>Viewing websites</span></div><div class="clf"><b><span aria-hidden="true">🎮</span> Games</b><span>Entertainment</span></div><div class="clf"><b><span aria-hidden="true">🧊</span> 3D modelling</b><span>Designing 3D objects and buildings</span></div><div class="clf"><b><span aria-hidden="true">🎬</span> Video editor</b><span>Cutting and editing video</span></div><div class="clf"><b><span aria-hidden="true">✉️</span> Email client</b><span>Sending and receiving emails</span></div></div>
  <div class="callout tip"><span class="k">How to tell them apart</span><p>Ask: <b>who is the software for?</b> If it helps the <b>computer</b> run, maintain itself or stay secure, it&#39;s system software. If it helps the <b>user</b> carry out a task, such as writing an essay or editing a photo, it&#39;s application software.</p></div>
 </section>
 <section>
  <h2>Hardware, firmware, operating system and applications</h2>
  <p>To run an application, a computer needs several layers, each one running on the one below it:</p>
  <div class="swlayers" id="swlayers"></div>
  <ul class="obj">
   <li><b>Applications</b> are run on the <b>operating system</b>. They don&#39;t control the hardware directly: they ask the OS to do it for them.</li>
   <li>The <b>operating system</b> is run on the <b>firmware</b>.</li>
   <li>The <b>firmware</b>, including the <b>bootloader</b>, is run on the <b>hardware</b>. Firmware is stored in ROM or flash memory, so it&#39;s there as soon as the computer is switched on.</li>
  </ul>
  <h3>Try it: switch the computer on</h3>
  <p>Press the power button and watch each layer start up in turn, from the hardware to the application.</p>
  <div class="bootdemo" id="bootdemo"></div>
 </section>
 <section>
  <h2>System vs application software</h2>
  <div class="tscroll"><table class="pvt deftab"><tr><th></th><th>System software</th><th>Application software</th></tr>
   <tr><td><b>Purpose</b></td><td>Provides the services the computer needs</td><td>Provides the services the user needs</td></tr>
   <tr><td><b>Runs</b></td><td>Mostly in the background</td><td>When the user opens it</td></tr>
   <tr><td><b>Needed for the computer to work?</b></td><td>Yes: the computer can&#39;t run without an operating system</td><td>No: the computer works without it</td></tr>
   <tr><td><b>Examples</b></td><td>Operating systems, anti-virus, firewall, backup, defragmentation</td><td>Word processor, spreadsheet, web browser, games</td></tr></table></div>
 </section>
</div>
</template>
<template id="th-3-2-input">
<div class="theory airy">
 <section>
  <p class="lede">A computer is no use if you can&#39;t get data into it. An <b>input device</b> is any hardware that <b>sends data into a computer</b>, so it can be processed.</p>
  <p>Input devices are needed because the CPU can only work with <b>binary data</b>. Each input device captures something from the real world, such as a key press, a sound or an image, and converts it into binary that the computer can process.</p>
 </section>
 <section>
  <h2>Input devices you need to know</h2>
  <p>Choose a device to see what it does, how it works, where it&#39;s used, and its advantages and disadvantages.</p>
  <div class="devx" data-devs="barcode,qr,camera,keyboard,mic,mouse,touch,scan2d,scan3d"></div>
 </section>
 <section>
  <h2>Touch screens</h2>
  <p>You need to know three types of touch screen. They all detect where the screen is touched, but in different ways:</p>
  <div class="stepline"><b>Resistive</b><span>Made of two flexible layers with a small gap between them. Pressing the screen pushes the layers together, and the point where they touch is detected. Works with a finger, a gloved finger or any stylus. Cheap, but less clear and less responsive, and usually only detects one touch at a time.</span></div>
  <div class="stepline"><b>Capacitive</b><span>A glass screen with a conductive layer that holds an electric charge. A bare finger is a conductor, so touching the screen changes the charge at that point, and sensors work out the position. Very clear and responsive, supports multi-touch (e.g. pinch to zoom). Doesn&#39;t work with ordinary gloves or a plastic stylus. Used in most phones and tablets.</span></div>
  <div class="stepline"><b>Infra-red</b><span>A grid of infra-red light beams runs across the front of the screen, from LEDs on two edges to sensors on the opposite edges. Touching the screen breaks beams, and the broken beams give the position. Works with any object, including gloves. Often used for large screens, e.g. interactive whiteboards.</span></div>
  <h3>Try it: which touches work?</h3>
  <p>Choose a type of screen, then touch it with different things.</p>
  <div class="tsdemo" id="tsdemo"></div>
 </section>
 <section>
  <h2>Input devices built into phones, tablets and kiosks</h2>
  <p>Exam questions often describe a <b>smartphone</b>, <b>tablet</b>, <b>ATM</b> or <b>self-service checkout</b> and ask which input devices are built in. Common answers:</p>
  <div class="tscroll"><table class="pvt deftab" style="max-width:720px">
   <tr><th>Device</th><th>What it inputs</th></tr>
   <tr><td><b>Touch screen</b> / <b>touch pad</b></td><td>The position of a touch, e.g. selecting an app or an option</td></tr>
   <tr><td><b>Keypad</b> / <b>buttons</b></td><td>Numbers such as a PIN, or simple commands such as volume up and down</td></tr>
   <tr><td><b>Microphone</b></td><td>Sound, e.g. voice calls and voice commands</td></tr>
   <tr><td><b>Digital camera</b></td><td>Photos and video, and can scan barcodes and QR codes</td></tr>
   <tr><td><b>Biometric device</b>, e.g. a fingerprint scanner</td><td>A biological feature, used to <b>authenticate</b> the user when unlocking the device or paying</td></tr>
   <tr><td><b>Sensors</b>: accelerometer, gyroscope, light, proximity</td><td>Movement, tilt and rotation (e.g. turning the screen round), light level (screen brightness), and whether the phone is next to your ear</td></tr>
   <tr><td><b>RFID / NFC reader</b></td><td>Data from a nearby chip, e.g. a contactless card or an electronic ticket</td></tr>
  </table></div>
  <h3>Helping users who can't see</h3>
  <p>A device such as an ATM or a library self-checkout must also work for people who are <b>unable to see</b> the screen. Suitable input devices are a <b>Braille keyboard</b> (keys with raised dots that can be read by touch) and a <b>microphone</b> for voice input. The matching output devices are <b>speakers</b> or <b>headphones</b> that read the information aloud.</p>
 </section>
 <section>
  <h2>Choosing an input device</h2>
  <div class="callout tip"><span class="k">Exam tip</span><p>When you&#39;re asked to choose a suitable input device, think about <b>what data needs to be captured</b> (text, images, sound, a code, a position) and <b>where it will be used</b>. A barcode scanner suits a busy checkout, a microphone suits hands-free control, and an infra-red touch screen suits users wearing gloves.</p></div>
 </section>
</div>

 <section>
  <p class="lede">Once data has been processed, the results need to get back out of the computer. An <b>output device</b> is any hardware that <b>takes data from the computer</b> and turns it into a form that people can see, hear or use, or that makes something happen.</p>
  <p>Output devices are needed because the computer stores and processes everything in <b>binary</b>, which isn&#39;t much use to a person! Output devices convert it into images, printed pages, sound, objects or movement.</p>

<template id="th-3-2-sensors">
<div class="theory airy">
 <section>
  <h2>What is a sensor?</h2>
  <p class="lede">A <b>sensor</b> is an input device that <b>measures a physical quantity</b> in the environment, such as temperature, light or pressure, and sends the reading to a computer.</p>
  <p>Sensors are used in <b>monitoring systems</b>, which keep track of conditions, e.g. a weather station, and in <b>control systems</b>, which use the readings to make something happen, e.g. a greenhouse that opens its windows when it gets too hot.</p>
  <ul class="obj"><li>Sensors usually capture <b>analogue data</b>: values that change continuously, like temperature.</li><li>Computers can only process <b>digital data</b>, so an <b>analogue-to-digital converter (ADC)</b> converts the reading into binary.</li><li>The microprocessor compares the reading with stored values and decides what to do, e.g. switch on an actuator.</li></ul>
  <h3>Try it: from sensor to computer</h3>
  <p>Choose a sensor and change the conditions. Watch the analogue reading being converted into a digital binary value, and see what the control system decides.</p>
  <div class="adcdemo" id="adcdemo"></div>
 </section>
 <section>
  <h2>The sensors you need to know</h2>
  <p>For each sensor, you need to know the <b>type of data it captures</b> and <b>when it would be used</b>:</p>
  <div class="tscroll"><table class="pvt deftab sentab"><tr><th>Sensor</th><th>Data captured</th><th>Example uses</th></tr><tr><td><b>Acoustic</b></td><td>Sound levels (noise)</td><td>Noise monitoring, voice-activated devices, burglar alarms that detect breaking glass</td></tr><tr><td><b>Accelerometer</b></td><td>Acceleration and changes in movement or orientation</td><td>Phones rotating the screen, airbags detecting a crash, fitness trackers counting steps</td></tr><tr><td><b>Flow</b></td><td>The rate of flow of a liquid or gas</td><td>Water and fuel pipes, hospital drips, monitoring breathing</td></tr><tr><td><b>Gas</b></td><td>The presence and level of a gas, e.g. carbon monoxide or carbon dioxide</td><td>Carbon monoxide alarms, pollution monitoring, greenhouses</td></tr><tr><td><b>Humidity</b></td><td>The amount of water vapour in the air</td><td>Greenhouses, weather stations, museums and art galleries</td></tr><tr><td><b>Infra-red</b></td><td>Infra-red radiation, e.g. body heat or a broken infra-red beam</td><td>Burglar alarms (motion), automatic doors, TV remote receivers</td></tr><tr><td><b>Level</b></td><td>How full a container is, e.g. the level of a liquid</td><td>Fuel tanks, washing machines, flood warning systems</td></tr><tr><td><b>Light</b></td><td>Light intensity (brightness)</td><td>Street lights, automatic screen brightness, greenhouse lighting</td></tr><tr><td><b>Magnetic field</b></td><td>Magnetic field strength and changes in it</td><td>Phone compasses, door and window alarms, anti-lock brakes</td></tr><tr><td><b>Moisture</b></td><td>The amount of water in a material, e.g. soil</td><td>Automatic plant watering, detecting damp</td></tr><tr><td><b>pH</b></td><td>How acidic or alkaline something is</td><td>Soil in greenhouses, swimming pools, aquariums, chemical plants</td></tr><tr><td><b>Pressure</b></td><td>Pressure or force</td><td>Burglar alarm pressure pads, tyre pressure, weighing scales</td></tr><tr><td><b>Proximity</b></td><td>How close an object is, without touching it</td><td>Car parking sensors, phone screen turning off at your ear, automatic taps</td></tr><tr><td><b>Temperature</b></td><td>Temperature</td><td>Thermostats, ovens, greenhouses, car engines</td></tr></table></div>
 </section>
 <section>
  <h2>Choosing the right sensor</h2>
  <p>In the exam you might be given a situation and asked which sensor is the most suitable. Ask yourself: <b>what physical quantity needs to be measured?</b></p>
  <div class="stepline"><b>Example 1</b><span>An automatic door needs to open when a person approaches. It needs to detect a person nearby: an <b>infra-red</b> or <b>proximity</b> sensor.</span></div>
  <div class="stepline"><b>Example 2</b><span>A greenhouse needs to water plants automatically. It needs to know how wet the soil is: a <b>moisture</b> sensor.</span></div>
  <div class="stepline"><b>Example 3</b><span>A car needs to set off its airbags in a crash. It needs to detect a sudden change in speed: an <b>accelerometer</b>.</span></div>
  <div class="callout warnbox"><span class="k">Watch out</span><p><b>Moisture</b> measures water in a material, such as soil. <b>Humidity</b> measures water vapour in the <b>air</b>. Don&#39;t mix them up! Also remember that a sensor only <b>measures</b>. It&#39;s the microprocessor that makes the decision, and an actuator that carries it out.</p></div>
 </section>
</div>

<template id="th-3-4-nicmac">
<div class="theory airy">
 <section>
  <p class="lede">To connect to a network, and through it to the internet, a computer needs some specialist hardware. In this lesson you&#39;ll meet the <b>network interface card</b> and the address built into it: the <b>MAC address</b>.</p>
 </section>
 <section>
  <h2>Network interface cards (NICs)</h2>
  <p>A <b>network interface card (NIC)</b> is a piece of hardware that a computer <b>needs to access a network</b>. Without one, a device can&#39;t connect to a network at all.</p>
  <figure class="srfig enfig"><svg viewBox="0 0 420 200" role="img" aria-label="A network interface card: a circuit board with a chip, a metal bracket with an Ethernet port, and gold contacts that plug into the motherboard"><rect x="40" y="30" width="320" height="120" rx="6" fill="#2F8F4A" stroke="#14232A" stroke-width="2"/><rect x="150" y="60" width="70" height="60" rx="4" fill="#1C2326"/><text x="185" y="95" text-anchor="middle" font-size="10" fill="#97A8AD" font-family="var(--mono)">NIC chip</text><rect x="240" y="70" width="40" height="30" rx="3" fill="#1C2326"/><rect x="60" y="150" width="8" height="18" fill="#E9C84A"/><rect x="72" y="150" width="8" height="18" fill="#E9C84A"/><rect x="84" y="150" width="8" height="18" fill="#E9C84A"/><rect x="96" y="150" width="8" height="18" fill="#E9C84A"/><rect x="108" y="150" width="8" height="18" fill="#E9C84A"/><rect x="120" y="150" width="8" height="18" fill="#E9C84A"/><rect x="132" y="150" width="8" height="18" fill="#E9C84A"/><rect x="144" y="150" width="8" height="18" fill="#E9C84A"/><rect x="156" y="150" width="8" height="18" fill="#E9C84A"/><rect x="168" y="150" width="8" height="18" fill="#E9C84A"/><rect x="180" y="150" width="8" height="18" fill="#E9C84A"/><rect x="192" y="150" width="8" height="18" fill="#E9C84A"/><rect x="204" y="150" width="8" height="18" fill="#E9C84A"/><rect x="216" y="150" width="8" height="18" fill="#E9C84A"/><rect x="360" y="20" width="18" height="160" rx="2" fill="#C9D1D4" stroke="#6E777B" stroke-width="2"/><rect x="330" y="60" width="38" height="34" rx="3" fill="#3A4246"/><rect x="338" y="68" width="22" height="18" fill="#14232A"/><text x="300" y="118" text-anchor="middle" font-size="10" fill="#14232A" font-weight="700">Ethernet port</text><text x="140" y="190" text-anchor="middle" font-size="10" fill="#5E676B">connects to the motherboard</text></svg></figure>
  <ul class="obj"><li>The NIC provides the connection point between the device and the network. This can be a <b>wired</b> connection, e.g. a copper Ethernet cable or fibre optic, or a <b>wireless</b> connection using radio waves (Wi-Fi). A wireless NIC is often called a <b>WNIC</b>.</li>
   <li>In most modern computers, phones and tablets the NIC is <b>built into the motherboard</b> rather than being a separate card. It still does the same job.</li>
   <li>Each NIC is given a unique <b>MAC address</b> when it&#39;s made. A device with both wired and wireless connections has <b>two</b> NICs, so it has two MAC addresses.</li></ul>
 </section>
 <section>
  <h2>MAC addresses</h2>
  <p>A <b>media access control (MAC) address</b> is a unique address given to every NIC by the company that <b>manufactured</b> it, at the point of manufacture. Its purpose is to <b>identify a device on a network</b>, so data can be delivered to the right device.</p>
  <h3>Structure of a MAC address</h3>
  <p>A MAC address is <b>48 bits</b> (6 bytes) long. Because 48 bits of binary would be very long to write, MAC addresses are usually written as <b>12 hexadecimal digits</b>, in six pairs:</p>
  <div class="macbig" aria-label="MAC address 4F:5A:16:5D:2A:5B. The first half, 4F:5A:16, is the manufacturer code. The second half, 5D:2A:5B, is the serial code."><span class="mf">4F:5A:16</span><span class="sep">:</span><span class="sn">5D:2A:5B</span></div>
  <div class="macleg"><div class="mf"><b>Manufacturer code</b><span>The first 6 hex digits (the first 3 pairs) identify the company that made the NIC, e.g. Apple or Samsung.</span></div><div class="sn"><b>Serial code</b><span>The last 6 hex digits (the last 3 pairs) identify the individual device. The manufacturer never uses the same serial code twice.</span></div></div>
  <div class="callout"><span class="k">Key facts</span><ul class="obj"><li>48 bits give <b>2<sup>48</sup></b> possible addresses: over 281 trillion, so every device can have its own.</li><li>Each pair of hex digits is one byte (8 bits). Each hex digit is 4 bits.</li><li>Unlike an IP address, a MAC address is set when the device is made and <b>stays the same</b> wherever the device is connected.</li></ul></div>
  <h3>Try it: explore a MAC address</h3>
  <p>Generate a MAC address, then click any pair to see it in binary.</p>
  <div class="macdemo" id="macdemo"></div>
  <p class="vfoot">This uses your hex to binary skills from lesson 1.1. Each hex digit converts to a 4-bit nibble.</p>
 </section>
</div>
</template>
<template id="th-3-4-iprouter">
<div class="theory airy">
 <section>
  <h2>IP addresses</h2>
  <p class="lede">A MAC address identifies a device&#39;s NIC. But to send data across networks and the internet, a device also needs an <b>internet protocol (IP) address</b>.</p>
  <p>An IP address is a unique address given to a device <b>by the network</b> it connects to. Its purpose is to identify the device on that network, so data can be sent to the right place, a bit like the address on a letter.</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th></th><th>MAC address</th><th>IP address</th></tr>
   <tr><td><b>Given by</b></td><td>The manufacturer, when the NIC is made</td><td>The network the device connects to</td></tr>
   <tr><td><b>Changes?</b></td><td>No, it stays the same</td><td>Can change, e.g. on a different network</td></tr>
   <tr><td><b>Written as</b></td><td>12 hex digits, e.g. 4F:5A:16:5D:2A:5B</td><td>Denary (IPv4) or hex (IPv6)</td></tr></table></div>
 </section>
 <section>
  <h2>Static and dynamic IP addresses</h2>
  <div class="stepline"><b>Dynamic</b><span>A <b>temporary</b> IP address, given to a device each time it connects to the network. It can be different next time. Most devices, such as phones and laptops, use dynamic IP addresses. They&#39;re easy to manage, and addresses can be reused when devices leave.</span></div>
  <div class="stepline"><b>Static</b><span>A <b>permanent</b> IP address that doesn&#39;t change. It&#39;s used for devices that other devices need to find at the same address every time, e.g. a web server, an email server or a network printer.</span></div>
  <div class="stepline"><b>Public</b><span>An IP address that can be reached across the internet. Your router has a public IP address given by your ISP.</span></div>
  <div class="stepline"><b>Private</b><span>An IP address used only inside a local network, e.g. 192.168.1.24. It can't be reached directly from the internet. The router passes data between private addresses and the internet.</span></div>
  <p>An IP address is in two parts: the <b>network prefix</b>, which identifies the network, and the <b>host number</b>, which identifies the device on that network.</p>
 </section>
 <section>
  <h2>IPv4 and IPv6</h2>
  <p>There are two types of IP address in use:</p>
  <div class="ipcards">
   <div class="ipc v4"><span class="eyebrow">IPv4</span><code>192.168.1.24</code><ul><li><b>32 bits</b> long</li><li>Written as <b>4 denary numbers</b> from 0 to 255, separated by full stops</li><li>Each number is one byte (8 bits)</li><li>2<sup>32</sup>: about <b>4.3 billion</b> possible addresses</li></ul></div>
   <div class="ipc v6"><span class="eyebrow">IPv6</span><code>2001:0db8:85a3:0000:0000:8a2e:0370:7334</code><ul><li><b>128 bits</b> long</li><li>Written as <b>8 groups of 4 hexadecimal digits</b>, separated by colons</li><li>Each group is 16 bits</li><li>2<sup>128</sup>: about 3.4 × 10<sup>38</sup> possible addresses</li></ul></div>
  </div>
  <h3>Why was IPv6 needed?</h3>
  <p>4.3 billion IPv4 addresses sounded like plenty when the internet started, but there are now far more devices than that: phones, laptops, smart TVs, watches and more. The world has been <b>running out of IPv4 addresses</b>. IPv6 has so many addresses that it won&#39;t run out, and it can also be processed more efficiently by routers.</p>
  <h3>Try it: check an IP address</h3>
  <p>Type an IP address to check whether it&#39;s a valid IPv4 or IPv6 address, and see it in binary.</p>
  <div class="ipdemo" id="ipdemo"></div>
 </section>
 <section>
  <h2>Routers</h2>
  <p>A <b>router</b> is a piece of hardware found in most homes, schools and businesses. Its role in a network is to:</p>
  <div class="stepline"><b>Connect</b><span>Connect a <b>local network</b>, e.g. all the devices in your home, to the <b>internet</b>. This lets many devices share one internet connection.</span></div>
  <div class="stepline"><b>Assign</b><span><b>Assign IP addresses</b> to the devices on the local network, usually dynamic ones, when they join.</span></div>
  <div class="stepline"><b>Send</b><span><b>Send data to a specific destination.</b> It reads the destination IP address in each packet and forwards it towards the right device, whether that&#39;s on the local network or out on the internet.</span></div>
  <h3>Try it: a home network</h3>
  <p>Connect the devices to the router to give them IP addresses, then request a web page and watch the router send the data to the right device.</p>
  <div class="rtdemo" id="rtdemo">
   <svg viewBox="0 0 700 330" role="img" aria-label="A home network: a laptop, a phone and a smart TV connected to a router, which connects to the internet">

  </div>
  <div class="callout tip"><span class="k">Did you know?</span><p>Most home routers also contain a <b>modem</b>. A modem converts the computer&#39;s digital data into the type of signal used by the connection to the internet provider, e.g. over a telephone line, and back again. It&#39;s also why every device in your home shares the router&#39;s one <b>public</b> IP address on the internet, while having its own <b>local</b> IP address inside your home.</p></div>
 </section>
