  <p>A REPEAT loop is a <b>post-condition</b> loop: it repeats UNTIL a condition becomes TRUE. The condition is checked at the <b>end</b>, so the code inside always runs <b>at least once</b>. That's the opposite of a WHILE loop.</p>
  <pre class="pc" data-t="REPEAT loop syntax">REPEAT
   &lt;statements&gt;
UNTIL &lt;condition&gt;</pre>
  <div class="lgwid psrun" data-p="repguess"></div>
 </section>
 <section>
  <h2>Totalling and counting</h2>
  <p>Two of the most common jobs for a loop:</p>
  <div class="stepline"><b>Totalling</b><span>Keep a running total by adding each value: <span class="mono">Total ← Total + Mark</span>. Set Total to 0 before the loop.</span></div>
  <div class="stepline"><b>Counting</b><span>Add 1 each time something happens: <span class="mono">Passed ← Passed + 1</span>. Set the counter to 0 before the loop.</span></div>
  <div class="lgwid psrun" data-p="counttotal"></div>
 </section>
 <section>
  <h2>The exam vs Python</h2>
  <div class="pcpair"><pre class="pc" data-t="Cambridge pseudocode">FOR Count ← 1 TO 10
   OUTPUT Count
NEXT Count
REPEAT
   INPUT Answer
UNTIL Answer = "yes"</pre><pre class="pc py" data-t="Python">for count in range(1, 11):
    print(count)
# Python has no REPEAT loop
while True:
    answer = input()
    if answer == "yes":
        break</pre></div>
  <p>Watch out: in Python, <span class="mono">range(1, 11)</span> stops <b>before</b> 11, so it gives 1 to 10. Cambridge's <span class="mono">FOR Count ← 1 TO 10</span> includes 10.</p>
 </section>
</div>
</template>
<template id="th-8-1-strings">
<div class="theory airy">
 <section>
  <h2>String handling</h2>
  <p class="lede">Programs often need to work with text: checking the length of a password, putting a name into capitals, or taking the first few letters of a word. Cambridge pseudocode has four <b>string handling</b> functions you need to know.</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Function</th><th>What it does</th><th>Example</th><th>Result</th></tr>
   <tr><td class="mono"><b>LENGTH</b>(s)</td><td>The number of characters in a string</td><td class="mono">LENGTH("Computer")</td><td class="mono">8</td></tr>
   <tr><td class="mono"><b>UCASE</b>(s)</td><td>Converts to upper case</td><td class="mono">UCASE("Computer")</td><td class="mono">COMPUTER</td></tr>
   <tr><td class="mono"><b>LCASE</b>(s)</td><td>Converts to lower case</td><td class="mono">LCASE("Computer")</td><td class="mono">computer</td></tr>
   <tr><td class="mono"><b>SUBSTRING</b>(s, start, length)</td><td>Part of a string, from a start position, for a number of characters</td><td class="mono">SUBSTRING("Computer", 1, 4)</td><td class="mono">Comp</td></tr></table></div>
  <div class="callout warnbox"><span class="k">Be careful</span><p>In Cambridge pseudocode, the <b>first character is position 1</b>. In Python, strings start at position 0, so <span class="mono">word[0:4]</span> gives the first 4 characters.</p></div>
  <div class="lgwid psrun" data-p="strings"></div>
 </section>
 <section>
  <h2>Library routines</h2>
  <p>A <b>library routine</b> is a ready-made, tested piece of code that's built into the language, so you don't have to write it yourself. As well as the string functions, you need to know:</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Routine</th><th>What it does</th><th>Example</th><th>Result</th></tr>
   <tr><td class="mono"><b>DIV</b>(x, y)</td><td>Integer division: the whole number part of x ÷ y</td><td class="mono">DIV(17, 5)</td><td class="mono">3</td></tr>
   <tr><td class="mono"><b>MOD</b>(x, y)</td><td>The remainder of x ÷ y</td><td class="mono">MOD(17, 5)</td><td class="mono">2</td></tr>
   <tr><td class="mono"><b>ROUND</b>(x, places)</td><td>Rounds to a number of decimal places</td><td class="mono">ROUND(3.14159, 2)</td><td class="mono">3.14</td></tr>
   <tr><td class="mono"><b>RANDOM</b>()</td><td>A random number from 0 up to (but not including) 1</td><td class="mono">RANDOM()</td><td class="mono">e.g. 0.6342</td></tr></table></div>
  <div class="lgwid psrun" data-p="library"></div>
  <p>MOD is handy for checking if a number is even: <span class="mono">MOD(Number, 2) = 0</span>. To get a random whole number, multiply RANDOM() and round it, e.g. <span class="mono">ROUND(RANDOM() * 5, 0) + 1</span> gives a whole number from 1 to 6.</p>
  <div class="pcpair"><pre class="pc" data-t="Cambridge pseudocode">OUTPUT LENGTH(Name)
OUTPUT UCASE(Name)
OUTPUT SUBSTRING(Name, 1, 3)
OUTPUT DIV(17, 5), MOD(17, 5)
OUTPUT ROUND(Price, 2)</pre><pre class="pc py" data-t="Python">print(len(name))
print(name.upper())
print(name[0:3])
print(17 // 5, 17 % 5)
print(round(price, 2))</pre></div>
 </section>
 <section>
  <h2>Challenges</h2>
  <p>Press <b>Edit code</b> and write each program yourself. Run it to test it, then press <b>Check my answer</b>: your program will be tested with some sample inputs.</p>
  <div class="lgwid psrun" data-p="chusername"></div>
  <details class="lgans"><summary>Show a possible answer</summary><div class="lgwid psrun" data-code="DECLARE FirstName, Surname, Username : STRING
DECLARE Year : INTEGER
OUTPUT &quot;Enter your first name&quot;
INPUT FirstName
OUTPUT &quot;Enter your surname&quot;
INPUT Surname
OUTPUT &quot;Enter your year group&quot;
INPUT Year
Username ← UCASE(SUBSTRING(Surname, 1, 3)) + UCASE(SUBSTRING(FirstName, 1, 1))
OUTPUT &quot;Your username is &quot;, Username, Year"></div></details>
  <div class="lgwid psrun" data-p="chcoin"></div>
  <details class="lgans"><summary>Show a possible answer</summary><div class="lgwid psrun" data-code="DECLARE Toss, Heads : INTEGER
Heads ← 0
FOR Toss ← 1 TO 10
   IF RANDOM() &lt; 0.5
     THEN
       OUTPUT &quot;Heads&quot;
       Heads ← Heads + 1
     ELSE
       OUTPUT &quot;Tails&quot;
   ENDIF
NEXT Toss
OUTPUT &quot;Number of heads: &quot;, Heads"></div></details>
 </section>
</div>
</template>
<template id="th-8-1-validation">
<div class="theory airy">
 <section>
  <h2>Validation in programs</h2>
  <p class="lede"><b>Validation</b> is an automatic check that data is <b>reasonable</b> before a program accepts it. A well-designed algorithm should decide by itself whether data is acceptable, and keep asking until it is.</p>
  <p>In code, validation is usually done with a <b>loop</b>: a WHILE loop or a REPEAT … UNTIL loop that keeps asking for the data until it passes the check. An IF statement on its own isn't enough, because the user could enter bad data a second time.</p>
  <p>Run each example below and try entering both good and bad data.</p>
 </section>
 <section>
  <h2>Range check</h2>
  <p>Makes sure a number is within an acceptable range. For example, a sign-up form might only accept ages from 13 to 100. This stops under-13s from signing up, and stops unrealistic ages such as 250.</p>
  <div class="lgwid psrun" data-p="valrange"></div>
  <p class="vfoot">Of course, a 10-year-old could just enter a different age! Validation checks that data is reasonable, not that it's true.</p>
 </section>
 <section>
  <h2>Presence check</h2>
  <p>Makes sure some data has been entered. For example, a blog lets anyone post a comment without an account, but they must enter a name first.</p>
  <div class="lgwid psrun" data-p="valpresence"></div>
 </section>
 <section>
  <h2>Length check</h2>
  <p>Makes sure the data has a set number of characters, or is within a minimum and maximum length.</p>
  <div class="lgwid psrun" data-p="vallength"></div>
 </section>
 <section>
  <h2>Format check</h2>
  <p>Makes sure the data matches a set pattern. For example, an ID number must be the letters ISS followed by 4 digits, e.g. ISS1432. This program checks the length, then the first 3 characters, then checks each of the last 4 characters is a digit.</p>
  <div class="lgwid psrun" data-p="valformat"></div>
  <p class="vfoot">This could be improved by telling the user exactly what was wrong, e.g. "Your ID number doesn't start with ISS", using nested IFs.</p>
 </section>
 <section>
  <h2>Type check</h2>
  <p>Makes sure the data is the right data type. For example, an age must be a whole number. The input is stored as a string, and each character is checked to see that it's a digit from 0 to 9.</p>
  <div class="lgwid psrun" data-p="valtype"></div>
  <p class="vfoot">In Python, you could use <span class="mono">age.isdigit()</span> to do the same check.</p>
 </section>
 <section>
  <h2>Character check</h2>
  <p>Makes sure a string doesn't contain any unacceptable characters. For example, a username can't contain ! or @, because those are reserved for admin usernames.</p>
  <div class="lgwid psrun" data-p="valchar"></div>
 </section>
 <section>
  <h2>Check digits and verification</h2>
  <p>A <b>check digit</b> is an extra digit added to the end of a number, such as a barcode, calculated from the other digits. When the number is entered, the check digit is calculated again; if it doesn't match, the number was entered incorrectly. You can learn more in the error detection lesson.</p>
  <p><b>Verification</b> checks that data has been entered <b>accurately</b>, e.g. by asking the user to type a new password twice (double entry) and checking both match, or by asking them to look over their data before submitting it (a visual check).</p>
 </section>
</div>
</template>
<template id="th-5-1-ip">
<div class="theory airy">
 <section>
  <h2>What is an IP address for?</h2>
  <p class="lede">Every device connected to the internet needs an <b>IP address</b> (internet protocol address). It's a unique address that <b>identifies a device</b> on a network, so data can be sent to the right place, just like the address on a letter.</p>
  <ul class="obj">
   <li>When data is sent across the internet, it's split into <b>packets</b>. Each packet's header contains the <b>destination IP address</b> and the <b>sender's IP address</b>.</li>
   <li><b>Routers</b> read the destination IP address to decide where to forward each packet next.</li>
   <li>When you type a web address, a <b>DNS</b> server looks up the domain name and finds the <b>IP address</b> of the web server, so your browser can request the page.</li>
   <li>The receiving device uses the sender's IP address to send a reply back.</li>
  </ul>
  <p>An IP address is given to a device by the <b>network</b> it connects to, so it can change, e.g. when you take your phone from home to school. (That's different from a MAC address, which is set by the manufacturer and stays the same.)</p>
 </section>
 <section>
  <h2>IPv4</h2>
  <p>The original version of IP addresses is <b>IPv4</b>. An IPv4 address looks like this: <span class="mono">192.168.1.24</span></p>
  <div class="tscroll"><table class="pvt deftab"><tr><th colspan="2">IPv4 characteristics</th></tr>
   <tr><td><b>Size</b></td><td><b>32 bits</b> (4 bytes)</td></tr>
   <tr><td><b>Written as</b></td><td><b>4 groups</b> of <b>denary</b> numbers</td></tr>
   <tr><td><b>Separated by</b></td><td>Full stops (dots)</td></tr>
   <tr><td><b>Each group</b></td><td>8 bits (1 byte), so a number from <b>0 to 255</b></td></tr>
   <tr><td><b>Number of addresses</b></td><td>2<sup>32</sup>: about <b>4.3 billion</b></td></tr></table></div>
  <h3>Rules for writing an IPv4 address</h3>
  <ul class="obj"><li>Exactly <b>4</b> numbers, separated by <b>3 full stops</b>.</li><li>Each number must be from <b>0 to 255</b>, because 255 is the largest number that fits in 8 bits (11111111).</li><li>Only digits 0 to 9: <b>no letters</b>.</li></ul>
  <h3>Try it: inside an IPv4 address</h3>
  <p>Change the numbers to see each group in binary. Each group is one byte, and the whole address is 32 bits.</p>
  <div class="lgwid" id="ip4b"></div>
 </section>
 <section>
  <h2>IPv6</h2>
  <p>4.3 billion addresses sounded like plenty when the internet began, but with phones, laptops, smart TVs, watches and fridges all online, the world has run out of new IPv4 addresses. <b>IPv6</b> was created to solve this. An IPv6 address looks like this: <span class="mono">2001<wbr>:0db8<wbr>:85a3<wbr>:0000<wbr>:0000<wbr>:8a2e<wbr>:0370<wbr>:7334</span></p>
  <div class="tscroll"><table class="pvt deftab"><tr><th colspan="2">IPv6 characteristics</th></tr>
   <tr><td><b>Size</b></td><td><b>128 bits</b> (16 bytes)</td></tr>
   <tr><td><b>Written as</b></td><td><b>8 groups</b> of <b>4 hexadecimal</b> digits</td></tr>
   <tr><td><b>Separated by</b></td><td>Colons</td></tr>
   <tr><td><b>Each group</b></td><td>16 bits (4 hex digits, each 4 bits), from 0000 to FFFF</td></tr>
   <tr><td><b>Number of addresses</b></td><td>2<sup>128</sup>: about <b>3.4 × 10<sup>38</sup></b> (340 undecillion)</td></tr></table></div>
  <h3>Rules for writing an IPv6 address</h3>
  <ul class="obj"><li><b>8</b> groups separated by <b>colons</b>.</li><li>Only the hexadecimal digits <b>0 to 9 and A to F</b> (upper or lower case). A letter such as G isn't allowed.</li><li><b>Leading zeros</b> in a group can be left out: <span class="mono">0db8</span> can be written as <span class="mono">db8</span>, and <span class="mono">0000</span> as <span class="mono">0</span>. Only zeros at the <b>start</b> of a group can be removed.</li><li>One run of consecutive groups that are all zeros can be replaced by a double colon <span class="mono">::</span>. This can only be done <b>once</b> in an address, otherwise you couldn't tell how many zero groups each :: stands for.</li></ul>
  <h3>Try it: shorten an IPv6 address</h3>
  <div class="lgwid" id="ip6s"></div>
 </section>
 <section>
  <h2>IPv4 vs IPv6</h2>
  <div class="tscroll"><table class="pvt deftab"><tr><th></th><th>IPv4</th><th>IPv6</th></tr>
   <tr><td><b>Size</b></td><td>32 bits</td><td>128 bits</td></tr>
   <tr><td><b>Groups</b></td><td>4</td><td>8</td></tr>
   <tr><td><b>Number base</b></td><td>Denary</td><td>Hexadecimal</td></tr>
   <tr><td><b>Separator</b></td><td>Full stops</td><td>Colons</td></tr>
   <tr><td><b>Group range</b></td><td>0 to 255</td><td>0000 to FFFF</td></tr>
   <tr><td><b>Addresses</b></td><td>About 4.3 billion</td><td>About 3.4 × 10<sup>38</sup></td></tr>
   <tr><td><b>Example</b></td><td class="mono">8.8.8.8</td><td class="mono">2001:db8::1</td></tr></table></div>
  <p>To get a feel for the difference: there are about 8 billion people on Earth, so IPv4 doesn't even have one address per person. IPv6 has enough addresses to give trillions to every grain of sand on Earth. IPv6 also makes routing more efficient, and both versions are used side by side today.</p>
 </section>
 <section>
  <h2>Static and dynamic, public and private</h2>
  <div class="stepline"><b>Dynamic</b><span>A temporary address, given to a device each time it connects. It can be different next time. Most phones and laptops use dynamic addresses.</span></div>
  <div class="stepline"><b>Static</b><span>A permanent address that doesn't change. Used for devices that must always be found at the same address, e.g. a web server or a network printer.</span></div>
  <div class="stepline"><b>Public</b><span>An address that can be reached across the internet. Your home router has a public IP address given by your ISP.</span></div>
  <div class="stepline"><b>Private</b><span>An address used only inside a local network, e.g. 192.168.1.24. Your router passes data between the private addresses at home and the internet.</span></div>
 </section>
 <section>
  <h2>Try it: is it a valid IP address?</h2>
  <p>Type an address, or try one of the examples, to check whether it's a valid IPv4 or IPv6 address.</p>
  <div class="ipdemo" id="ipdemo"></div>
  <div class="callout tip"><span class="k">Exam tip</span><p>If you're asked to describe IPv4 or IPv6, give the facts: the number of <b>bits</b>, the number of <b>groups</b>, the <b>number base</b> (denary or hex), and the <b>separator</b> (dots or colons). Questions often ask you to spot what's wrong with an address, e.g. a group over 255 in IPv4, or a letter after F in IPv6.</p></div>
 </section>
</div>
</template>
<template id="th-8-1-maintain">
<div class="theory airy">
 <section>
  <h2>What makes a program maintainable?</h2>
  <p class="lede">Programs are rarely written once and then left alone. Bugs need fixing, new features get added, and values such as prices change. This is called <b>maintenance</b>, and it's often done by a different programmer, or by you, months after you've forgotten how your code works.</p>
  <p>A <b>maintainable program</b> is one that is easy for someone else to <b>read</b>, <b>understand</b> and <b>change</b>. You need to know four ways to make a program maintainable:</p>
  <ul class="obj"><li><b>Meaningful identifiers</b> for variables, constants, arrays, procedures and functions.</li><li><b>Comments</b> that explain what the code does and why.</li><li><b>Constants</b> for fixed values, instead of typing the number into the code.</li><li><b>Procedures and functions</b>, so each task is written once and given a name.</li></ul>
  <p>The two programs below do exactly the same job: they work out the cost of a school trip, with a 10% discount for groups of more than 30. Run both with the same inputs. Which one would you rather have to fix?</p>
  <div class="lgwid psrun" data-p="mtmessy"></div>
  <div class="lgwid psrun" data-p="mttidy"></div>
  <p class="vfoot">In Version A, you have to work out what a, b, c and d mean, and why 12.5, 30 and 0.1 are there. Version B tells you.</p>
 </section>
 <section>
  <h2>Meaningful identifiers</h2>
  <p>An <b>identifier</b> is the name given to a variable, constant, array, procedure or function. A meaningful identifier describes exactly what it stores or does, so the code explains itself.</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Used for</th><th>Poor</th><th>Meaningful</th><th>Tip</th></tr>
   <tr><td><b>Variables</b></td><td class="mono">x, n1, temp</td><td class="mono">TotalCost, StudentName</td><td>Describe the data it holds.</td></tr>
   <tr><td><b>Constants</b></td><td class="mono">v, c2</td><td class="mono">VATRate, MaxPlayers</td><td>Describe the fixed value.</td></tr>
   <tr><td><b>Arrays</b></td><td class="mono">a, list</td><td class="mono">StudentNames, DailyRainfall</td><td>Use a plural to show it holds many items.</td></tr>
   <tr><td><b>Procedures</b></td><td class="mono">p1, Stuff</td><td class="mono">DisplayMenu, PrintReceipt</td><td>Start with a verb: say what it does.</td></tr>
   <tr><td><b>Functions</b></td><td class="mono">f, Calc</td><td class="mono">CircleArea, IsValidEmail</td><td>Say what value it returns. Is… works well for a BOOLEAN.</td></tr></table></div>
  <p>Cambridge pseudocode uses <b>PascalCase</b>: each word starts with a capital letter, e.g. <span class="mono">HighScore</span>. Python programmers usually use <b>snake_case</b> instead, e.g. <span class="mono">high_score</span>. Either way, keep names clear but not too long: <span class="mono">NumberOfStudentsInTheClassThisYear</span> is meaningful, but tiring to type and read. <span class="mono">ClassSize</span> is better.</p>
  <p class="vfoot">A single letter such as <span class="mono">i</span> is usually accepted for a loop counter or array index, but nowhere else.</p>
 </section>
 <section>
  <h2>Comments</h2>
  <p>A <b>comment</b> is a note in the code written for humans. The translator ignores it, so it has no effect on how the program runs. In Cambridge pseudocode, a comment starts with <span class="mono">//</span>. In Python, it starts with <span class="mono">#</span>. Everything after it on that line is ignored.</p>
  <p>Good places for comments:</p>
  <ul class="obj"><li><b>At the top</b> of the program: what the program does (and often who wrote it, and when).</li><li><b>Above each procedure or function</b>: what it does, what its parameters are, and what it returns.</li><li><b>Above a section</b> of code: what the next few lines are for.</li><li><b>Next to syntax that isn't obvious</b>, such as MOD, SUBSTRING or a complicated condition: what it actually achieves.</li></ul>
  <pre class="pc" data-t="A well-commented section of code">// Counts how many of the numbers entered are even
DECLARE Number, EvenCount, Count : INTEGER
EvenCount ← 0
FOR Count ← 1 TO 10
    INPUT Number
    // a remainder of 0 when divided by 2 means the number is even
    IF MOD(Number, 2) = 0 THEN
        EvenCount ← EvenCount + 1
    ENDIF
NEXT Count
OUTPUT EvenCount, " even numbers were entered"</pre>
  <div class="callout warnbox"><span class="k">A common mistake!</span><p>A comment that just repeats the code is no help. <span class="mono">Total ← Total + Price&nbsp;&nbsp;// add Price to Total</span> tells the reader nothing new. <span class="mono">// add this item's price to the bill</span> explains <b>why</b>. Comments also need updating when the code changes: a wrong comment is worse than none.</p></div>
  <p class="vfoot">Programmers also "comment out" a line while testing: putting // in front of it stops it running without deleting it.</p>
 </section>
 <section>
  <h2>Constants instead of "magic numbers"</h2>
  <p>A <b>magic number</b> is a value typed straight into the code with no explanation, like the 12.5 in Version A above. It's hard to know what it means, and if it's used in several places, every one has to be found and changed when the value changes.</p>
  <p>Storing it in a <b>constant</b> with a meaningful identifier fixes both problems: the name explains the value, and if the ticket price goes up, only <b>one line</b> needs changing.</p>
  <div class="pcpair"><pre class="pc" data-t="Cambridge pseudocode">CONSTANT TicketPrice ← 12.5
Cost ← People * TicketPrice</pre><pre class="pc py" data-t="Python">TICKET_PRICE = 12.5
cost = people * TICKET_PRICE</pre></div>
 </section>
 <section>
  <h2>Procedures and functions</h2>
  <p>A <b>subroutine</b> is a named block of code that does one specific task. It's written once, then <b>called</b> by its name whenever the task is needed. There are two kinds:</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th></th><th>Procedure</th><th>Function</th></tr>
   <tr><td><b>What it does</b></td><td>Carries out a task</td><td>Carries out a task and <b>returns a value</b></td></tr>
   <tr><td><b>Defined with</b></td><td class="mono">PROCEDURE … ENDPROCEDURE</td><td class="mono">FUNCTION … RETURNS type … ENDFUNCTION</td></tr>
   <tr><td><b>Called with</b></td><td class="mono">CALL ShowMenu()</td><td>Used as a value, e.g. <span class="mono">Area ← CircleArea(5)</span></td></tr>
   <tr><td><b>Example</b></td><td>Output a menu, draw a line</td><td>Work out an area, check a password</td></tr></table></div>
  <h3>Procedures</h3>
  <p>The code inside a procedure only runs when the procedure is called. Step through this program and watch the highlighted line jump into the procedure each time it's called, then come back.</p>
  <div class="lgwid psrun" data-p="mtproc1"></div>
  <h3>Parameters</h3>
  <p>A <b>parameter</b> is a value passed into a subroutine, so it can do a slightly different job each time. Parameters are listed in brackets in the header, each with an identifier and a data type. The values given when the subroutine is called are called <b>arguments</b>, and they're copied into the parameters in order.</p>
  <div class="lgwid psrun" data-p="mtproc2"></div>
  <h3>Functions</h3>
  <p>A function works out a value and sends it back with <span class="mono">RETURN</span>. The header says what data type it returns. Because a function call becomes a value, it can be stored in a variable, output, or used in a calculation or condition.</p>
  <div class="lgwid psrun" data-p="mtfunc1"></div>
  <p>Functions are great for validation. This one asks for a mark until it's valid. It's written once but used twice:</p>
  <div class="lgwid psrun" data-p="mtfunc2"></div>
  <p class="vfoot">You've already used functions: LENGTH, UCASE, SUBSTRING, ROUND and RANDOM are <b>library routines</b>, functions that come ready-made with the language.</p>
  <h3>Why subroutines make programs maintainable</h3>
  <ul class="obj"><li>Code is written <b>once</b> and called many times, so programs are shorter.</li><li>A bug only needs fixing in <b>one place</b>.</li><li>Each subroutine can be <b>tested on its own</b>.</li><li>A team can split the work: each programmer writes different subroutines.</li><li>Subroutines can be <b>reused</b> in other programs.</li><li>The main program reads like a summary: <span class="mono">CALL DisplayMenu()</span> says exactly what happens.</li></ul>
 </section>
 <section>
  <h2>Local and global variables</h2>
  <p>A <b>global variable</b> is declared in the main program. It can be used anywhere, including inside every subroutine.</p>
  <p>A <b>local variable</b> is declared inside a subroutine. It can only be used inside that subroutine, and it only exists while the subroutine is running. Parameters are local too.</p>
  <p>Step through this program and watch the <b>Local</b> and <b>Global</b> tables. Then look at the error on the last line.</p>
  <div class="lgwid psrun" data-p="mtscope"></div>
  <p>Use local variables wherever you can. They keep each subroutine <b>self-contained</b>: it can't accidentally change a variable used elsewhere, the same identifier can be reused in different subroutines, the memory is freed when the subroutine ends, and the subroutine can be copied into another program without breaking.</p>
 </section>
 <section>
  <h2>The exam vs Python</h2>
  <p>Python uses <span class="mono">def</span> for both procedures and functions, has no CALL keyword, and doesn't give data types for parameters or return values. Indentation marks where the subroutine ends, instead of ENDPROCEDURE or ENDFUNCTION.</p>
  <div class="pcpair"><pre class="pc" data-t="Cambridge pseudocode">PROCEDURE Greet(Name : STRING)
    OUTPUT "Hello ", Name
ENDPROCEDURE

FUNCTION Square(Number : INTEGER) RETURNS INTEGER
    RETURN Number * Number
ENDFUNCTION

CALL Greet("Ava")
OUTPUT Square(4)</pre><pre class="pc py" data-t="Python">def greet(name):
    print("Hello", name)


def square(number):
    return number * number


greet("Ava")
print(square(4))</pre></div>
  <p class="vfoot">In Python, a "procedure" is just a function with no return statement. It actually returns a special value called None.</p>
 </section>
 <section>
  <h2>Your turn 1: tidy a program</h2>
  <p>This program works out a taxi fare: a $3.50 starting charge, plus $1.20 per kilometre, with $5 off journeys over 20 km. It works, but it's hard to maintain. Press <b>Edit code</b> and improve it: meaningful identifiers, constants for the fixed values, a prompt, and helpful comments. It must still work out the same fares.</p>
  <div class="lgwid psrun" data-p="mttaxi"></div>
  <details class="lgans"><summary>Show a possible answer</summary><div class="lgwid psrun" data-code="// Works out the fare for a taxi journey:
// a starting charge plus a charge per km, with money off long journeys
CONSTANT StartCharge ← 3.5
CONSTANT PricePerKm ← 1.2
CONSTANT LongJourney ← 20
CONSTANT LongDiscount ← 5
DECLARE Distance, Fare : REAL

OUTPUT &quot;Enter the distance in km&quot;
INPUT Distance
Fare ← StartCharge + Distance * PricePerKm
// Journeys over 20 km get money off
IF Distance &gt; LongJourney THEN
    Fare ← Fare - LongDiscount
ENDIF
OUTPUT &quot;Fare: $&quot;, Fare"></div></details>
 </section>
 <section>
  <h2>Your turn 2: write a function</h2>
  <p>Write a <b>function</b> that takes a temperature in Celsius as a parameter and returns it in Fahrenheit. The formula is <span class="mono">Celsius × 9 / 5 + 32</span>. Then write a main program that inputs a temperature in Celsius and uses your function to output it in Fahrenheit. Add a comment to explain your function.</p>
  <div class="lgwid psrun" data-p="mttemp"></div>
  <details class="lgans"><summary>Show a possible answer</summary><div class="lgwid psrun" data-code="// Converts a temperature from Celsius to Fahrenheit
// and returns the result
FUNCTION ToFahrenheit(Celsius : REAL) RETURNS REAL
    RETURN Celsius * 9 / 5 + 32
ENDFUNCTION

// Main program
DECLARE TempC : REAL
OUTPUT &quot;Enter a temperature in Celsius&quot;
INPUT TempC
OUTPUT TempC, &quot;°C is &quot;, ToFahrenheit(TempC), &quot;°F&quot;"></div></details>
 </section>
 <section>
  <h2>Your turn 3: replace repeated code with a procedure</h2>
  <p>This program outputs the headings for a quiz night. The same three-line pattern is typed out again and again. Write a <b>procedure</b> with a STRING parameter for the heading, and use it so the program gives <b>exactly the same output</b> without the repeated code.</p>
  <div class="lgwid psrun" data-p="mtquiz"></div>
  <details class="lgans"><summary>Show a possible answer</summary><div class="lgwid psrun" data-code="// Outputs a heading between two lines of = signs
PROCEDURE ShowHeading(Heading : STRING)
    OUTPUT &quot;====================&quot;
    OUTPUT Heading
    OUTPUT &quot;====================&quot;
ENDPROCEDURE

// Main program
CALL ShowHeading(&quot;QUIZ NIGHT&quot;)
OUTPUT &quot;Teams: 4&quot;
CALL ShowHeading(&quot;ROUND 1: Science&quot;)
CALL ShowHeading(&quot;ROUND 2: Sport&quot;)
CALL ShowHeading(&quot;ROUND 3: Music&quot;)"></div></details>
 </section>
 <section>
  <h2>In the exam</h2>
  <div class="callout tip"><span class="k">Exam tip</span><p>A common question shows you an algorithm and asks how it could be made easier to maintain or understand. Make every point <b>specific to the code</b>:</p>
   <ul class="obj"><li>Use meaningful identifiers, e.g. rename <span class="mono">X</span> to <span class="mono">TotalSales</span>.</li><li>Add comments to explain what each section does.</li><li>Use a constant for a fixed value, e.g. <span class="mono">CONSTANT VATRate ← 0.2</span>.</li><li>Put repeated code in a procedure or function, e.g. the validation loop.</li></ul>
   <p>If you're asked to write code, use meaningful identifiers and a comment or two anyway. It shows the examiner what your code is meant to do.</p></div>
 </section>
</div>
</template>
<template id="th-7-1-pdlc">
<div class="theory airy">
 <section>
  <h2>Building software is a project</h2>
  <p class="lede">Nobody sits down and types out a big program from start to finish. Real software is built in stages: first you work out what's needed, then you plan it, then you build it, then you check it works. These stages are called the <b>program development life cycle</b>.</p>
  <p>You need to know four stages: <b>analysis</b>, <b>design</b>, <b>coding</b> and <b>testing</b>. Click each stage to see what happens in it.</p>
  <div class="lgwid" id="pdlc"></div>
  <p class="vfoot">It's called a cycle because it often loops: testing might reveal a problem that sends you back to the design, and once a program is in use, new requirements start the cycle again.</p>
 </section>
 <section>
  <h2>Analysis</h2>
  <p>Throughout this lesson we'll follow one example: a school wants an app so students can <b>pre-order lunch</b> from the canteen and skip the queue.</p>
  <p>In <b>analysis</b>, the developer finds out exactly what the problem is. They talk to the people involved (the canteen staff, the students, the school office) and look at how things work now. The result is a <b>requirements specification</b>: a list of everything the finished system must do.</p>
  <div class="lgcard"><b>Some requirements for the canteen app</b><ul class="obj"><li>Students must log in with their school account.</li><li>The menu must show each dish's price and any allergens.</li><li>Orders must be placed before 10:30 am.</li><li>Payment comes from a balance that parents can top up.</li><li>The kitchen must see a list of orders to prepare.</li></ul></div>
  <h3>Abstraction</h3>
  <p><b>Abstraction</b> means removing the details that don't matter, so you can focus on the ones that do. The canteen app needs to know each dish's name, price and allergens. It doesn't need to know the colour of the trays, the cook's favourite dish or what the dining hall looks like. A bus route map is a good everyday example: it shows the stops in order and leaves out every building, tree and road bend.</p>
  <h3>Decomposition</h3>
  <p><b>Decomposition</b> means breaking a big problem down into smaller parts that are easier to understand and solve. "Build a canteen app" is overwhelming. "Let a student log in", "show today's menu" and "take a payment" are each manageable.</p>
 </section>
 <section>
  <h2>Design</h2>
  <p>In <b>design</b>, the developer plans how the solution will work, <b>before</b> any code is written. This includes:</p>
  <ul class="obj"><li>Decomposing the system into <b>sub-systems</b> and showing them on a <b>structure diagram</b>.</li><li>Planning the <b>inputs</b>, <b>processes</b>, <b>outputs</b> and <b>storage</b> each part needs.</li><li>Designing the algorithms using <b>flowcharts</b> and <b>pseudocode</b>.</li></ul>
  <p>A good design means a team of programmers can each build a different part and know that the parts will fit together.</p>
 </section>
 <section>
  <h2>Coding and iterative testing</h2>
  <p>In <b>coding</b>, the design is turned into program code, usually one module at a time. Each module is tested as soon as it's written, any errors are fixed, and then it's tested again. This repeated cycle of code, test, fix, test is called <b>iterative testing</b>. It means errors are found while the code is fresh in the programmer's mind, rather than all at once at the end.</p>
 </section>
 <section>
  <h2>Testing</h2>
  <p>Once the program is complete, it's tested as a whole. The tester plans <b>test data</b> and works out the <b>expected result</b> for each test <b>before</b> running it. Then they run the program and compare the <b>actual result</b> with the expected one. If they're different, there's an error to fix.</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Test</th><th>Test data</th><th>Type</th><th>Expected result</th><th>Actual result</th></tr>
   <tr><td>1</td><td class="mono">Order at 09:15</td><td>Normal</td><td>Order accepted</td><td>Order accepted ✓</td></tr>
   <tr><td>2</td><td class="mono">Order at 10:30</td><td>Boundary</td><td>Order accepted</td><td>Order rejected ✗</td></tr>
   <tr><td>3</td><td class="mono">Order at 10:31</td><td>Boundary</td><td>Order rejected</td><td>Order rejected ✓</td></tr>
   <tr><td>4</td><td class="mono">Order at "lunch"</td><td>Abnormal</td><td>Error message</td><td>Error message ✓</td></tr></table></div>
  <p class="vfoot">Test 2 failed: the programmer probably wrote <span class="mono">&lt; 10:30</span> when the requirement said orders are allowed up to <b>and including</b> 10:30. You'll learn about the types of test data in the testing lesson.</p>
 </section>
 <section>
  <h2>Systems and sub-systems</h2>
  <p>Every computer system is made up of <b>sub-systems</b>, and each sub-system is made up of further sub-systems. A smartphone has hardware and software; the hardware includes a camera; the camera is made of a lens, a sensor and a focusing motor. Click the boxes to break each part down.</p>
  <div class="lgwid sdw" data-sd="phone"></div>
  <h3>Structure diagrams</h3>
  <p>A <b>structure diagram</b> shows how a system is decomposed. The whole system is the box at the top. Each level below breaks the box above it into smaller sub-systems, until each box is a single task that's simple enough to program. Here's the canteen app:</p>
  <div class="lgwid sdw" data-sd="canteen"></div>
  <p class="vfoot">A structure diagram shows what the parts are, not the order they happen in. Use a flowchart or pseudocode to show the order of steps.</p>
 </section>
 <section>
  <h2>Inputs, processes, outputs and storage</h2>
  <p>Another way to decompose a problem is to identify its four component parts:</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Part</th><th>What it means</th><th>In the canteen app</th></tr>
   <tr><td><b>Inputs</b></td><td>Data going into the system</td><td>The student's login, the dishes they choose</td></tr>
   <tr><td><b>Processes</b></td><td>What the system does with the data: calculations and decisions</td><td>Adding up the order total, checking the balance is high enough</td></tr>
   <tr><td><b>Outputs</b></td><td>Information that comes out of the system</td><td>The order confirmation, the kitchen's order list</td></tr>
   <tr><td><b>Storage</b></td><td>Data that must be kept for later</td><td>Student accounts and balances, the menu, past orders</td></tr></table></div>
  <div class="lgwid iposw" data-ipos="library"></div>
 </section>
</div>
</template>
<template id="th-7-1-flowcharts">
<div class="theory airy">
 <section>
  <h2>What is an algorithm?</h2>
  <p class="lede">An <b>algorithm</b> is a precise, step-by-step set of instructions for solving a problem or completing a task. A recipe, the directions to a friend's house and the steps for working out a mean are all algorithms.</p>
  <p>Before writing code, programmers design their algorithms. In the exam you'll use three methods:</p>
  <ul class="obj"><li><b>Structure diagrams</b>: show how a problem is broken down into parts (see the previous lesson).</li><li><b>Flowcharts</b>: show the steps as symbols joined by arrows.</li><li><b>Pseudocode</b>: shows the steps as structured, code-like text.</li></ul>
 </section>
 <section>
  <h2>Flowchart symbols</h2>
  <p>Each type of step has its own symbol. You need to know these six:</p>
  <div id="flsym"></div>
  <p>A few rules make flowcharts easy to follow:</p>
  <ul class="obj"><li>Start with a <b>START</b> terminator and end with a <b>STOP</b> terminator.</li><li>Every decision has exactly <b>two exits</b>, labelled <b>Yes</b> and <b>No</b>.</li><li>Arrows show the direction of flow. A loop is drawn as an arrow going back to an earlier step.</li><li>Write the steps precisely, e.g. <span class="mono">Is Age &gt;= 65?</span> rather than "Is the person old?"</li></ul>
 </section>
 <section>
  <h2>Selection in a flowchart</h2>
  <p>This flowchart works out a bus fare. Under 12s pay $1.50, people aged 65 or over travel free, and everyone else pays $3.20. Press <b>Step</b> to follow the arrows. Then change the test data and try again with ages such as 12, 64 and 65.</p>
  <div class="lgwid fltr" data-fl="bus"></div>
  <p>The same algorithm in pseudocode:</p>
  <pre class="pc" data-t="Bus fare in pseudocode">INPUT Age
IF Age &lt; 12 THEN
    Fare ← 1.50
ELSE
    IF Age &gt;= 65 THEN
        Fare ← 0
    ELSE
        Fare ← 3.20
    ENDIF
ENDIF
OUTPUT Fare</pre>
 </section>
 <section>
  <h2>Loops in a flowchart</h2>
  <p>A loop is drawn by sending an arrow back to an earlier step. This one keeps asking for a mark until it's between 0 and 100. That's a validation check, which you'll meet again later in this topic.</p>
  <div class="lgwid fltr" data-fl="valid"></div>
  <pre class="pc" data-t="The same loop in pseudocode">OUTPUT "Enter a mark (0 to 100)"
INPUT Mark
WHILE Mark &lt; 0 OR Mark &gt; 100 DO
    OUTPUT "Invalid, try again"
    INPUT Mark
ENDWHILE
OUTPUT "Mark saved"</pre>
 </section>
 <section>
  <h2>Subroutines in a flowchart</h2>
  <p>The subroutine symbol runs a procedure or function that's defined somewhere else, often in its own flowchart. It keeps the main flowchart short and readable. This till adds up prices until 0 is entered, then calls <span class="mono">PrintReceipt</span>.</p>
  <div class="lgwid fltr" data-fl="till"></div>
 </section>
 <section>
  <h2>Pseudocode</h2>
  <p><b>Pseudocode</b> describes an algorithm in structured text that looks like code but isn't tied to one programming language. Cambridge has its own set of pseudocode keywords (INPUT, OUTPUT, IF … THEN … ENDIF, FOR … NEXT and so on). You've already used them in the programming lessons, and they're the ones to use in the exam.</p>
  <div class="callout warnbox"><span class="k">Be precise!</span><p>Pseudocode and flowcharts must be exact enough to turn straight into code. <span class="mono">IF X &gt; Y THEN</span> is acceptable. <span class="mono">IF X is greater than Y</span> is not, and won't get the mark.</p></div>
 </section>
 <section>
  <h2>Explaining the purpose of an algorithm</h2>
  <p>Exam questions often give you an algorithm and ask you to explain it. There are two kinds of answer:</p>
  <ul class="obj"><li><b>State the purpose</b>: one sentence saying what the algorithm achieves overall.</li><li><b>Describe the processes</b>: what happens, step by step, using the variable names.</li></ul>
  <p>Read this algorithm, then run it with some temperatures and 999 at the end.</p>
  <div class="lgwid psrun" data-p="purptemp"></div>
  <details class="lgans"><summary>Show a model answer</summary><div class="lgcard"><p><b>Purpose:</b> it finds the highest temperature entered, and counts how many temperatures were below zero.</p><p><b>Processes:</b></p><ul class="obj"><li>Highest is set to −999 and BelowZero to 0.</li><li>Temperatures are input until 999 is entered (999 is a rogue value that stops the loop).</li><li>Each temperature is compared with Highest; if it's bigger, it becomes the new Highest.</li><li>If a temperature is less than 0, BelowZero is increased by 1.</li><li>After the loop, the highest temperature and the number below zero are output.</li></ul></div></details>
  <div class="callout tip"><span class="k">Exam tip</span><p>Don't just translate each line into English ("it sets Highest to −999"). For the purpose, say what the algorithm is <b>for</b>. To trace it, try a few simple inputs and look at what comes out.</p></div>
 </section>
</div>
</template>
<template id="th-7-1-standard">
<div class="theory airy">
 <section>
  <h2>Standard methods of solution</h2>
  <p class="lede">Some jobs come up in program after program: adding things up, counting things, finding the biggest or smallest, working out an average, and searching for an item. Programmers don't reinvent these each time. They use <b>standard methods</b> that are known to work.</p>
  <p>In this lesson, a weather station has recorded the rainfall (in mm) for each day of a week, stored in an array:</p>
  <div class="lgcard"><div class="arrv"><span class="arrn mono">Rainfall</span><div class="arrrow"><div class="arrc"><small>1</small><b>0</b></div><div class="arrc"><small>2</small><b>12</b></div><div class="arrc"><small>3</small><b>4</b></div><div class="arrc"><small>4</small><b>0</b></div><div class="arrc"><small>5</small><b>7</b></div><div class="arrc"><small>6</small><b>21</b></div><div class="arrc"><small>7</small><b>3</b></div></div></div></div>
  <p>Every program on this page can be run and stepped through. Watch the variables change as you step.</p>
 </section>
 <section>
  <h2>Totalling</h2>
  <p><b>Totalling</b> keeps a running total. A variable is set to 0 <b>before</b> the loop, then each value is added to it <b>inside</b> the loop:</p>
  <pre class="pc" data-t="The totalling pattern">Total ← 0
...loop...
    Total ← Total + Value</pre>
  <div class="lgwid psrun" data-p="smtotal"></div>
  <div class="callout warnbox"><span class="k">A common mistake!</span><p>Forgetting to set the total to 0 first, or setting it to 0 <b>inside</b> the loop so it's reset every time round.</p></div>
 </section>
 <section>
  <h2>Counting</h2>
  <p><b>Counting</b> adds 1 to a variable each time something happens. It's often inside an IF statement, so only the items that meet a condition are counted:</p>
  <pre class="pc" data-t="The counting pattern">Count ← 0
...loop...
    IF condition THEN
        Count ← Count + 1
    ENDIF</pre>
  <div class="lgwid psrun" data-p="smcount"></div>
 </section>
 <section>
  <h2>Average</h2>
  <p>The <b>average</b> (mean) is the total divided by how many values there are, so it needs totalling <b>and</b> counting. This version keeps going until −1 is entered, so it counts the scores as they come in. Notice it checks Count isn't 0 before dividing.</p>
  <div class="lgwid psrun" data-p="smavg"></div>
 </section>
 <section>
  <h2>Maximum and minimum</h2>
  <p>To find the <b>maximum</b>, keep the biggest value so far, and compare every value with it. If a value is bigger, it becomes the new maximum. The <b>minimum</b> works the same way, using less than.</p>
  <p>The starting value matters. There are two safe ways to start:</p>
  <ul class="obj"><li>Set the maximum and minimum to the <b>first item</b>, then compare the rest. This always works.</li><li>Set the maximum to a value lower than any real data (e.g. −1 for rainfall) and the minimum to a value higher than any real data (e.g. 9999).</li></ul>
  <p>Setting the minimum to 0 is a classic mistake: if every value is above 0, nothing is ever smaller than it, and the "minimum" stays at 0.</p>
  <div class="lgwid psrun" data-p="smmax"></div>
  <p class="vfoot">Storing <span class="mono">WettestDay</span> as well as the value tells you <b>where</b> the maximum was, not just what it was.</p>
 </section>
 <section>
  <h2>Linear search</h2>
  <p>A <b>linear search</b> checks each item in a list in turn, starting with the first, until it finds the one it's looking for or reaches the end. It works on any list, sorted or not, but it can be slow for a long list: the item might be the very last one checked.</p>
  <div class="lgwid lsw"></div>
  <p>In pseudocode, a <span class="mono">Found</span> flag stops the loop as soon as the item is found:</p>
  <div class="lgwid psrun" data-p="smls"></div>
  <p class="vfoot">Try a name that isn't there, such as Zoe. Then try lower-case "kai": the comparison is case-sensitive, so it isn't found. How could you fix that? (Hint: UCASE.)</p>
 </section>
 <section>
  <h2>Explaining what an algorithm does</h2>
  <p>Exam questions often show one of these methods without saying which it is. Look for the giveaways:</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>If you see…</th><th>…it's probably</th></tr>
   <tr><td class="mono">X ← X + Value</td><td>Totalling</td></tr><tr><td class="mono">X ← X + 1</td><td>Counting</td></tr><tr><td class="mono">IF Value &gt; X THEN X ← Value</td><td>Finding the maximum</td></tr><tr><td class="mono">IF Value &lt; X THEN X ← Value</td><td>Finding the minimum</td></tr><tr><td class="mono">Total / Count</td><td>Finding the average</td></tr><tr><td class="mono">IF List[i] = Target</td><td>Linear search</td></tr><tr><td class="mono">Temp ← … then two swaps</td><td>Bubble sort</td></tr></table></div>
 </section>
</div>
</template>
<template id="th-7-1-bubble">
<div class="theory airy">
 <section>
  <h2>Why sort data?</h2>
  <p class="lede">Sorted data is easier for people to use: a leaderboard from highest to lowest score, a class list in alphabetical order, products from cheapest to most expensive. Computers benefit too, because some search methods only work on sorted data, and they're much faster than a linear search.</p>
  <p>There are many sorting algorithms. You need to know the <b>bubble sort</b>.</p>
 </section>
 <section>
  <h2>How a bubble sort works</h2>
  <ol class="obj"><li>Compare the first two items. If they're in the wrong order, <b>swap</b> them.</li><li>Move along one place and compare the next pair. Keep going to the end of the list. This is one <b>pass</b>.</li><li>After the first pass, the largest item has "bubbled" to the end, so it's in its final place.</li><li>Do another pass, and another. Each pass puts one more item in place.</li><li>Stop when a whole pass makes <b>no swaps</b>: the list is sorted.</li></ol>
  <p>Step through it one comparison at a time. Yellow shows the pair being compared, red shows a swap, and green shows items in their final place.</p>
  <div class="lgwid bsw"></div>
 </section>
 <section>
  <h2>A worked example</h2>
  <p>Sorting <span class="mono">31, 12, 47, 8, 25, 19</span> into ascending order. The bold items are in their final place.</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Pass</th><th>List after the pass</th><th>Now in place</th></tr><tr><td>Start</td><td class="mono">31, 12, 47, 8, 25, 19</td><td></td></tr><tr><td>1</td><td class="mono">12, 31, 8, 25, 19, <b>47</b></td><td>47</td></tr><tr><td>2</td><td class="mono">12, 8, 25, 19, <b>31</b>, <b>47</b></td><td>31, 47</td></tr><tr><td>3</td><td class="mono">8, 12, 19, <b>25</b>, <b>31</b>, <b>47</b></td><td>25, 31, 47</td></tr><tr><td>4</td><td class="mono">8, 12, <b>19</b>, <b>25</b>, <b>31</b>, <b>47</b></td><td>No swaps: sorted!</td></tr></table></div>
  <p>6 items needed at most 5 passes. In general, a list of <i>n</i> items needs at most <i>n</i> − 1 passes, and the first pass makes <i>n</i> − 1 comparisons.</p>
 </section>
 <section>
  <h2>Bubble sort in pseudocode</h2>
  <p>Swapping two array elements needs a temporary variable. If you copy <span class="mono">Scores[2]</span> into <span class="mono">Scores[1]</span> first, the old value of <span class="mono">Scores[1]</span> is lost. It's like swapping the drinks in two glasses: you need a third glass.</p>
  <div class="lgwid psrun" data-p="bsort"></div>
  <p>This version has two improvements that make it faster:</p>
  <ul class="obj"><li>The <span class="mono">Swapped</span> flag stops the sort as soon as a pass makes no swaps.</li><li><span class="mono">Last</span> gets 1 smaller after each pass, so items already in place at the end aren't compared again.</li></ul>
  <p class="vfoot">To sort into <b>descending</b> order, change <span class="mono">&gt;</span> to <span class="mono">&lt;</span> in the IF statement.</p>
 </section>
 <section>
  <h2>The exam vs Python</h2>
  <p>Python has a built-in <span class="mono">sort()</span>, and can swap two items in one line. In the exam you must write the full algorithm, with a temporary variable.</p>
  <div class="pcpair"><pre class="pc" data-t="Cambridge pseudocode">Temp ← Scores[Index]
Scores[Index] ← Scores[Index + 1]
Scores[Index + 1] ← Temp</pre><pre class="pc py" data-t="Python">scores[i], scores[i + 1] = scores[i + 1], scores[i]

# or sort the whole list:
scores.sort()</pre></div>
 </section>
</div>
</template>
<template id="th-7-1-valver">
<div class="theory airy">
 <section>
  <h2>Why check input data?</h2>
  <p class="lede">A program is only as good as the data it's given. If someone types their age as 150, or leaves their email address blank, the program might crash, or worse, carry on with nonsense. Computer scientists call this <b>garbage in, garbage out</b>.</p>
  <p>There are two kinds of check on input data:</p>
  <ul class="obj"><li><b>Validation</b>: an <b>automatic</b> check by the computer that data is <b>reasonable</b> and follows the rules, before it's accepted.</li><li><b>Verification</b>: a check that data has been entered <b>accurately</b>, matching what was intended.</li></ul>
 </section>
 <section>
  <h2>Validation checks</h2>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Check</th><th>What it does</th><th>Example</th></tr>
   <tr><td><b>Range check</b></td><td>Makes sure a value is between a lower and an upper limit.</td><td>An age must be from 11 to 18.</td></tr>
   <tr><td><b>Length check</b></td><td>Makes sure data has an exact number of characters, or is within a minimum and maximum length.</td><td>A username must be 5 to 12 characters.</td></tr>
   <tr><td><b>Type check</b></td><td>Makes sure data is the right data type.</td><td>An age must be a whole number, not "fourteen".</td></tr>
   <tr><td><b>Presence check</b></td><td>Makes sure data has been entered, not left blank.</td><td>Your name must be filled in.</td></tr>
   <tr><td><b>Format check</b></td><td>Makes sure data matches a set pattern.</td><td>A student ID is 2 capital letters then 4 digits, e.g. KT2041.</td></tr>
   <tr><td><b>Check digit</b></td><td>An extra digit, calculated from the other digits, is added to the end of a number. When it's entered, the digit is calculated again and compared.</td><td>Barcodes and ISBNs. If one digit is mistyped, the check digit won't match.</td></tr></table></div>
  <p class="vfoot">You can see how check digits are calculated in the error detection lesson, and how validation is written in pseudocode in the programming lessons.</p>
 </section>
 <section>
  <h2>Try it: a sign-up form</h2>
  <p>This form uses every validation check, plus both kinds of verification. Break the rules and see which check catches each mistake.</p>
  <div class="lgwid vfw"></div>
 </section>
 <section>
  <h2>Verification checks</h2>
  <p>Validation can only check that data is <b>reasonable</b>. If you type your age as 15 when you're 16, it passes the range check, but it's still wrong. Verification helps catch these mistakes:</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Check</th><th>How it works</th><th>Example</th></tr>
   <tr><td><b>Double entry check</b></td><td>The data is entered twice, and the two entries are compared. If they don't match, one was mistyped.</td><td>Typing a new password twice.</td></tr>
   <tr><td><b>Visual check</b></td><td>The user looks over the data on screen and confirms it's correct, or compares it with the original document.</td><td>"Please check your details before you submit."</td></tr></table></div>
 </section>
 <section>
  <h2>In the exam</h2>
  <div class="callout tip"><span class="k">Exam tip</span><p>Don't mix up the two words. <b>Validation</b> checks data is <b>sensible</b>; it can't tell whether the data is <b>correct</b>. <b>Verification</b> checks the data was <b>entered accurately</b>. When you name a check, also say exactly what it would check in that scenario, e.g. "a range check to make sure the number of tickets is from 1 to 8".</p></div>
 </section>
</div>
</template>
<template id="th-7-1-testing">
<div class="theory airy">
 <section>
  <h2>Why test?</h2>
  <p class="lede">Testing is how errors are found and removed before a program is used for real. An error in a game is annoying. An error in a plane's autopilot, a hospital drug pump or a bank's payment system could be a disaster.</p>
  <p>When testing, we're checking that the program:</p>
  <ul class="obj"><li>produces the <b>correct results</b>;</li><li><b>accepts</b> the data it should accept, and <b>rejects</b> the data it should reject;</li><li>doesn't <b>crash</b>, whatever the user types.</li></ul>
 </section>
 <section>
  <h2>Types of test data</h2>
  <p><b>Test data</b> is data chosen to test whether a program works. A good test plan uses four types. Imagine a youth club that accepts members aged <b>11 to 17</b>:</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Type</th><th>What it is</th><th>Youth club (11 to 17)</th><th>Expected result</th></tr>
   <tr><td><b>Normal</b></td><td>Sensible data the program should accept.</td><td class="mono">14</td><td>Accepted</td></tr>
   <tr><td><b>Abnormal</b></td><td>Data the program should reject: out of range, or the wrong type.</td><td class="mono">25, −3, "fourteen"</td><td>Rejected</td></tr>
   <tr><td><b>Extreme</b></td><td>The largest or smallest acceptable value.</td><td class="mono">11, 17</td><td>Accepted</td></tr>
   <tr><td><b>Boundary</b></td><td>The largest or smallest acceptable value, <b>and</b> the value just beyond it that should be rejected.</td><td class="mono">11 and 10; 17 and 18</td><td>Accept 11 and 17; reject 10 and 18</td></tr></table></div>
  <p>Extreme and boundary data overlap: 17 is extreme data, and it's also the accepted half of the upper boundary pair. Boundary testing matters because programmers often type <span class="mono">&lt;</span> when they mean <span class="mono">&lt;=</span>, and only testing right at the edge will catch it.</p>
  <div class="lgwid tdw"></div>
  <p>Test data isn't only for numbers. If a password must have <b>at least 9 characters</b>: <span class="mono">"TopSecret123"</span> is normal data, <span class="mono">"Secret"</span> is abnormal, and a 9-character password with an 8-character one is a boundary pair.</p>
 </section>
 <section>
  <h2>Test plans</h2>
  <p>A <b>test plan</b> lists each test, the test data, its type and the <b>expected result</b>, all worked out <b>before</b> testing. During testing, the <b>actual result</b> is recorded. If the two don't match, there's an error to find and fix, and then the test is run again.</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Test</th><th>Purpose</th><th>Test data</th><th>Type</th><th>Expected result</th></tr>
   <tr><td>1</td><td>Accept a normal age</td><td class="mono">14</td><td>Normal</td><td>Accepted</td></tr><tr><td>2</td><td>Reject an age that's too high</td><td class="mono">25</td><td>Abnormal</td><td>Error message</td></tr><tr><td>3</td><td>Reject text</td><td class="mono">fourteen</td><td>Abnormal</td><td>Error message</td></tr><tr><td>4</td><td>Accept the youngest age</td><td class="mono">11</td><td>Extreme / boundary</td><td>Accepted</td></tr><tr><td>5</td><td>Reject just below the range</td><td class="mono">10</td><td>Boundary</td><td>Error message</td></tr><tr><td>6</td><td>Accept the oldest age</td><td class="mono">17</td><td>Extreme / boundary</td><td>Accepted</td></tr><tr><td>7</td><td>Reject just above the range</td><td class="mono">18</td><td>Boundary</td><td>Error message</td></tr></table></div>
 </section>
 <section>
  <h2>Types of error</h2>
  <p><b>Syntax errors</b> break the grammar rules of the language, such as a misspelt keyword or a missing ENDIF. The translator can't understand the code, so it won't run until they're fixed. They're the easiest to find, because the translator tells you where they are.</p>
  <div class="lgwid psrun" data-p="errsyn"></div>
  <p><b>Logic errors</b> let the program run, but it does the wrong thing. They're the hardest to find, because there's no error message: the only clue is a wrong result. This program should output the average of three ages. Try 10, 12 and 14. Can you spot the problem?</p>
  <div class="lgwid psrun" data-p="errlog"></div>
  <details class="lgans"><summary>Show the answer</summary><div class="lgcard"><p>Division happens before addition, so only Age3 is divided by 3. The fix is to add brackets: <span class="mono">(Age1 + Age2 + Age3) / 3</span>.</p></div></details>
  <p><b>Runtime errors</b> happen while the program is running and make it crash, even though the code is valid. Dividing by zero and using an array index that's out of range are common causes. Try 0 people:</p>
  <div class="lgwid psrun" data-p="errrun"></div>
 </section>
 <section>
  <h2>Identifying and correcting errors</h2>
  <p>In the exam you'll be given an algorithm with errors in it. For each one, give the <b>line</b>, say <b>what's wrong</b>, and write the <b>corrected line</b> in full. Good ways to find logic errors:</p>
  <ul class="obj"><li><b>Dry-run</b> the algorithm with a trace table (next lesson) and compare the output with what it should be.</li><li>Check each <b>initial value</b>: totals at 0, maximums low, minimums high.</li><li>Check each <b>comparison</b>: &lt; or &lt;=? &gt; or &lt;?</li><li>Check each <b>loop</b>: does it run the right number of times, and does it ever stop?</li></ul>
  <p>Your turn. This algorithm should input 5 temperatures (they can be negative) and output the highest, the lowest and the average. It contains <b>five errors</b>. Fix them, then check your answer.</p>
  <div class="lgwid psrun" data-p="fixtemp"></div>
  <details class="lgans"><summary>Show the corrected algorithm</summary><div class="lgwid psrun" data-code="DECLARE Temp, Highest, Lowest, Total, Count : INTEGER
Highest ← -999
Lowest ← 999
Total ← 0
FOR Count ← 1 TO 5
    OUTPUT &quot;Enter temperature &quot;, Count
    INPUT Temp
    Total ← Total + Temp
    IF Temp &gt; Highest THEN
        Highest ← Temp
    ENDIF
    IF Temp &lt; Lowest THEN
        Lowest ← Temp
    ENDIF
NEXT Count
OUTPUT &quot;Highest: &quot;, Highest
OUTPUT &quot;Lowest: &quot;, Lowest
OUTPUT &quot;Average: &quot;, Total / 5"></div></details>
 </section>
</div>
</template>
<template id="th-7-1-trace">
<div class="theory airy">
 <section>
  <h2>What is a trace table?</h2>
  <p class="lede">A <b>trace table</b> records what happens as you work through an algorithm by hand, step by step, using some test data. This is called a <b>dry run</b>. It's like being the computer: you follow every instruction exactly and write down every value.</p>
  <p>Trace tables are used to:</p>
  <ul class="obj"><li>find <b>logic errors</b>, by showing exactly where a value goes wrong;</li><li>work out what an algorithm <b>does</b>, by seeing what comes out;</li><li>check an algorithm gives the <b>expected output</b> for some test data.</li></ul>
 </section>
 <section>
  <h2>How to complete a trace table</h2>
  <ul class="obj"><li>There's a <b>column for each variable</b>, and an <b>OUTPUT</b> column for everything that's output, including prompts such as "Enter a number".</li><li>Work through the algorithm <b>one line at a time</b>, using the test data in order. Each INPUT takes the next value.</li><li>Write a value in a column only when that variable <b>changes</b>.</li><li>Move down to a new row when a column you need already has a value in the current row, usually each time round a loop.</li><li>A blank cell just means "no change". Writing the unchanged value again is also accepted in the exam.</li></ul>
  <p>Step through this flowchart and watch the trace table fill in.</p>
  <div class="lgwid fltr" data-fl="steps"></div>
  <p class="vfoot">The final output is 9200 (the average number of steps) and 3 (the number of days with at least 10000 steps). Notice that 10000 counts as a goal day, because the decision uses &gt;=.</p>
 </section>
 <section>
  <h2>Your turn</h2>
  <p>Complete each trace table, then press <b>Check</b>. Your rows don't have to be laid out exactly like the answer: each column is checked for the right values in the right order.</p>
  <div class="lgwid trfw" data-tr="tr1"></div>
  <div class="lgwid trfw" data-tr="tr2"></div>
  <div class="lgwid trfw" data-tr="tr3"></div>
  <div class="lgwid trfw" data-tr="tr4"></div>
 </section>
 <section>
  <h2>In the exam</h2>
  <div class="callout tip"><span class="k">Exam tip</span><p>Before you start, read the whole algorithm and find the loops. Then use a finger or ruler to keep your place. The most common slips are: forgetting the <b>initial values</b>, missing a <b>prompt</b> in the OUTPUT column, using the test data <b>out of order</b>, and doing one loop too many or too few. When the question asks what the algorithm does, look at your finished table: the answer is usually in the OUTPUT column.</p></div>
 </section>
</div>
</template>
<template id="th-7-1-writing">
<div class="theory airy">
 <section>
  <h2>Writing algorithms</h2>
  <p class="lede">Paper 2 ends with a long question that gives you a scenario and asks you to write an algorithm, in pseudocode or program code. It's worth a lot of marks, and every mark comes from a requirement in the question. A methodical approach makes a huge difference.</p>
  <ol class="obj"><li><b>Read the scenario twice.</b> Underline every requirement: each input, each check, each calculation, each output. These are your marks.</li><li><b>Spot the data.</b> If the question gives you arrays or variables, use exactly those names. Decide what else you need, and declare it.</li><li><b>Plan the structure.</b> Initialise totals and counters → loop through the data → validate each input → process it (totals, counts, max, min) → output the results with clear messages.</li><li><b>Write it</b> using the standard methods you know, with meaningful identifiers and a few comments.</li><li><b>Check it.</b> Tick off each requirement, then dry-run it with a couple of simple values.</li></ol>
  <div class="callout warnbox"><span class="k">Be precise!</span><p>Write <span class="mono">IF Laps &gt; 40 THEN</span>, not "if the laps are too big". Every line must be exact enough to turn straight into code. And don't leave any requirement out: a perfect algorithm that ignores the validation will lose those marks.</p></div>
 </section>
 <section>
  <h2>Amending an algorithm</h2>
  <p>Some questions give you a working algorithm and ask you to change it. Keep everything that already works, and add to it. A new feature usually needs three things: an <b>initial value</b> before the loop, an <b>update</b> inside the loop, and an <b>output</b> after it.</p>
  <p>This algorithm adds up a football team's points from 6 matches. Amend it so that it also:</p>
  <ul class="obj"><li><b>validates</b> each input: the only possible points are 0 (loss), 1 (draw) and 3 (win);</li><li><b>counts</b> the number of wins and outputs it;</li><li>outputs the <b>average</b> points per match.</li></ul>
  <div class="lgwid psrun" data-p="wramend"></div>
  <details class="lgans"><summary>Show a possible answer</summary><div class="lgwid psrun" data-code="DECLARE Total, Count, Points, Wins : INTEGER
Total ← 0
Wins ← 0
FOR Count ← 1 TO 6
    OUTPUT &quot;Enter points for match &quot;, Count
    INPUT Points
    // validation: only 0, 1 or 3 points are possible
    WHILE Points &lt;&gt; 0 AND Points &lt;&gt; 1 AND Points &lt;&gt; 3 DO
        OUTPUT &quot;Points must be 0, 1 or 3. Try again&quot;
        INPUT Points
    ENDWHILE
    Total ← Total + Points
    IF Points = 3 THEN
        Wins ← Wins + 1
    ENDIF
NEXT Count
OUTPUT &quot;Total points: &quot;, Total
OUTPUT &quot;Wins: &quot;, Wins
OUTPUT &quot;Average points per match: &quot;, ROUND(Total / 6, 2)"></div></details>
 </section>
 <section>
  <h2>Writing an algorithm from a scenario</h2>
  <div class="lgcard"><p><b>Scenario.</b> A school runs a sponsored walk around the field. Write an algorithm that, for each of <b>8 students</b>:</p><ul class="obj"><li>inputs their <b>name</b> and the number of <b>laps</b> they completed, storing them in two arrays;</li><li><b>validates</b> the laps: it must be from 0 to 40, and an invalid value must be re-entered with a message.</li></ul><p>Then it outputs:</p><ul class="obj"><li>the <b>total</b> number of laps walked;</li><li>the <b>name</b> of the student with the most laps;</li><li>how many students completed <b>20 or more</b> laps.</li></ul></div>
  <p class="vfoot">When you check your answer, it's tested with Ava 12, Ben 25, Cara 41 (invalid, then 40), Dev 20, Eli 0, Fay 19, Gus 33, Hal −2 (invalid, then 7). Inputs are given in that order: a name, then the laps.</p>
  <div class="lgwid psrun" data-p="wrwalk"></div>
  <details class="lgans"><summary>Show a possible answer</summary><div class="lgwid psrun" data-code="// Sponsored walk: stores 8 names and lap counts,
// then outputs the total, the top walker and how many did 20+
DECLARE Names : ARRAY[1:8] OF STRING
DECLARE Laps : ARRAY[1:8] OF INTEGER
DECLARE Index, Total, Best, Over20 : INTEGER

FOR Index ← 1 TO 8
    OUTPUT &quot;Name of student &quot;, Index
    INPUT Names[Index]
    OUTPUT &quot;Laps completed (0 to 40)&quot;
    INPUT Laps[Index]
    WHILE Laps[Index] &lt; 0 OR Laps[Index] &gt; 40 DO
        OUTPUT &quot;Invalid: enter a number from 0 to 40&quot;
        INPUT Laps[Index]
    ENDWHILE
NEXT Index

Total ← 0
Best ← 1
Over20 ← 0
FOR Index ← 1 TO 8
    Total ← Total + Laps[Index]
    IF Laps[Index] &gt; Laps[Best] THEN
        Best ← Index
    ENDIF
    IF Laps[Index] &gt;= 20 THEN
        Over20 ← Over20 + 1
    ENDIF
NEXT Index

OUTPUT &quot;Total laps: &quot;, Total
OUTPUT &quot;Most laps: &quot;, Names[Best], &quot; with &quot;, Laps[Best]
OUTPUT &quot;Students with 20 or more laps: &quot;, Over20"></div></details>
 </section>
 <section>
  <h2>From a flowchart to pseudocode</h2>
  <p>You may also need to turn a flowchart into pseudocode, or the other way round. Step through this flowchart to see how it behaves. Then write pseudocode that gives exactly the same outputs.</p>
  <div class="lgwid fltr" data-fl="guess"></div>
  <div class="lgwid psrun" data-p="wrguess"></div>
  <details class="lgans"><summary>Show a possible answer</summary><div class="lgwid psrun" data-code="Secret ← 42
Tries ← 0
REPEAT
    INPUT Guess
    Tries ← Tries + 1
    IF Guess &gt; Secret THEN
        OUTPUT &quot;Too high&quot;
    ELSE
        IF Guess &lt; Secret THEN
            OUTPUT &quot;Too low&quot;
        ENDIF
    ENDIF
UNTIL Guess = Secret
OUTPUT &quot;Correct! Tries: &quot;, Tries"></div></details>
  <p class="vfoot">The arrow back to the input makes this a loop that always runs at least once, and stops when Guess = Secret. That's a REPEAT … UNTIL loop.</p>
 </section>

<template id="th-8-3-files">
<div class="theory airy">
 <section>
  <h2>Why store data in files?</h2>
  <p class="lede">When a program ends, its variables and arrays disappear. They're stored in RAM, which is <b>volatile</b>. To keep data until next time, such as a game's high scores, a user's settings or a list of orders, a program saves it to a <b>file</b> in secondary storage, which is non-volatile.</p>
  <p>Files have other advantages too:</p>
  <ul class="obj"><li>Data is kept <b>permanently</b>, even when the program is closed or the computer is turned off.</li><li>Data can be <b>shared</b>: another program, another user or another computer can open the same file.</li><li>A program can <b>read in</b> data from a file instead of a user typing it all in.</li></ul>
 </section>
 <section>
  <h2>Open, read or write, close</h2>
  <p>Using a file always takes three steps: <b>open</b> it, <b>read from it or write to it</b>, then <b>close</b> it. When a file is opened, you choose a <b>mode</b>:</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Pseudocode</th><th>What it does</th></tr>
   <tr><td class="mono">OPENFILE "Scores.txt" FOR READ</td><td>Opens a file so that data can be read from it, starting at the first line.</td></tr>
   <tr><td class="mono">OPENFILE "Scores.txt" FOR WRITE</td><td>Opens a file so that data can be written to it. If the file doesn't exist, it's created. <b>If it does exist, everything in it is replaced.</b></td></tr>
   <tr><td class="mono">READFILE "Scores.txt", Score</td><td>Reads the <b>next line</b> of the file into the variable Score.</td></tr>
   <tr><td class="mono">WRITEFILE "Scores.txt", Score</td><td>Writes the value of Score to the file as a new line.</td></tr>
   <tr><td class="mono">CLOSEFILE "Scores.txt"</td><td>Closes the file when you've finished with it.</td></tr></table></div>
  <p>Closing a file matters: it makes sure all the data has been saved, frees up the resources the file was using, and lets other programs open it.</p>
 </section>
 <section>
  <h2>Writing to a file</h2>
  <p>Run this program, then look at the <b>Files</b> panel to see what was saved. Each WRITEFILE puts one item on its own line.</p>
  <div class="lgwid psrun" data-p="fwrite"></div>
  <p>Be careful with WRITE mode. Visitors.txt already contains two lines. Step through this and watch what happens to them:</p>
  <div class="lgwid psrun" data-p="fover"></div>
 </section>
 <section>
  <h2>Reading from a file</h2>
  <p>Each READFILE reads the <b>next</b> line, so data comes out in the same order it went in. The highlighted line in the Files panel shows which line will be read next.</p>
  <div class="lgwid psrun" data-p="fread"></div>
  <p>A whole line of text can be read into a STRING variable in one go:</p>
  <div class="lgwid psrun" data-p="fline"></div>
  <p>If a file holds many values, the program needs to know when to stop reading. One way is for the first line to say how many values follow:</p>
  <div class="lgwid psrun" data-p="fcount"></div>
 </section>
 <section>
  <h2>The exam vs Python</h2>
  <p>Python uses <span class="mono">open()</span> with a mode: <span class="mono">"r"</span> to read and <span class="mono">"w"</span> to write. Writing needs <span class="mono">"\n"</span> to start a new line, and reading gives you a string, so numbers must be converted with <span class="mono">int()</span>.</p>
  <div class="pcpair"><pre class="pc" data-t="Cambridge pseudocode">OPENFILE "Scores.txt" FOR WRITE
WRITEFILE "Scores.txt", Score
CLOSEFILE "Scores.txt"

OPENFILE "Scores.txt" FOR READ
READFILE "Scores.txt", Score
CLOSEFILE "Scores.txt"</pre><pre class="pc py" data-t="Python">file = open("scores.txt", "w")
file.write(str(score) + "\n")
file.close()

file = open("scores.txt", "r")
score = int(file.readline())
file.close()</pre></div>
 </section>
 <section>
  <h2>Your turn</h2>
  <p>Write a program that inputs a <b>username</b> and a <b>favourite colour</b>, writes them to a file called <span class="mono">Profile.txt</span> (one per line) and closes it. Then open the file again, read both items back, and output them.</p>
  <div class="lgwid psrun" data-p="fprofile"></div>
  <details class="lgans"><summary>Show a possible answer</summary><div class="lgwid psrun" data-code="DECLARE Username, Colour : STRING
OUTPUT &quot;Enter your username&quot;
INPUT Username
OUTPUT &quot;Enter your favourite colour&quot;
INPUT Colour
// save both items, one per line
OPENFILE &quot;Profile.txt&quot; FOR WRITE
WRITEFILE &quot;Profile.txt&quot;, Username
WRITEFILE &quot;Profile.txt&quot;, Colour
CLOSEFILE &quot;Profile.txt&quot;
// read them back to check they were saved
OPENFILE &quot;Profile.txt&quot; FOR READ
READFILE &quot;Profile.txt&quot;, Username
READFILE &quot;Profile.txt&quot;, Colour
CLOSEFILE &quot;Profile.txt&quot;
OUTPUT &quot;Saved: &quot;, Username, &quot; likes &quot;, Colour"></div></details>
 </section>
