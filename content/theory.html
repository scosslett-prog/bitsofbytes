<template id="th-2-3-encryption">
<div class="theory airy">
 <section>
  <h2>Why encrypt data?</h2>
  <p class="lede">Keeping data safe when it&#39;s stored on a server is one thing, but data rarely stays in one place. When data is transmitted from one place to another, it&#39;s vulnerable to <b>interception</b>, so extra steps must be taken to keep it safe. One powerful technique is <b>encryption</b>.</p>
  <p>When data is transmitted, a hacker could <b>intercept</b> it. Intercepted data can be read and used for malicious purposes. To <b>protect data</b> from interception, it&#39;s encrypted.</p>
  <div class="callout"><span class="k">Definition</span><p><b>Encryption</b> is the scrambling of data so that it&#39;s no longer in an understandable format.</p></div>
  <p>Encryption doesn&#39;t stop data being intercepted. It means that if it <i>is</i> intercepted, it can&#39;t be understood.</p>
 </section>
 <section>
  <h2>Encryption terms</h2>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Term</th><th>Meaning</th></tr>
   <tr><td><b>Plaintext</b></td><td>The data or message before it&#39;s encrypted.</td></tr>
   <tr><td><b>Ciphertext</b></td><td>The encrypted data or message.</td></tr>
   <tr><td><b>Encryption</b></td><td>The process of converting plaintext into ciphertext by following an algorithm.</td></tr>
   <tr><td><b>Key</b></td><td>A sequence of numbers or characters used with the algorithm to encrypt or decrypt data.</td></tr>
  </table></div>
 </section>
 <section>
  <h2>The encryption process</h2>
  <p>Plaintext is processed using an <b>encryption algorithm</b>: a set of steps designed to scramble the plaintext and create the ciphertext. The algorithm uses a <b>key</b>.</p>

  <p>Once the ciphertext has been produced, it can be sent across a network with relative safety. Even if it&#39;s intercepted, it won&#39;t make sense to anybody unless they have the key to <b>decrypt</b> it.</p>
 </section>
 <section>
  <h2>Types of encryption</h2>
  <p>There are two encryption techniques you need to know: <b>symmetric encryption</b> and <b>asymmetric encryption</b>. This lesson covers symmetric encryption. Asymmetric encryption is in the next lesson.</p>
  <p>Symmetric encryption uses <b>one single key</b> to both encrypt and decrypt data. Because the same key does both jobs, it must be kept private, which is why this is also called <b>private key</b> encryption.</p>
 </section>
 <section>
  <h2>Symmetric encryption: the Caesar cipher</h2>
  <p>A basic example of symmetric encryption is the <b>Caesar shift cipher</b>. It was used by Julius Caesar and is one of the earliest known ciphers.</p>
  <h3>How it works</h3>
  <div class="stepline"><b>Step 1</b><span>Get the message you want to encrypt. In this example the plaintext is <span class="mono">Bits of Bytes</span>.</span></div>
  <div class="stepline"><b>Step 2</b><span>Choose a key: a number from 1 to 25. (A shift of 26 would take every letter all the way round the alphabet and back to itself.)</span></div>
  <div class="stepline"><b>Step 3</b><span>To encrypt, shift each letter of the plaintext <b>forward</b> through the alphabet by the key.</span></div>
  <div class="stepline"><b>Step 4</b><span>To decrypt, shift each letter of the ciphertext <b>backward</b> by the key.</span></div>
  <div class="callout"><span class="k">Example</span>
   <p>Plaintext = <span class="mono">BITS OF BYTES</span> · Key = <b>3</b> · Ciphertext = <span class="mono"><b>ELWV RI EBWHV</b></span></p>
   <p>If the shift passes Z, loop back round to A and keep going. For example, Y shifted by 3 is <b>B</b> (Y → Z → A → B).</p></div>
  <p>Try it yourself. Type a message and change the key:</p>
  <div class="caesar" id="caesar"></div>
 </section>
 <section>
  <h2>The symmetric process</h2>
  <div class="stepline"><b>Step 1</b><span>The sender and receiver agree on the key and the algorithm they will use.</span></div>
  <div class="stepline"><b>Step 2</b><span>The sender uses the key and the encryption algorithm to produce the ciphertext.</span></div>
  <div class="stepline"><b>Step 3</b><span>The sender sends the ciphertext to the receiver.</span></div>
  <div class="stepline"><b>Step 4</b><span>The receiver uses the <b>same key</b> and the decryption algorithm to turn the ciphertext back into plaintext.</span></div>

  <div class="callout warnbox"><span class="k">Weakness of symmetric encryption</span>
   <p>A good symmetric encryption algorithm can be very hard to crack, but the idea has a weakness: the <b>initial agreement</b> about which key to use.</p>
   <p>If the sender and receiver agree on a key remotely, the key itself has to be sent across a network. A hacker could intercept the key, and then it would be easy to decrypt any ciphertext they intercept.</p>
   <figure class="srfig enfig"><svg viewBox="0 0 640 250" role="img" aria-label="The key is sent from the sender to the receiver across the network, and a hacker intercepts a copy of it"><defs><marker id="ena3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="srhead"/></marker></defs><rect x="24" y="34" width="170" height="100" rx="10" fill="#000" opacity=".14"/><rect x="20" y="30" width="170" height="100" rx="10" fill="#B3F2C6" stroke="#14232A" stroke-width="2.5"/><text x="105.0" y="60" text-anchor="middle" class="enbox" font-size="20" font-weight="700">Sender</text><g transform="translate(70 90) scale(1.0)"><circle cx="11" cy="0" r="11" fill="#E2B01E"/><circle cx="7" cy="-2" r="3.2" fill="#fff"/><path d="M20 -5 h34 l6 5 l-6 5 h-3 l-3 -3 l-3 3 l-3 -3 l-3 3 l-3 -3 l-3 3 h-12 z" fill="#E2B01E"/></g><rect x="454" y="34" width="170" height="100" rx="10" fill="#000" opacity=".14"/><rect x="450" y="30" width="170" height="100" rx="10" fill="#B3F2C6" stroke="#14232A" stroke-width="2.5"/><text x="535.0" y="60" text-anchor="middle" class="enbox" font-size="20" font-weight="700">Receiver</text><line x1="196" y1="82" x2="444" y2="82" class="srarr" marker-end="url(#ena3)"/><text x="320" y="70" text-anchor="middle" class="ensm">key sent across the network</text><line x1="320" y1="90" x2="320" y2="168" class="srarr endash" marker-end="url(#ena3)"/><circle cx="320" cy="196" r="13" fill="var(--ink)"/><path d="M299 240 v-12 a21 19 0 0 1 42 0 v12 z" fill="var(--ink)"/><g transform="translate(350 200) scale(0.8)"><circle cx="11" cy="0" r="11" fill="#E2B01E"/><circle cx="7" cy="-2" r="3.2" fill="#fff"/><path d="M20 -5 h34 l6 5 l-6 5 h-3 l-3 -3 l-3 3 l-3 -3 l-3 3 l-3 -3 l-3 3 h-12 z" fill="#E2B01E"/></g><text x="400" y="180" text-anchor="start" class="enlab2">Hacker copies the key</text></svg></figure></div>

<template id="th-2-3-asymmetric">
<div class="theory airy">
 <section>
  <h2>Asymmetric encryption (public key)</h2>
  <p class="lede">Asymmetric encryption solves the key problem of symmetric encryption by using <b>two keys</b>. Both keys are <b>created by the person who wants to receive data securely</b>.</p>
  <div class="keypair">
   <div class="kp pub"><span class="eyebrow">The public key</span><p>Used by the <b>sender</b> to encrypt data before sending it. It&#39;s created by the receiver and can be shared <b>publicly</b> with anyone who wants to send them data. It doesn&#39;t need to be kept secret, because it can only encrypt data. Data <b>can&#39;t be decrypted</b> with the public key.</p></div>
   <div class="kp priv"><span class="eyebrow">The private key</span><p>Kept <b>securely</b> by the receiver and never shared. It&#39;s the only key that can <b>decrypt</b> data that was encrypted with the matching public key.</p></div>
  </div>
  <p>One key encrypts the data and the other decrypts it. This is more secure than symmetric encryption because the decryption key <b>never has to be sent</b>, so it can&#39;t be intercepted and used to decrypt the ciphertext.</p>
 </section>
 <section>
  <h2>The asymmetric process</h2>
  <div class="stepline"><b>Step 1</b><span>The receiver creates a public key and a private key.</span></div>
  <div class="stepline"><b>Step 2</b><span>The receiver gives the public key to anyone who wants to send them data.</span></div>
  <div class="stepline"><b>Step 3</b><span>The sender encrypts the data using the receiver&#39;s public key.</span></div>
  <div class="stepline"><b>Step 4</b><span>The ciphertext is sent to the receiver.</span></div>
  <div class="stepline"><b>Step 5</b><span>The receiver uses their private key to decrypt the ciphertext back into plaintext.</span></div>

<template id="th-2-3-cracking">
<div class="theory airy">
 <section>
  <div class="callout tip"><span class="k">Extension</span><p>Cracking encryption goes beyond the 0478 syllabus, but it helps explain why keys need to be long and kept secret.</p></div>
  <h2>Cracking encryption</h2>
  <p class="lede">As with anything in computing that&#39;s designed to make things safer, some people want to break it.</p>
  <p>Encrypted data can sometimes be decoded <b>without</b> the key. This is called <b>cryptanalysis</b>. There are two methods: a <b>brute force attack</b> and a <b>non brute force attack</b>.</p>
 </section>
 <section>
  <h2>Brute force attack</h2>
  <p>A brute force attack tries to find the key by trying <b>every possible combination</b> of letters, numbers or characters until the right key is found.</p>
  <p>The larger the key, the longer this takes. This is why most services ask you to choose a strong password of at least 8 characters.</p>
  <h3>How strong is a key?</h3>
  <p>The number of possible keys for a key of a set length is <b>2<sup>number of bits</sup></b>:</p>
  <div class="tscroll"><table class="pvt" style="max-width:520px"><tr><th>Key length</th><th>Possible keys</th></tr>
   <tr><td>8 bits</td><td>2<sup>8</sup> = 256</td></tr><tr><td>16 bits</td><td>2<sup>16</sup> = 65,536</td></tr><tr><td>32 bits</td><td>2<sup>32</sup> = 4,294,967,296</td></tr></table></div>
  <p>Each extra bit <b>doubles</b> the number of keys an attacker has to work through, so it takes longer to crack. Drag the slider to see how quickly it grows:</p>
  <div class="keystr" id="keystr"></div>
 </section>
 <section>
  <h2>Non brute force attack</h2>
  <p>A non brute force attack doesn&#39;t try every key. It uses cleverer methods to work out the key.</p>
  <p>One of these is <b>frequency analysis</b>. It works because some letters are used much more than others. <b>E</b> is the most common letter in English, followed by T, A, O and I.</p>
  <p>Knowing this, an attacker looks for the most common letters in the ciphertext. If they can work out that every <span class="mono">H</span> in the ciphertext is an <span class="mono">E</span> in the plaintext, that&#39;s a great starting point for cracking the whole message. For a Caesar cipher, one letter is enough to find the key.</p>
  <h3>Try it: crack the message</h3>
  <p>This message was encrypted with a Caesar cipher. Look at which letter appears most often, then move the slider to shift it back until the message makes sense.</p>
  <div class="freq" id="freq"></div>
 </section>
</div>

<template id="th-3-1-vonneumann">
<div class="theory airy">
 <section>
  <p class="lede">Computers have changed a lot since they were invented. This lesson looks at how the <b>Von Neumann</b> concept changed the way computers work and shaped them into what we use today, and how the CPU follows the <b>fetch–decode–execute</b> cycle.</p>
  <h2>The Von Neumann concept</h2>
  <p>Early computers didn&#39;t store their programs in memory. Instead, a series of switches had to be set by hand, cables plugged in, or instructions read from paper tape, one at a time. To make the computer do something else, every switch had to be changed to a new combination.</p>
  <p>This was far from ideal: it was slow, time-consuming and easy to make mistakes.</p>
  <p>In 1945 the mathematician <b>John von Neumann</b> described the idea of storing the <b>program instructions</b> and the <b>data</b> they use <b>in the same memory</b>.</p>

" height="22" rx="3" fill="#C5E3F6"/><text x="380" y="158" text-anchor="middle" class="armono">03</text><text x="499" y="158" text-anchor="middle" class="armono" fill="#14232A" style="fill:#14232A">OUT</text><rect x="350" y="166" width="60" height="22" rx="3" class="arcell"/><rect x="414" y="166" width="170" height="22" rx="3" fill="#C5E3F6"/><text x="380" y="182" text-anchor="middle" class="armono">04</text><text x="499" y="182" text-anchor="middle" class="armono" fill="#14232A" style="fill:#14232A">HLT</text><rect x="350" y="190" width="60" height="22" rx="3" class="arcell"/><rect x="414" y="190" width="170" height="22" rx="3" fill="#F6E0B5"/><text x="380" y="206" text-anchor="middle" class="armono">06</text><text x="499" y="206" text-anchor="middle" class="armono" fill="#14232A" style="fill:#14232A">12</text><rect x="350" y="214" width="60" height="22" rx="3" class="arcell"/><rect x="414" y="214" width="170" height="22" rx="3" fill="#F6E0B5"/><text x="380" y="230" text-anchor="middle" class="armono">07</text><text x="499" y="230" text-anchor="middle" class="armono" fill="#14232A" style="fill:#14232A">30</text><rect x="372" y="244" width="12" height="10" fill="#C5E3F6"/><text x="388" y="253" class="ensm">instruction</text><rect x="484" y="244" width="12" height="10" fill="#F6E0B5"/><text x="500" y="253" class="ensm">data</text></svg></figure>
  <div class="callout"><span class="k">Key idea</span><p>The Von Neumann concept (the <b>stored program concept</b>): program instructions and data are stored together in the same memory.</p></div>
 </section>
 <section>
  <h2>Fetch, decode, execute</h2>
  <p>With instructions and data now stored in the same memory, the CPU (central processing unit) needed a process to find the right instruction and carry it out. It&#39;s no longer as simple as reading the switches.</p>
  <p>The process is called the <b>fetch–decode–execute cycle</b>. The CPU repeats these three stages constantly while the computer is running, so it can quickly and efficiently work through instructions.</p>
  <div class="fdesplit">
   <div>
    <h3>Fetch</h3><p>The next instruction is fetched from memory (RAM) into the CPU.</p>
    <h3>Decode</h3><p>The control unit decodes the instruction to work out what it means and what needs to happen.</p>
    <h3>Execute</h3><p>The instruction is carried out, for example a calculation in the ALU.</p>
    <p>When the execute stage is complete, the CPU goes back to the fetch stage for the next instruction.</p>
   </div>

ure>

<div class="theory airy">
 <section>
  <h2>The central processing unit (CPU)</h2>
  <p class="lede">The CPU is often called the brain of the computer, and it&#39;s a fair comparison. The CPU <b>processes the instructions and data</b> that are input into the computer, so that the result can be output. It&#39;s responsible for all processing and calculations.</p>
  <figure class="srfig enfig"><svg viewBox="0 0 660 440" role="img" aria-label="The CPU in the centre, connected to RAM above and secondary storage below in both directions, with input devices sending data in and output devices receiving data"><defs><marker id="arc3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="srhead"/></marker><marker id="arc3p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D27BCB"/></marker></defs><rect x="259" y="24" width="150" height="90" rx="8" fill="#000" opacity=".16"/><rect x="255" y="20" width="150" height="90" rx="8" fill="#F8F59A" stroke="#14232A" stroke-width="3"/><text x="330.0" y="61.0" text-anchor="middle" class="arbig" font-size="24">RAM</text><text x="330.0" y="85.0" text-anchor="middle" class="arsm2">Main memory</text><g transform="rotate(-20 222 34)"><rect x="222" y="34" width="16" height="78" rx="2" fill="#2F8F3A" stroke="#14232A" stroke-width="1.5"/><rect x="225" y="40" width="10" height="12" fill="#1C2A2E"/><rect x="225" y="58" width="10" height="12" fill="#1C2A2E"/><rect x="225" y="76" width="10" height="12" fill="#1C2A2E"/><rect x="225" y="94" width="10" height="12" fill="#1C2A2E"/></g><rect x="259" y="174" width="150" height="90" rx="8" fill="#000" opacity=".16"/><rect x="255" y="170" width="150" height="90" rx="8" fill="#7EEB7E" stroke="#14232A" stroke-width="3"/><text x="330.0" y="223.0" text-anchor="middle" class="arbig" font-size="30">CPU</text><rect x="259" y="324" width="150" height="90" rx="8" fill="#000" opacity=".16"/><rect x="255" y="320" width="150" height="90" rx="8" fill="#F8F59A" stroke="#14232A" stroke-width="3"/><text x="330.0" y="361.0" text-anchor="middle" class="arbig" font-size="20">SECONDARY</text><text x="330.0" y="385.0" text-anchor="middle" class="arsm2">Storage</text><rect x="392" y="370" width="70" height="56" rx="6" fill="#B9C2C6" stroke="#14232A" stroke-width="2"/><circle cx="422" cy="398" r="20" fill="#E4E9EA" stroke="#14232A" stroke-width="1.5"/><circle cx="422" cy="398" r="4" fill="#14232A"/><line x1="452" y1="380" x2="428" y2="400" stroke="#14232A" stroke-width="3"/><rect x="44" y="174" width="160" height="90" rx="8" fill="#000" opacity=".16"/><rect x="40" y="170" width="160" height="90" rx="8" fill="#9ADDEF" stroke="#14232A" stroke-width="3"/><text x="120.0" y="211.0" text-anchor="middle" class="arbig" font-size="24">INPUT</text><text x="120.0" y="235.0" text-anchor="middle" class="arsm2">Devices</text><ellipse cx="70" cy="290" rx="16" ry="24" fill="#2F6BC8" stroke="#14232A" stroke-width="2" transform="rotate(-40 70 290)"/><line x1="64" y1="276" x2="74" y2="288" stroke="#1C2A2E" stroke-width="2" transform="rotate(0)"/><rect x="120" y="272" width="20" height="30" rx="10" fill="#B9C2C6" stroke="#14232A" stroke-width="2"/><line x1="123" y1="280" x2="137" y2="280" stroke="#14232A" stroke-width="1"/><line x1="123" y1="286" x2="137" y2="286" stroke="#14232A" stroke-width="1"/><line x1="123" y1="292" x2="137" y2="292" stroke="#14232A" stroke-width="1"/><rect x="127" y="302" width="6" height="12" fill="#14232A"/><rect x="464" y="174" width="160" height="90" rx="8" fill="#000" opacity=".16"/><rect x="460" y="170" width="160" height="90" rx="8" fill="#9ADDEF" stroke="#14232A" stroke-width="3"/><text x="540.0" y="211.0" text-anchor="middle" class="arbig" font-size="24">OUTPUT</text><text x="540.0" y="235.0" text-anchor="middle" class="arsm2">Devices</text><rect x="508" y="104" width="64" height="44" rx="3" fill="#fff" stroke="#14232A" stroke-width="3"/><rect x="536" y="148" width="8" height="10" fill="#14232A"/><rect x="526" y="157" width="28" height="4" fill="#14232A"/><line x1="310" y1="168" x2="310" y2="116" class="srarr arthick" marker-end="url(#arc3)"/><line x1="350" y1="114" x2="350" y2="166" class="srarr arthick" marker-end="url(#arc3)"/><line x1="310" y1="318" x2="310" y2="266" class="srarr arthick" marker-end="url(#arc3)"/><line x1="350" y1="264" x2="350" y2="316" class="srarr arthick" marker-end="url(#arc3)"/><line x1="204" y1="215" x2="250" y2="215" class="srarr arthick" marker-end="url(#arc3)"/><line x1="410" y1="215" x2="456" y2="215" class="srarr arthick" marker-end="url(#arc3)"/></svg></figure>
  <p>The diagram shows that the CPU sits at the centre of the computer, connecting and managing all the components as they interact with each other.</p>
  <div class="callout"><span class="k">Microprocessor</span><p>A <b>microprocessor</b> is a type of <b>integrated circuit on a single chip</b>. The CPU in most computers is a microprocessor.</p></div>
 </section>
 <section>
  <h2>Inside the CPU</h2>
  <div class="fdesplit">
   <div>
    <p>The CPU is a small chip, only about 45 mm × 42.5 mm, but there&#39;s a lot going on inside it. A Von Neumann CPU contains:</p>
    <ul class="obj"><li>Two units: the <b>control unit (CU)</b> and the <b>arithmetic logic unit (ALU)</b></li><li><b>Registers</b>: small, very fast memory locations inside the CPU. You need to know the <b>PC</b>, <b>MAR</b>, <b>MDR</b>, <b>CIR</b> and <b>ACC</b>.</li><li><b>Buses</b> that connect the components. You&#39;ll learn about them in the next lesson.</li></ul>
   </div>
   <figure class="srfig enfig"><svg viewBox="0 0 380 380" role="img" aria-label="Inside the CPU: the control unit, the ALU, and the registers PC, MAR, MDR, CIR and ACC"><defs><marker id="arc4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="srhead"/></marker><marker id="arc4p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D27BCB"/></marker></defs><rect x="10" y="10" width="360" height="360" fill="#2E6B3A"/><circle cx="22.0" cy="20" r="2" fill="#D9C46A"/><circle cx="22.0" cy="360" r="2" fill="#D9C46A"/><circle cx="20" cy="22.0" r="2" fill="#D9C46A"/><circle cx="360" cy="22.0" r="2" fill="#D9C46A"/><circle cx="33.3" cy="20" r="2" fill="#D9C46A"/><circle cx="33.3" cy="360" r="2" fill="#D9C46A"/><circle cx="20" cy="33.3" r="2" fill="#D9C46A"/><circle cx="360" cy="33.3" r="2" fill="#D9C46A"/><circle cx="44.6" cy="20" r="2" fill="#D9C46A"/><circle cx="44.6" cy="360" r="2" fill="#D9C46A"/><circle cx="20" cy="44.6" r="2" fill="#D9C46A"/><circle cx="360" cy="44.6" r="2" fill="#D9C46A"/><circle cx="55.9" cy="20" r="2" fill="#D9C46A"/><circle cx="55.9" cy="360" r="2" fill="#D9C46A"/><circle cx="20" cy="55.9" r="2" fill="#D9C46A"/><circle cx="360" cy="55.9" r="2" fill="#D9C46A"/><circle cx="67.2" cy="20" r="2" fill="#D9C46A"/><circle cx="67.2" cy="360" r="2" fill="#D9C46A"/><circle cx="20" cy="67.2" r="2" fill="#D9C46A"/><circle cx="360" cy="67.2" r="2" fill="#D9C46A"/><circle cx="78.5" cy="20" r="2" fill="#D9C46A"/><circle cx="78.5" cy="360" r="2" fill="#D9C46A"/><circle cx="20" cy="78.5" r="2" fill="#D9C46A"/><circle cx="360" cy="78.5" r="2" fill="#D9C46A"/><circle cx="89.8" cy="20" r="2" fill="#D9C46A"/><circle cx="89.8" cy="360" r="2" fill="#D9C46A"/><circle cx="20" cy="89.8" r="2" fill="#D9C46A"/><circle cx="360" cy="89.8" r="2" fill="#D9C46A"/><circle cx="101.1" cy="20" r="2" fill="#D9C46A"/><circle  r="2" fill="#D9C46A"/><circle cx="20" cy="214.1" r="2" fill="#D9C46A"/><circle cx="360" cy="214.1" r="2" fill="#D9C46A"/><circle cx="225.4" cy="20" r="2" fill="#D9C46A"/><circle cx="225.4" cy="360" r="2" fill="#D9C46A"/><circle cx="20" cy="225.4" r="2" fill="#D9C46A"/><circle cx="360" cy="225.4" r="2" fill="#D9C46A"/><circle cx="236.7" cy="20" r="2" fill="#D9C46A"/><circle cx="236.7" cy="360" r="2" fill="#D9C46A"/><circle cx="20" cy="236.7" r="2" fill="#D9C46A"/><circle cx="360" cy="236.7" r="2" fill="#D9C46A"/><circle cx="248.0" cy="20" r="2" fill="#D9C46A"/><circle cx="248.0" cy="360" r="2" fill="#D9C46A"/><circle cx="20" cy="248.0" r="2" fill="#D9C46A"/><circle cx="360" cy="248.0" r="2" fill="#D9C46A"/><circle cx="259.3" cy="20" r="2" fill="#D9C46A"/><circle cx="259.3" cy="360" r="2" fill="#D9C46A"/><circle cx="20" cy="259.3" r="2" fill="#D9C46A"/><circle cx="360" cy="259.3" r="2" fill="#D9C46A"/><circle cx="270.6" cy="20" r="2" fill="#D9C46A"/><circle cx="270.6" cy="360" r="2" fill="#D9C46A"/><circle cx="20" cy="270.6" r="2" fill="#D9C46A"/><circle cx="360" cy="270.6" r="2" fill="#D9C46A"/><circle cx="281.9" cy="20" r="2" fill="#D9C46A"/><circle cx="281.9" cy="360" r="2" fill="#D9C46A"/><circle cx="20" cy="281.9" r="2" fill="#D9C46A"/><circle cx="360" cy="281.9" r="2" fill="#D9C46A"/><circle cx="293.2" cy="20" r="2" fill="#D9C46A"/><circle cx="293.2" cy="360" r="2" fill="#D9C46A"/><circle cx="20" cy="293.2" r="2" fill="#D9C46A"/><circle cx="360" cy="293.2" r="2" fill="#D9C46A"/><circle cx="304.5" cy="20" r="2" fill="#D9C46A"/><circle cx="304.5" cy="360" r="2" fill="#D9C46A"/><circle cx="20" cy="304.5" r="2" fill="#D9C46A"/><circle cx="360" cy="304.5" r="2" fill="#D9C46A"/><circle cx="315.8" cy="20" r="2" fill="#D9C46A"/><circle cx="315.8" cy="360" r="2" fill="#D9C46A"/><circle cx="20" cy="315.8" r="2" fill="#D9C46A"/><circle cx="360" cy="315.8" r="2" fill="#D9C46A"/><circle cx="327.1" cy="20" r="2" fill="#D9C46A"/><circle cx="327.1" cy="360" r="2" fill="#D9C46A"/><circle cx="20" cy="327.1" r="2" fill="#D9C46A"/><circle cx="360" cy="327.1" r="2" fill="#D9C46A"/><circle cx="338.4" cy="20" r="2" fill="#D9C46A"/><circle cx="338.4" cy="360" r="2" fill="#D9C46A"/><circle cx="20" cy="338.4" r="2" fill="#D9C46A"/><circle cx="360" cy="338.4" r="2" fill="#D9C46A"/><circle cx="349.7" cy="20" r="2" fill="#D9C46A"/><circle cx="349.7" cy="360" r="2" fill="#D9C46A"/><circle cx="20" cy="349.7" r="2" fill="#D9C46A"/><circle cx="360" cy="349.7" r="2" fill="#D9C46A"/><rect x="34" y="34" width="312" height="312" rx="22" fill="#EFE3D6"/><rect x="54" y="54" width="132" height="120" rx="6" fill="#B9E59A" stroke="#14232A" stroke-width="3"/><text x="120.0" y="108.7" text-anchor="middle" class="arbody" font-size="22">Control</text><text x="120.0" y="134.7" text-anchor="middle" class="arbody" font-size="22">Unit</text><rect x="194" y="54" width="132" height="120" rx="6" fill="#9DD2E8" stroke="#14232A" stroke-width="3"/><text x="260.0" y="122.4" text-anchor="middle" class="arbody" font-size="24">ALU</text><text x="190" y="200" text-anchor="middle" class="arbody" font-size="15" font-weight="700">Registers</text><rect x="54" y="210" width="50" height="116" rx="6" fill="#F5E6A8" stroke="#14232A" stroke-width="3"/><text x="79.0" y="273.2" text-anchor="middle" class="arbody" font-size="15">PC</text><rect x="109" y="210" width="50" height="116" rx="6" fill="#74B8DC" stroke="#14232A" stroke-width="3"/><text x="134.0" y="273.2" text-anchor="middle" class="arbody" font-size="15">MAR</text><rect x="164" y="210" width="50" height="116" rx="6" fill="#D6D6D6" stroke="#14232A" stroke-width="3"/><text x="189.0" y="273.2" text-anchor="middle" class="arbody" font-size="15">MDR</text><rect x="219" y="210" width="50" height="116" rx="6" fill="#C9F1C0" stroke="#14232A" stroke-width="3"/><text x="244.0" y="273.2" text-anchor="middle" class="arbody" font-size="15">CIR</text><rect x="274" y="210" width="50" height="116" rx="6" fill="#E9AEEA" stroke="#14232A" stroke-width="3"/><text x="299.0" y="273.2" text-anchor="middle" class="arbody" font-size="15">ACC</text></svg></figure>
  </div>
  <div class="ccards">
   <div class="ccard cu"><h3>Control unit (CU)</h3><p>Controls and coordinates the operation of the CPU by sending <b>control signals</b> to the other components. It manages the fetch–decode–execute cycle and <b>decodes</b> each instruction in the CIR, so the instruction can be executed.</p></div>
   <div class="ccard alu"><h3>Arithmetic logic unit (ALU)</h3><p>Carries out all the <b>calculations</b> and <b>logical operations</b>:</p><ul><li>Addition and subtraction</li><li>Multiplication and division</li><li>Logical comparisons, e.g. Is A = B? Is 3 &gt; 5?</li></ul><p>It can combine comparisons with the Boolean operators AND, OR and NOT, e.g. Is A &lt; B OR C &lt; A?</p></div>
  </div>
 </section>
 <section>
  <h2>Registers</h2>
  <p>A register is a small but very fast memory location inside the CPU. Each one has a specific job:</p>
  <div class="ccards">
   <div class="ccard pc"><h3>Program counter (PC)</h3><p>Stores the <b>address</b> in memory of the <b>next instruction</b> to be fetched.</p></div>
   <div class="ccard mar"><h3>Memory address register (MAR)</h3><p>Holds the <b>address</b> of the memory location that is about to be <b>read from or written to</b>.</p></div>
   <div class="ccard mdr"><h3>Memory data register (MDR)</h3><p>Holds the <b>data or instruction</b> that has just been fetched from memory, or that&#39;s about to be written to memory. An instruction is stored in the MDR before being copied into the CIR.</p></div>
   <div class="ccard cir"><h3>Current instruction register (CIR)</h3><p>Holds the <b>instruction</b> that is currently being <b>decoded and executed</b>.</p></div>
   <div class="ccard acc"><h3>Accumulator (ACC)</h3><p>Stores the <b>result</b> of calculations carried out by the <b>ALU</b>, including <b>interim</b> (in-between) results while a longer calculation is being worked out. Some CPUs also have general purpose registers, which act like the CPU&#39;s notepad for values used in calculations.</p></div>
  </div>
  <h3>Register summary</h3>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Register</th><th>What it holds</th></tr>
   <tr><td><b>PC</b> · Program counter</td><td>The address of the next instruction to be fetched</td></tr>
   <tr><td><b>MAR</b> · Memory address register</td><td>The address of the memory location to be read from or written to</td></tr>
   <tr><td><b>MDR</b> · Memory data register</td><td>The data or instruction fetched from memory, or to be written to memory</td></tr>
   <tr><td><b>CIR</b> · Current instruction register</td><td>The instruction being decoded and executed</td></tr>
   <tr><td><b>ACC</b> · Accumulator</td><td>The result of calculations carried out in the ALU</td></tr></table></div>
 </section>
 <section>
  <h2>Coming together: the fetch–decode–execute cycle</h2>
  <p>There are a lot of different parts inside the CPU, and they all work together to carry out the fetch–decode–execute cycle. Follow the flowchart to see the process in detail:</p>
  <div class="fdeflow" role="list"><i class="ffin" aria-hidden="true"></i><div class="ff c1" role="listitem">The <b>program counter (PC)</b> holds the address of the next instruction to be fetched from memory.</div><div class="ffa" aria-hidden="true"></div><div class="ff c2" role="listitem">The address in the <b>PC</b> is copied into the <b>MAR</b>.</div><div class="ffa" aria-hidden="true"></div><div class="ff c3" role="listitem">The address in the <b>MAR</b> is sent along the <b>address bus</b> to RAM. The instruction stored at that address is sent along the <b>data bus</b> to the <b>MDR</b>.</div><div class="ffa" aria-hidden="true"></div><div class="ff c4" role="listitem">The instruction in the <b>MDR</b> is copied into the <b>CIR</b>.</div><div class="ffa" aria-hidden="true"></div><div class="ff c5" role="listitem">The value in the <b>PC</b> is incremented by 1, so it points to the next instruction to be fetched.</div><div class="ffa" aria-hidden="true"></div><div class="ff c6" role="listitem">The instruction in the <b>CIR</b> is decoded by the control unit and executed.</div><i class="ffout" aria-hidden="true"></i></div>
  <div class="callout tip"><span class="k">Note</span><p>The PC doesn&#39;t have to be incremented at exactly this point. It can happen at any time <b>after</b> its address has been copied into the MAR, as long as it&#39;s <b>before</b> the instruction is decoded and executed. Mark schemes accept any of these positions.</p></div>
 </section>
 <section>
  <h2>The Little Man Computer</h2>
  <p>The <b>Little Man Computer</b> is a model of a Von Neumann computer. Imagine a little man working in a room. He has a set of numbered <b>mailboxes</b> (memory), a <b>counter</b> (the PC) and a <b>calculator</b> (the ALU and ACC). He repeats the same routine for every instruction: fetch, decode, execute.</p>
  <p>Choose a program, then click <b>Next step</b> to follow every step of the cycle. Watch which registers change, which bus is used and where the little man goes. You can change the data values first.</p>
  <div class="lmc" id="lmc"></div>
  <div class="callout tip"><span class="k">Instruction codes</span><p>Each instruction is a 3-digit number. The first digit says what to do and the last two give an address: <span class="mono">5xx</span> LDA (load into the ACC), <span class="mono">1xx</span> ADD, <span class="mono">2xx</span> SUB, <span class="mono">3xx</span> STA (store the ACC), <span class="mono">902</span> OUT, <span class="mono">000</span> HLT (stop). For example, <span class="mono">506</span> means "load the value at address 06".</p></div>
 </section>
</div>
</template>
<template id="th-3-1-buses">
<div class="theory airy">
 <section>
  <h2>Buses</h2>
  <p class="lede">The components in a computer, and inside the CPU itself, have to work together. To communicate, they need connections that allow data to be transmitted between them.</p>
  <p>These connections are <b>buses</b>. A bus is a set of parallel wires that connects two or more components in a computer system. There are three buses:</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Bus</th><th>What it carries</th><th>Direction</th></tr>
   <tr><td><b>Address bus</b></td><td><b>Addresses</b>: the memory location to be read from or written to, sent from the CPU (the MAR) to memory</td><td><b>Unidirectional</b>: one direction only</td></tr>
   <tr><td><b>Data bus</b></td><td>The <b>actual data</b> and instructions moving between the CPU, memory and input/output devices</td><td><b>Bidirectional</b>: both directions</td></tr>
   <tr><td><b>Control bus</b></td><td><b>Control signals</b> from the control unit, e.g. a signal to read or write data, and timing signals from the clock</td><td><b>Bidirectional</b>: both directions</td></tr></table></div>
  <p>Choose a bus to highlight it on the diagram:</p>
  <div class="busdemo" id="busdemo">
   <div class="seg" style="align-self:flex-start;flex-wrap:wrap"><button data-bus-v="all" aria-pressed="true">All buses</button><button data-bus-v="data" aria-pressed="false">Data bus</button><button data-bus-v="addr" aria-pressed="false">Address bus</button><button data-bus-v="ctrl" aria-pressed="false">Control bus</button></div>
   <svg viewBox="0 0 690 330" role="img" aria-label="Three buses connect the CPU, memory, and input and output: the data bus and control bus carry signals both ways; the address bus carries addresses one way, from the CPU to memory and input and output"><defs><marker id="arc5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="srhead"/></marker><marker id="arc5p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D27BCB"/></marker><marker id="arc5bdata" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="2.6" markerHeight="2.6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5BA9DE"/></marker><marker id="arc5baddr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="2.6" markerHeight="2.6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4F8FC4"/></marker><marker id="arc5bctrl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="2.6" markerHeight="2.6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7FA7C4"/></marker></defs><rect x="50" y="20" width="170" height="92" rx="10" class="arbox"/><text x="135" y="46" text-anchor="middle" class="arbody2">CPU</text><text x="135" y="66" text-anchor="middle" class="arbody2">(ALU, registers and</text><text x="135" y="86" text-anchor="middle" class="arbody2">control unit)</text><rect x="260" y="20" width="170" height="92" rx="10" class="arbox"/><text x="345" y="56" text-anchor="middle" class="arbody2">Memory</text><text x="345" y="76" text-anchor="middle" class="arbody2">(RAM)</text><rect x="470" y="20" width="170" height="92" rx="10" class="arbox"/><text x="555" y="56" text-anchor="middle" class="arbody2">Input and</text><text x="555" y="76" text-anchor="middle" class="arbody2">output</text><g data-bus="data" class="busg"><rect x="24" y="190" width="640" height="16" rx="3" fill="#8CCBEE" stroke="#5BA9DE" stroke-width="1.5"/><text x="30" y="222" class="arbus">Data bus · bidirectional</text><line x1="90" y1="118" x2="90" y2="184" stroke="#5BA9DE" stroke-width="7" marker-start="url(#arc5bdata)" marker-end="url(#arc5bdata)"/><line x1="300" y1="118" x2="300" y2="184" stroke="#5BA9DE" stroke-width="7" marker-start="url(#arc5bdata)" marker-end="url(#arc5bdata)"/><line x1="510" y1="118" x2="510" y2="184" stroke="#5BA9DE" stroke-width="7" marker-start="url(#arc5bdata)" marker-end="url(#arc5bdata)"/></g><g data-bus="addr" class="busg"><rect x="24" y="236" width="640" height="16" rx="3" fill="#B5DDF5" stroke="#4F8FC4" stroke-width="1.5"/><text x="30" y="268" class="arbus">Address bus · unidirectional</text><line x1="135" y1="114" x2="135" y2="230" stroke="#4F8FC4" stroke-width="7" marker-end="url(#arc5baddr)"/><line x1="345" y1="236" x2="345" y2="120" stroke="#4F8FC4" stroke-width="7" marker-end="url(#arc5baddr)"/><line x1="555" y1="236" x2="555" y2="120" stroke="#4F8FC4" stroke-width="7" marker-end="url(#arc5baddr)"/></g><g data-bus="ctrl" class="busg"><rect x="24" y="282" width="640" height="16" rx="3" fill="#D7EEFB" stroke="#7FA7C4" stroke-width="1.5"/><text x="30" y="314" class="arbus">Control bus · bidirectional</text><line x1="180" y1="118" x2="180" y2="276" stroke="#7FA7C4" stroke-width="7" marker-start="url(#arc5bctrl)" marker-end="url(#arc5bctrl)"/><line x1="390" y1="118" x2="390" y2="276" stroke="#7FA7C4" stroke-width="7" marker-start="url(#arc5bctrl)" marker-end="url(#arc5bctrl)"/><line x1="600" y1="118" x2="600" y2="276" stroke="#7FA7C4" stroke-width="7" marker-start="url(#arc5bctrl)" marker-end="url(#arc5bctrl)"/></g></svg>
   <p class="vfoot" id="bus-note">The three buses connect the CPU, memory, and input and output devices.</p>
  </div>
  <div class="callout tip"><span class="k">Why is the address bus one way?</span><p>Only the CPU decides which memory location to use, so addresses only ever travel <b>from</b> the CPU <b>to</b> memory. Data has to go both ways, because the CPU both reads data from memory and writes data to memory.</p></div>
 </section>
 <section>
  <h2>Buses in the fetch–decode–execute cycle</h2>
  <div class="stepline"><b>Address bus</b><span>Carries the address in the MAR to RAM, so RAM knows which location to use.</span></div>
  <div class="stepline"><b>Control bus</b><span>Carries the signal telling RAM whether to <b>read</b> (send data to the CPU) or <b>write</b> (store data from the CPU).</span></div>
  <div class="stepline"><b>Data bus</b><span>Carries the instruction or data from RAM into the MDR, or from the MDR back to RAM.</span></div>
  <p>You can watch all three buses being used in the Little Man Computer in the previous lesson.</p>
 </section>
</div>

<template id="th-3-1-cores">
<div class="theory airy">
 <section>
  <p class="lede">If you&#39;ve ever shopped for a computer or its parts, you&#39;ll have had to choose a CPU. Comparing CPUs can be daunting, because there are lots of numbers and technical terms.</p>
  <div class="speccard"><div class="sc-pic" aria-hidden="true"><svg viewBox="0 0 80 80"><rect x="6" y="6" width="68" height="68" fill="#3E9A5C"/><rect x="16" y="14" width="48" height="52" rx="5" fill="#A9AFB2"/><rect x="24" y="26" width="14" height="22" fill="#151A1C"/><rect x="42" y="26" width="14" height="22" fill="#151A1C"/></svg></div>
   <div class="sc-body"><b>Example CPU · desktop processor</b><span class="sc-stars" aria-hidden="true">★★★★★</span><p><mark class="circ">8 cores / 16 threads</mark>, <mark class="circ">3.80 GHz clock speed</mark>, 5.1 GHz max turbo, 16 MB cache, 125 W TDP</p></div></div>
  <p>This lesson explains the two circled items: the number of <b>cores</b> and the <b>clock speed</b>. The next lesson covers the cache.</p>
 </section>
 <section>
  <h2>CPU cores</h2>
  <p>A <b>core</b> is a processing unit that can fetch, decode and execute instructions <b>independently</b>. In the past, CPUs had only one core. Modern CPUs usually contain between 2 and 16 cores, and some have even more. In effect, a modern CPU contains several processors.</p>
  <p>Why would we want this? A CPU with multiple cores can work on <b>several tasks at the same time</b>. This increases the performance of the CPU, because more work can be completed in less time.</p>
  <figure class="srfig enfig"><svg viewBox="0 0 560 330" role="img" aria-label="A multi-core CPU chip with two cores, labelled core 1 and core 2"><defs><marker id="cc1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E0402E"/></marker><marker id="cc1k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="srhead"/></marker></defs><rect x="150" y="20" width="260" height="260" fill="#3E9A5C"/><rect x="181.2" y="40.8" width="197.6" height="218.4" rx="14.0" fill="#A9AFB2"/><rect x="202.0" y="61.6" width="156.0" height="176.8" rx="10.0" fill="#C3C7C9"/><rect x="207.2" y="77.2" width="11.7" height="7.8" rx="1" fill="#E9B23C"/><rect x="223.8" y="77.2" width="11.7" height="7.8" rx="1" fill="#E9B23C"/><rect x="240.5" y="77.2" width="11.7" height="7.8" rx="1" fill="#E9B23C"/><rect x="257.1" y="77.2" width="11.7" height="7.8" rx="1" fill="#E9B23C"/><rect x="273.8" y="77.2" width="11.7" height="7.8" rx="1" fill="#E9B23C"/><rect x="290.4" y="77.2" width="11.7" height="7.8" rx="1" fill="#E9B23C"/><rect x="307.0" y="77.2" width="11.7" height="7.8" rx="1" fill="#E9B23C"/><rect x="323.7" y="77.2" width="11.7" height="7.8" rx="1" fill="#E9B23C"/><rect x="340.3" y="77.2" width="11.7" height="7.8" rx="1" fill="#E9B23C"/><rect x="215.0" y="118.8" width="62.4" height="78.0" fill="#151A1C"/><rect x="287.8" y="118.8" width="62.4" height="78.0" fill="#151A1C"/><rect x="233.2" y="20" width="93.6" height="13.0" fill="#151A1C"/><rect x="233.2" y="267.0" width="93.6" height="13.0" fill="#151A1C"/><text x="130" y="212" text-anchor="end" class="ccred">CORE 1</text><polyline points="136,206 210,170" fill="none" stroke="#E0402E" stroke-width="3" marker-end="url(#cc1)"/><line x1="134" y1="206" x2="140" y2="206" stroke="#E0402E" stroke-width="3"/><text x="430" y="142" text-anchor="start" class="ccred">CORE 2</text><polyline points="426,136 360,170" fill="none" stroke="#E0402E" stroke-width="3" marker-end="url(#cc1)"/><text x="280" y="316" text-anchor="middle" class="ccred ccbig">MULTI-CORE CPU</text></svg></figure>
  <p>Each core contains its own <b>ALU</b>, <b>control unit</b> and <b>registers</b>, which is what lets it work on tasks independently.</p>
  <figure class="srfig enfig"><svg viewBox="0 0 760 340" role="img" aria-label="Each core of a multi-core CPU contains its own ALU, control unit and registers"><defs><marker id="cc2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E0402E"/></marker><marker id="cc2k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="srhead"/></marker></defs><rect x="10" y="34" width="190" height="250" rx="22" class="ccore"/><rect x="22" y="48" width="166" height="62" rx="8" fill="#8DCDEB" stroke="#14232A" stroke-width="2.5"/><text x="105" y="86" text-anchor="middle" class="ccmono">ALU</text><rect x="22" y="126" width="166" height="62" rx="8" fill="#F6D5B8" stroke="#14232A" stroke-width="2.5"/><text x="105" y="164" text-anchor="middle" class="ccmono">Control unit</text><rect x="22" y="204" width="166" height="62" rx="8" fill="#FAF8C8" stroke="#14232A" stroke-width="2.5"/><text x="105" y="242" text-anchor="middle" class="ccmono">Registers</text><rect x="260" y="40" width="240" height="240" fill="#3E9A5C"/><rect x="288.8" y="59.2" width="182.4" height="201.6" rx="12.923076923076923" fill="#A9AFB2"/><rect x="308.0" y="78.4" width="144.0" height="163.20000000000002" rx="9.230769230769232" fill="#C3C7C9"/><rect x="312.8" y="92.8" width="10.8" height="7.2" rx="1" fill="#E9B23C"/><rect x="328.2" y="92.8" width="10.8" height="7.2" rx="1" fill="#E9B23C"/><rect x="343.5" y="92.8" width="10.8" height="7.2" rx="1" fill="#E9B23C"/><rect x="358.9" y="92.8" width="10.8" height="7.2" rx="1" fill="#E9B23C"/><rect x="374.2" y="92.8" width="10.8" height="7.2" rx="1" fill="#E9B23C"/><rect x="389.6" y="92.8" width="10.8" height="7.2" rx="1" fill="#E9B23C"/><rect x="405.0" y="92.8" width="10.8" height="7.2" rx="1" fill="#E9B23C"/><rect x="420.3" y="92.8" width="10.8" height="7.2" rx="1" fill="#E9B23C"/><rect x="435.7" y="92.8" width="10.8" height="7.2" rx="1" fill="#E9B23C"/><rect x="320.0" y="131.2" width="57.599999999999994" height="72.0" fill="#151A1C"/><rect x="387.2" y="131.2" width="57.599999999999994" height="72.0" fill="#151A1C"/><rect x="336.8" y="40" width="86.39999999999999" height="12.0" fill="#151A1C"/><rect x="336.8" y="268.0" width="86.39999999999999" height="12.0" fill="#151A1C"/><rect x="560" y="34" width="190" height="250" rx="22" class="ccore"/><rect x="572" y="48" width="166" height="62" rx="8" fill="#8DCDEB" stroke="#14232A" stroke-width="2.5"/><text x="655" y="86" text-anchor="middle" class="ccmono">ALU</text><rect x="572" y="126" width="166" height="62" rx="8" fill="#F6D5B8" stroke="#14232A" stroke-width="2.5"/><text x="655" y="164" text-anchor="middle" class="ccmono">Control unit</text><rect x="572" y="204" width="166" height="62" rx="8" fill="#FAF8C8" stroke="#14232A" stroke-width="2.5"/><text x="655" y="242" text-anchor="middle" class="ccmono">Registers</text><text x="380" y="320" text-anchor="middle" class="ccred ccbig">MULTI-CORE CPU</text><polyline points="320,155 205,105" fill="none" stroke="#E0402E" stroke-width="3" marker-end="url(#cc2)"/><text x="105" y="22" text-anchor="middle" class="ccred">CORE 1</text><polyline points="440,155 555,105" fill="none" stroke="#E0402E" stroke-width="3" marker-end="url(#cc2)"/><text x="655" y="22" text-anchor="middle" class="ccred">CORE 2</text></svg></figure>
 </section>
 <section>
  <h2>More cores = more power?</h2>
  <p>Adding more cores does increase overall performance, but <b>not</b> by 100% for each extra core. Doubling the number of cores won&#39;t exactly double the performance, and four times the cores won&#39;t give four times the performance. Why not?</p>
  <ul class="obj">
   <li>Every extra core adds more <b>communication and coordination</b> between the cores, which takes time.</li>
   <li>Some tasks <b>can&#39;t be split up</b> into parts that run at the same time, and some software isn&#39;t written to use more than one core.</li>
  </ul>
 </section>
 <section>
  <h2>Clock speed</h2>
  <div class="speccard"><div class="sc-pic" aria-hidden="true"><svg viewBox="0 0 80 80"><rect x="6" y="6" width="68" height="68" fill="#3E9A5C"/><rect x="16" y="14" width="48" height="52" rx="5" fill="#A9AFB2"/><rect x="24" y="26" width="14" height="22" fill="#151A1C"/><rect x="42" y="26" width="14" height="22" fill="#151A1C"/></svg></div>
   <div class="sc-body"><b>Example CPU · desktop processor</b><span class="sc-stars" aria-hidden="true">★★★★★</span><p>8 cores / 16 threads, <mark class="circ">3.80 GHz clock speed</mark>, 5.1 GHz max turbo, 16 MB cache, 125 W TDP</p></div></div>
  <p>The CPU above has 8 cores and a clock speed of <b>3.80 GHz</b>.</p>
  <h3>What is clock speed?</h3>
  <p>The CPU contains a <b>clock</b> that sends out a regular pulse. Each pulse is one <b>cycle</b>, and the CPU carries out fetch–decode–execute work in time with the pulses. The <b>clock speed</b> is the number of cycles per second, measured in <b>hertz (Hz)</b>.</p>
  <p>A modern CPU carries out billions of cycles every second, so clock speed is usually given in <b>gigahertz (GHz)</b>:</p>
  <div class="tscroll"><table class="pvt" style="max-width:560px"><tr><th>Unit</th><th>Cycles per second</th></tr>
   <tr><td>1 hertz (Hz)</td><td>1</td></tr><tr><td>1 kilohertz (kHz)</td><td>1,000</td></tr><tr><td>1 megahertz (MHz)</td><td>1,000,000</td></tr><tr><td>1 gigahertz (GHz)</td><td>1,000,000,000</td></tr></table></div>
  <p>1 GHz is 1 billion cycles per second, so the CPU above carries out <b>3.8 billion cycles per second</b>.</p>
  <div class="callout"><span class="k">Remember</span><p>In general, the <b>higher the clock speed</b>, the more instructions can be processed each second, so the <b>faster</b> the CPU. A higher clock speed also makes the CPU produce more <b>heat</b>, which is one reason clock speeds can&#39;t keep rising forever. Adding more cores has let CPUs keep getting faster without needing ever-higher clock speeds.</p></div>
 </section>

  <h2>Compare two CPUs</h2>
  <p>Change the cores and clock speed of each CPU to see which one should perform better:</p>

 </section>
</div>

<template id="th-3-1-cache">
<div class="theory airy">
 <section>
  <div class="speccard"><div class="sc-pic" aria-hidden="true"><svg viewBox="0 0 80 80"><rect x="6" y="6" width="68" height="68" fill="#3E9A5C"/><rect x="16" y="14" width="48" height="52" rx="5" fill="#A9AFB2"/><rect x="24" y="26" width="14" height="22" fill="#151A1C"/><rect x="42" y="26" width="14" height="22" fill="#151A1C"/></svg></div>
   <div class="sc-body"><b>Example CPU · desktop processor</b><span class="sc-stars" aria-hidden="true">★★★★★</span><p>8 cores / 16 threads, 3.80 GHz clock speed, 5.1 GHz max turbo, <mark class="circ">16 MB cache</mark>, 125 W TDP</p></div></div>
  <h2>CPU cache</h2>
  <p class="lede">Modern CPUs are so fast that they can process data more quickly than it can be fetched from RAM. The CPU then has to wait, which slows it down. This is called a <b>bottleneck</b>.</p>
  <p>To reduce this, a small but extremely fast memory called the <b>cache</b> is built into the CPU. It stores frequently used <b>instructions and data</b>, so they can be accessed much more quickly than from RAM.</p>

 <section>
  <h2>Cache levels</h2>
  <p>There are three levels of cache, each with a different speed, size and job: <b>L1</b>, <b>L2</b> and <b>L3</b>.</p>
  <div class="ccards cstack">
   <div class="ccard l1"><h3>L1 cache</h3><p>The <b>fastest</b> cache, and the <b>smallest</b>: typically 2 KiB to 64 KiB. It stores the data the core is most likely to need for its current task. Each core has its own.</p></div>
   <div class="ccard l2"><h3>L2 cache</h3><p><b>Slower than L1</b> but <b>larger</b>: typically 256 KiB to 8 MiB. It&#39;s still much faster than RAM. Each core has its own.</p></div>
   <div class="ccard l3"><h3>L3 cache</h3><p>The <b>slowest</b> of the three, but still much faster than RAM. It&#39;s the <b>largest</b>, often tens of MiB, and it&#39;s <b>shared between all the cores</b>.</p></div>
  </div>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Level</th><th>Speed</th><th>Size</th><th>Belongs to</th></tr>
   <tr><td><b>L1</b></td><td>Fastest</td><td>Smallest</td><td>Each core</td></tr>
   <tr><td><b>L2</b></td><td>Slower than L1</td><td>Larger than L1</td><td>Each core</td></tr>
   <tr><td><b>L3</b></td><td>Slowest cache, still faster than RAM</td><td>Largest</td><td>Shared by all cores</td></tr></table></div>
 </section>
 <section>
  <h2>What does the cache store?</h2>
  <p>The cache stores commonly used instructions and data that are normally held in RAM. When the CPU needs some data, it looks in the cache <b>first</b>, starting with L1, then L2, then L3.</p>
  <div class="stepline"><b>Cache hit</b><span>The data is found in the cache, so it can be used straight away.</span></div>
  <div class="stepline"><b>Cache miss</b><span>The data isn&#39;t in the cache, so the CPU has to fetch it from RAM, which is much slower. A copy is then kept in the cache in case it&#39;s needed again.</span></div>
  <p>To improve performance further, the cache tries to <b>predict</b> what data will be needed next. For example, if the CPU is processing a video file, the next parts of the file can be loaded into the cache before they&#39;re needed.</p>
  <h3>Try it: cache hits and misses</h3>
  <p>Request some data. Watch where the CPU looks, and how long it takes. Request the same data again to see a cache hit.</p>
  <div class="cachedemo" id="cachedemo"></div>
  <div class="callout"><span class="k">Remember</span><p>The <b>larger the cache</b>, the more data can be stored close to the CPU, so there are more cache hits, fewer slow trips to RAM, and <b>better performance</b>.</p></div>
 </section>

 <section>
  <p class="lede">Memory and storage are hugely important. Without them, nothing could be saved and you&#39;d have to start every work session from scratch. There would also be nowhere to keep the operating system, so computers as we know them couldn&#39;t exist.</p>
  <p>Storage is grouped into <b>primary</b> storage, <b>secondary</b> storage and <b>off-line</b> (removable) storage. This lesson covers primary storage. The next lessons cover the other two.</p>
 </section>
 <section>
  <h2>Primary storage</h2>
  <p><b>Primary storage</b>, also called <b>main memory</b>, is storage that is <b>directly accessed by the CPU</b>. It&#39;s split into two types: <b>RAM</b> and <b>ROM</b>.</p>

 <section>
  <h2>Random access memory (RAM)</h2>
  <p>RAM stores the <b>data and programs that are currently in use</b>, including:</p>
  <ul class="obj"><li><b>The operating system</b>, e.g. Windows</li><li><b>The software in use</b>, e.g. a web browser, photo editor or spreadsheet</li><li><b>The data the software is using</b>, e.g. the document you&#39;re editing or the images on a web page</li></ul>
  <p>When a program is no longer in use, for example when you close a web browser, it&#39;s removed from RAM to make space for other programs. RAM can be <b>read from and written to</b>, so its contents change all the time.</p>
  <div class="callout warnbox"><span class="k">Volatile</span><p>RAM is <b>volatile</b> memory: when the power is lost, any data stored in it is <b>lost</b>. That&#39;s why you lose unsaved work if the power goes off.</p></div>
  <h3>Why are programs in use stored in RAM?</h3>
  <p>RAM is <b>much faster</b> than secondary storage such as a hard disk drive, and the CPU can access it directly. Loading programs into RAM to run them gives a big performance boost.</p>
 </section>
 <section>
  <h2>What happens when RAM is full?</h2>
  <p>If every running program has to be in RAM, a problem comes up when you try to open a new program and there isn&#39;t enough space left.</p>
  <div class="ramsteps"><figure class="ramst"><div class="ramcol"><div class="ramh">RAM</div><div class="ramr free">free space</div><div class="ramr">Arcade game</div><div class="ramr">Word processor</div><div class="ramr">Photo editor</div><div class="ramr">Web browser</div><div class="ramr os">Operating system</div></div><figcaption><b>1.</b> RAM holds the operating system and four programs. Only a little space is left.</figcaption></figure><figure class="ramst"><div class="ramcol"><div class="ramh">RAM</div><div class="ramr new">Spreadsheet</div><div class="ramr">Arcade game</div><div class="ramr">Word processor</div><div class="ramr">Photo editor</div><div class="ramr">Web browser</div><div class="ramr os">Operating system</div></div><figcaption><b>2.</b> A spreadsheet is opened. It fits, but now the RAM is <b>full</b>.</figcaption></figure></div>
  <p>The RAM is now full. If the user opens another program, the computer has to make space using <b>virtual memory</b>. Part of the secondary storage (e.g. the hard drive) is set aside to act as extra RAM. The operating system moves <b>pages</b> of data that aren&#39;t being used right now from RAM into virtual memory, and moves them back into RAM when they&#39;re needed again.</p>
  <div class="vmpair"><figure class="ramst"><div class="ramcol"><div class="ramh">RAM</div><div class="ramr">Spreadsheet</div><div class="ramr new">Video game</div><div class="ramr">Word processor</div><div class="ramr">Photo editor</div><div class="ramr">Web browser</div><div class="ramr os">Operating system</div></div><figcaption><b>3.</b> A video game is opened. The arcade game is moved out of RAM to make space…</figcaption></figure><figure class="ramst"><div class="ramcol"><div class="ramh">Virtual memory</div><div class="ramr moved">Arcade game</div></div><figcaption>…into <b>virtual memory</b> on secondary storage.</figcaption></figure></div>
  <div class="callout warnbox"><span class="k">The cost: speed</span><p>Virtual memory stops RAM from running out, but secondary storage is much slower than RAM. Moving data back and forth between RAM and virtual memory causes a <b>noticeable slowdown</b>. If this keeps happening, it&#39;s time to <b>add more RAM</b>, so it&#39;s less likely to fill up.</p></div>
  <h3>Try it: the RAM simulator</h3>
  <p>Open programs and watch the RAM fill up. When there&#39;s no space left, the operating system moves the program that was used least recently into virtual memory. Switch back to a program in virtual memory to see it swapped back into RAM. Then add more RAM and compare.</p>
  <div class="vmdemo" id="vmdemo"></div>
 </section>
 <section>
  <h2>Read only memory (ROM)</h2>
  <p>ROM is different from RAM and has a very specific job. It&#39;s <b>read only</b>: it can be read but <b>not written to</b> in normal use.</p>
  <p>ROM holds the <b>instructions the computer needs to start up</b> when the power is switched on. These start-up instructions are known as the <b>BIOS</b> (basic input output system). The BIOS checks the hardware and then loads the operating system from secondary storage into RAM.</p>
  <p>The program that starts the computer is also called the <b>bootstrap</b> or <b>bootloader</b>. Software stored permanently in ROM like this is called <b>firmware</b>. ROM can also store parts of the operating system, and in an embedded system it often stores the whole program the device runs.</p>
  <div class="callout"><span class="k">Non-volatile</span><p>ROM is <b>non-volatile</b>: it <b>doesn&#39;t lose its data</b> when the power is lost. That&#39;s essential, because the start-up instructions have to be there every time the computer is switched on.</p></div>
  <p>Many computers let you open a BIOS setup screen while they start up, to change settings such as the order of devices to start from:</p>
  <div class="bios" role="img" aria-label="A BIOS setup screen showing the system time and date, the boot order and the installed memory">
 <div class="bios-t">BIOS Setup Utility</div><div class="bios-m"><span class="on">Main</span><span>Advanced</span><span>Security</span><span>Boot</span><span>Exit</span></div>
 <div class="bios-b"><div class="bios-l">
  <p><span>System Time</span><b>[09:21:30]</b></p><p><span>System Date</span><b>[14/10/2026]</b></p><br>
  <p><span>▸ Boot device 1</span><b>[SSD]</b></p><p><span>▸ Boot device 2</span><b>[USB drive]</b></p><p><span>▸ Boot device 3</span><b>[Network]</b></p><br>
  <p><span>Installed memory</span><b>16384 MB</b></p><p><span>Boot-time diagnostic screen</span><b>[Enabled]</b></p></div>
  <div class="bios-r"><p>Item specific help</p><p>Choose the order in which the computer looks for an operating system when it starts up.</p></div></div>
 <div class="bios-f"><span>F1 Help</span><span>↑↓ Select item</span><span>Enter Select</span><span>F10 Save and exit</span></div></div>
 </section>
 <section>
  <h2>Why does a computer need both?</h2>
  <div class="tscroll"><table class="pvt deftab"><tr><th></th><th>RAM</th><th>ROM</th></tr>
   <tr><td><b>Stores</b></td><td>The programs and data currently in use, including the operating system</td><td>The start-up instructions (BIOS)</td></tr>
   <tr><td><b>Volatile?</b></td><td>Yes: data is lost when the power is off</td><td>No: keeps its data without power</td></tr>
   <tr><td><b>Read / write</b></td><td>Can be read from and written to</td><td>Read only</td></tr>
   <tr><td><b>Contents</b></td><td>Change constantly</td><td>Fixed</td></tr>
   <tr><td><b>Size</b></td><td>Larger, e.g. 8–32 GB</td><td>Small</td></tr></table></div>
  <p>A computer needs <b>ROM</b> because the start-up instructions must still be there when the power has been off. It needs <b>RAM</b> because the programs and data in use change all the time, and they need fast storage that can be written to.</p>
 </section>

 <section>
  <h2>Secondary storage</h2>
  <p class="lede">Secondary storage is the computer&#39;s <b>long-term</b> storage. It stores the user&#39;s files and programs, and the operating system, while they aren&#39;t being used.</p>
  <ul class="obj"><li>It&#39;s <b>non-volatile</b>: it doesn&#39;t lose its data when the power is lost.</li><li>It&#39;s <b>not directly accessed by the CPU</b>. Programs and data are loaded from secondary storage into RAM before the CPU uses them.</li></ul>
  <p>The two main types of secondary storage in a computer are the <b>hard disk drive (HDD)</b> and the <b>solid-state drive (SSD)</b>.</p>

"/><rect x="60" y="226" width="40" height="16" rx="2" fill="#3A4246"/></svg></figure></div>
 </section>
 <section>
  <h2>Hard disk drives (HDD)</h2>
  <p>A hard disk drive is a type of <b>magnetic storage</b>. Inside it, data is stored on circular, magnetic surfaces called <b>platters</b>. A drive can contain several platters stacked on top of each other.</p>
  <ul class="obj">
   <li>The platters <b>spin</b> very fast, often at about <b>7,200 revolutions per minute</b>.</li>
   <li>A <b>read/write head</b> on an <b>actuator arm</b> moves across the platter, from the centre to the edge, so it can reach every part of the disk.</li>
   <li>The head uses an <b>electromagnet</b> to read and write data, by detecting or changing the magnetic direction of tiny areas of the platter. Each area represents a 1 or a 0.</li>
  </ul>
  <h3>Why is an HDD slower than RAM?</h3>
  <p>7,200 revolutions per minute sounds fast, but accessing data on an HDD is still much <b>slower than RAM</b>, which is why programs in use are loaded into RAM. The main reason is <b>latency</b>. To read a block of data, the head first moves to the right track. Then it has to wait for the platter to spin until the data passes underneath it. While the data is rotating away from the head, it can&#39;t be read or written.</p>
 </section>
 <section>
  <h2>Structure of the platters</h2>
  <p>Data on each platter is organised so the read/write head can find it easily. Each platter is divided into <b>tracks</b> and <b>sectors</b>:</p>
  <div class="stepline"><b>Track</b><span>A circle all the way round the platter. Tracks are <b>concentric</b>: they don&#39;t spiral, but are separate circles, one inside another.</span></div>
  <div class="stepline"><b>Sector</b><span>A wedge-shaped section of the platter. It splits each track into smaller blocks.</span></div>
  <figure class="srfig enfig"><svg viewBox="0 0 440 420" role="img" aria-label="A platter divided into circular tracks (one track highlighted in purple) and wedge-shaped sectors (one sector highlighted in green)"><defs><marker id="st3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2FA84F"/></marker><marker id="st3r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#E0402E"/></marker></defs><path d="M305.0 357.2 A170 170 0 0 1 135.0 357.2 L208.0 230.8 A24 24 0 0 0 232.0 230.8 Z" fill="#A9F2C9" stroke="#14232A" stroke-width="3"/><circle cx="220" cy="210" r="138.5" fill="none" stroke="#6A1B6A" stroke-width="16"/><circle cx="220" cy="210" r="24.0" fill="none" class="tsline"/><circle cx="220" cy="210" r="40.4" fill="none" class="tsline"/><circle cx="220" cy="210" r="56.8" fill="none" class="tsline"/><circle cx="220" cy="210" r="73.2" fill="none" class="tsline"/><circle cx="220" cy="210" r="89.6" fill="none" class="tsline"/><circle cx="220" cy="210" r="106.0" fill="none" class="tsline"/><circle cx="220" cy="210" r="122.4" fill="none" class="tsline"/><circle cx="220" cy="210" r="138.8" fill="none" class="tsline"/><circle cx="220" cy="210" r="155.2" fill="none" class="tsline"/><circle cx="220" cy="210" r="171.6" fill="none" class="tsline"/><line x1="50.0" y1="210.0" x2="390.0" y2="210.0" class="tsline"/><line x1="99.8" y1="89.8" x2="340.2" y2="330.2" class="tsline"/><line x1="220.0" y1="40.0" x2="220.0" y2="380.0" class="tsline"/><line x1="340.2" y1="89.8" x2="99.8" y2="330.2" class="tsline"/><path d="M305.0 357.2 A170 170 0 0 1 135.0 357.2 L208.0 230.8 A24 24 0 0 0 232.0 230.8 Z" fill="none" stroke="#14232A" stroke-width="3"/><rect x="76.0" y="20" width="68.0" height="30" rx="7" fill="#fff" stroke="#14232A" stroke-width="2.5"/><text x="110.0" y="41" text-anchor="middle" class="stlab">Track</text><line x1="125" y1="58" x2="148" y2="96" stroke="#E0402E" stroke-width="5" marker-end="url(#st3r)"/><rect x="51.2" y="372" width="77.6" height="30" rx="7" fill="#fff" stroke="#14232A" stroke-width="2.5"/><text x="90.0" y="393" text-anchor="middle" class="stlab">Sector</text><line x1="138" y1="384" x2="186" y2="366" stroke="#14232A" stroke-width="3"/></svg></figure>
  <h3>Try it: read a block of data</h3>
  <p>Press <b>Read a block</b>. Watch the head <b>move to the right track</b>, then <b>wait for the sector to spin round</b> under it. That wait is the latency.</p>
  <div class="hdddemo" id="hdddemo"></div>
  <div class="keypts mag"><h3>Magnetic storage (HDD) key points</h3><div class="kpgrid"><div><h4>Advantages</h4><ul><li>Cheap for the amount of storage (low cost per GB)</li><li>Can store very large amounts of data</li><li>Reliable for long-term storage</li></ul></div><div><h4>Disadvantages</h4><ul><li>Lots of moving parts, which can break if the drive is dropped</li><li>Slower to access data than an SSD, because of latency</li><li>Heavier, and use more power than an SSD</li><li>Can be noisy</li></ul></div><div><h4>Capacity</h4><ul><li>Large: typically 500 GB to 20 TB</li></ul></div><div><h4>Uses</h4><ul><li>Desktop computers</li><li>Servers and data centres</li><li>Backups</li><li>CCTV recording</li></ul></div></div></div>
 </section>
 <section>
  <h2>Solid-state drives (SSD)</h2>
  <p>Solid-state drives have the same job as HDDs: they give long-term, <b>non-volatile</b> storage of the user&#39;s files and programs. The big difference is that an SSD has <b>no moving parts</b>, so reading and writing data is much faster.</p>
  <h3>How flash memory works</h3>
  <p>SSDs use <b>flash memory</b>, built from <b>NAND</b> or <b>NOR</b> technology. Flash memory is made of millions of <b>transistors</b>, each with a <b>control gate</b> and a <b>floating gate</b>:</p>
  <ul class="obj">
   <li>To write data, a voltage on the control gate pushes <b>electrons</b> through an insulating layer into the floating gate, where they become <b>trapped</b>.</li>
   <li>Because the floating gate is surrounded by insulation, the electrons stay trapped even when the power is off. That&#39;s why flash memory is non-volatile.</li>
   <li>Whether electrons are trapped or not represents a 0 or a 1. A cell with <b>no electrons</b> trapped stores <b>1</b>. A cell with <b>electrons trapped</b> stores <b>0</b>.</li>
  </ul>
  <h3>Try it: store a byte in flash memory</h3>
  <p>Each box below is one flash memory cell. Select a cell, then apply the right voltage: <b>program</b> it to trap electrons and store a <b>0</b>, or <b>erase</b> it to remove the electrons and store a <b>1</b>. Can you store the target byte?</p>
  <div class="flashdemo" id="flashdemo"></div>
  <p>Other devices that use flash memory include <b>SD cards</b> and <b>USB flash drives</b>.</p>
  <div class="keypts ssd"><h3>Solid-state storage (SSD) key points</h3><div class="kpgrid"><div><h4>Advantages</h4><ul><li>Faster to read and write: no moving parts and no spinning latency</li><li>Faster start-up and program loading</li><li>More durable: no moving parts to break if dropped</li><li>Silent, lighter and uses less power</li><li>Smaller, so easier to fit in portable devices</li></ul></div><div><h4>Disadvantages</h4><ul><li>More expensive for the amount of storage</li><li>Usually lower capacity than an HDD for the same price</li><li>Each cell can only be rewritten a limited number of times</li></ul></div><div><h4>Capacity</h4><ul><li>Typically 256 GB to 4 TB</li></ul></div><div><h4>Uses</h4><ul><li>Laptops, tablets and smartphones</li><li>Games consoles</li><li>The main drive of most new computers</li></ul></div></div></div>
  <div class="tscroll"><table class="pvt deftab"><tr><th></th><th>HDD</th><th>SSD</th></tr>
   <tr><td><b>Technology</b></td><td>Magnetic: spinning platters, read/write head</td><td>Solid state: flash memory (NAND or NOR)</td></tr>
   <tr><td><b>Moving parts</b></td><td>Yes</td><td>No</td></tr><tr><td><b>Speed</b></td><td>Slower (latency)</td><td>Faster</td></tr>
   <tr><td><b>Cost per GB</b></td><td>Cheaper</td><td>More expensive</td></tr><tr><td><b>Durability</b></td><td>Can break if dropped</td><td>More durable</td></tr></table></div>
 </section>

<div class="theory airy">
 <section>
  <h2>Off-line storage</h2>
  <p class="lede"><b>Off-line storage</b> is any storage device that can hold data but <b>isn&#39;t permanently connected</b> to a computer. It&#39;s removable.</p>
  <p>Off-line storage is great for <b>backing up</b> data, because it can be taken away and kept somewhere secure. It&#39;s also useful for <b>transporting</b> data from one device to another.</p>

  <p>Portable (external) hard drives are off-line storage too.</p>
 </section>
 <section>
  <h2>Optical storage: CD, DVD and Blu-ray</h2>
  <p><b>Optical storage</b> uses <b>lasers</b> and light to read and write data. CDs, DVDs and Blu-ray discs all use optical storage.</p>
  <p>Data is stored as <b>pits</b> (tiny dips) and <b>lands</b> (flat areas) burned by a laser along a single <b>spiral track</b>. The track starts near the centre and spirals outwards. In the diagram, the spiral track is the red line. If you looked at the disc through a powerful magnifying glass, you&#39;d see the pits and lands.</p>

="rotate(-25 345 120)"/><rect x="370" y="117" width="10" height="5" rx="2.5" fill="#E9ECED" transform="rotate(-25 345 120)"/><rect x="316" y="130" width="6" height="5" rx="2.5" fill="#E9ECED" transform="rotate(-25 345 120)"/><rect x="334" y="130" width="16" height="5" rx="2.5" fill="#E9ECED" transform="rotate(-25 345 120)"/><rect x="362" y="130" width="6" height="5" rx="2.5" fill="#E9ECED" transform="rotate(-25 345 120)"/><rect x="376" y="130" width="6" height="5" rx="2.5" fill="#E9ECED" transform="rotate(-25 345 120)"/><rect x="316" y="143" width="16" height="5" rx="2.5" fill="#E9ECED" transform="rotate(-25 345 120)"/><rect x="337" y="143" width="16" height="5" rx="2.5" fill="#E9ECED" transform="rotate(-25 345 120)"/><rect x="358" y="143" width="10" height="5" rx="2.5" fill="#E9ECED" transform="rotate(-25 345 120)"/><rect x="380" y="143" width="16" height="5" rx="2.5" fill="#E9ECED" transform="rotate(-25 345 120)"/><rect x="337" y="156" width="10" height="5" rx="2.5" fill="#E9ECED" transform="rotate(-25 345 120)"/><rect x="355" y="156" width="6" height="5" rx="2.5" fill="#E9ECED" transform="rotate(-25 345 120)"/><rect x="366" y="156" width="16" height="5" rx="2.5" fill="#E9ECED" transform="rotate(-25 345 120)"/><rect x="250" y="186" width="190" height="24" rx="6" fill="var(--surface)" stroke="var(--line)"/><text x="345" y="203" text-anchor="middle" class="stsm2b">pits and lands, magnified</text></svg></figure>
  <h3>Reading and writing</h3>
  <p>To <b>write</b> to a disc, a laser burns pits into the track. To <b>read</b> a disc, a laser is shone at the track and a sensor detects the reflected light. A <b>land</b> reflects the light straight back to the sensor. A <b>pit</b> scatters it, so less light returns. The difference is read as 1s and 0s.</p>
  <p>Try it. Burn some binary onto the disc, then read it back:</p>
  <div class="laserdemo" id="laserdemo"></div>
  <p class="vfoot">In this model a pit means 1 and a land means 0. On real discs, it&#39;s the change between a pit and a land that represents a 1, but the idea is the same.</p>
 </section>
 <section>
  <h2>CD vs DVD vs Blu-ray</h2>
  <p>CDs, DVDs and Blu-ray discs are all the same size, but they hold very different amounts of data:</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Disc</th><th>Laser</th><th>Typical capacity</th></tr>
   <tr><td><b>CD</b></td><td>Infrared laser</td><td>About 700 MB</td></tr>
   <tr><td><b>DVD</b></td><td>Red laser, shorter wavelength</td><td>4.7 GB (single layer) · 8.5 GB (dual layer)</td></tr>
   <tr><td><b>Blu-ray</b></td><td>Blue laser, much shorter wavelength</td><td>25 GB (single layer) · 50 GB (dual layer)</td></tr></table></div>
  <p>How is this possible? <b>Blu-ray</b> uses a <b>blue laser with a much shorter wavelength</b>. It can focus on a smaller spot, so it burns <b>smaller pits and lands</b>, and more of them fit on a disc of the same size.</p>
  <p><b>DVDs</b> use a red laser, which has a shorter wavelength than a CD&#39;s laser. Dual-layer DVDs also have <b>two data layers</b>. The laser changes its focus to read or write each layer.</p>
 </section>
 <section>
  <h2>Recordable and rewritable discs</h2>
  <p>A normal disc, such as a film you buy, is pressed with its data and can only be read. Recordable discs (CD-R, DVD-R, BD-R) have a layer of <b>dye</b>. When the laser heats it, the dye changes <b>permanently</b>, so they can only be written <b>once</b>.</p>
  <p><b>Rewritable</b> discs (CD-RW, DVD-RW, DVD+RW, BD-RE) use a special <b>metal alloy</b> that can switch between two states when it&#39;s heated by the laser. Because the change can be reversed, the disc can be written to <b>many times</b>.</p>
  <div class="callout tip"><span class="k">Did you know?</span><p><b>DVD-RAM</b> discs, now rarely used, came in a plastic cartridge and used <b>concentric tracks</b> like an HDD, instead of a spiral. This meant data could be read and written at the same time, and they could last 30 years, which made them good for archiving.</p></div>
  <div class="keypts opt"><h3>Optical storage key points</h3><div class="kpgrid"><div><h4>Advantages</h4><ul><li>Cheap to make</li><li>Very portable and light</li><li>Don&#39;t need power to keep their data</li></ul></div><div><h4>Disadvantages</h4><ul><li>Low capacity compared with HDDs and SSDs</li><li>Easily damaged by scratches</li><li>Slow to read and write</li><li>Need an optical drive, which many new computers don&#39;t have</li></ul></div><div><h4>Capacity</h4><ul><li>CD: about 700 MB</li><li>DVD: up to 8.5 GB</li><li>Blu-ray: up to 50 GB (or more with extra layers)</li></ul></div><div><h4>Uses</h4><ul><li>Films, music and games</li><li>Software distribution</li><li>Backing up and archiving personal files</li></ul></div></div></div>
 </section>
 <section>
  <h2>Magnetic tape</h2>
  <p><b>Magnetic tape</b> is an older type of storage that is still very popular for <b>backups and archives</b>. A tape is a plastic cartridge containing a reel of <b>magnetically coated tape</b>.</p>
  <ul class="obj">
   <li>Tape gives <b>serial access</b>: you can&#39;t jump straight to the data you need. The tape has to be wound through from the start until the data is found.</li>
   <li>Tapes have a <b>very large capacity</b> but are <b>slow to access</b> data, so they&#39;re ideal for backing up or archiving large amounts of data that won&#39;t be needed often.</li>
   <li>They are <b>very cheap</b> for the amount of data they store.</li>
  </ul>
 </section>
 <section>
  <h2>USB flash memory</h2>
  <p><b>USB flash drives</b> are probably the most popular off-line storage. Like SSDs, they use <b>flash memory</b> (solid-state storage).</p>
  <p>They&#39;re popular because they&#39;re <b>cheap</b>, <b>very portable</b> and <b>durable</b>, since they have no moving parts. They&#39;re mostly used for <b>transferring data</b> between computers, and as small backups of work, programs and music. <b>SD cards</b> work the same way and are used in cameras, phones and games consoles.</p>
 </section>

 <section>
  <h2>Cloud storage</h2>
  <p class="lede"><b>Cloud storage</b> lets users store their files and data <b>on the internet</b> instead of on their own device. The files are accessed <b>remotely</b>, from wherever the user is.</p>
  <p>The &quot;cloud&quot; isn&#39;t really in the sky. The cloud is a <b>collection of servers</b>: the data is stored on <b>physical servers</b> in buildings called <b>data centres</b>, owned and managed by a professional company. Your files may be stored in <b>several locations</b>, possibly in different countries.</p>
  <p>Storing data on your own device or drive, such as your computer&#39;s SSD or a USB flash drive, is called <b>local storage</b>.</p>

 cy="269.5" r="2" fill="#6BCB82"/><rect x="564" y="278" width="36" height="9" rx="2" fill="#3E474C"/><circle cx="594" cy="282.5" r="2" fill="#7CC0F0"/><rect x="564" y="291" width="36" height="9" rx="2" fill="#3E474C"/><circle cx="594" cy="295.5" r="2" fill="#6BCB82"/><rect x="615" y="220" width="46" height="84" rx="4" fill="#2A3135"/><rect x="620" y="226" width="36" height="9" rx="2" fill="#3E474C"/><circle cx="650" cy="230.5" r="2" fill="#7CC0F0"/><rect x="620" y="239" width="36" height="9" rx="2" fill="#3E474C"/><circle cx="650" cy="243.5" r="2" fill="#6BCB82"/><rect x="620" y="252" width="36" height="9" rx="2" fill="#3E474C"/><circle cx="650" cy="256.5" r="2" fill="#7CC0F0"/><rect x="620" y="265" width="36" height="9" rx="2" fill="#3E474C"/><circle cx="650" cy="269.5" r="2" fill="#6BCB82"/><rect x="620" y="278" width="36" height="9" rx="2" fill="#3E474C"/><circle cx="650" cy="282.5" r="2" fill="#7CC0F0"/><rect x="620" y="291" width="36" height="9" rx="2" fill="#3E474C"/><circle cx="650" cy="295.5" r="2" fill="#6BCB82"/><text x="610" y="322" text-anchor="middle" class="clsm">Data centre · Singapore</text><text x="70" y="24" text-anchor="middle" class="clsm">your devices</text><text x="690" y="352" text-anchor="end" class="clsm">copies of your files are kept in both</text></svg></figure>
