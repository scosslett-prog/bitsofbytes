<template id="th-6-3-expert">
<div class="theory airy">
 <section>
  <h2>What is an expert system?</h2>
  <p class="lede">An <b>expert system</b> is an AI program that <b>imitates a human expert</b> in one particular area. It asks the user questions, and uses facts and rules to give advice or reach a decision, just like a doctor, mechanic or careers adviser would.</p>
  <p>Expert systems are used for:</p>
  <div class="clfeat">
   <div class="clf"><b>🩺 Medical diagnosis</b><span>suggesting what illness a patient might have from their symptoms.</span></div>
   <div class="clf"><b>🔧 Fault finding</b><span>working out what's wrong with a car, a boiler or a computer.</span></div>
   <div class="clf"><b>🎓 Careers advice</b><span>suggesting jobs that suit your interests.</span></div>
   <div class="clf"><b>⛏️ Geology</b><span>finding the best places to search for minerals or oil.</span></div>
   <div class="clf"><b>💷 Finance</b><span>deciding whether to approve a loan or flag fraud.</span></div>
   <div class="clf"><b>♟️ Games</b><span>choosing the best move in chess.</span></div>
  </div>
 </section>
 <section>
  <h2>The parts of an expert system</h2>
  <figure class="srfig"><figcaption><b>Expert system</b><span>Four parts work together.</span></figcaption><svg viewBox="0 0 680 250" role="img" aria-label="The user talks to the interface. The interface passes answers to the inference engine, which uses the knowledge base and the rule base to reach a conclusion and sends it back through the interface."><defs><marker id="esa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--accent)"/></marker></defs><rect x="10" y="90" width="110" height="70" rx="10" class="dnsb"/><text x="65" y="122" text-anchor="middle" class="dnst">👤 User</text><text x="65" y="140" text-anchor="middle" class="dnss">asks / answers</text><rect x="170" y="90" width="130" height="70" rx="10" class="dnsb"/><text x="235" y="122" text-anchor="middle" class="dnst">Interface</text><text x="235" y="140" text-anchor="middle" class="dnss">questions + advice</text><rect x="350" y="80" width="150" height="90" rx="10" class="dnsb on"/><text x="425" y="116" text-anchor="middle" class="dnst">Inference engine</text><text x="425" y="136" text-anchor="middle" font-size="11" fill="var(--ink)">applies the rules</text><text x="425" y="152" text-anchor="middle" font-size="11" fill="var(--ink)">to the facts</text><rect x="550" y="20" width="120" height="80" rx="10" class="dnsb"/><text x="610" y="52" text-anchor="middle" class="dnst">Knowledge</text><text x="610" y="70" text-anchor="middle" class="dnst">base</text><text x="610" y="88" text-anchor="middle" class="dnss">facts</text><rect x="550" y="150" width="120" height="80" rx="10" class="dnsb"/><text x="610" y="182" text-anchor="middle" class="dnst">Rule base</text><text x="610" y="202" text-anchor="middle" class="dnss">IF … THEN …</text><line x1="122" y1="125" x2="167" y2="125" stroke="var(--accent)" stroke-width="2.5" marker-start="url(#esa)" marker-end="url(#esa)"/><line x1="302" y1="125" x2="347" y2="125" stroke="var(--accent)" stroke-width="2.5" marker-start="url(#esa)" marker-end="url(#esa)"/><line x1="502" y1="105" x2="547" y2="70" stroke="var(--accent)" stroke-width="2.5" marker-start="url(#esa)" marker-end="url(#esa)"/><line x1="502" y1="145" x2="547" y2="182" stroke="var(--accent)" stroke-width="2.5" marker-start="url(#esa)" marker-end="url(#esa)"/></svg></figure>
  <div class="stepline"><b>Knowledge base</b><span>A database of <b>facts</b> about the subject, collected from human experts. The user's answers are added to it as new facts.</span></div>
  <div class="stepline"><b>Rule base</b><span>A set of <b>rules</b>, usually written as <b>IF … THEN …</b>, for using the facts. e.g. IF the computer doesn't turn on AND it is plugged in THEN the power supply may be faulty.</span></div>
  <div class="stepline"><b>Inference engine</b><span>The "brain" of the system. It <b>applies the rules</b> from the rule base to the facts in the knowledge base to <b>reason</b> and reach a conclusion. It also decides which question to ask next.</span></div>
  <div class="stepline"><b>Interface</b><span>How the user <b>communicates</b> with the system: it asks the questions and displays the advice. It could be a website, an app, a chatbot or even a phone line. Many also explain <b>how</b> they reached their conclusion.</span></div>
  <div class="stepline"><b>Explanation system</b><span>Often part of the interface. It shows the user <b>how</b> the inference engine reached its conclusion, e.g. which answers and rules led to the diagnosis, so the user can trust it.</span></div>
 </section>
 <section>
  <h2>Try it: a computer repair expert system</h2>
  <p>Your computer has a problem. Answer the questions, and watch the inference engine add your answers to the knowledge base and test the rules until one of them <b>fires</b>.</p>
  <div class="esdemo" id="esdemo"></div>
 </section>
 <section>
  <h2>How the inference engine reasons</h2>
  <p>The inference engine can work in two directions:</p>
  <div class="swsplit">
   <div class="swcol sys"><span class="eyebrow">Forward chaining</span><p>Starts with the <b>facts</b> and works <b>forwards</b> through the rules to reach a conclusion.</p><small>"The computer turns on, the screen is blank, the cable is connected and it beeps… so the RAM is probably faulty." The demo above uses forward chaining.</small></div>
   <div class="swcol app"><span class="eyebrow">Backward chaining</span><p>Starts with a possible <b>conclusion</b> (a goal) and works <b>backwards</b> to check whether the facts support it.</p><small>"Could the RAM be faulty? For that to be true, the computer must turn on, the screen must be blank, the cable must be connected and it must beep. Let's check each one."</small></div>
  </div>
 </section>
 <section>
  <h2>Advantages and disadvantages</h2>
  <div class="kpgrid2">
   <div class="keypts ssd"><h3>Advantages</h3><ul><li>Gives <b>consistent</b> answers: it doesn't get tired or have a bad day.</li><li>Available <b>24/7</b>, from anywhere.</li><li>Combines the knowledge of <b>many</b> experts.</li><li>Can <b>explain</b> how it reached its answer.</li><li>Cheaper than paying a human expert every time.</li></ul></div>
   <div class="keypts kcmp"><h3>Disadvantages</h3><ul><li>Only as good as its <b>rules and facts</b>: errors give wrong advice.</li><li>Can't handle situations its rules don't cover.</li><li>Has <b>no common sense</b> or empathy.</li><li>Expensive and slow to build, and must be kept up to date.</li><li>Doesn't learn by itself: humans must update the rules.</li></ul></div>
  </div>
 </section>
</div>
</template>
<template id="th-6-3-ml">
<div class="theory airy">
 <section>
  <h2>What is machine learning?</h2>
  <p class="lede"><b>Machine learning</b> is a type of AI where a program can <b>automatically adapt its own processes and/or data</b>. Instead of being given all the rules by a programmer, it <b>works out its own rules</b> from data.</p>
  <div class="swsplit">
   <div class="swcol sys"><span class="eyebrow">Expert system</span><p>A human expert writes the rules. The system follows them.</p><small>It doesn't improve unless someone updates the rules.</small></div>
   <div class="swcol app"><span class="eyebrow">Machine learning</span><p>The program is given lots of <b>training data</b>, finds the <b>patterns</b>, and creates its own rules.</p><small>It keeps improving as it's given more data.</small></div>
  </div>
 </section>
 <section>
  <h2>How does a machine learn?</h2>
  <p>Imagine teaching a computer to sort fruit into <b>apples</b> and <b>bananas</b>. We don't tell it how. Instead we give it <b>training data</b>: lots of examples that have already been labelled, with measurements of each one.</p>
  <div class="stepline"><b>Step 1</b><span>Collect <b>training data</b>: many examples, each with its properties (length, roundness, yellowness, weight) and the correct label.</span></div>
  <div class="stepline"><b>Step 2</b><span>The program looks for <b>patterns</b>, e.g. bananas are always longer than 14 cm.</span></div>
  <div class="stepline"><b>Step 3</b><span>It creates its own <b>rules</b>, and gives each property a <b>weighting</b>: how important it is. Length separates apples and bananas well, so it gets a high weighting. Weight overlaps a lot, so it gets a low weighting.</span></div>
  <div class="stepline"><b>Step 4</b><span>It uses the rules to <b>classify new data</b> it has never seen before.</span></div>
  <div class="stepline"><b>Step 5</b><span>When it's told whether it was right, it <b>adapts</b> its rules. The more data, the more accurate it gets.</span></div>
  <h3>Try it: train a fruit sorter</h3>
  <p>Add some examples to the training data, then train the model. Look at the rules and weightings it creates. Then test it on a new piece of fruit.</p>
  <div class="mldemo" id="mldemo"></div>
 </section>
 <section>
  <h2>Where is machine learning used?</h2>
  <div class="clfeat">
   <div class="clf"><b>📧 Spam filters</b><span>learn from the emails users mark as spam.</span></div>
   <div class="clf"><b>🎬 Recommendations</b><span>learn what you like from what you watch, skip and buy.</span></div>
   <div class="clf"><b>🗣️ Speech recognition</b><span>gets better at understanding your voice and accent.</span></div>
   <div class="clf"><b>💳 Fraud detection</b><span>learns your normal spending and flags anything unusual.</span></div>
   <div class="clf"><b>🩻 Medical scans</b><span>trained on thousands of scans to spot signs of disease.</span></div>
   <div class="clf"><b>🚗 Self-driving cars</b><span>trained on millions of images to recognise people, signs and vehicles.</span></div>
  </div>
  <h3>Supervised and unsupervised learning</h3>
  <div class="stepline"><b>Supervised</b><span>The training data is <b>labelled</b> by humans (like the apples and bananas above). The program learns to match the inputs to the correct labels, and is told when it's right or wrong.</span></div>
  <div class="stepline"><b>Unsupervised</b><span>The data is <b>not labelled</b>. The program finds patterns and groups in the data by itself, without human help, e.g. grouping customers who buy similar things.</span></div>
  <p>Either way, the program stores its successful and unsuccessful results, and uses them to <b>influence future decisions</b>.</p>
  <div class="callout warnbox"><span class="k">Be careful</span><p>A machine learning system is only as good as its training data. If the data is <b>biased</b> or doesn't include enough examples, the rules it creates will be wrong, and it can make unfair decisions.</p></div>
  <div class="callout tip"><span class="k">Exam tip</span><p>Learn the definition: machine learning is when a program can <b>automatically adapt its own processes and/or data</b>.</p></div>
 </section>
</div>
</template>
<template id="th-10-1-gates">
<div class="theory airy">
 <section>
  <h2>Boolean logic</h2>
  <p class="lede">Inside every computer are billions of tiny electronic switches. Each one can only be <b>on</b> or <b>off</b>. That's why computers work in binary, and it's why they use <b>Boolean logic</b>: a type of logic where everything is either <b>TRUE</b> or <b>FALSE</b>.</p>
  <p>Lots of everyday situations only have two states, like stop or go, pass or fail, open or closed. In computing, <b>1</b> means <b>TRUE</b> (on) and <b>0</b> means <b>FALSE</b> (off).</p>
  <p>Boolean logic is named after George Boole, a mathematician who worked it out in the 1840s, a hundred years before the first electronic computers were built!</p>
  <h3>Making decisions with TRUE and FALSE</h3>
  <p>We use Boolean logic all the time without noticing. Each of these decisions has inputs that are TRUE or FALSE, and an output that's TRUE or FALSE:</p>
  <div class="stepline"><b>One condition</b><span>A fridge light: IF the door is open THEN light = TRUE. Otherwise, light = FALSE.</span></div>
  <div class="stepline"><b>AND</b><span>A safe with two keys: IF key 1 is turned AND key 2 is turned THEN open = TRUE. Both conditions must be true.</span></div>
  <div class="stepline"><b>OR</b><span>Unlocking a phone: IF the fingerprint is recognised OR the PIN is correct THEN unlock = TRUE. Only one condition needs to be true.</span></div>
  <div class="stepline"><b>NOT</b><span>A test result: IF you did NOT pass THEN resit = TRUE. NOT flips TRUE to FALSE, and FALSE to TRUE.</span></div>
 </section>
 <section>
  <h2>Logic gates</h2>
  <p>A <b>logic gate</b> is an electronic component that takes one or more binary inputs and produces a single binary output. Gates are built from transistors, and they're the building blocks of every processor and memory chip.</p>
  <p>You need to know <b>six</b> logic gates: <b>NOT</b>, <b>AND</b>, <b>OR</b>, <b>NAND</b>, <b>NOR</b> and <b>XOR</b>. For each one, you need to be able to recognise and draw its symbol, and know what output it gives for every combination of inputs.</p>
  <p>Inputs go in on the left and the output comes out on the right. Inputs are usually labelled with letters such as A and B, and the output with a letter such as X.</p>
 </section>
 <section>
  <h2>Try it: the six logic gates</h2>
  <p>Choose a gate, then click the inputs to switch them between 0 and 1. A lit wire carries a 1. Watch the output, and see which row of the truth table you're on.</p>
  <div class="lgwid" id="lggates"></div>
 </section>
 <section>
  <h2>Telling the symbols apart</h2>
  <p>In the exam you must draw the <b>correct symbol</b> for each gate. Some of them look very similar, so learn the differences:</p>
  <div class="stepline"><b>AND</b><span>A flat back and a rounded front, like a capital D.</span></div>
  <div class="stepline"><b>OR</b><span>A curved back, coming to a point at the front.</span></div>
  <div class="stepline"><b>Bubble</b><span>A small circle on the output means NOT. So NOT, NAND and NOR all have one: NAND is AND with a bubble, and NOR is OR with a bubble.</span></div>
  <div class="stepline"><b>XOR</b><span>An OR gate with an <b>extra curved line</b> across the inputs.</span></div>
  <div class="callout warnbox"><span class="k">Be careful</span><p>Draw the actual gate symbols. A box with the gate's name written inside it won't get the mark.</p></div>
 </section>
 <section>
  <h2>Boolean logic in programs</h2>
  <p>Boolean logic isn't only for hardware. Programs use AND, OR and NOT to combine conditions, e.g. <span class="mono">IF Age &gt;= 13 AND Age &lt;= 19 THEN</span>. Each comparison is either TRUE or FALSE, and then the logic is applied. Try these:</p>
  <div class="lgquiz">
   <div class="lgtf" data-ans="F"><span class="mono lgtfq">(4 &gt; 3) AND (5 &gt; 7)</span><div class="lgtfb"><button class="btn small" data-tf="T">TRUE</button><button class="btn small" data-tf="F">FALSE</button></div><p class="lgtfr" hidden><b></b> 4 &gt; 3 is TRUE, but 5 &gt; 7 is FALSE. AND needs both to be TRUE.</p></div>
   <div class="lgtf" data-ans="T"><span class="mono lgtfq">(2 &lt; 8) OR (8 &gt; 10)</span><div class="lgtfb"><button class="btn small" data-tf="T">TRUE</button><button class="btn small" data-tf="F">FALSE</button></div><p class="lgtfr" hidden><b></b> 2 &lt; 8 is TRUE. OR only needs one side to be TRUE.</p></div>
   <div class="lgtf" data-ans="F"><span class="mono lgtfq">NOT (5 * 7 &gt; 30)</span><div class="lgtfb"><button class="btn small" data-tf="T">TRUE</button><button class="btn small" data-tf="F">FALSE</button></div><p class="lgtfr" hidden><b></b> 5 * 7 = 35, so 35 &gt; 30 is TRUE. NOT flips it to FALSE.</p></div>
   <div class="lgtf" data-ans="T"><span class="mono lgtfq">((7 DIV 3) &gt;= 2) OR ((7 DIV 3) &lt; 2)</span><div class="lgtfb"><button class="btn small" data-tf="T">TRUE</button><button class="btn small" data-tf="F">FALSE</button></div><p class="lgtfr" hidden><b></b> 7 DIV 3 = 2 (DIV gives the whole number part of a division). 2 &gt;= 2 is TRUE, so the whole thing is TRUE. In fact, this is always TRUE: any number is either &gt;= 2 or &lt; 2!</p></div>
   <div class="lgtf" data-ans="F"><span class="mono lgtfq">((12 MOD 5) &lt; 2) AND ((12 MOD 5) = 2)</span><div class="lgtfb"><button class="btn small" data-tf="T">TRUE</button><button class="btn small" data-tf="F">FALSE</button></div><p class="lgtfr" hidden><b></b> 12 MOD 5 = 2 (MOD gives the remainder). 2 &lt; 2 is FALSE, so the AND is FALSE.</p></div>
  </div>
  <p class="vfoot">Decide whether each statement is TRUE or FALSE, then click your answer.</p>
 </section>
</div>
</template>
<template id="th-10-1-tables">
<div class="theory airy">
 <section>
  <h2>What is a truth table?</h2>
  <p class="lede">Explaining a logic gate with diagrams takes a lot of drawings: one for every possible combination of inputs. A <b>truth table</b> does the same job much more neatly.</p>
  <p>A truth table shows the <b>output</b> for <b>every possible combination of inputs</b>. Each input and output gets its own column, with the input and output labels as the headings. Each row is one combination of inputs, with the result in the output column.</p>
 </section>
 <section>
  <h2>How many rows?</h2>
  <p>Each input can be 0 or 1, so each extra input <b>doubles</b> the number of possible combinations. For <i>n</i> inputs there are 2<sup><i>n</i></sup> rows:</p>
  <div class="tscroll"><table class="pvt" style="max-width:420px"><tr><th>Inputs</th><th>Rows</th></tr><tr><td>1</td><td>2</td></tr><tr><td>2</td><td>4</td></tr><tr><td>3</td><td>8</td></tr><tr><td>4</td><td>16</td></tr></table></div>
  <p>To make sure you don't miss or repeat a combination, fill in the input columns by <b>counting up in binary</b> from 0. Choose the number of inputs to see the pattern:</p>
  <div class="lgwid" id="lgrows"></div>
  <div class="callout tip"><span class="k">Exam tip</span><p>In the exam, the input columns are usually filled in for you. You just need to work out the outputs. If you have to write the inputs yourself, use this counting order.</p></div>
 </section>
 <section>
  <h2>Truth tables for the six gates</h2>
  <p>Learn these. Every circuit you'll meet is built from them.</p>
  <div class="lgsix" id="lgsix"></div>
 </section>
 <section>
  <h2>Truth tables for logic circuits</h2>
  <p>Logic gates are usually joined together into <b>logic circuits</b>. The truth table gets bigger because there are more inputs. Here's a circuit that could control a security alarm:</p>
  <div class="stepline"><b>A</b><span>Movement sensor: 1 if movement is detected.</span></div>
  <div class="stepline"><b>B</b><span>Sound sensor: 1 if sound is detected.</span></div>
  <div class="stepline"><b>C</b><span>Light sensor: 1 while light is detected.</span></div>
  <div class="stepline"><b>X</b><span>Alarm: sounds when it receives a 1.</span></div>
  <p>The alarm should sound if the lights are off <b>and</b> movement or sound (or both) is detected. That's X = (A OR B) AND (NOT C).</p>
  <h3>Add working points</h3>
  <p>To keep track, label the output of each gate before the last one with a new letter. Here, the OR gate's output is <b>D</b> and the NOT gate's output is <b>E</b>. Add columns for them to your truth table. In the exam you're given a <b>working space</b> column you can use for this.</p>
  <h3>Work out one row at a time</h3>
  <p>Take the row A = 1, B = 0, C = 0: movement is detected, there's no sound, and the lights are off. The alarm should sound. Work through the circuit from left to right:</p>
  <div class="stepline"><b>Step 1</b><span>Put the input values on the circuit's inputs.</span></div>
  <div class="stepline"><b>Step 2</b><span>Work out the first gates. D = A OR B = 1 OR 0 = <b>1</b>. E = NOT C = NOT 0 = <b>1</b>.</span></div>
  <div class="stepline"><b>Step 3</b><span>D and E are the inputs to the final AND gate. X = D AND E = 1 AND 1 = <b>1</b>. The alarm sounds.</span></div>
  <div class="stepline"><b>Step 4</b><span>Repeat for every other row. With 3 inputs, that's 8 rows altogether.</span></div>
 </section>
 <section>
  <h2>Try it: fill in the truth table</h2>
  <p>Click the inputs (or click a row of the table) to test each combination. Every combination you test is added to the truth table. Can you predict X before you check it?</p>
  <div class="lgwid" id="lgtt"></div>
  <div class="callout tip"><span class="k">Exam tip</span><p>Only the output column X is marked, so take your time with the working columns. Do one gate at a time, and check you've got the right number of rows.</p></div>
 </section>
</div>
</template>
<template id="th-10-1-circuits">
<div class="theory airy">
 <section>
  <h2>Logic circuits</h2>
  <p class="lede">Logic gates are rarely used on their own. They're combined into <b>logic circuits</b>, so that several inputs can work together to control a real situation, like an alarm, a greenhouse or a lift.</p>
  <p>To really understand logic circuits, you need to be able to:</p>
  <ul class="obj"><li><b>Draw</b> a circuit from a logic statement, a logic expression or a truth table.</li><li><b>Complete</b> a truth table for a circuit (see the last lesson).</li><li><b>Write</b> a logic expression from a circuit, a truth table or a description of a problem.</li></ul>
 </section>
 <section>
  <h2>Logic statements and logic expressions</h2>
  <p>The same logic can be written in two ways. You may be given either, and you need to recognise both:</p>
  <div class="stepline"><b>Logic statement</b><span>Written in words, with "is 1" and "is NOT 1": <span class="mono">X = 1 if (A is 1 OR B is 1) AND C is NOT 1</span></span></div>
  <div class="stepline"><b>Logic expression</b><span>Written with the gate names: <span class="mono">X = (A OR B) AND (NOT C)</span></span></div>
  <p>"A is 1" just becomes A, and "C is NOT 1" becomes NOT C. Brackets show which parts are worked out first, just like in maths.</p>
 </section>
 <section>
  <h2>Drawing a circuit from a statement</h2>
  <p>At first, drawing a logic circuit can seem like a daunting task. But if you break the statement down and work through it logically, it soon becomes manageable. Here's an example:</p>
  <p class="lgst big">X = 1 if ((A is 1 OR B is 1) AND (A is 1 AND B is 1)) OR (C is NOT 1)</p>
  <div class="stepline"><b>Step 1</b><span>Find the output and the inputs. "X = 1 if" means the whole circuit ends at one output called X. The letters A, B and C are the inputs.</span></div>
  <div class="stepline"><b>Step 2</b><span>Break the statement into its bracketed sections. Start with the innermost brackets: each one is a gate.</span></div>
  <div class="stepline"><b>Step 3</b><span>Draw each section, then join them with the gates between the brackets, working outwards until you reach X.</span></div>
  <h3>Try it: build the circuit step by step</h3>
  <div class="lgwid" id="lgbuild"></div>
  <div class="callout tip"><span class="k">Important</span><p>If an input such as A or B is needed more than once, you don't need extra inputs. Draw one input and <b>split the wire</b>, with a dot where the wires join.</p></div>
 </section>
 <section>
  <h2>Solving a real problem</h2>
  <p>Exam questions often describe a real situation, and you have to turn it into a circuit. Read the description carefully and pick out the conditions and how they're joined (AND, OR, NOT). Try these two yourself before you look at the answers.</p>
  <h3>Problem 1: a security light</h3>
  <p>A security light <b>L</b> switches on if movement is detected (<b>M</b> = 1) <b>and</b> it is night (<b>N</b> = 1), <b>or</b> if the manual override switch is pressed (<b>O</b> = 1). Draw the logic circuit.</p>
  <details class="lgans"><summary>Show a solution</summary><p>L = (M AND N) OR O. Movement and night are joined by AND, and that result is joined to the override by OR. Click the inputs to test it.</p><div class="lgsim" data-c="sec" data-tt="1"></div></details>
  <h3>Problem 2: a greenhouse</h3>
  <p>A greenhouse has a motor <b>Z</b> that opens the roof windows when Z = 1. It uses three inputs:</p>
  <div class="stepline"><b>A</b><span>1 if the temperature is below 40 °C, 0 if it's 40 °C or more.</span></div>
  <div class="stepline"><b>B</b><span>1 if the humidity is below 75%, 0 if it's 75% or more.</span></div>
  <div class="stepline"><b>C</b><span>1 if it's night, 0 if it's day.</span></div>
  <p>The windows should open if the temperature is 40 °C or more, <b>or</b> the humidity is 75% or more, but <b>never</b> at night. Draw the logic circuit.</p>
  <details class="lgans"><summary>Show a solution</summary><p>Be careful: it's too hot when A is <b>0</b>, so the condition is NOT A. The same goes for B. "Never at night" means AND NOT C. So Z = ((NOT A) OR (NOT B)) AND (NOT C).</p><div class="lgsim" data-c="green" data-tt="1"></div></details>
 </section>
 <section>
  <h2>Writing a logic expression from a circuit</h2>
  <p>Work from the <b>inputs</b> towards the <b>output</b>. Write down what comes out of each gate, putting each one in brackets, and join them with the next gate's name. For the alarm circuit from the last lesson:</p>
  <div class="stepline"><b>Step 1</b><span>The OR gate gives (A OR B).</span></div>
  <div class="stepline"><b>Step 2</b><span>The NOT gate gives (NOT C).</span></div>
  <div class="stepline"><b>Step 3</b><span>Both go into an AND gate, so X = (A OR B) AND (NOT C).</span></div>
  <div class="callout tip"><span class="k">Exam tip</span><p>Questions often say "Do not attempt to simplify the expression" and "each gate must have a maximum of two inputs". Just write what the circuit shows, using brackets so the order is clear.</p></div>
 </section>
 <section>
  <h2>Writing a logic expression from a truth table</h2>
  <p>Look only at the rows where the output is <b>1</b>. For each one, join the inputs with AND, putting NOT in front of any input that's 0. Then join the rows together with OR.</p>
  <div class="tscroll"><table class="pvt" style="max-width:420px"><tr><th>A</th><th>B</th><th>C</th><th>X</th></tr><tr><td>0</td><td>0</td><td>0</td><td>0</td></tr><tr><td>0</td><td>0</td><td>1</td><td>0</td></tr><tr class="lghit"><td>0</td><td>1</td><td>0</td><td><b>1</b></td></tr><tr><td>0</td><td>1</td><td>1</td><td>0</td></tr><tr><td>1</td><td>0</td><td>0</td><td>0</td></tr><tr><td>1</td><td>0</td><td>1</td><td>0</td></tr><tr class="lghit"><td>1</td><td>1</td><td>0</td><td><b>1</b></td></tr><tr><td>1</td><td>1</td><td>1</td><td>0</td></tr></table></div>
  <div class="stepline"><b>Row 3</b><span>A = 0, B = 1, C = 0 gives (NOT A AND B AND NOT C).</span></div>
  <div class="stepline"><b>Row 7</b><span>A = 1, B = 1, C = 0 gives (A AND B AND NOT C).</span></div>
  <p>So X = (NOT A AND B AND NOT C) OR (A AND B AND NOT C). If you look closely, X is 1 whenever B is 1 and C is 0, so this could be simplified to X = B AND (NOT C), but you don't need to simplify at IGCSE.</p>
 </section>
</div>
</template>
<template id="th-10-1-universal">
<div class="theory airy">
 <section>
  <h2>NAND and NOR</h2>
  <p class="lede"><b>NAND</b> and <b>NOR</b> are special. They're known as <b>universal gates</b>, because any logic circuit at all can be built using only NAND gates, or only NOR gates.</p>
  <p>First, remember what they are. A NAND gate is an <b>AND gate followed by a NOT gate</b>: NAND is short for NOT AND. The two circuits below behave in exactly the same way. Click the inputs to check:</p>
  <div class="lgwid lgsim" data-c="andnot" data-tt="1"></div>
  <p>In the same way, a NOR gate is an <b>OR gate followed by a NOT gate</b>, so NOR is short for NOT OR.</p>
  <h3>Be careful: NOT (A AND B) is not the same as (NOT A) AND (NOT B)</h3>
  <p>These two look very similar, but the position of NOT changes everything. In <b>NOT (A AND B)</b>, the AND is worked out first and then the result is flipped. In <b>(NOT A) AND (NOT B)</b>, each input is flipped first and then they go into the AND gate. Click the inputs and compare the outputs:</p>
  <div class="lgwid" id="lgcmp"></div>
 </section>
 <section>
  <h2>Why are they called universal?</h2>
  <p>Every logic circuit, however complicated, can be made from just three gates: <b>NOT</b>, <b>AND</b> and <b>OR</b>. (NAND, NOR and XOR can all be built from these three.)</p>
  <p>So if you can make NOT, AND and OR using only NAND gates, you can make <b>anything</b> using only NAND gates. And you can! The same is true for NOR. That's what makes them <b>universal</b>.</p>
  <div class="callout warnbox"><span class="k">Be careful</span><p>Only <b>NAND</b> and <b>NOR</b> are universal. AND, OR and XOR are not. For example, with only AND gates there's no way to turn a 1 into a 0, so you could never make a NOT gate.</p></div>
 </section>
 <section>
  <h2>Try it: build gates from NAND</h2>
  <p>Choose a gate to build. The normal gate is on the left, and the version built only from NAND gates is on the right. Click the inputs on either one, and check that the outputs always match. Then switch to NOR to see that it works for NOR gates too.</p>
  <div class="lgwid" id="lguni"></div>
 </section>
 <section>
  <h2>Building gates from NAND: how to do it</h2>
  <p>Choose a gate to see how it's wired up from NAND gates, one step at a time.</p>
  <div class="lgwid" id="lghow"></div>
  <p>The trick behind all of these is the first one: <b>a NAND gate with its inputs joined together is a NOT gate</b>. Once you can make NOT, the rest follows.</p>
 </section>
 <section>
  <h2>Why use universal gates?</h2>
  <p>If AND and OR gates already exist, why would anyone build them from NAND gates instead? There are some very good reasons:</p>
  <div class="kpgrid2">
   <div class="keypts ssd"><h3>Advantages</h3><ul><li><b>Simpler manufacturing:</b> a chip can be made from millions of copies of one type of gate. There's only one design to make, test and perfect, so mass production is cheaper and more reliable.</li><li><b>Smaller, faster and cheaper:</b> NAND and NOR are the simplest gates to build from transistors. An AND gate is really a NAND gate with an extra NOT on the end, so it needs more transistors.</li><li><b>One kind of spare part:</b> an engineer with a box of NAND chips can build any circuit they need.</li></ul></div>
   <div class="keypts kcmp"><h3>Disadvantages</h3><ul><li><b>More gates</b> may be needed for some circuits. An OR gate needs 3 NAND gates.</li><li>More gates in a row can make a circuit slightly <b>slower</b>, as the signal has to pass through each one.</li><li>The circuit diagram is harder for a person to read.</li></ul></div>
  </div>
  <div class="callout"><span class="k">Did you know?</span><p>The computer that guided the Apollo missions to the Moon was built almost entirely from NOR gates. And the <b>NAND flash</b> memory in SSDs and USB memory sticks is named after the NAND-style way its memory cells are connected.</p></div>
 </section>
</div>
</template>
<template id="th-9-1-intro">
<div class="theory airy">
 <section>
  <h2>What is a database?</h2>
  <p class="lede">Databases play a huge role in our computer-based world. They sit behind the scenes of most applications, storing all the information the program needs to work.</p>
  <p>Simply put, a <b>database</b> is an <b>organised collection of data</b>. Because the data is stored in a structured way, it can be searched, sorted and updated quickly, and you can ask it questions, called <b>queries</b>.</p>
  <h3>Where are databases used?</h3>
  <p>They're literally everywhere! Here are a few examples:</p>
  <div class="dbuses">
   <div><b>📱 Mobile phones</b><span>Your contacts are stored in a database.</span></div>
   <div><b>🎮 Video games</b><span>Stats, scores, ranks and trophies.</span></div>
   <div><b>🏢 Businesses</b><span>Employee, customer and supplier details.</span></div>
   <div><b>🏥 Hospitals</b><span>Patient health records.</span></div>
   <div><b>🚓 Law enforcement</b><span>Criminal records.</span></div>
   <div><b>🏫 Schools</b><span>Students, parents and staff.</span></div>
   <div><b>🛒 Online shops</b><span>Products, prices and orders.</span></div>
   <div><b>💬 Social media</b><span>Every member's details and posts.</span></div>
  </div>
 </section>
 <section>
  <h2>Database structure</h2>
  <p>Databases store data in <b>tables</b>. One database can hold several tables, e.g. a school database could have one table for students and another for parents. For your exam, you only need to work with <b>single-table databases</b>: databases that store all their data in one table.</p>
  <div class="stepline"><b>Table</b><span>A collection of related data, organised into fields (columns) and records (rows). Each table has a name.</span></div>
  <div class="stepline"><b>Field</b><span>One piece of information about each thing, person or object. Each field is a <b>column</b>, and has a name and a data type, e.g. Breed.</span></div>
  <div class="stepline"><b>Record</b><span>All the fields about one thing, person or object. Each record is a <b>row</b> of the table, e.g. everything about one dog.</span></div>
  <h3>Try it: fields, records and tables</h3>
  <div class="lgwid" id="dbparts"></div>
 </section>
 <section>
  <h2>Primary keys</h2>
  <p>A <b>primary key</b> is a field that holds a <b>unique</b> value for every record: no value is ever repeated. This means every single record can be identified, so when you search for a record or sort the data, you always find the right one.</p>
  <p>Good examples of primary keys are a student ID, an employee ID, a car's number plate, a passport number or a product barcode. Each of these is one of a kind.</p>
  <div class="callout warnbox"><span class="k">Example situation</span><p>Imagine a large school has three students called James Jones in Year 7. A teacher asks the office for the phone number of one of their parents. The secretary searches the database by name and finds three James Joneses, with no way of telling which is the right one! To fix this, every student is given a unique <b>StudentID</b>. Searching for the StudentID always finds exactly one student.</p></div>
  <h3>Try it: choose the primary key</h3>
  <div class="lgwid" id="dbkey"></div>
  <div class="callout tip"><span class="k">Exam tip</span><p>If you're asked to explain why a field is a suitable primary key, say that its values are <b>unique</b> for every record, so it can be used to <b>identify each record</b>. Names, dates and phone numbers are rarely good choices, because they can be shared.</p></div>
 </section>
</div>
</template>
<template id="th-9-1-types">
<div class="theory airy">
 <section>
  <h2>Data types</h2>
  <p class="lede">When a database is set up, each field must be given a <b>name</b> and a <b>data type</b>. The data type says what kind of data the field will hold.</p>
  <p>Why does this matter? Knowing the data type lets the computer work out how much <b>storage</b> each field needs, and how it can <b>handle</b> the data. For example, if it knows a field holds numbers, it can search for values greater than or less than a number, or add them up. It couldn't do that if the numbers were stored as text.</p>
  <p>You need to know these six data types:</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Data type</th><th>What it stores</th><th>Examples</th></tr>
   <tr><td><b>Text / alphanumeric</b></td><td>Any mix of letters, digits, spaces and symbols</td><td>A name, an address, a postcode, a phone number</td></tr>
   <tr><td><b>Character</b></td><td>A single letter, digit or symbol</td><td>A grade such as B, or M or F</td></tr>
   <tr><td><b>Boolean</b></td><td>One of only two values: TRUE or FALSE (yes or no)</td><td>Paid? Member of the newsletter?</td></tr>
   <tr><td><b>Integer</b></td><td>A whole number</td><td>A year group such as 10, a quantity in stock</td></tr>
   <tr><td><b>Real</b></td><td>A number with a decimal point</td><td>A price such as 4.99, a height such as 1.65</td></tr>
   <tr><td><b>Date / time</b></td><td>A date or time in a set format</td><td>09/02/2011, 14:30</td></tr></table></div>
  <div class="callout warnbox"><span class="k">Be careful</span><p>Phone numbers <b>look</b> like numbers, but they should be stored as <b>text</b>. They often start with 0 (which a number would lose) and may contain spaces, and you'd never add or multiply them.</p></div>
  <p class="vfoot">Database software sometimes uses other names. For example, Microsoft Access has Short Text, Number, Currency, Yes/No and AutoNumber, which counts up automatically and is often used for a primary key.</p>
  <h3>Try it: design a table</h3>
  <div class="lgwid" id="dbtypes"></div>
 </section>
 <section>
  <h2>Validation</h2>
  <p>Like most things in computing, databases can fall victim to errors, and the most common error is data being <b>entered incorrectly</b>. <b>Validation</b> is an automatic check, set on a field, that makes sure the data entered is <b>sensible and reasonable</b>, and in the required format. If it isn't, the data is rejected and the user is asked to enter it again.</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Validation check</th><th>What it does</th><th>Example</th></tr>
   <tr><td><b>Presence check</b></td><td>Makes sure the field isn't left empty</td><td>A surname must be entered</td></tr>
   <tr><td><b>Type check</b></td><td>Makes sure the data is the right data type</td><td>An age must be a whole number</td></tr>
   <tr><td><b>Range check</b></td><td>Makes sure a value is between a lower and an upper limit</td><td>A price must be between £5 and £10</td></tr>
   <tr><td><b>Length check</b></td><td>Makes sure the data has a set number of characters, or a minimum or maximum</td><td>A password must be at least 8 characters</td></tr>
   <tr><td><b>Format check</b></td><td>Makes sure the data matches a set pattern</td><td>A date must be dd/mm/yyyy. The same format everywhere makes sorting and searching easier.</td></tr>
   <tr><td><b>Check digit</b></td><td>A final digit calculated from the other digits, used to spot mistyped numbers</td><td>The last digit of a barcode or ISBN</td></tr>
   <tr><td><b>List check</b></td><td>Makes sure the data is one of a pre-set list of options</td><td>A house must be Red, Blue, Green or Yellow</td></tr></table></div>
  <h3>Try it: add a record</h3>
  <div class="lgwid" id="dbval"></div>
  <div class="callout tip"><span class="k">Validation or verification?</span><p>Validation only checks that data is <b>reasonable</b>. A date of birth of 03/04/2011 passes every check, even if the real date was 04/03/2011! <b>Verification</b> checks the data has been entered <b>accurately</b>, e.g. by typing it in twice (double entry) or reading it back (a visual check).</p></div>
 </section>
</div>
</template>
<template id="th-9-1-sql">
<div class="theory airy">
 <section>
  <h2>What is SQL?</h2>
  <p class="lede"><b>SQL</b> stands for <b>Structured Query Language</b>. It's the language used to ask a database questions, called <b>queries</b>, and get back just the data you want.</p>
  <p>SQL is used by almost every database system, from huge online shops to the app on your phone. Programs written in languages like Python can send SQL queries to a database too.</p>
  <p>For the exam you need to be able to <b>read</b>, <b>complete</b> and <b>write</b> SQL queries, and work out what a query will <b>output</b>.</p>
 </section>
 <section>
  <h2>The structure of a query</h2>
  <p>Most queries are built from three parts, always in this order:</p>
  <pre class="sqlcode"><b class="sqlk">SELECT</b> Name, Breed
<b class="sqlk">FROM</b> Dogs
<b class="sqlk">WHERE</b> Age &gt; 3</pre>
  <div class="stepline"><b>SELECT</b><span>Lists the <b>fields</b> to show, separated by commas. Use <span class="mono">*</span> to show every field.</span></div>
  <div class="stepline"><b>FROM</b><span>Names the <b>table</b> to search.</span></div>
  <div class="stepline"><b>WHERE</b><span>Gives the <b>condition</b> a record must meet to be included. WHERE is optional: without it, every record is included.</span></div>
  <p>Here's the Dogs table we'll be using:</p>
  <div class="dbtbl" data-db="Dogs"></div>
 </section>
 <section>
  <h2>Writing conditions</h2>
  <p>A condition compares a field with a value, using one of these operators:</p>
  <div class="tscroll"><table class="pvt" style="max-width:520px"><tr><th>Operator</th><th>Meaning</th></tr><tr><td>=</td><td>equal to</td></tr><tr><td>&lt;&gt;</td><td>not equal to</td></tr><tr><td>&gt;</td><td>greater than</td></tr><tr><td>&lt;</td><td>less than</td></tr><tr><td>&gt;=</td><td>greater than or equal to</td></tr><tr><td>&lt;=</td><td>less than or equal to</td></tr></table></div>
  <ul class="obj">
   <li><b>Text</b> values go in quotation marks: <span class="mono">WHERE Breed = 'Beagle'</span></li>
   <li><b>Numbers</b> don't: <span class="mono">WHERE Age &gt;= 5</span></li>
   <li><b>Boolean</b> values are TRUE or FALSE: <span class="mono">WHERE Vaccinated = TRUE</span></li>
  </ul>
  <h3>Combining conditions with AND, OR and NOT</h3>
  <p>Just like in Boolean logic, conditions can be joined. <b>AND</b> needs both to be true, <b>OR</b> needs at least one, and <b>NOT</b> flips a condition. Use brackets to make the order clear:</p>
  <pre class="sqlcode"><b class="sqlk">SELECT</b> Name <b class="sqlk">FROM</b> Dogs
<b class="sqlk">WHERE</b> (Breed = 'Beagle' <b class="sqlk">OR</b> Breed = 'Boxer') <b class="sqlk">AND</b> Gender = 'M'</pre>
 </section>
 <section>
  <h2>How a query works</h2>
  <p>Step through each query to see what the database does with each part.</p>
  <div class="lgwid" id="sqlsteps"></div>
 </section>
 <section>
  <h2>Try it: the SQL playground</h2>
  <p>Type a query and press <b>Run query</b> (or Ctrl + Enter). Start with one of the examples, then change it. Can you find all the white dogs? Or every member over 30?</p>
  <div class="lgwid sqlplay" id="sqlplay1" data-tables="Dogs,Members" data-ex="SELECT * FROM Dogs|SELECT Name, Breed FROM Dogs WHERE Colour = 'Brown'|SELECT FirstName, Surname FROM Members WHERE Town = 'Riverton'|SELECT Name FROM Dogs WHERE Age &gt;= 4 AND Vaccinated = TRUE|SELECT * FROM Members WHERE NOT Level = 'Gold'"></div>
  <div class="callout tip"><span class="k">Exam tip</span><p>Spell field and table names <b>exactly</b> as they appear in the table, and remember the quotation marks around text. When you write the output of a query, show only the fields listed after SELECT, in the same order.</p></div>
 </section>
</div>
</template>
<template id="th-9-1-sql2">
<div class="theory airy">
 <section>
  <h2>Sorting with ORDER BY</h2>
  <p class="lede"><b>ORDER BY</b> sorts the results of a query. It always goes at the <b>end</b> of the query, after WHERE.</p>
  <div class="stepline"><b>ASC</b><span><b>Ascending</b>: smallest to largest (1, 2, 3) or A to Z. If you don't write ASC or DESC, ascending is used.</span></div>
  <div class="stepline"><b>DESC</b><span><b>Descending</b>: largest to smallest (3, 2, 1) or Z to A.</span></div>
  <pre class="sqlcode"><b class="sqlk">SELECT</b> Name, Age <b class="sqlk">FROM</b> Dogs
<b class="sqlk">WHERE</b> Vaccinated = TRUE
<b class="sqlk">ORDER BY</b> Age <b class="sqlk">DESC</b></pre>
  <p>This shows the name and age of every vaccinated dog, oldest first. The field you sort by doesn't have to be one of the fields you SELECT.</p>
 </section>
 <section>
  <h2>SUM and COUNT</h2>
  <p>Sometimes you don't want a list of records, just a single number. SQL has two functions for this:</p>
  <div class="stepline"><b>COUNT</b><span><b>Counts</b> how many records match. <span class="mono">SELECT COUNT(DogID) FROM Dogs WHERE Breed = 'Beagle'</span> gives <b>2</b>, because two dogs are Beagles.</span></div>
  <div class="stepline"><b>SUM</b><span><b>Adds up</b> the values in a number field for the matching records. <span class="mono">SELECT SUM(Stock) FROM Products WHERE Category = 'Dairy'</span> gives <b>115</b> (15 + 40 + 60).</span></div>
  <div class="callout warnbox"><span class="k">Be careful</span><p>COUNT doesn't add up the values in a field. It counts the <b>records</b>. If a table has 4 records with quantities 6, 1, 2 and 6, then COUNT(Quantity) is <b>4</b>, but SUM(Quantity) is <b>15</b>.</p></div>
  <p>Here's the Products table:</p>
  <div class="dbtbl" data-db="Products"></div>
 </section>
 <section>
  <h2>Putting it all together</h2>
  <p>A full query can use every part you've learnt. The order is always:</p>
  <pre class="sqlcode"><b class="sqlk">SELECT</b> fields <span class="vfoot">or SUM(field) or COUNT(field)</span>
<b class="sqlk">FROM</b> table
<b class="sqlk">WHERE</b> condition
<b class="sqlk">ORDER BY</b> field <b class="sqlk">ASC</b> or <b class="sqlk">DESC</b></pre>
  <h3>Try it: the SQL playground</h3>
  <p>Try sorting, counting and adding up. Can you find the total stock of fruit? Or list every member from youngest to oldest?</p>
  <div class="lgwid sqlplay" id="sqlplay2" data-tables="Products,Dogs,Members" data-ex="SELECT Product, Price FROM Products ORDER BY Price DESC|SELECT COUNT(ProductID) FROM Products WHERE OnSale = TRUE|SELECT SUM(Stock) FROM Products WHERE Category = 'Fruit'|SELECT Name, Breed FROM Dogs ORDER BY Name ASC|SELECT FirstName, Age FROM Members WHERE Age &gt;= 18 ORDER BY Age ASC"></div>
  <div class="callout tip"><span class="k">Exam tip</span><p>Exam questions often give you part of a query and ask you to complete it, or ask for the output of a query. Work through it like the database does: first find the matching records (WHERE), then pick the fields (SELECT), then sort them (ORDER BY).</p></div>
 </section>
</div>
</template>
<template id="th-8-2-onedim">
<div class="theory airy">
 <section>
  <h2>Why do we need arrays?</h2>
  <p class="lede">A variable stores <b>one</b> piece of data. Imagine your program needs to keep track of the ages of 30 people. Would you need 30 separate variables? Not necessarily! An <b>array</b> can store all 30 values in a single data structure.</p>
  <p>With 30 variables (Age1, Age2, Age3…), you'd need 30 lines of code just to input them, and 30 more to output them. With an array, a loop can do the same job in three lines. You'll see how in the next lesson.</p>
 </section>
 <section>
  <h2>One-dimensional arrays</h2>
  <p>An <b>array</b> is a data structure that stores several items of data under <b>one name</b> (identifier). Each item is called an <b>element</b>, and each element is stored at a position called its <b>index</b>.</p>
  <p>A one-dimensional (1D) array is like a single row of boxes. Here's an array called StudentNames that holds 5 names:</p>
  <div class="arrstatic" data-arr='["Mary","Paul","Ivy","Will","Dan"]' data-name="StudentNames"></div>
  <p>To use one element, write the array's name followed by the index in square brackets: <span class="mono">StudentNames[3]</span> is "Ivy".</p>
  <div class="callout warnbox"><span class="k">Index 0 or 1?</span><p>Depending on the language, the first index can be 0 or 1. Cambridge pseudocode usually uses a <b>lower bound of 1</b>, so we'll follow that. Python always starts at <b>0</b>, so in Python, Ivy would be at index 2. Always check the declaration to see where an array starts.</p></div>
 </section>
 <section>
  <h2>Declaring an array</h2>
  <p>In Cambridge pseudocode, an array must be <b>declared</b> before it can be used. The declaration gives the array's name, its size (the lower and upper bound of the index) and the data type of its elements:</p>
  <p class="lgst big">DECLARE &lt;identifier&gt; : ARRAY[&lt;lower&gt;:&lt;upper&gt;] OF &lt;data type&gt;</p>
  <pre class="pc" data-t="Declaring arrays">// space for 5 names
DECLARE StudentNames : ARRAY[1:5] OF STRING
// space for 30 ages
DECLARE Ages : ARRAY[1:30] OF INTEGER
// space for 7 temperatures with decimals
DECLARE Temps : ARRAY[1:7] OF REAL</pre>
  <p>Two rules follow from this, and they're important in the exam:</p>
  <div class="stepline"><b>Fixed size</b><span>The size is set when the array is declared and <b>can't change</b>. An array declared [1:5] has exactly 5 elements. You can't add a sixth.</span></div>
  <div class="stepline"><b>One data type</b><span>Every element must be the <b>same data type</b>: an ARRAY OF STRING can only hold strings.</span></div>
 </section>
 <section>
  <h2>Storing and outputting data</h2>
  <p>You assign a value to an element just like a variable, using the arrow <span class="mono">←</span>. You can store a fixed value, the value of a variable, or a value the user inputs:</p>
  <pre class="pc" data-t="Storing data at a specific index">DECLARE StudentNames : ARRAY[1:5] OF STRING
DECLARE Name : STRING
StudentNames[1] ← "Mary"
StudentNames[2] ← "Paul"
// store a variable's value
INPUT Name
StudentNames[3] ← Name
// or input straight into an element
INPUT StudentNames[4]
OUTPUT StudentNames[1]</pre>
  <p>The last line outputs <b>Mary</b>. To output a single item, write <span class="mono">OUTPUT</span> followed by the array name and the index.</p>
  <h3>Try it: run some pseudocode</h3>
  <div class="lgwid" id="arr1d"></div>
 </section>
 <section>
  <h2>The exam vs Python</h2>
  <p>Cambridge pseudocode is a <b>stricter</b> language than Python. It isn't a real programming language, but it borrows its rules from several that are: the way arrays are declared with a lower and upper bound, e.g. <span class="mono">ARRAY[1:5] OF STRING</span>, comes from <b>Pascal</b>; keywords like <span class="mono">DECLARE … : … OF STRING</span> read a lot like <b>Visual Basic</b> (<span class="mono">Dim Names(4) As String</span>); and, like <b>Java</b>, an array has a fixed size and every element must be the same data type.</p>
  <p>Python doesn't have arrays in quite the same way. It has <b>lists</b>, which are much more flexible. That's handy when you're programming, but in the exam you must follow the stricter Cambridge rules. Here's the same idea in both:</p>
  <div class="pcpair"><pre class="pc" data-t="Cambridge pseudocode">DECLARE StudentNames : ARRAY[1:5] OF STRING
StudentNames[1] ← "Mary"
StudentNames[2] ← "Paul"
StudentNames[3] ← "Ivy"
OUTPUT StudentNames[3]</pre><pre class="pc py" data-t="Python">student_names = ["Mary", "Paul"]
student_names.append("Ivy")
# lists can mix types and grow
student_names.append(42)
print(student_names[2])</pre></div>
  <div class="tscroll"><table class="pvt deftab"><tr><th></th><th>Cambridge pseudocode (exam)</th><th>Python lists</th></tr>
   <tr><td><b>Size</b></td><td>Fixed when declared</td><td>Can grow and shrink, e.g. with append()</td></tr>
   <tr><td><b>Data types</b></td><td>One data type for every element</td><td>Can mix types in one list</td></tr>
   <tr><td><b>First index</b></td><td>Usually 1</td><td>Always 0</td></tr>
   <tr><td><b>Declaring</b></td><td>Must be declared before use, with DECLARE</td><td>Created by assigning a list, e.g. names = []</td></tr>
   <tr><td><b>Assignment</b></td><td>Names[1] ← "Mary"</td><td>names[0] = "Mary"</td></tr>
   <tr><td><b>2D</b></td><td>Marks[2, 3]</td><td>marks[1][2]</td></tr></table></div>
  <div class="callout tip"><span class="k">Exam tip</span><p>Python functions such as <span class="mono">append()</span>, <span class="mono">len()</span>, <span class="mono">min()</span>, <span class="mono">max()</span> and <span class="mono">sum()</span> aren't part of Cambridge pseudocode, and using them doesn't show the examiner that you understand the logic. Write the loop yourself.</p></div>
 </section>
</div>
</template>
<template id="th-8-2-loops">
<div class="theory airy">
 <section>
  <h2>Filling an array with a loop</h2>
  <p class="lede">It's very common for a program to let the user fill an array with data. Writing an INPUT line for every element would take forever, so we use a <b>loop</b>.</p>
  <p>A <b>FOR</b> loop is the best choice, because we know exactly how many times to repeat: once for each element in the array.</p>
  <pre class="pc" data-t="Entering data into an array using a loop">DECLARE StudentNames : ARRAY[1:30] OF STRING
DECLARE Count : INTEGER
FOR Count ← 1 TO 30
   OUTPUT "Enter the name of student ", Count
   INPUT StudentNames[Count]
NEXT Count</pre>
  <h3>Why does this work?</h3>
  <p>The key is that the FOR loop's counter variable, <b>Count</b>, is used as the array's <b>index</b>. Count starts at 1 and goes up by 1 each time round the loop, until it reaches 30. So the first name goes into StudentNames[1], the second into StudentNames[2], and so on, until the array is full.</p>
 </section>
 <section>
  <h2>Outputting every item</h2>
  <p>Outputting the whole array works in the same way, using OUTPUT instead of INPUT:</p>
  <pre class="pc" data-t="Output every item in the array">FOR Count ← 1 TO 30
   OUTPUT StudentNames[Count]
NEXT Count</pre>
  <p>These three lines output the entire contents of the array, however big it is.</p>
 </section>
 <section>
  <h2>When you don't know the size</h2>
  <p>Often you won't know how much data there will be when you write the program. For example, a teacher wants to enter their students' names, but each class is a different size.</p>
  <p>The solution is to ask the user first. The teacher enters how many students they have, the program stores this in a variable, and then that variable is used as the <b>upper bound</b> when the array is declared. The array is created at exactly the right size:</p>
  <div class="pcpair"><pre class="pc" data-t="Cambridge pseudocode">DECLARE NumStudents, Count : INTEGER
OUTPUT "How many students are in the class?"
INPUT NumStudents
DECLARE StudentNames : ARRAY[1:NumStudents] OF STRING
FOR Count ← 1 TO NumStudents
   OUTPUT "Enter the name of student ", Count
   INPUT StudentNames[Count]
NEXT Count</pre><pre class="pc py" data-t="Python">num_students = int(input("How many students are in the class? "))
# create a list of the right size, like DECLARE
student_names = [""] * num_students
for count in range(num_students):
    student_names[count] = input("Enter a name: ")</pre></div>
  <p>On line 3 the user states the number of students. Line 4 uses that number to create an empty array of that length, ready for the names to be entered. Notice the array is declared <b>after</b> the INPUT, because the program needs to know the size first. Once it's declared, its size is still fixed: you can't add an extra student later.</p>
  <p>In Python you could start with an empty list and use <span class="mono">append()</span> to grow it, but creating the list at full size first (<span class="mono">[""] * num_students</span>) works just like the Cambridge version.</p>
 </section>
 <section>
  <h2>Useful algorithms with arrays</h2>
  <p>These come up again and again in exam questions. Choose a program and step through it line by line. Watch how the loop counter is used as the index, and how the variables change.</p>
  <div class="lgwid" id="arrloop"></div>
  <div class="callout tip"><span class="k">Exam tip</span><p>To find the highest or lowest value, start by setting Highest (or Lowest) to the <b>first element</b> of the array, not to 0. If every value were negative, starting at 0 would give the wrong answer!</p></div>
 </section>
</div>
</template>
<template id="th-8-2-twodim">
<div class="theory airy">
 <section>
  <h2>Two-dimensional arrays</h2>
  <p class="lede">A 1D array is a single row of data. A <b>two-dimensional (2D) array</b> is like a <b>table</b>, with rows and columns. You can think of it as an array of arrays.</p>
  <p>Imagine a teacher storing the marks of 3 students in 4 tests. They could use 3 separate 1D arrays, or one 2D array with a <b>row for each student</b> and a <b>column for each test</b>:</p>
  <div class="lgwid" id="arr2d"></div>
 </section>
 <section>
  <h2>Declaring and using a 2D array</h2>
  <p>A 2D array is declared with two sets of bounds: first the <b>rows</b>, then the <b>columns</b>.</p>
  <p class="lgst big">DECLARE &lt;identifier&gt; : ARRAY[&lt;l1&gt;:&lt;u1&gt;, &lt;l2&gt;:&lt;u2&gt;] OF &lt;data type&gt;</p>
  <pre class="pc" data-t="Declaring and using a 2D array">// 3 rows (students) and 4 columns (tests)
DECLARE Marks : ARRAY[1:3, 1:4] OF INTEGER
// Ben (row 2) scored 15 in Test 3
Marks[2, 3] ← 15
OUTPUT Marks[2, 3]</pre>
  <p>To use one element, give <b>both</b> indexes: the row first, then the column. The array above has 3 × 4 = <b>12</b> elements.</p>
  <div class="pcpair"><pre class="pc" data-t="Cambridge pseudocode">DECLARE Marks : ARRAY[1:3, 1:4] OF INTEGER
Marks[2, 3] ← 15
OUTPUT Marks[2, 3]</pre><pre class="pc py" data-t="Python">marks = [[12, 14, 8, 17],
         [6, 8, 15, 13],
         [16, 15, 9, 18]]
print(marks[1][2])</pre></div>
  <p>Python stores a 2D array as a <b>list of lists</b>. Each row is its own list, and the indexes are written in two sets of brackets, starting from 0.</p>
 </section>
 <section>
  <h2>Nested loops</h2>
  <p>To visit every element of a 2D array, you need a loop <b>inside</b> another loop. This is called <b>nested iteration</b>. The outer loop goes through the rows. For each row, the inner loop goes through every column.</p>
  <pre class="pc" data-t="Input every mark using nested loops">FOR Student ← 1 TO 3
   FOR Test ← 1 TO 4
      OUTPUT "Enter mark for student ", Student, " test ", Test
      INPUT Marks[Student, Test]
   NEXT Test
NEXT Student</pre>
  <p>The inner loop runs <b>4 times</b> for each pass of the outer loop, so the INPUT line runs 3 × 4 = 12 times: once for every element.</p>
  <h3>Try it: step through nested loops</h3>
  <div class="lgwid" id="arrloop2" data-two="1"></div>
  <div class="callout tip"><span class="k">Exam tip</span><p>Name your loop counters after what they count (Student and Test, or Row and Column) rather than i and j. It makes it much easier to get the indexes in the right order.</p></div>
 </section>
</div>
</template>
<template id="th-8-2-uses">
<div class="theory airy">
 <section>
  <h2>Choosing the right data structure</h2>
  <p class="lede">Arrays are used in almost every real program. The trick is spotting which structure fits the data:</p>
  <div class="stepline"><b>Variable</b><span>One single value, e.g. a player's name or the current score.</span></div>
  <div class="stepline"><b>1D array</b><span>A <b>list</b> of values of the same type, e.g. 30 names, 7 daily temperatures, the top 10 high scores.</span></div>
  <div class="stepline"><b>2D array</b><span>Data in a <b>table or grid</b>, e.g. marks for each student in each test, a game board, seats in a cinema.</span></div>
 </section>
 <section>
  <h2>1D arrays in practice</h2>
  <h3>Weekly temperatures</h3>
  <p>A weather station stores the temperature at noon for each day of the week, then works out the average and the hottest day:</p>
  <pre class="pc" data-t="Weekly temperatures">DECLARE Temps : ARRAY[1:7] OF REAL
DECLARE Day, HottestDay : INTEGER
DECLARE Total : REAL
Total ← 0
HottestDay ← 1
FOR Day ← 1 TO 7
   INPUT Temps[Day]
   Total ← Total + Temps[Day]
   IF Temps[Day] &gt; Temps[HottestDay]
     THEN
       HottestDay ← Day
   ENDIF
NEXT Day
OUTPUT "Average: ", Total / 7
OUTPUT "Hottest day: ", HottestDay</pre>
  <h3>Parallel arrays</h3>
  <p>An array can only hold one data type. So how do you store each player's name <b>and</b> score? Use two arrays of the same size, where the same index refers to the same player. These are called <b>parallel arrays</b>:</p>
  <div class="arrpar"><div class="arrstatic" data-arr='["Ama","Leo","Kim","Raj"]' data-name="Players"></div><div class="arrstatic" data-arr='[120,95,210,150]' data-name="Scores" data-q="0"></div></div>
  <p>Players[3] is Kim, and Scores[3] is Kim's score of 210. A loop with one counter can work through both arrays together.</p>
  <pre class="pc" data-t="Output each player with their score">FOR Count ← 1 TO 4
   OUTPUT Players[Count], " scored ", Scores[Count]
NEXT Count</pre>
 </section>
 <section>
  <h2>2D arrays in practice</h2>
  <p>2D arrays are perfect for anything that looks like a grid:</p>
  <div class="dbuses">
   <div><b>🎬 Cinema seats</b><span>Rows and seats: TRUE if booked.</span></div>
   <div><b>⭕ Game boards</b><span>Noughts and crosses, chess, battleships.</span></div>
   <div><b>🖼️ Images</b><span>The colour of each pixel, row by row.</span></div>
   <div><b>📅 Timetables</b><span>Days and lessons.</span></div>
   <div><b>📊 Results</b><span>Students and tests, teams and matches.</span></div>
   <div><b>🐄 Farm records</b><span>Each cow's milk yield for each day.</span></div>
  </div>
  <h3>Try it: book cinema seats</h3>
  <div class="lgwid" id="arrcinema"></div>
 </section>
 <section>
  <h2>Worked example: a dairy farm</h2>
  <p>A farmer wants to record how much milk each cow produces every day for a week, then see each cow's weekly total. Each cow has a 3-digit ID number.</p>
  <p>The cows' IDs go in a 1D array. The daily milk yields go in a 2D array, with a <b>row for each cow</b> and a <b>column for each day</b>:</p>
  <pre class="pc" data-t="Weekly milk yields">DECLARE HerdSize, Cow, Day : INTEGER
DECLARE Total : REAL
OUTPUT "How many cows are in the herd?"
INPUT HerdSize
DECLARE CowID : ARRAY[1:HerdSize] OF INTEGER
DECLARE Milk : ARRAY[1:HerdSize, 1:7] OF REAL
FOR Cow ← 1 TO HerdSize
   REPEAT
      OUTPUT "Enter the 3-digit ID for cow ", Cow
      INPUT CowID[Cow]
   UNTIL CowID[Cow] &gt;= 100 AND CowID[Cow] &lt;= 999
   Total ← 0
   FOR Day ← 1 TO 7
      OUTPUT "Litres of milk on day ", Day
      INPUT Milk[Cow, Day]
      Total ← Total + Milk[Cow, Day]
   NEXT Day
   OUTPUT "Cow ", CowID[Cow], " total: ", Total
NEXT Cow</pre>
  <p>Notice how much this one program uses: a 1D and a 2D array, nested loops, validation with a REPEAT loop, and a running total.</p>
  <div class="callout tip"><span class="k">Exam tip</span><p>The 15-mark scenario question in Paper 2 almost always needs arrays. Declare them clearly, use loops to process them, choose meaningful names, and add comments explaining what each part does.</p></div>
 </section>
</div>
</template>
<template id="th-8-1-variables">
<div class="theory airy">
 <section>
  <h2>Why do programs need variables?</h2>
  <p class="lede">As programs get more complex, they need to <b>remember</b> information. Without this, all software would be limited to extremely simple jobs. Variables and constants give programs the ability to store data.</p>
  <p>A <b>variable</b> is a named <b>location in memory</b> that is set aside to store a piece of data while a program runs, e.g. a number or some text. Think of it as a labelled box: the label is the variable's name, and the box holds its current value. The value can be used, and <b>changed</b>, at any point in the program.</p>
  <p>A <b>constant</b> is also a named location in memory, but its value is set once and <b>can't change</b> while the program runs. Constants are used for values that never change, such as Pi or the VAT rate.</p>
 </section>
 <section>
  <h2>Naming variables: identifiers</h2>
  <p>The name of a variable or constant is called its <b>identifier</b>. You'll need it every time you use the variable, so choose it carefully. Identifiers must follow these rules:</p>
  <ul class="obj"><li>Use a <b>meaningful name</b> that describes the data, e.g. <span class="mono">TotalScore</span>, not <span class="mono">X</span>.</li><li>Don't start with a <b>number</b>: <span class="mono">Player1</span> is fine, <span class="mono">1Player</span> isn't.</li><li>No <b>spaces</b> or <b>accented letters</b>, and only use A–Z, a–z and 0–9.</li><li>Don't use a <b>keyword</b> such as OUTPUT, IF or WHILE.</li></ul>
  <p>Single letters such as i or x are acceptable as loop counters or array indexes, but meaningful names make your code much easier to read.</p>
 </section>
 <section>
  <h2>Declaring, assigning and constants</h2>
  <p><b>Declaring</b> a variable sets it up: it gives the variable an identifier and a data type, and reserves memory for it. It's good practice to declare all your variables at the start of a program, so the computer knows how much memory the program will need.</p>
  <p><b>Assigning</b> puts a value into a variable. In Cambridge pseudocode, the assignment arrow <span class="mono">←</span> is used. A value can be assigned directly, from another variable, or from a calculation:</p>
  <pre class="pc" data-t="Declaring variables and constants, and assigning values">DECLARE Username : STRING
DECLARE Score, Bonus, Total : INTEGER
DECLARE Sold : BOOLEAN
CONSTANT VATRate ← 0.2
Username ← "SkyRunner"
Score ← 120
Bonus ← 30
Total ← Score + Bonus
Sold ← TRUE</pre>
  <p>Giving a variable its first value, such as <span class="mono">Score ← 0</span>, is called <b>initialising</b> it. It's a good habit for any variable you'll add to later, like a total or a counter.</p>
  <div class="lgwid psrun" data-p="area"></div>
  <div class="lgwid psrun" data-p="constant"></div>
 </section>
 <section>
  <h2>Data types</h2>
  <p>Data needs to be stored differently depending on what it is. <span class="mono">"Hello"</span> and <span class="mono">7</span> are very different: 7 should be usable in calculations, but "Hello" shouldn't. Each variable is given a <b>data type</b>, which decides what can be stored in it, how much memory it needs, and what can be done with it. You need to know five:</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Data type</th><th>Stores</th><th>Example</th><th>Typical size</th></tr>
   <tr><td><b>INTEGER</b></td><td>A whole number, positive or negative</td><td class="mono">YearGroup ← 10</td><td>2 or 4 bytes</td></tr>
   <tr><td><b>REAL</b></td><td>A number with a decimal part</td><td class="mono">Cost ← 5.50</td><td>4 or 8 bytes</td></tr>
   <tr><td><b>CHAR</b></td><td>A single character</td><td class="mono">Grade ← 'B'</td><td>1 byte</td></tr>
   <tr><td><b>STRING</b></td><td>Zero or more characters: letters, digits and symbols</td><td class="mono">Name ← "Dave"</td><td>1 byte per character</td></tr>
   <tr><td><b>BOOLEAN</b></td><td>One of two values: TRUE or FALSE</td><td class="mono">Accepted ← TRUE</td><td>usually 1 byte</td></tr></table></div>
  <p class="vfoot">Sizes vary between programming languages, so you don't need to learn them, but they show why choosing the right type matters.</p>
  <h3>Strings and numbers behave differently</h3>
  <p>A string can contain digits, but you can't do maths with it. If X ← "7" and Y ← "3", then X + Y gives <b>"73"</b>, not 10: the two strings are joined together. Joining strings is called <b>concatenation</b>. If A ← 7 and B ← 3 are integers, A + B gives <b>10</b>.</p>
  <div class="lgwid psrun" data-p="concat"></div>
  <p>Every variable can only hold its own data type. The runner checks this, just like a real program would. Try breaking the rules:</p>
  <div class="lgwid psrun" data-p="typeerr"></div>
 </section>
 <section>
  <h2>Your turn: what data type is it?</h2>
  <p>Choose the data type of each value. Look carefully at the quotation marks!</p>
  <div class="lgwid" id="pstypes"></div>
 </section>
 <section>
  <h2>Your turn: declare and assign</h2>
  <p>Write pseudocode to declare suitable variables, and assign each one a value. Use meaningful identifiers and the right data types. Press <b>Edit code</b> to write your answer, <b>Run</b> to test it, then <b>Check my answer</b> when you're ready.</p>

DECLARE Tickets : INTEGER

 </section>
 <section>
  <h2>The exam vs Python</h2>
  <p>Python doesn't make you declare variables or their data types: the type is worked out from the value you assign, and it can even change. Python also has no true constants; programmers just write the name in capitals as a reminder not to change it. In the exam, follow the stricter Cambridge rules.</p>
  <div class="pcpair"><pre class="pc" data-t="Cambridge pseudocode">DECLARE Score : INTEGER
CONSTANT VATRate ← 0.2
Score ← 120
OUTPUT Score</pre><pre class="pc py" data-t="Python">score = 120
VAT_RATE = 0.2   # capitals: "please don't change"
print(score)</pre></div>
 </section>
</div>

<template id="th-8-1-sequence">
<div class="theory airy">
 <section>
  <h2>The three programming constructs</h2>
  <p class="lede">Every program is built from just three basic structures: <b>sequence</b>, <b>selection</b> and <b>iteration</b>. Sequence is perhaps the simplest of the three.</p>
  <div class="stepline"><b>Sequence</b><span>Instructions run one after another, in order.</span></div>
  <div class="stepline"><b>Selection</b><span>The program chooses which instructions to run, based on a condition (IF and CASE).</span></div>
  <div class="stepline"><b>Iteration</b><span>Instructions are repeated (FOR, WHILE and REPEAT loops).</span></div>
 </section>
 <section>
  <h2>Sequence</h2>
  <p><b>Sequence</b> means code that runs line by line, in order, without skipping or repeating anything: line 1, then line 2, then line 3…</p>
  <div class="lgwid psrun" data-p="seqgood"></div>
  <p>When code runs in sequence, it's very important that it's written in the <b>correct order</b>. In this version, lines 3 and 4 have been swapped:</p>
  <div class="lgwid psrun" data-p="seqbad"></div>
  <p>Now the user has to enter something as soon as the program starts, but they have no idea what to type, because the prompt doesn't appear until afterwards!</p>
  <h3>Sequence inside other structures</h3>
  <p>Any block of code that runs line by line counts as sequence, even if it's just two or three lines inside an IF statement or a loop. In the example below, lines 1–3, lines 6–11 and line 13 are all sequence. Lines 4–5, 12 and 14 are part of the selection.</p>
  <pre class="pc" data-t="Sequence within selection">DECLARE Age : INTEGER
OUTPUT "Please enter your age"
INPUT Age
IF Age &gt;= 17
  THEN
    OUTPUT "Welcome to the driving licence application"
    OUTPUT "Please enter your name"
    INPUT Name
    OUTPUT "Please enter your address"
    INPUT Address
    OUTPUT "Thank you"
  ELSE
    OUTPUT "Sorry, you are too young to drive"
ENDIF</pre>
 </section>
 <section>
  <h2>Input and output</h2>
  <div class="stepline"><b>INPUT</b><span>Takes data from the user and stores it in a variable: <span class="mono">INPUT Name</span></span></div>
  <div class="stepline"><b>OUTPUT</b><span>Displays data. Separate items with commas to output several at once: <span class="mono">OUTPUT "Hello ", Name</span></span></div>
  <p>Always OUTPUT a <b>prompt</b> before an INPUT, so the user knows what to type.</p>
  <div class="pcpair"><pre class="pc" data-t="Cambridge pseudocode">DECLARE Name : STRING
DECLARE Age : INTEGER
OUTPUT "Enter your name"
INPUT Name
OUTPUT "Enter your age"
INPUT Age
OUTPUT "Hello ", Name</pre><pre class="pc py" data-t="Python">name = input("Enter your name: ")
# input() always gives a string,
# so convert it to a number
age = int(input("Enter your age: "))
print("Hello", name)</pre></div>
 </section>
 <section>
  <h2>Operators</h2>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Type</th><th>Operators</th><th>Example</th></tr>
   <tr><td><b>Arithmetic</b></td><td><span class="mono">+  −  *  /  ^</span> (^ means "to the power of")</td><td class="mono">2 ^ 3 = 8</td></tr>
   <tr><td><b>Integer division</b></td><td><span class="mono">DIV</span>: the whole number part of a division</td><td class="mono">DIV(17, 5) = 3</td></tr>
   <tr><td><b>Remainder</b></td><td><span class="mono">MOD</span>: the remainder after a division</td><td class="mono">MOD(17, 5) = 2</td></tr>
   <tr><td><b>Relational</b></td><td><span class="mono">=  &lt;&gt;  &lt;  &gt;  &lt;=  &gt;=</span></td><td class="mono">Age &gt;= 17</td></tr>
   <tr><td><b>Logical</b></td><td><span class="mono">AND  OR  NOT</span></td><td class="mono">Age &gt; 12 AND Age &lt; 20</td></tr></table></div>
  <p>Calculations follow the same order as in maths: brackets first, then powers, then multiplication and division, then addition and subtraction.</p>
  <div class="lgwid psrun" data-p="ops"></div>
  <p class="vfoot">In Python: DIV is <span class="mono">//</span>, MOD is <span class="mono">%</span>, ^ is <span class="mono">**</span>, and &lt;&gt; is <span class="mono">!=</span>.</p>
 </section>
 <section>
  <h2>Challenges</h2>
  <p>Press <b>Edit code</b> and write each program yourself. Run it to test it, then press <b>Check my answer</b>: your program will be tested with some sample inputs.</p>
  <div class="lgwid psrun" data-p="chpizza"></div>
  <details class="lgans"><summary>Show a possible answer</summary><div class="lgwid psrun" data-code="DECLARE Pizzas, People, Slices : INTEGER
OUTPUT &quot;How many pizzas were bought?&quot;
INPUT Pizzas
OUTPUT &quot;How many people are sharing?&quot;
INPUT People
Slices ← Pizzas * 8
OUTPUT &quot;Each person gets &quot;, DIV(Slices, People), &quot; slices&quot;
OUTPUT &quot;Slices left over: &quot;, MOD(Slices, People)"></div></details>
  <div class="lgwid psrun" data-p="chtravel"></div>
  <details class="lgans"><summary>Show a possible answer</summary><div class="lgwid psrun" data-code="DECLARE Distance, Speed, Hours : REAL
OUTPUT &quot;Enter the distance in km&quot;
INPUT Distance
OUTPUT &quot;Enter the average speed in km/h&quot;
INPUT Speed
Hours ← Distance / Speed
OUTPUT &quot;Journey time: &quot;, ROUND(Hours, 2), &quot; hours&quot;"></div></details>
 </section>
</div>
</template>
<template id="th-8-1-selection">
<div class="theory airy">
 <section>
  <h2>Selection</h2>
  <p class="lede">A useful program can react to the information it's given. <b>Selection</b> means the program chooses which instructions to run, depending on whether a <b>condition</b> is TRUE or FALSE.</p>
  <p>For example, a driving licence system asks for the user's age. If they're under 17, it tells them they're too young. If they're 17 or older, it carries on with the application.</p>
  <p>There are two ways to do selection: <b>IF statements</b> and <b>CASE statements</b>.</p>
 </section>
 <section>
  <h2>IF statements</h2>
  <p>IF statements are a simple but very powerful idea: IF something is true, do something. ELSE, do something else.</p>
  <pre class="pc" data-t="IF statement syntax">IF &lt;condition&gt;
  THEN
    &lt;statements to run if the condition is TRUE&gt;
  ELSE
    &lt;statements to run if the condition is FALSE&gt;
ENDIF</pre>
  <p>The ELSE part is optional. Indent the code inside each part so it's easy to see which lines belong where.</p>
  <div class="lgwid psrun" data-p="ifage"></div>
  <h3>Nested IF statements</h3>
  <p>When there are more than two possible outcomes, you can put an IF statement inside another one. This is called <b>nesting</b>:</p>
  <div class="lgwid psrun" data-p="ifgrade"></div>
  <div class="callout tip"><span class="k">Exam tip</span><p>Cambridge pseudocode uses <b>IF … THEN … ELSE … ENDIF</b>, with THEN on its own line. Many languages have ELSE IF (Python's <span class="mono">elif</span>), but in the exam, use a nested IF instead.</p></div>
 </section>
 <section>
  <h2>CASE statements</h2>
  <p>A <b>CASE</b> statement checks one variable against a list of possible values, and runs the code for the value that matches. If nothing matches, the <b>OTHERWISE</b> code runs. CASE is especially useful when there are lots of options, because it needs fewer lines than lots of IFs.</p>
  <pre class="pc" data-t="CASE statement syntax">CASE OF &lt;identifier&gt;
  &lt;value 1&gt; : &lt;statement&gt;
  &lt;value 2&gt; : &lt;statement&gt;
  &lt;value 3&gt; : &lt;statement&gt;
  OTHERWISE : &lt;statement&gt;
ENDCASE</pre>
  <div class="lgwid psrun" data-p="casespin"></div>
  <p>Here's the same choice written with IF statements. As the number of options grows, the IF version gets much longer:</p>
  <pre class="pc" data-t="The same logic using IF">IF Spinner = 1
  THEN
    Price ← 3.00
  ELSE
    IF Spinner = 2
      THEN
        Price ← 6.50
      ELSE
        IF Spinner = 3
          THEN
            Price ← 8.00
          ELSE
            OUTPUT "Please enter 1, 2 or 3"
        ENDIF
    ENDIF
ENDIF</pre>
  <div class="callout warnbox"><span class="k">Be careful</span><p>In a CASE statement, each option is a <b>value</b> to match, like 1 or "Red". To test a condition such as Age &lt; 17, use an IF statement.</p></div>
 </section>
 <section>
  <h2>The exam vs Python</h2>
  <div class="pcpair"><pre class="pc" data-t="Cambridge pseudocode">IF Age &gt;= 17
  THEN
    OUTPUT "Old enough"
  ELSE
    OUTPUT "Too young"
ENDIF</pre><pre class="pc py" data-t="Python">if age &gt;= 17:
    print("Old enough")
else:
    print("Too young")</pre></div>
  <p>Python uses a colon and indentation instead of THEN and ENDIF. For several options, Python uses <span class="mono">elif</span>, or <span class="mono">match</span> and <span class="mono">case</span> (in newer versions) instead of CASE OF.</p>
 </section>
</div>
</template>
<template id="th-8-1-iteration">
<div class="theory airy">
 <section>
  <h2>Iteration</h2>
  <p class="lede"><b>Iteration</b> means repeating. A loop lets a program repeat steps without writing the same lines again and again, which massively reduces the amount of code you need.</p>
  <p>To output the numbers 1 to 12 without a loop, you'd need 12 OUTPUT lines. With a loop, it takes 3:</p>
  <div class="lgwid psrun" data-p="loop12"></div>
  <p>Now imagine you needed the numbers 1 to 10 million. Without a loop, that's 10 million lines of code! With a loop, you just change 12 to 10000000 and it's still 3 lines.</p>
  <p>There are three types of loop, and each is best suited to different situations:</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Loop</th><th>Also called</th><th>Use it when…</th></tr>
   <tr><td><b>FOR … NEXT</b></td><td>Count-controlled</td><td>You know how many times to repeat</td></tr>
   <tr><td><b>WHILE … ENDWHILE</b></td><td>Pre-condition</td><td>You don't know how many times, and the loop might not need to run at all</td></tr>
   <tr><td><b>REPEAT … UNTIL</b></td><td>Post-condition</td><td>You don't know how many times, but the loop must run at least once</td></tr></table></div>
 </section>
 <section>
  <h2>FOR loops</h2>
  <p>A FOR loop repeats a <b>set number of times</b>. The number can be chosen by the programmer, by the user, or by a calculation.</p>
  <pre class="pc" data-t="FOR loop syntax">FOR &lt;identifier&gt; ← &lt;value 1&gt; TO &lt;value 2&gt;
   &lt;statements&gt;
NEXT &lt;identifier&gt;</pre>
  <p>The identifier is a variable used for counting. It starts at value 1 and goes up by 1 each time round the loop, until it reaches value 2. You can add <span class="mono">STEP</span> to count in different jumps, e.g. <span class="mono">FOR Count ← 0 TO 100 STEP 10</span>.</p>
  <h3>Example: Bob's shop</h3>
  <p>Bob wants to enter the money his shop takes each day, then be told the total for the week. His shop isn't open the same number of days every week, so the program asks him first, and stores his answer in a variable. That variable is then used as the upper value of the FOR loop. If Bob types 5, the loop runs 5 times.</p>
  <div class="lgwid psrun" data-p="forbob"></div>
 </section>
 <section>
  <h2>WHILE loops</h2>
  <p>A WHILE loop is a <b>pre-condition</b> loop: it keeps repeating WHILE a condition is TRUE. The condition is checked at the <b>start</b>, so if it's FALSE straight away, the code inside never runs.</p>
  <pre class="pc" data-t="WHILE loop syntax">WHILE &lt;condition&gt; DO
   &lt;statements&gt;
ENDWHILE</pre>
  <p>WHILE loops are useful when you don't know how many times the code needs to repeat, e.g. a game that runs while the player has lives left, or validating an input. A common mistake is to use an IF statement to check a password: the user gets one second chance, but if their second try is also wrong, the program accepts it anyway! A WHILE loop keeps asking until the password is acceptable:</p>
  <div class="lgwid psrun" data-p="whilepw"></div>
 </section>
 <section>
  <h2>REPEAT … UNTIL loops</h2>
