<template id="th-5-1-web">
<div class="theory airy">
 <section>
  <h2>What is the internet?</h2>
  <p class="lede">When asked this question, many people struggle, because they realise they can&#39;t describe something they use every single day!</p>
  <div class="swsplit">
   <div class="swcol sys"><span class="eyebrow">The internet</span><p>The world&#39;s largest network: a global network of <b>interconnected networks</b>.</p><small>It&#39;s the <b>infrastructure</b>: the physical cables, routers, servers and connections that carry data around the world.</small></div>
   <div class="swcol app"><span class="eyebrow">The world wide web (WWW)</span><p>The collection of <b>websites and web pages</b> that are accessed <b>using</b> the internet.</p><small>It&#39;s one of many services that run on the internet. Email, online gaming and video calls use the internet too, but they aren&#39;t the web.</small></div>
  </div>
  <div class="callout warnbox"><span class="k">Be careful</span><p>The internet and the world wide web are often confused, but they aren&#39;t the same thing. Think of the internet as the <b>roads</b>, and the web as one kind of <b>traffic</b> that travels along them.</p></div>
  <h3>Internet service providers (ISPs)</h3>
  <p>An <b>internet service provider (ISP)</b> is the company that gives you <b>access to the internet</b>, usually for a monthly fee. Your router connects your home network to your ISP, and the ISP connects you to the rest of the internet.</p>
 </section>
 <section>
  <h2>Web browsers</h2>
  <p>Web pages are viewed using software called a <b>web browser</b>. Its main purpose is to <b>render HTML</b> (hypertext markup language: the code that web pages are written in) and <b>display web pages</b>.</p>
  <div class="callout tip"><span class="k">Exam tip</span><p>Don&#39;t use brand names such as Chrome, Safari or Edge in your answers. Say &quot;a web browser&quot;.</p></div>
  <p>As well as displaying web pages, a browser has many other functions. Click each part of the browser to find out more:</p>
  <div class="brdemo" id="brdemo"></div>
  <p>Other functions of a web browser that exam mark schemes accept:</p>
  <ul class="obj">
   <li>Sending the URL to the <b>DNS</b>, then sending a <b>request to the web server</b>.</li>
   <li>Managing protocols such as HTTP and HTTPS, and checking <b>digital certificates</b>.</li>
   <li>Running <b>client-side scripts</b>, e.g. JavaScript that runs in the browser to make a page interactive.</li>
   <li>Allowing files to be <b>downloaded</b>.</li>
  </ul>
 </section>
 <section>
  <h2>URLs: uniform resource locators</h2>
  <p>A <b>URL</b> is the <b>text-based address</b> of a web page: the web address you type into your browser&#39;s address bar. A URL is made of three main parts:</p>
  <div class="urlbig" aria-label="https:// is the protocol, www.bitsofbytes.co is the domain name, home.html is the file name"><span class="u1">https://</span><span class="u2">www.bitsofbytes.co</span><span class="u0">/</span><span class="u3">home.html</span></div>
  <div class="urlleg"><div class="u1"><b>Protocol</b><span>The set of rules used to transfer the page, e.g. <b>HTTP</b> or <b>HTTPS</b>.</span></div><div class="u2"><b>Domain name</b><span>The name of the web server that holds the website. It&#39;s converted into an IP address so the server can be found.</span></div><div class="u3"><b>Web page / file name</b><span>The file you want from the web server, usually a web page. If there&#39;s no file name, the home page is sent.</span></div></div>
  <h3>Try it: take a URL apart</h3>
  <div class="urldemo" id="urldemo"></div>
 </section>
 <section>
  <h2>HTTP and HTTPS</h2>
  <p>A <b>protocol</b> is a set of rules for how data is sent. Browsers and web servers use these protocols to transfer web pages:</p>
  <div class="stepline"><b>HTTP</b><span><b>Hypertext transfer protocol.</b> The set of rules a browser and web server follow to request and send web pages. Data is sent as <b>plain text</b>, so anyone who intercepts it can read it. It isn&#39;t safe for passwords or payment details.</span></div>
  <div class="stepline"><b>HTTPS</b><span><b>Hypertext transfer protocol secure.</b> HTTP with <b>encryption</b> added, using SSL/TLS. The data is scrambled before it&#39;s sent, so if it&#39;s intercepted it can&#39;t be understood. The browser shows a <b>padlock</b> in the address bar. Always look for HTTPS before entering personal details.</span></div>
  <p class="vfoot">You&#39;ll learn how SSL works in the cyber security lessons.</p>
 </section>
</div>
</template>
<template id="th-5-1-pages">
<div class="theory airy">
 <section>
  <h2>Where are web pages stored?</h2>
  <p class="lede">Websites are stored on <b>web servers</b>: powerful computers that store web pages and send ("serve") them to any device that requests them. Every web server has an <b>IP address</b>, so it can be found on the internet.</p>
  <p>But people don&#39;t remember IP addresses like <span class="mono">93.184.216.34</span>. We use friendly <b>domain names</b> like <span class="mono">www.bitsofbytes.co</span> instead. Something has to convert one into the other. That&#39;s the job of the DNS.</p>
 </section>
 <section>
  <h2>The domain name server (DNS)</h2>
  <p>A <b>domain name server (DNS)</b> can be thought of as the <b>phone book of the internet</b>. It stores a huge list of <b>domain names</b> and their matching <b>IP addresses</b>.</p>
  <div class="tscroll"><table class="pvt deftab" style="max-width:520px"><tr><th>Domain name</th><th>IP address</th></tr><tr><td class="mono">www.bitsofbytes.co</td><td class="mono">185.230.63.171</td></tr><tr><td class="mono">www.example.com</td><td class="mono">93.184.216.34</td></tr><tr><td class="mono">www.school.edu</td><td class="mono">203.0.113.25</td></tr></table></div>
  <p>When you type a URL, the browser asks a DNS server for the IP address of the domain. If that DNS server doesn&#39;t have it, it asks other DNS servers until it&#39;s found.</p>
 </section>
 <section>
  <h2>How a web page is found and displayed</h2>
  <p>Here&#39;s what happens when a user types a URL into their browser. You need to know the role of the <b>web browser</b>, <b>IP addresses</b>, the <b>DNS</b>, the <b>web server</b> and <b>HTML</b>:</p>
  <div class="stepline"><b>Step 1</b><span>The user types a URL into the web browser&#39;s address bar.</span></div>
  <div class="stepline"><b>Step 2</b><span>The browser sends the <b>domain name</b> to a <b>DNS</b> server.</span></div>
  <div class="stepline"><b>Step 3</b><span>The DNS looks up the domain name and finds its matching <b>IP address</b>. If it can&#39;t find it, it asks other DNS servers.</span></div>
  <div class="stepline"><b>Step 4</b><span>The DNS sends the IP address back to the browser.</span></div>
  <div class="stepline"><b>Step 5</b><span>The browser uses the IP address to send a request (using HTTP or HTTPS) to the <b>web server</b> for the web page.</span></div>
  <div class="stepline"><b>Step 6</b><span>The web server sends the web page back to the browser as <b>HTML</b> files, along with any images and other files it needs.</span></div>
  <div class="stepline"><b>Step 7</b><span>The browser <b>renders the HTML</b> and displays the web page.</span></div>
  <h3>Try it: watch a page load</h3>
  <div class="dnsdemo" id="dnsdemo"></div>
  <div class="callout tip"><span class="k">Did you know?</span><p>Your computer and router remember (cache) recent DNS lookups, so the next time you visit the same site the IP address is already known and the page loads faster.</p></div>
 </section>
</div>
</template>
<template id="th-5-1-cookies">
<div class="theory airy">
 <section>
  <h2>What are cookies?</h2>
  <p class="lede"><b>Cookies</b> are small text files that a website sends to your web browser when you visit. The browser stores them, and the next time you visit, the website reads them to remember who you are and what you did last time.</p>
  <p>Cookies play an important part in giving us the useful, personalised internet we&#39;re used to. They&#39;re used for:</p>
  <div class="clfeat">
   <div class="clf"><b>👤 Saving personal details</b><span>e.g. your name and address, so forms fill in automatically.</span></div>
   <div class="clf"><b>⚙️ Tracking user preferences</b><span>e.g. your language, or dark mode, so the site looks the way you like it.</span></div>
   <div class="clf"><b>🛒 Holding items in a shopping cart</b><span>so items stay in your basket while you browse other pages.</span></div>
   <div class="clf"><b>🔑 Storing login details</b><span>so you stay logged in and don&#39;t have to sign in every time.</span></div>
   <div class="clf"><b>📈 Tracking browsing habits</b><span>which websites use to show targeted adverts.</span></div>
   <div class="clf"><b>🎮 Saving progress</b><span>e.g. how far you&#39;ve got in an online game or quiz.</span></div>
  </div>
 </section>
 <section>
  <h2>Session and persistent cookies</h2>
  <div class="kpgrid2">
   <div class="keypts ssd"><h3>Session cookies</h3><ul><li>Only last for one <b>browsing session</b>.</li><li>Stored <b>temporarily in memory</b> (RAM), not on secondary storage.</li><li>Have <b>no expiry date</b>.</li><li><b>Deleted when the browser is closed.</b></li><li>e.g. remembering what&#39;s in your shopping cart as you move between pages.</li></ul></div>
   <div class="keypts kcmp"><h3>Persistent cookies</h3><ul><li>Stay on the device after the browser is closed, or the computer is turned off.</li><li>Stored on <b>secondary storage</b> (e.g. the hard drive or SSD).</li><li>Have an <b>expiry date</b> set by the website. They&#39;re deleted when it&#39;s reached, or when the user deletes them.</li><li>e.g. keeping you logged in, remembering your preferences.</li></ul></div>
  </div>
  <h3>Try it: an online shop</h3>
  <p>Log in, change a preference and add items to your basket. Watch the cookies being stored. Then close the browser and open it again: which cookies are left?</p>
  <div class="ckdemo" id="ckdemo"></div>
 </section>
 <section>
  <h2>Are cookies safe?</h2>
  <p>Cookies are just text files. They can&#39;t run programs or carry viruses. But they do raise some concerns:</p>
  <ul class="obj"><li><b>Privacy:</b> third-party tracking cookies can follow you across many websites to build a profile of your interests for advertising.</li><li><b>Security:</b> if spyware reads a cookie that stores login data, a hacker could use it to access your account. This is why sensitive cookies should be encrypted.</li><li>Many websites have to ask for your <b>consent</b> before storing non-essential cookies, and you can view and delete cookies in your browser settings.</li></ul>
 </section>
</div>
</template>
<template id="th-5-2-crypto">
<div class="theory airy">
 <section>
  <h2>What is digital currency?</h2>
  <p class="lede"><b>Digital currency</b> is money that <b>only exists electronically</b>. There are no physical notes or coins. It's just data, stored on computers and sent between them.</p>
  <p>You probably use digital money already. When you pay with a contactless card or phone, buy something online, or send money with a banking app, no cash changes hands. The money moves as <b>data</b> from one account to another.</p>
  <p>Some digital currencies, called <b>cryptocurrencies</b>, go one step further: they don't belong to any bank or government. They use <b>cryptography</b> (encryption) to keep transactions secure, and a technology called <b>blockchain</b> to keep track of who owns what.</p>
  <h3>How is digital currency used?</h3>
  <div class="clfeat">
   <div class="clf"><b>💳 Paying in shops</b><span>tapping a card or phone instead of handing over cash.</span></div>
   <div class="clf"><b>🛒 Shopping online</b><span>paying for goods and services over the internet.</span></div>
   <div class="clf"><b>📱 Sending money to people</b><span>e.g. paying a friend back using an app.</span></div>
   <div class="clf"><b>🌍 International payments</b><span>sending money to another country quickly.</span></div>
   <div class="clf"><b>📈 Investing</b><span>some people buy cryptocurrency hoping its value will rise.</span></div>
  </div>
 </section>
 <section>
  <h2>Centralised or decentralised?</h2>
  <div class="swsplit">
   <div class="swcol sys"><span class="eyebrow">Traditional currency: centralised</span><p>Controlled by a <b>central bank</b> or government. Banks keep the records (the <b>ledger</b>) of every transaction.</p><small>Banks can charge fees, and payments abroad can be slow. Governments can print more money, which can cause inflation (or <b>hyperinflation</b> in extreme cases), and physical cash can be <b>counterfeited</b>.</small></div>
   <div class="swcol app"><span class="eyebrow">Cryptocurrency: decentralised</span><p><b>No central authority</b>. The ledger is copied and shared across thousands of computers around the world.</p><small>Payments go directly between users (<b>peer to peer</b>), with no bank in the middle. Coins can't be counterfeited, because the history of every coin is recorded in the blockchain.</small></div>
  </div>
  <h3>Digital wallets and keys</h3>
  <p>To use cryptocurrency, you need a <b>digital wallet</b>: software that stores your <b>keys</b>.</p>
  <div class="stepline"><b>Public key</b><span>Like an account number. You can share it, so people can send you money.</span></div>
  <div class="stepline"><b>Private key</b><span>Like a PIN or a signature. It's used to <b>authorise</b> payments from your wallet, so it must never be shared.</span></div>
  <div class="callout warnbox"><span class="k">Be careful</span><p>If you lose your private key, you lose your money. There's no bank to phone to get it back!</p></div>
 </section>
 <section>
  <h2>What is blockchain?</h2>
  <p class="lede">A <b>blockchain</b> is a <b>digital ledger</b>: a <b>time-stamped</b> series of records that <b>cannot be altered</b>. Every transaction ever made with the currency is stored in it.</p>
  <p>Transactions are grouped together into <b>blocks</b>. Each block stores:</p>
  <div class="clfeat">
   <div class="clf"><b>📄 Transaction data</b><span>who paid who, and how much.</span></div>
   <div class="clf"><b>🕘 A timestamp</b><span>the exact date and time the block was made.</span></div>
   <div class="clf"><b>🔢 Its own hash</b><span>a unique value calculated from everything in the block, like a digital fingerprint. Change anything in the block, and the hash changes completely.</span></div>
   <div class="clf"><b>🔗 The previous block's hash</b><span>this is what links the blocks together into a chain.</span></div>
  </div>
  <figure class="srfig"><figcaption><b>The chain</b><span>Each block stores the hash of the block before it.</span></figcaption><svg viewBox="0 0 700 230" role="img" aria-label="Three blocks in a chain. Each block stores data, a timestamp, its own hash and the hash of the previous block. Arrows link each hash to the previous hash stored in the next block."><defs><marker id="bca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--accent)"/></marker></defs><rect x="10" y="10" width="210" height="205" rx="12" class="dnsb"/><text x="115" y="36" text-anchor="middle" class="dnst">Block 1</text><rect x="20" y="50" width="190" height="34" rx="6" fill="var(--bg)"/><text x="28" y="64" class="dnss">Data</text><text x="28" y="78" font-size="12.5" font-weight="700" font-family="var(--mono)" fill="var(--ink)">Ana → Ben: 5</text><rect x="20" y="90" width="190" height="34" rx="6" fill="var(--bg)"/><text x="28" y="104" class="dnss">Timestamp</text><text x="28" y="118" font-size="12.5" font-weight="700" font-family="var(--mono)" fill="var(--ink)">09:12:41</text><rect x="20" y="130" width="190" height="34" rx="6" fill="var(--accent-soft)"/><text x="28" y="144" class="dnss">Previous hash</text><text x="28" y="158" font-size="12.5" font-weight="700" font-family="var(--mono)" fill="var(--ink)">00000000</text><rect x="20" y="170" width="190" height="34" rx="6" fill="var(--accent-soft)"/><text x="28" y="184" class="dnss">Hash</text><text x="28" y="198" font-size="12.5" font-weight="700" font-family="var(--mono)" fill="var(--ink)">8f3a91c2</text><path d="M210 187 C 232 187, 232 147, 255 147" fill="none" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#bca)"/><rect x="245" y="10" width="210" height="205" rx="12" class="dnsb"/><text x="350" y="36" text-anchor="middle" class="dnst">Block 2</text><rect x="255" y="50" width="190" height="34" rx="6" fill="var(--bg)"/><text x="263" y="64" class="dnss">Data</text><text x="263" y="78" font-size="12.5" font-weight="700" font-family="var(--mono)" fill="var(--ink)">Ben → Cal: 2</text><rect x="255" y="90" width="190" height="34" rx="6" fill="var(--bg)"/><text x="263" y="104" class="dnss">Timestamp</text><text x="263" y="118" font-size="12.5" font-weight="700" font-family="var(--mono)" fill="var(--ink)">09:30:05</text><rect x="255" y="130" width="190" height="34" rx="6" fill="var(--accent-soft)"/><text x="263" y="144" class="dnss">Previous hash</text><text x="263" y="158" font-size="12.5" font-weight="700" font-family="var(--mono)" fill="var(--ink)">8f3a91c2</text><rect x="255" y="170" width="190" height="34" rx="6" fill="var(--accent-soft)"/><text x="263" y="184" class="dnss">Hash</text><text x="263" y="198" font-size="12.5" font-weight="700" font-family="var(--mono)" fill="var(--ink)">c41b07de</text><path d="M445 187 C 467 187, 467 147, 490 147" fill="none" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#bca)"/><rect x="480" y="10" width="210" height="205" rx="12" class="dnsb"/><text x="585" y="36" text-anchor="middle" class="dnst">Block 3</text><rect x="490" y="50" width="190" height="34" rx="6" fill="var(--bg)"/><text x="498" y="64" class="dnss">Data</text><text x="498" y="78" font-size="12.5" font-weight="700" font-family="var(--mono)" fill="var(--ink)">Cal → Dev: 1</text><rect x="490" y="90" width="190" height="34" rx="6" fill="var(--bg)"/><text x="498" y="104" class="dnss">Timestamp</text><text x="498" y="118" font-size="12.5" font-weight="700" font-family="var(--mono)" fill="var(--ink)">10:02:17</text><rect x="490" y="130" width="190" height="34" rx="6" fill="var(--accent-soft)"/><text x="498" y="144" class="dnss">Previous hash</text><text x="498" y="158" font-size="12.5" font-weight="700" font-family="var(--mono)" fill="var(--ink)">c41b07de</text><rect x="490" y="170" width="190" height="34" rx="6" fill="var(--accent-soft)"/><text x="498" y="184" class="dnss">Hash</text><text x="498" y="198" font-size="12.5" font-weight="700" font-family="var(--mono)" fill="var(--ink)">5e92ab10</text></svg></figure>
  <h3>Why can't it be altered?</h3>
  <p>If someone changes the data in a block, that block's <b>hash changes</b>. But the next block still stores the <b>old</b> hash as its "previous hash", so the link is broken and the change is spotted straight away.</p>
  <p>To get away with it, a hacker would have to recalculate the hash of every block after it, and do this on most of the computers in the network at the same time. That's practically impossible.</p>
  <h3>A distributed ledger</h3>
  <p>A copy of the blockchain is stored on <b>every computer</b> (called a <b>node</b>) in the network. When a new transaction is made, the computers check (<b>verify</b>) it. The block is only added if the majority agree it's valid, and then every copy is updated. Because there are thousands of copies, one altered copy doesn't match the others, so it's simply rejected.</p>
  <h3>Try it: tamper with the blockchain</h3>
  <p>Change the data in any block and watch what happens to the chain. Then try to cover your tracks by recalculating the hashes. Does the network accept your copy?</p>
  <div class="bcdemo" id="bcdemo"></div>
 </section>
 <section>
  <h2>How a transaction is added</h2>
  <div class="stepline"><b>Step 1</b><span>A user requests a transaction, e.g. Ana sends Ben 5 coins.</span></div>
  <div class="stepline"><b>Step 2</b><span>The transaction is sent to all the computers in the network.</span></div>
  <div class="stepline"><b>Step 3</b><span>The computers <b>verify</b> the transaction, e.g. they check Ana has enough coins and authorised it with her private key.</span></div>
  <div class="stepline"><b>Step 4</b><span>The transaction is grouped with others into a new <b>block</b>.</span></div>
  <div class="stepline"><b>Step 5</b><span>The block is given a <b>timestamp</b>, its own <b>hash</b> and the <b>hash of the previous block</b>.</span></div>
  <div class="stepline"><b>Step 6</b><span>The block is added to the end of the chain and every copy of the ledger is updated. The transaction is complete and can't be changed.</span></div>
  <div class="callout tip"><span class="k">Exam tip</span><p>Learn the definition: blockchain is <b>a digital ledger of time-stamped records that cannot be altered</b>. Then explain <b>why</b>: each block contains the previous block's hash, and copies are held on many computers.</p></div>
 </section>
 <section>
  <h2>Benefits and drawbacks</h2>
  <div class="kpgrid2">
   <div class="keypts ssd"><h3>Benefits</h3><ul><li><b>Secure:</b> records can't be altered once they're in the chain.</li><li><b>Transparent:</b> every transaction is recorded and can be traced.</li><li><b>No central bank</b>, so fees are usually lower.</li><li><b>Fast</b> payments to anywhere in the world.</li><li>Can't be <b>counterfeited</b>.</li></ul></div>
   <div class="keypts kcmp"><h3>Drawbacks</h3><ul><li>Its value can rise and fall very quickly (it's <b>volatile</b>).</li><li>Lose your private key and you lose your money.</li><li>Users can stay anonymous, which attracts criminals, e.g. ransomware demands.</li><li>Not accepted by every shop.</li><li>Verifying blocks ("mining") uses huge amounts of <b>electricity</b>.</li></ul></div>
  </div>
  <div class="callout tip"><span class="k">Did you know?</span><p>Blockchain isn't only used for money. It can also be used to track medical records, the journey of products through a supply chain, and who owns digital artwork.</p></div>
 </section>
</div>

<template id="th-5-3-threats">
<div class="theory airy">
 <section>
  <h2>What is cyber security?</h2>
  <p class="lede"><b>Cyber security</b> is about protecting computers, networks and data from <b>attack</b>, <b>damage</b> and <b>unauthorised access</b>.</p>
  <p>There are lots of threats out there. For each one, you need to know <b>what it is</b>, how it works and what the attacker is trying to achieve: its <b>aim</b>.</p>
  <div class="callout tip"><span class="k">Exam tip</span><p>Always describe the threat <b>and</b> its aim. "Phishing is dangerous" won't get marks. "Phishing is a fake email designed to trick the user into giving away personal details" will.</p></div>
 </section>
 <section>
  <h2>Attacks on passwords and data</h2>
  <div class="thcard"><h3>Brute-force attack</h3><p>A <b>trial and error</b> method of cracking a password. A program tries every possible combination of characters, one after another, until it finds the right one. Attackers often start with a list of the most common passwords (like 123456 or password) to save time.</p><span class="aim"><b>Aim:</b> to find a password and gain access to an account or system.</span></div>
  <h3>Try it: how long would a brute-force attack take?</h3>
  <p>Every extra character, and every extra type of character, multiplies the number of combinations the attacker has to try.</p>
  <div class="bfdemo" id="bfdemo"></div>
  <div class="thcard"><h3>Data interception</h3><p>Data is <b>stolen while it's being transmitted</b>, by tapping into a network. A common method is <b>packet sniffing</b>: software that examines the packets travelling across a network. Unsecured public Wi-Fi is an easy target. The data still arrives, so the victim often has no idea it happened.</p><span class="aim"><b>Aim:</b> to steal data, such as passwords and bank details, as it travels.</span></div>
  <div class="callout tip"><span class="k">Remember</span><p>Encryption doesn't stop data being intercepted, but it means the intercepted data can't be understood.</p></div>
  <div class="thcard"><h3>Hacking</h3><p>Gaining <b>unauthorised access</b> to a computer system, usually by exploiting a weakness in its security. Once inside, a hacker can view, steal, change or delete data. Malicious hacking is illegal. (<b>Ethical hackers</b> are paid by companies to find weaknesses before criminals do.)</p><span class="aim"><b>Aim:</b> to steal, change or delete data, or cause disruption. Stolen personal data may be used for identity theft.</span></div>
 </section>
 <section>
  <h2>Distributed denial of service (DDoS) attacks</h2>
  <p>A <b>denial of service</b> (DoS) attack floods a web server with so many requests that it can't cope. The server slows down or crashes, and <b>genuine users can't access</b> the website.</p>
  <p>In a <b>distributed</b> denial of service (DDoS) attack, the requests come from <b>many computers at once</b>. The attacker infects lots of computers with malware, turning them into a <b>botnet</b> (a network of "zombie" computers) that they control. The owners usually have no idea their computer is taking part.</p>
  <figure class="srfig"><figcaption><b>DDoS</b><span>Thousands of bots flood the web server with requests.</span></figcaption><svg viewBox="0 0 680 280" role="img" aria-label="An attacker controls a botnet of infected computers. They all send requests to a web server at once, so it is overloaded and a genuine user cannot connect."><defs><marker id="dda" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C2412D"/></marker><marker id="ddg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs><line x1="130" y1="140" x2="262" y2="44" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="338" y1="44" x2="500" y2="110" stroke="#C2412D" stroke-width="2.5" marker-end="url(#dda)"/><line x1="130" y1="140" x2="262" y2="92" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="338" y1="92" x2="500" y2="110" stroke="#C2412D" stroke-width="2.5" marker-end="url(#dda)"/><line x1="130" y1="140" x2="262" y2="140" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="338" y1="140" x2="500" y2="110" stroke="#C2412D" stroke-width="2.5" marker-end="url(#dda)"/><line x1="130" y1="140" x2="262" y2="188" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="338" y1="188" x2="500" y2="110" stroke="#C2412D" stroke-width="2.5" marker-end="url(#dda)"/><line x1="130" y1="140" x2="262" y2="236" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="338" y1="236" x2="500" y2="110" stroke="#C2412D" stroke-width="2.5" marker-end="url(#dda)"/><rect x="10" y="110" width="120" height="60" rx="10" class="dnsb"/><text x="70" y="137" text-anchor="middle" class="dnst">Attacker</text><text x="70" y="155" text-anchor="middle" class="dnss">sends commands</text><rect x="262" y="30" width="76" height="30" rx="6" fill="var(--bg)" stroke="#C2412D" stroke-width="1.5"/><text x="300" y="49" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">🖥 bot</text><rect x="262" y="78" width="76" height="30" rx="6" fill="var(--bg)" stroke="#C2412D" stroke-width="1.5"/><text x="300" y="97" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">🖥 bot</text><rect x="262" y="126" width="76" height="30" rx="6" fill="var(--bg)" stroke="#C2412D" stroke-width="1.5"/><text x="300" y="145" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">🖥 bot</text><rect x="262" y="174" width="76" height="30" rx="6" fill="var(--bg)" stroke="#C2412D" stroke-width="1.5"/><text x="300" y="193" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">🖥 bot</text><rect x="262" y="222" width="76" height="30" rx="6" fill="var(--bg)" stroke="#C2412D" stroke-width="1.5"/><text x="300" y="241" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">🖥 bot</text><text x="300" y="272" text-anchor="middle" class="dnss">botnet of infected "zombie" computers</text><rect x="505" y="70" width="160" height="80" rx="10" fill="#FBE1DC" stroke="#C2412D" stroke-width="3"/><text x="585" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#7A1F12">Web server</text><text x="585" y="120" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7A1F12">overloaded!</text><text x="585" y="138" text-anchor="middle" font-size="11" fill="#7A1F12">millions of requests</text><rect x="505" y="205" width="160" height="56" rx="10" class="dnsb"/><text x="585" y="229" text-anchor="middle" class="dnst">Genuine user</text><text x="585" y="247" text-anchor="middle" class="dnss">can't connect ✗</text><line x1="585" y1="205" x2="585" y2="156" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ddg)"/></svg></figure>
  <div class="thcard"><h3>DDoS attack</h3><p>Signs of an attack include a very slow network, being unable to reach a website, and lots of spam email (mail servers can be targeted too). Because the requests come from so many places, it's hard to block them all.</p><span class="aim"><b>Aim:</b> to stop a website or service from working, causing disruption and lost income. Sometimes the attacker demands money to stop.</span></div>
 </section>
 <section>
  <h2>Malware</h2>
  <p><b>Malware</b> (malicious software) is any software designed to cause harm to a computer or its user. You need to know six types:</p>
  <div class="tscroll"><table class="pvt deftab mwtab"><tr><th>Type</th><th>What it does</th><th>How it spreads</th></tr>
   <tr><td><b>Virus</b></td><td>Copies itself (<b>replicates</b>) and attaches to other files and programs. It can delete or corrupt data, or make the computer crash.</td><td>Needs the user to <b>run or open</b> the infected file, e.g. an email attachment.</td></tr>
   <tr><td><b>Worm</b></td><td>Replicates itself and spreads through a network on its own, using up bandwidth and slowing the network down.</td><td><b>Doesn't need a user</b> to open anything, and doesn't attach to other files. It exploits security holes.</td></tr>
   <tr><td><b>Trojan horse</b></td><td>Disguised as <b>genuine software</b>. Once installed, it carries out a harmful action, e.g. installing spyware or opening a "back door" for a hacker.</td><td>The user is tricked into installing it, e.g. a free game. It doesn't replicate.</td></tr>
   <tr><td><b>Spyware</b></td><td>Secretly <b>monitors</b> what the user does and sends the information to a third party. A <b>keylogger</b> records every key pressed, to capture passwords.</td><td>Often installed by a Trojan horse or bundled with downloads.</td></tr>
   <tr><td><b>Adware</b></td><td>Displays unwanted <b>adverts</b> and pop-ups, and may redirect the browser to advertising websites. It can also track browsing and slow the computer down.</td><td>Usually bundled with free software.</td></tr>
   <tr><td><b>Ransomware</b></td><td><b>Encrypts</b> the user's files, then demands a payment (a ransom), often in cryptocurrency, for the key to decrypt them.</td><td>Through phishing emails and Trojan horses. Paying doesn't guarantee the files come back!</td></tr></table></div>
  <div class="callout warnbox"><span class="k">Virus or worm?</span><p>A <b>virus</b> needs a user to open an infected file to spread. A <b>worm</b> spreads across a network by itself.</p></div>
  <span class="aim"><b>Aim of malware:</b> to damage or delete data, steal data, take control of a computer, or make money for the attacker.</span>
 </section>
 <section>
  <h2>Tricking the user</h2>
  <p>Some of the most successful attacks don't target computers at all. They target <b>people</b>.</p>
  <div class="thcard"><h3>Phishing</h3><p>The attacker sends a <b>fake email</b> (or text message) that looks as if it's from a trusted organisation, such as a bank or a delivery company. It contains a <b>link to a fake website</b>, where the user is asked to enter personal details. Phishing emails are sent to thousands of people at once, hoping a few will fall for it.</p><span class="aim"><b>Aim:</b> to steal personal details such as login details and bank details, for fraud or identity theft.</span></div>
  <h3>Try it: spot the clues</h3>
  <p>This email is a fake. Click on everything that looks suspicious. There are <b>7 clues</b> to find.</p>
  <div class="phdemo" id="phdemo"></div>
  <div class="thcard"><h3>Pharming</h3><p><b>Malicious code</b> is installed on the user's computer or on a <b>DNS server</b>. It <b>redirects</b> the user to a fake website, <b>even when they type the correct URL</b>. The fake site looks identical to the real one, so the user enters their details without realising.</p><span class="aim"><b>Aim:</b> to steal personal details entered into the fake website.</span></div>
  <div class="swsplit">
   <div class="swcol sys"><span class="eyebrow">Phishing</span><p>The user has to <b>click a link</b> in an email or message.</p></div>
   <div class="swcol app"><span class="eyebrow">Pharming</span><p>The user is redirected <b>without clicking anything</b>, even if they type the correct URL.</p></div>
  </div>
  <div class="thcard"><h3>Social engineering</h3><p><b>Manipulating people</b> into breaking normal security procedures, such as giving away a password or letting someone into a building. People are often the weakest link in any system.</p><span class="aim"><b>Aim:</b> to gain access to data or systems, or to get the victim to install malware.</span></div>
  <div class="clfeat">
   <div class="clf"><b>📞 Phone calls</b><span>pretending to be from IT support or the bank and asking for a password.</span></div>
   <div class="clf"><b>💾 Baiting</b><span>leaving infected USB sticks lying around, hoping someone plugs one in.</span></div>
   <div class="clf"><b>👀 Shoulder surfing</b><span>watching over someone's shoulder as they type a PIN or password.</span></div>
   <div class="clf"><b>🎭 Impersonation</b><span>pretending to be a delivery driver or engineer to get into a building.</span></div>
  </div>
 </section>
</div>

<template id="th-5-3-solutions">
<div class="theory airy">
 <section>
  <h2>Keeping data safe</h2>
  <p class="lede">Now that you know the threats, here's how we protect against them. Many solutions protect against more than one threat, and the best protection uses several of them together.</p>
 </section>
 <section>
  <h2>Authentication</h2>
  <p><b>Authentication</b> means checking that a user is <b>who they say they are</b>. It's based on one or more of these:</p>
  <div class="clfeat">
   <div class="clf"><b>🧠 Something you know</b><span>a password, PIN or the answer to a security question.</span></div>
   <div class="clf"><b>👆 Something you are</b><span>a fingerprint, your face or your voice (biometrics).</span></div>
   <div class="clf"><b>📱 Something you have</b><span>your phone, a bank card or a security key.</span></div>
  </div>
  <h3>Usernames and passwords</h3>
  <p>The most common method. The user enters a username and password, which are checked against the stored details. To make a password <b>strong</b>, and hard to brute-force:</p>
  <ul class="obj"><li>Make it <b>long</b>, at least 12 characters.</li><li>Use a <b>mix</b> of uppercase and lowercase letters, numbers and symbols.</li><li>Don't use personal information, such as a pet's name or birthday.</li><li>Use a <b>different</b> password for every account, and change it if it's ever leaked.</li></ul>
  <p>Systems can also <b>lock an account</b> after several wrong attempts, which stops a brute-force attack.</p>
  <h3>Biometrics</h3>
  <p><b>Biometrics</b> use a person's unique physical characteristics, such as their <b>fingerprint</b>, <b>face</b>, <b>retina</b> or <b>voice</b>.</p>
  <div class="kpgrid2">
   <div class="keypts ssd"><h3>Advantages</h3><ul><li>Can't be forgotten, like a password can.</li><li>Very hard to copy or share.</li><li>Quick and easy to use.</li></ul></div>
   <div class="keypts kcmp"><h3>Disadvantages</h3><ul><li>Can fail, e.g. a cut finger, a sore throat or poor lighting.</li><li>The hardware can be expensive.</li><li>If biometric data is stolen, you can't change your fingerprint!</li></ul></div>
  </div>
  <h3>Two-step verification</h3>
  <p><b>Two-step verification</b> (also called <b>two-factor authentication</b>) uses two different methods of authentication, one after the other:</p>
  <div class="stepline"><b>Step 1</b><span>The user enters their username and password.</span></div>
  <div class="stepline"><b>Step 2</b><span>A one-time <b>code</b> is sent to their phone or email, or generated by an authenticator app.</span></div>
  <div class="stepline"><b>Step 3</b><span>The user types in the code (which only works for a short time) and is given access.</span></div>
  <p>Even if a hacker steals the password, they <b>can't log in without the user's phone</b> too.</p>
  <div class="callout tip"><span class="k">Exam tip</span><p>Stopping a <b>brute-force attack</b> is a favourite question. Good answers: strong passwords, <b>limiting the number of login attempts</b>, two-step verification, biometrics, asking for only <b>some characters</b> of the password, or choosing them from <b>drop-down boxes</b> so a program can't simply type guesses in.</p></div>
 </section>
 <section>
  <h2>Anti-malware</h2>
  <p><b>Anti-malware</b> software protects against all types of malware. It includes <b>anti-virus</b> and <b>anti-spyware</b>.</p>
  <ul class="obj"><li>It <b>scans</b> files, downloads and email attachments, and compares them against a <b>database of known malware</b>.</li><li>It also uses <b>heuristic checking</b>: watching for suspicious behaviour, to catch new malware that isn't in the database yet.</li><li>Infected files are <b>quarantined</b> (isolated so they can't do harm) or deleted.</li><li><b>Anti-spyware</b> detects and removes spyware, and can block keyloggers.</li><li>It must be <b>kept up to date</b>, so it knows about the newest threats.</li></ul>
  <h3>Automating software updates</h3>
  <p>When developers find a security hole in their software, they release an <b>update</b> (a <b>patch</b>) to fix it. Hackers and worms look for computers that haven't been updated yet. Setting updates to install <b>automatically</b> means they're installed as soon as they're released, without relying on the user to remember.</p>
 </section>
 <section>
  <h2>Firewalls</h2>
  <p>A <b>firewall</b> sits between a computer (or network) and the internet. It <b>monitors all incoming and outgoing traffic</b>, checks it against a set of <b>rules</b>, and <b>blocks</b> anything that doesn't meet them. A firewall can be <b>hardware</b> (e.g. built into a router) or <b>software</b> (e.g. part of the operating system).</p>
  <ul class="obj"><li>Blocks traffic from IP addresses on a <b>blacklist</b>, or only allows traffic from a <b>whitelist</b>.</li><li>Blocks certain types of traffic, or access to certain websites.</li><li>Keeps a <b>log</b> of traffic, and warns the user if software tries to access the internet.</li></ul>
  <div class="callout warnbox"><span class="k">But…</span><p>A firewall can't stop a user who gives away their password, malware brought in on a USB stick, or someone inside the network.</p></div>
  <h3>Try it: you are the firewall</h3>
  <p>Read the rules, then decide whether each packet should be allowed or blocked.</p>
  <div class="fwdemo" id="fwdemo"></div>
 </section>
 <section>
  <h2>Proxy servers</h2>
  <p>A <b>proxy server</b> sits <b>between the user's computer and the internet</b>. Requests go to the proxy, which forwards them to the web server, then passes the response back.</p>
  <figure class="srfig"><figcaption><b>Proxy server</b><span>The web server only sees the proxy's IP address.</span></figcaption><svg viewBox="0 0 680 190" role="img" aria-label="The user's computer sends a request to the proxy server, which forwards it to the web server. The web server only sees the proxy's IP address."><defs><marker id="pxa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--accent)"/></marker></defs><rect x="10" y="55" width="150" height="74" rx="10" class="dnsb"/><text x="85" y="86" text-anchor="middle" class="dnst">Your computer</text><text x="85" y="106" text-anchor="middle" class="dnss">192.168.1.20</text><rect x="265" y="45" width="150" height="94" rx="10" class="dnsb on"/><text x="340" y="78" text-anchor="middle" class="dnst">Proxy server</text><text x="340" y="98" text-anchor="middle" class="dnss">81.2.69.160</text><text x="340" y="120" text-anchor="middle" font-size="11" fill="var(--muted)">filters · caches · hides IP</text><rect x="520" y="55" width="150" height="74" rx="10" class="dnsb"/><text x="595" y="86" text-anchor="middle" class="dnst">Web server</text><text x="595" y="106" text-anchor="middle" class="dnss">the internet</text><line x1="162" y1="80" x2="262" y2="80" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#pxa)"/><line x1="262" y1="106" x2="162" y2="106" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#pxa)"/><line x1="417" y1="80" x2="517" y2="80" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#pxa)"/><line x1="517" y1="106" x2="417" y2="106" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#pxa)"/><text x="212" y="160" text-anchor="middle" font-size="11.5" fill="var(--ink)">request from 192.168.1.20</text><text x="467" y="160" text-anchor="middle" font-size="11.5" fill="var(--ink)">request from 81.2.69.160</text><text x="467" y="178" text-anchor="middle" font-size="11" font-weight="700" fill="var(--accent)">your IP address is hidden</text></svg></figure>
  <ul class="obj"><li><b>Hides the user's IP address</b>, so the user stays anonymous.</li><li>Can <b>filter</b> traffic and block websites, e.g. on a school network.</li><li>Can act as a <b>firewall</b>, checking the data passing through.</li><li>Can <b>cache</b> (store copies of) popular web pages, so they load faster.</li><li>Takes the hit in an attack: in a DDoS attack, the proxy is overwhelmed rather than the web server.</li></ul>
 </section>
 <section>
  <h2>SSL: secure socket layer</h2>
  <p><b>SSL</b> is a <b>protocol</b> that <b>encrypts</b> the data sent between a web browser and a web server. If the data is intercepted, it can't be understood. Websites using SSL show <b>https</b> and a <b>padlock</b> in the address bar.</p>
  <p>It uses an <b>SSL certificate</b>: a digital certificate issued by a trusted authority, which proves the website is genuine.</p>
  <div class="stepline"><b>Step 1</b><span>The browser asks the web server for a secure connection.</span></div>
  <div class="stepline"><b>Step 2</b><span>The web server sends a copy of its <b>SSL certificate</b>.</span></div>
  <div class="stepline"><b>Step 3</b><span>The browser checks the certificate is <b>valid</b> and comes from a trusted authority.</span></div>
  <div class="stepline"><b>Step 4</b><span>If it's valid, the browser and server agree on the keys to use for encryption.</span></div>
  <div class="stepline"><b>Step 5</b><span>All data is now <b>encrypted</b> before it's sent. The padlock is displayed.</span></div>
  <p class="vfoot">SSL has been replaced by a newer version called TLS, but it works in the same way, and the syllabus still calls it SSL.</p>
 </section>
 <section>
  <h2>Access levels and privacy settings</h2>
  <p><b>Access levels</b> give different users different permissions, so they can only see or change the data they need. For example, on a school network:</p>
  <div class="tscroll"><table class="pvt deftab" style="max-width:600px"><tr><th>User</th><th>Access to grades</th></tr><tr><td>Student</td><td><b>Read only</b>, and only their own</td></tr><tr><td>Teacher</td><td><b>Read and write</b> for their own classes</td></tr><tr><td>Network manager</td><td><b>Full access</b>, including setting other users' access levels</td></tr></table></div>
  <p>This limits the damage if an account is hacked, and stops people changing data by accident.</p>
  <p><b>Privacy settings</b> control who can see your information online, e.g. on social media. You can limit your posts and photos to friends only, turn off location sharing, and choose who can contact you. The less personal information that's public, the harder it is for someone to use social engineering or steal your identity.</p>
 </section>
 <section>
  <h2>Be a human firewall</h2>
  <p>The last line of defence is <b>you</b>. These two habits protect against phishing and pharming:</p>
  <div class="stepline"><b>Check the spelling and tone</b><span>Genuine organisations check their messages carefully. Poor spelling and grammar, a generic greeting ("Dear customer") and an urgent or threatening tone ("act now or your account will be closed!") are all warning signs.</span></div>
  <div class="stepline"><b>Check the URL</b><span>Before clicking a link, hover over it (or press and hold on a phone) to see where it really goes. Check the domain name is spelt correctly (e.g. examp1e.com is not example.com) and look for https. If in doubt, type the address yourself.</span></div>
 </section>
 <section>
  <h2>Summary: which solution stops which threat?</h2>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Threat</th><th>Solutions</th></tr>
   <tr><td>Brute-force attack</td><td>Strong passwords, locking accounts after failed attempts, two-step verification</td></tr>
   <tr><td>Data interception</td><td>SSL (encryption), avoiding unsecured public Wi-Fi</td></tr>
   <tr><td>DDoS attack</td><td>Firewall, proxy server</td></tr>
   <tr><td>Hacking</td><td>Firewall, strong authentication, access levels, software updates</td></tr>
   <tr><td>Malware</td><td>Anti-malware, automatic software updates, firewall</td></tr>
   <tr><td>Phishing</td><td>Checking spelling, tone and URLs, two-step verification</td></tr>
   <tr><td>Pharming</td><td>Anti-malware, checking the URL and padlock</td></tr>
   <tr><td>Social engineering</td><td>Training staff, privacy settings, access levels</td></tr></table></div>
 </section>
</div>

<template id="th-4-1-os">
<div class="theory airy">
 <section>
  <h2>What is an operating system?</h2>
  <p class="lede">An <b>operating system</b> (OS) is <b>system software</b> that <b>manages all the hardware</b> connected to a computer, and provides the user with an <b>interface</b> to control it.</p>
  <p>Every computer has one: desktop computers, laptops, phones, tablets, games consoles, even smart TVs. Examples include Windows, macOS, Linux, Android and iOS.</p>
  <p>Without an operating system, every program would need to know exactly how to control every piece of hardware. Instead, programs ask the OS to do it for them. The OS has lots of jobs to do. You need to know all of them:</p>
  <div class="clfeat">
   <div class="clf"><b>🖱️ Providing an interface</b><span>so the user can control the computer.</span></div>
   <div class="clf"><b>🧠 Managing memory</b><span>deciding where programs and data go in RAM.</span></div>
   <div class="clf"><b>🔀 Managing multitasking</b><span>sharing the CPU's time between programs.</span></div>
   <div class="clf"><b>🖨️ Managing peripherals and drivers</b><span>making sure connected devices work.</span></div>
   <div class="clf"><b>📁 Managing files</b><span>saving, opening, organising and deleting files.</span></div>
   <div class="clf"><b>⚡ Handling interrupts</b><span>responding to signals that need attention.</span></div>
   <div class="clf"><b>🧩 A platform for applications</b><span>loading and running programs.</span></div>
   <div class="clf"><b>🔒 Providing system security</b><span>keeping data and the system safe.</span></div>
   <div class="clf"><b>👥 Managing user accounts</b><span>separate logins, files and settings for each user.</span></div>
  </div>
  <div class="callout tip"><span class="k">Remember</span><p>This lesson covers the user interface. The next lesson covers the rest of the OS's jobs, and interrupts have a lesson of their own.</p></div>
 </section>
 <section>
  <h2>The user interface</h2>
  <p>One of the operating system's jobs is to provide a <b>user interface</b>: what the user uses to <b>control the computer</b>. Without a user interface, people would have no way of telling a computer what to do.</p>
  <p>There are many different types of user interface, each best suited to different users and systems. The ones you need to know are the <b>GUI</b>, <b>CLI</b>, <b>menu-driven</b> and <b>voice</b> interfaces.</p>
 </section>
 <section>
  <h2>GUI: graphical user interface</h2>
  <p>A GUI is very <b>visual</b>. It's based on <b>WIMP</b>:</p>
  <div class="kpgrid2">
   <div class="keypts ssd"><h3>W · I · M · P</h3><ul><li><b>Windows:</b> each open program runs in its own window, which can be moved and resized.</li><li><b>Icons:</b> small pictures that represent files, folders and programs.</li><li><b>Menus:</b> lists of options, e.g. the File menu or a right-click menu.</li><li><b>Pointers:</b> the arrow controlled by a mouse or touchpad. On a touch screen, your finger is the pointer.</li></ul></div>
   <div class="keypts kcmp"><h3>Good and bad points</h3><ul><li>✅ <b>Intuitive</b> and easy to learn: ideal for beginners.</li><li>✅ No commands to remember: you can see the options.</li><li>❌ Uses lots of <b>RAM</b>, <b>processing power</b> and <b>storage</b> for all the graphics.</li><li>❌ Can be slower for experts, who have to click through menus.</li></ul></div>
  </div>
  <div class="callout tip"><span class="k">Design tip</span><p>A good GUI should be so easy to use that nobody needs to explain it. "A GUI is like a joke… if you have to explain it, it's not good."</p></div>
 </section>
 <section>
  <h2>CLI: command line interface</h2>
  <p>A CLI is all <b>text</b>. There are no windows, icons, menus or pointers: the user is given a place to <b>type commands</b> and read the text that comes back. Certain commands are typed in to get the OS to perform certain tasks, e.g. <span class="mono">dir</span> to list the files in a folder.</p>
  <div class="kpgrid2">
   <div class="keypts ssd"><h3>Advantages</h3><ul><li>Much <b>faster</b> for experts who know the commands: you tell the computer exactly what to do, instead of searching through menus.</li><li>Uses much less <b>RAM</b>, processing power and storage.</li><li>Gives more <b>control</b>: some settings can only be changed from the command line.</li></ul></div>
   <div class="keypts kcmp"><h3>Disadvantages</h3><ul><li>Learning all the commands takes a long time, so it's best suited to <b>expert users</b>.</li><li>Commands must be typed exactly right, or they won't work.</li><li>Not very user friendly for beginners.</li></ul></div>
  </div>
 </section>
 <section>
  <h2>Menu-driven interface</h2>
  <p>A <b>menu-driven</b> interface gives the user a <b>menu</b> of options to choose from. Choosing one often leads to another, more detailed menu. The user can only do the tasks on the menu, which keeps it <b>simple</b> and <b>prevents errors</b>.</p>
  <p>It's used for systems with a very specific purpose, such as an <b>ATM</b> (cash machine), a ticket machine, a self-service checkout, or the settings menu on a TV.</p>
  <ul class="obj"><li>✅ Very easy to use, even for people who have never used it before.</li><li>✅ The user can't type an invalid command.</li><li>❌ Limited: the user can only choose what's on the menu.</li><li>❌ Can be slow if you have to go through several menus to find an option.</li></ul>
 </section>
 <section>
  <h2>Voice interface</h2>
  <p>A <b>voice</b> (or <b>natural language</b>) interface lets the user control a device by <b>speaking</b> to it, e.g. "set a timer for ten minutes". It's used in smart speakers, phones and cars.</p>
  <ul class="obj"><li>✅ Hands-free, so it's useful when driving or cooking.</li><li>✅ Helpful for users with a visual or physical impairment.</li><li>❌ Can misunderstand accents or struggle with background noise.</li><li>❌ Not private: other people can hear what you say.</li></ul>
 </section>
 <section>
  <h2>Try it: three interfaces, one task</h2>
  <p>Your task is the same in each interface: <b>delete the file old_homework.txt</b>. Try all three. Which was quickest? Which was easiest to work out?</p>
  <div class="uidemo" id="uidemo"></div>
 </section>
</div>

<div class="theory airy">
 <section>
  <h2>Managing memory</h2>
  <p class="lede">When a program is run, it's copied from secondary storage into <b>RAM</b>, so the CPU can access it quickly. It's the job of the operating system to make sure this all runs smoothly.</p>
  <p>To do this, the operating system must:</p>
  <ul class="obj"><li>Decide <b>where in RAM</b> each program and its data will be stored.</li><li>Keep a <b>record</b> of which programs are in RAM, and exactly where.</li><li>Keep track of how much <b>free space</b> there is.</li><li>Make sure programs <b>don't overwrite</b> each other's memory.</li><li><b>Free up</b> the memory when a program is closed.</li></ul>
  <figure class="srfig"><figcaption><b>Memory map</b><span>RAM is shared between the OS, programs and their data.</span></figcaption><svg viewBox="0 0 520 330" role="img" aria-label="A memory map of RAM. The operating system, programs, their data and files are each stored in their own area, with some areas free. The OS keeps a record of where everything is."><rect x="20" y="10" width="230" height="34" rx="6" fill="#2F6AAE"/><text x="135" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Operating system</text><text x="262" y="32" font-size="11" font-family="var(--mono)" fill="var(--muted)">   0–511 MB</text><rect x="20" y="48" width="230" height="34" rx="6" fill="#3E8E5A"/><text x="135" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Program A</text><text x="262" y="70" font-size="11" font-family="var(--mono)" fill="var(--muted)"> 512–1023 MB</text><rect x="20" y="86" width="230" height="34" rx="6" fill="#7DBF8F"/><text x="135" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Program A data</text><text x="262" y="108" font-size="11" font-family="var(--mono)" fill="var(--muted)">1024–1535 MB</text><rect x="20" y="124" width="230" height="34" rx="6" fill="var(--bg)" stroke="var(--line)" stroke-dasharray="5 4" stroke-width="2"/><text x="135" y="146" text-anchor="middle" font-size="13" fill="var(--muted)">free</text><text x="262" y="146" font-size="11" font-family="var(--mono)" fill="var(--muted)">1536–2047 MB</text><rect x="20" y="162" width="230" height="34" rx="6" fill="#C0662B"/><text x="135" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Program B</text><text x="262" y="184" font-size="11" font-family="var(--mono)" fill="var(--muted)">2048–2559 MB</text><rect x="20" y="200" width="230" height="34" rx="6" fill="#E0A060"/><text x="135" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">File C</text><text x="262" y="222" font-size="11" font-family="var(--mono)" fill="var(--muted)">2560–3071 MB</text><rect x="20" y="238" width="230" height="34" rx="6" fill="var(--bg)" stroke="var(--line)" stroke-dasharray="5 4" stroke-width="2"/><text x="135" y="260" text-anchor="middle" font-size="13" fill="var(--muted)">free</text><text x="262" y="260" font-size="11" font-family="var(--mono)" fill="var(--muted)">3072–3583 MB</text><rect x="20" y="276" width="230" height="34" rx="6" fill="#7B4FB8"/><text x="135" y="298" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Program D</text><text x="262" y="298" font-size="11" font-family="var(--mono)" fill="var(--muted)">3584–4095 MB</text><text x="135" y="324" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">RAM (main memory)</text><rect x="370" y="60" width="140" height="150" rx="10" class="dnsb on"/><text x="440" y="86" text-anchor="middle" class="dnst">The OS</text><text x="440" y="108" text-anchor="middle" font-size="11.5" fill="var(--ink)">keeps a record of</text><text x="440" y="124" text-anchor="middle" font-size="11.5" fill="var(--ink)">where everything</text><text x="440" y="140" text-anchor="middle" font-size="11.5" fill="var(--ink)">is stored, and stops</text><text x="440" y="156" text-anchor="middle" font-size="11.5" fill="var(--ink)">programs overwriting</text><text x="440" y="172" text-anchor="middle" font-size="11.5" fill="var(--ink)">each other</text></svg></figure>
  <h3>When RAM is full: virtual memory</h3>
  <p>If RAM fills up, the OS uses part of the secondary storage as <b>virtual memory</b> (sometimes called a swap file). Programs that aren't being used are moved out of RAM onto the disk, and moved back in when they're needed. This lets more programs run, but swapping is much <b>slower</b> than using RAM.</p>
  <h3>Try it: you are the memory manager</h3>
  <p>Open some programs. Watch where the OS puts them in RAM. What happens when RAM is full?</p>
  <div class="memdemo" id="memdemo"></div>
 </section>
 <section>
  <h2>Managing multitasking</h2>
  <p>These days, computers are expected to do lots of things at once without slowing down! You might be playing music, downloading a file, browsing the web and writing an essay, all at the same time.</p>
  <p>But a CPU core can only process <b>one instruction at a time</b>. So the operating system gives each program a short <b>time slice</b> of the CPU, then switches to the next one. It switches so quickly (thousands of times a second) that all the programs <b>appear to run at the same time</b>. The OS also decides which programs are most important (their <b>priority</b>) and gives them more time.</p>
  <p>You can see this in action in your operating system's task manager, which shows every running program, including background ones, with the share of the CPU and the amount of RAM each one is using.</p>
  <h3>Try it: time slicing</h3>
  <div class="mtdemo" id="mtdemo"></div>
 </section>
 <section>
  <h2>Managing peripherals and drivers</h2>
  <p><b>Peripherals</b> are hardware devices that aren't part of the computer's main body: input devices, output devices and storage devices. A computer can have lots connected at once, such as a keyboard, mouse, printer, webcam, microphone and memory stick.</p>
  <p>The operating system manages them, makes sure they all work, and lets them communicate with the CPU and with each other. To do this, it uses <b>device drivers</b>.</p>
  <div class="stepline"><b>Device driver</b><span>A small program that lets the operating system <b>communicate with</b> a specific hardware device. It translates the OS's general instructions into the exact signals that device understands. Every peripheral needs a driver, and it must be installed before the device can be used. Many are installed automatically when a device is plugged in.</span></div>
  <h3>Print buffers</h3>
  <p>What happens if several people send documents to the same printer at the same time? They can't all print at once. The OS stores the documents in a <b>print buffer</b>: an area of memory set aside to hold documents waiting to print, organised into a <b>queue</b>. They're sent to the printer one at a time, in order. This is called <b>spooling</b>, and it means users can carry on working instead of waiting for the printer.</p>

stroke-width="1.5"/><text x="431" y="101" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">Doc 1</text><line x1="478" y1="85" x2="545" y2="85" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#spa)"/><rect x="550" y="50" width="120" height="70" rx="10" class="dnsb"/><text x="610" y="82" text-anchor="middle" class="dnst">🖨 Printer</text><text x="610" y="102" text-anchor="middle" class="dnss">one at a time</text></svg></figure>
 </section>
 <section>
  <h2>Managing files</h2>
  <p>The OS provides a <b>file management system</b>, which lets users and programs:</p>
  <ul class="obj"><li><b>Save</b>, open, copy, move, rename and delete files.</li><li>Organise files into <b>folders</b> (directories), in a hierarchy of folders inside folders.</li><li>Give each file a <b>name</b> and a file <b>extension</b> (e.g. .docx or .png), so the OS knows which program opens it.</li></ul>
  <p>Behind the scenes, the OS keeps track of exactly <b>where</b> on the storage device each file is stored (on a hard drive, which track and sector), and makes sure files don't overwrite each other.</p>
 </section>
 <section>
  <h2>Providing a platform for running applications</h2>
  <p>Applications don't control the hardware directly. When you open an app, the OS <b>loads it into RAM</b>, gives it CPU time, and handles things like saving files, printing and displaying windows <b>for it</b>. This is why software is made for a specific operating system: an app written for one OS won't run on another.</p>
 </section>
 <section>
  <h2>Providing system security</h2>
  <p>The OS keeps the computer and its data safe in a number of ways:</p>
  <ul class="obj"><li><b>Authentication:</b> users must log in with a password, PIN, fingerprint or face recognition.</li><li>Built-in <b>firewall</b> and <b>anti-malware</b>, kept up to date with automatic <b>security updates</b>.</li><li>Stopping ordinary users from installing software or changing important settings without an administrator's permission.</li><li><b>Encrypting</b> files, so they can't be read if the device is stolen.</li></ul>
 </section>
 <section>
  <h2>Managing user accounts</h2>
  <p>Many people can share one computer. The OS lets each user have their own <b>account</b> with a username and password, their own <b>files</b> and their own <b>settings</b>, such as their desktop background.</p>
  <p>It also sets up <b>access rights</b>, so each user can only see the files they're supposed to. Some people can be allowed to see more than others. Here's how a school's access rights might look:</p>
  <div class="tscroll"><table class="pvt deftab" style="max-width:640px"><tr><th>User</th><th>Can see</th></tr><tr><td><b>Admin</b></td><td>All files, and can set up accounts and access rights</td></tr><tr><td><b>Head teacher</b></td><td>All teachers' files and all students' files</td></tr><tr><td><b>Teacher</b></td><td>Their own files and all students' files, but not other teachers' files</td></tr><tr><td><b>Student</b></td><td>Only their own files</td></tr></table></div>
  <div class="callout tip"><span class="k">Exam tip</span><p>If a question asks for functions of an operating system, give the <b>function</b> and then <b>explain</b> it, e.g. "Managing memory: the OS decides where programs are stored in RAM and stops them overwriting each other."</p></div>
 </section>
</div>
</template>
<template id="th-6-1-auto">
<div class="theory airy">
 <section>
  <h2>What is an automated system?</h2>
  <p class="lede">An <b>automated system</b> is a mix of hardware and software that carries out a task <b>without a human</b> needing to control it. Once it's set up, it measures what's happening, makes decisions and acts on them by itself.</p>
  <p>They're everywhere: street lights that switch on when it gets dark, doors that open as you walk up to them, greenhouses that water their own plants, and cars that warn you when a tyre is going flat.</p>
  <p>Every automated system is built from three parts working together:</p>
  <div class="clfeat">
   <div class="clf"><b>📡 Sensors (input)</b><span>measure a physical property, such as temperature, light or pressure, and send readings to the microprocessor.</span></div>
   <div class="clf"><b>🧠 Microprocessor (process)</b><span>compares each reading with stored <b>pre-set values</b> and decides what to do.</span></div>
   <div class="clf"><b>⚙️ Actuators (output)</b><span>receive a signal and carry out a physical action, such as turning a motor, opening a valve or switching on a heater.</span></div>
  </div>
  <p>Some systems also have other output devices, like a siren, a light or a screen that warns a person.</p>
 </section>
 <section>
  <h2>How the parts work together</h2>
  <p>Sensors produce <b>analogue</b> readings, but a microprocessor can only process <b>digital</b> data. So the readings pass through an <b>analogue-to-digital converter (ADC)</b> first. Some actuators need an analogue signal, so the microprocessor's output may pass through a <b>digital-to-analogue converter (DAC)</b> on the way out.</p>
  <figure class="srfig"><figcaption><b>The control loop</b><span>The system keeps going round and round.</span></figcaption><svg viewBox="0 0 700 220" role="img" aria-label="A control loop: the sensor sends readings through an ADC to the microprocessor, which sends signals through a DAC to an actuator. The actuator changes the environment, which the sensor measures again."><defs><marker id="lpa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--accent)"/></marker></defs><rect x="10" y="40" width="120" height="70" rx="10" class="dnsb"/><text x="70" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">Sensor</text><text x="70" y="90" text-anchor="middle" font-size="10.5" fill="var(--muted)">measures a property</text><line x1="132" y1="75" x2="157" y2="75" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#lpa)"/><rect x="150" y="40" width="120" height="70" rx="10" class="dnsb"/><text x="210" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">ADC</text><text x="210" y="90" text-anchor="middle" font-size="10.5" fill="var(--muted)">analogue → digital</text><line x1="272" y1="75" x2="297" y2="75" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#lpa)"/><rect x="290" y="40" width="120" height="70" rx="10" class="dnsb on"/><text x="350" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">Microprocessor</text><text x="350" y="90" text-anchor="middle" font-size="10.5" fill="var(--muted)">compares with set values</text><line x1="412" y1="75" x2="437" y2="75" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#lpa)"/><rect x="430" y="40" width="120" height="70" rx="10" class="dnsb"/><text x="490" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">DAC</text><text x="490" y="90" text-anchor="middle" font-size="10.5" fill="var(--muted)">digital → analogue</text><line x1="552" y1="75" x2="577" y2="75" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#lpa)"/><rect x="570" y="40" width="120" height="70" rx="10" class="dnsb"/><text x="630" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">Actuator</text><text x="630" y="90" text-anchor="middle" font-size="10.5" fill="var(--muted)">carries out an action</text><path d="M630 112 C 630 190, 70 190, 70 114" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#lpa)"/><text x="350" y="178" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--accent)">feedback: the action changes the environment, and the sensor measures it again</text><text x="350" y="24" text-anchor="middle" font-size="12" fill="var(--muted)">pre-set values are stored in the microprocessor, e.g. 18–26 °C</text></svg></figure>
  <h3>Microprocessors and microcontrollers</h3>
  <p>Automated systems are often controlled by a <b>microcontroller</b>: a tiny computer on a single chip, with its own processor, RAM and ROM. They're cheap, small and use very little power, which makes them perfect for embedded systems like these.</p>
 </section>
 <section>
  <h2>Monitoring or control?</h2>
  <div class="swsplit">
   <div class="swcol sys"><span class="eyebrow">Monitoring system</span><p>The computer <b>measures and reports</b> values, and may raise a warning, but it <b>doesn't change</b> what's happening.</p><small>e.g. monitoring a patient's heart rate in hospital, or the pollution level in a river.</small></div>
   <div class="swcol app"><span class="eyebrow">Control system</span><p>The computer's output <b>changes the process</b>, e.g. switching on a heater or opening a valve. This then affects the next reading: this is called <b>feedback</b>.</p><small>e.g. a greenhouse controlling its temperature, or traffic lights controlling traffic.</small></div>
  </div>
 </section>
 <section>
  <h2>Try it: run an automated system</h2>
  <p>Choose a system and set the conditions. Then step through one cycle of the loop, or let it run on its own and watch it react.</p>
  <div class="autodemo" id="autodemo"></div>
 </section>
 <section>
  <h2>Answering exam questions on automated systems</h2>
  <p>These questions come up a lot, and they're easy marks if you follow the same steps every time. Make sure you name the <b>actual sensor</b> and the <b>actual actuator</b> for the scenario in the question:</p>
  <div class="stepline"><b>Step 1</b><span>Name the <b>sensor</b> and what it measures. It takes readings <b>continuously</b> (or at regular intervals).</span></div>
  <div class="stepline"><b>Step 2</b><span>The readings are converted to digital by an <b>ADC</b> and sent to the <b>microprocessor</b>.</span></div>
  <div class="stepline"><b>Step 3</b><span>The microprocessor <b>compares</b> the reading with the <b>pre-set values</b>. If the question gives you the values, use them!</span></div>
  <div class="stepline"><b>Step 4</b><span>If the reading is outside the pre-set values, the microprocessor sends a signal (through a DAC if needed) to an <b>actuator</b>, which carries out an action to change it, e.g. switching on a heater.</span></div>
  <div class="stepline"><b>Step 5</b><span>The process <b>repeats</b> continuously, until the system is switched off.</span></div>
  <div class="callout tip"><span class="k">Exam tip</span><p>Don't just write "the sensor sends data". Write "the <b>temperature sensor</b> continually measures the <b>temperature</b> and sends the readings to the microprocessor". Specific answers get the marks.</p></div>
 </section>
</div>

  <p class="lede">Automated systems are used in almost every area of life. For the exam, you need to be able to describe how they're used and <b>evaluate</b> them in seven areas: <b>industry</b>, <b>transport</b>, <b>agriculture</b>, <b>weather</b>, <b>gaming</b>, <b>lighting</b> and <b>science</b>.</p>

 </section>
 <section>
  <h2>The big picture: advantages and disadvantages</h2>
  <p>Whatever the area, the same advantages and disadvantages come up again and again. In the exam, always <b>apply them to the scenario</b> in the question.</p>
  <div class="kpgrid2">
   <div class="keypts ssd"><h3>Advantages</h3><ul><li>Can run <b>24 hours a day</b> without breaks.</li><li>Often <b>faster</b> and more <b>accurate</b> than people, with consistent results.</li><li><b>Fewer workers</b> needed, which cuts running costs.</li><li>Can work in places that are <b>dangerous</b> or hard for people to reach.</li><li>Reacts to changes <b>instantly</b>, and can use resources (energy, water, fuel) more efficiently.</li></ul></div>
   <div class="keypts kcmp"><h3>Disadvantages</h3><ul><li><b>Expensive</b> to buy, set up and maintain.</li><li>Fewer jobs for people.</li><li>A faulty sensor or a programming error can cause <b>mistakes</b>, and possibly harm.</li><li>Can't cope with <b>unexpected situations</b> it wasn't programmed for.</li><li>Systems connected to a network could be <b>hacked</b>.</li></ul></div>

 <section>
  <h2>What is robotics?</h2>
  <p class="lede"><b>Robotics</b> is the branch of computer science that deals with the <b>design</b>, <b>construction</b> and <b>operation</b> of robots.</p>
  <p>When people hear "robot", they often picture a metal human from a film. In reality, most robots look nothing like people. A robot might be an arm on a factory production line, a vacuum cleaner, a drone or a machine that explores the surface of Mars.</p>
  <p>Robotics brings together lots of areas: mechanical engineering to build the body, electronics for the sensors and motors, and computer science to program it. More and more robots also use <b>artificial intelligence</b> to make their own decisions.</p>
 </section>
 <section>
  <h2>The characteristics of a robot</h2>
  <p>To count as a robot, a machine must have all three of these characteristics:</p>
  <div class="stepline"><b>Mechanical structure</b><span>A physical <b>framework</b> or body, designed for the job it does, e.g. an arm with joints, wheels, legs or propellers.</span></div>
  <div class="stepline"><b>Electrical components</b><span><b>Sensors</b> to gather information about its surroundings, a <b>microprocessor</b> to process it, and <b>actuators</b> (such as motors) to make it move. It also needs a power source.</span></div>
  <div class="stepline"><b>Programmable</b><span>It can be given a <b>set of instructions</b> to follow, and reprogrammed to do a different job. It then carries them out by itself.</span></div>
  <div class="callout warnbox"><span class="k">Robot or not?</span><p>A remote-controlled toy car has a body and electrical parts, but a person controls every move, and it can't be programmed. So it <b>isn't a robot</b>. A chatbot can be programmed, but it has no mechanical structure, so it isn't a robot either.</p></div>
  <p>Robots can be <b>independent</b> (they make decisions and act without a human, like a robot vacuum) or <b>dependent</b> (a human is involved in controlling them, like a surgical robot guided by a surgeon).</p>
 </section>

<template id="th-6-3-ai">
<div class="theory airy">
 <section>
  <h2>What is intelligence?</h2>
  <p class="lede">Before we can talk about <b>artificial</b> intelligence, we need to think about what intelligence actually is. It's not just knowing lots of facts. Intelligence includes the ability to:</p>
  <div class="clfeat">
   <div class="clf"><b>📚 Learn</b><span>gain new knowledge and skills from experience.</span></div>
   <div class="clf"><b>💡 Understand</b><span>make sense of information, not just store it.</span></div>
   <div class="clf"><b>🧭 Cope with new situations</b><span>work out what to do when something hasn't happened before.</span></div>
   <div class="clf"><b>🔁 Apply knowledge</b><span>use what you already know in a different context.</span></div>
   <div class="clf"><b>🧩 Spot patterns</b><span>think in an abstract way and see connections.</span></div>
  </div>
 </section>
 <section>
  <h2>What is artificial intelligence?</h2>
  <p><b>Artificial intelligence (AI)</b> is the branch of computer science dealing with the <b>simulation of intelligent behaviour by computers</b>. An AI system copies one or more of the abilities above.</p>
  <p>You probably use AI every day without thinking about it:</p>
  <div class="clfeat">
   <div class="clf"><b>🗣️ Voice assistants</b><span>understand spoken commands and answer questions.</span></div>
   <div class="clf"><b>💬 Chatbots</b><span>hold a conversation and answer customers' questions.</span></div>
   <div class="clf"><b>🛍️ Recommendations</b><span>suggest videos, music or products based on what you've liked before.</span></div>
   <div class="clf"><b>📷 Image recognition</b><span>recognise faces to unlock a phone, or objects in photos.</span></div>
   <div class="clf"><b>🚗 Self-driving cars</b><span>make decisions about steering and braking.</span></div>
   <div class="clf"><b>🏥 Healthcare</b><span>spot diseases in X-rays and scans, and help discover new medicines.</span></div>
   <div class="clf"><b>📧 Spam filters</b><span>decide which emails are junk.</span></div>
   <div class="clf"><b>🌍 Translation</b><span>translate text and speech between languages.</span></div>
  </div>
  <div class="callout tip"><span class="k">AI or robot?</span><p>They're not the same thing! A chatbot is AI but not a robot (no mechanical structure). A simple factory robot that repeats the same movements is a robot without AI. Some robots, like self-driving cars, use AI to make decisions.</p></div>
 </section>
 <section>
  <h2>The characteristics of AI</h2>
  <p>You need to know three main characteristics of AI:</p>
  <div class="stepline"><b>Data and rules</b><span>AI has a <b>collection of data</b>, and <b>rules for using that data</b>. The rules might be written by people, or (with machine learning) worked out by the system itself.</span></div>
  <div class="stepline"><b>Reasoning</b><span>The ability to <b>reason</b>: to use the rules to work out new information and reach a conclusion that it wasn't directly given.</span></div>
  <div class="stepline"><b>Learning and adapting</b><span>Some AI can <b>learn</b> from new data and experience, and <b>adapt</b> (change) its own rules and processes to get better over time.</span></div>
 </section>
 <section>
  <h2>Rules: how would a computer read emotions?</h2>
  <p>Imagine teaching a computer to tell whether a face is <b>happy</b> or <b>sad</b>. It can't "just tell" like you can. It needs <b>rules</b>, for example:</p>
  <div class="kpgrid2">
   <div class="keypts ssd"><h3>😀 Rules for happy</h3><ul><li>IF the corners of the mouth turn up</li><li>IF teeth are showing</li><li>IF the eyes are wide open</li><li>THEN the face is probably happy</li></ul></div>
   <div class="keypts kcmp"><h3>😢 Rules for sad</h3><ul><li>IF the corners of the mouth turn down</li><li>IF the eyes are partly closed</li><li>IF there are tears</li><li>THEN the face is probably sad</li></ul></div>
  </div>
  <h3>Try it: be the AI</h3>
  <p>Change the face, and watch which rules the AI uses to reach its conclusion. Can you find a face that confuses it?</p>
  <div class="facedemo" id="facedemo"></div>
 </section>
 <section>
  <h2>Reasoning</h2>
  <p>Reasoning means using facts and rules to work out something <b>new</b>. For example:</p>
  <div class="stepline"><b>Rule</b><span>All birds have feathers.</span></div>
  <div class="stepline"><b>Fact</b><span>A robin is a bird.</span></div>
  <div class="stepline"><b>Conclusion</b><span>So a robin has feathers. Nobody told the computer this directly: it <b>reasoned</b> it out.</span></div>
  <p>But reasoning is only as good as the rules and data. If a rule is wrong, the conclusion will be wrong too!</p>
 </section>
 <section>
  <h2>Learning and adapting</h2>
  <p>An AI that can learn gets better the more data it sees. A video app learns what you like from what you watch, skip and replay, and adapts its recommendations. A spam filter learns from every email you mark as junk. You'll see how this works in the machine learning lesson.</p>
 </section>
</div>
