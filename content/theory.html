.0,81.9 L425.6,77.3 L428.2,72.3 L430.8,66.7 L433.4,60.9 L436.0,55.0 L438.6,49.1 L441.2,43.3 L443.8,37.7 L446.4,32.7 L449.0,28.1 L451.6,24.3 L454.2,21.1 L456.8,18.9 L459.4,17.5 L462.0,17.0 L464.6,17.5 L467.2,18.9 L469.8,21.1 L472.4,24.3 L475.0,28.1 L477.6,32.7 L480.2,37.7 L482.8,43.3 L485.4,49.1 L488.0,55.0 L490.6,60.9 L493.2,66.7 L495.8,72.3 L498.4,77.3 L501.0,81.9 L503.6,85.7 L506.2,88.9 L508.8,91.1 L511.4,92.5 L514.0,93.0 L516.6,92.5 L519.2,91.1 L521.8,88.9 L524.4,85.7 L527.0,81.9 L529.6,77.3 L532.2,72.3 L534.8,66.7 L537.4,60.9 L540.0,55.0" fill="none" stroke="var(--accent)" stroke-width="3"/></svg></div>
<div><span class="eyebrow">Digital signal: discrete</span><svg viewBox="0 0 560 110" role="img" aria-label="A square digital wave that jumps between two values"><path d="M20,93 L20.0,17 L72.0,17 L72.0,93 L124.0,93 L124.0,17 L176.0,17 L176.0,93 L228.0,93 L228.0,17 L280.0,17 L280.0,93 L332.0,93 L332.0,17 L384.0,17 L384.0,93 L436.0,93 L436.0,17 L488.0,17 L488.0,93 L540.0,93" fill="none" stroke="var(--info)" stroke-width="3" stroke-linejoin="round"/></svg></div></div>
 </section>
 <section id="d-sample">
  <h2>Sound sampling</h2>
  <p>To store sound, a computer <b>samples</b> the analogue wave: it measures the <b>amplitude</b> (the height) of the wave at regular intervals and stores each measurement as a binary number. This is done by an <b>analogue-to-digital converter (ADC)</b>.</p>
  <p>The digital version is only an approximation of the real sound. Move the sliders to see how the two settings change it:</p>
  <div class="sampler" id="sampler"></div>
  <ul class="obj">
   <li>The <b>sample rate</b> is the number of samples taken each second, measured in hertz (Hz). CD-quality audio uses 44,100 samples a second.</li>
   <li>The <b>sample resolution</b> is the number of bits used to store each sample. With 8 bits there are 2<sup>8</sup> = 256 possible amplitude values. With 16 bits there are 65,536.</li>
  </ul>
 </section>
 <section id="d-effects">
  <h2>The effects of sample rate and resolution</h2>
  <div class="facts3" style="grid-template-columns:repeat(2,minmax(0,1fr))">
   <div><span class="eyebrow">Higher sample rate</span><b style="font-size:1.05rem">More samples each second</b><span>The digital sound is closer to the original analogue sound, but the file is <b>larger</b>.</span></div>
   <div><span class="eyebrow">Higher sample resolution</span><b style="font-size:1.05rem">More bits per sample</b><span>Each amplitude is measured more precisely, so the sound is more accurate, but the file is <b>larger</b>.</span></div>
  </div>
 </section>
 <section id="d-size">
  <h2>Calculating the file size of a sound</h2>
  <p class="sum">file size (bits) = sample rate × sample resolution × length in seconds</p>
  <p>Example: a 10-second sound sampled at 8,000 Hz with a 16-bit resolution:</p>
  <div class="stepline"><b>Step 1</b><span>Multiply: 8,000 × 16 × 10 = <b>1,280,000 bits</b>.</span></div>
  <div class="stepline"><b>Step 2</b><span>Divide by 8 to get bytes: 1,280,000 ÷ 8 = <b>160,000 bytes</b>.</span></div>
  <div class="stepline"><b>Step 3</b><span>Divide by 1024 to get kibibytes: 160,000 ÷ 1024 = <b>156.25 KiB</b>.</span></div>
  <div class="callout"><span class="k">Exam tip</span><p>When asked how sample rate or resolution affects a sound file, always mention <b>both</b> the quality (more accurate) <b>and</b> the file size (larger).</p></div>
 </section>
</div>
</template>
<template id="th-1-3-compression">
<div class="theory airy">
 <section id="z-intro">
  <h2>File compression</h2>
  <p class="lede">Compression is the process of reducing the amount of data used to represent a file. This is useful for a number of reasons:</p>
  <div class="facts3">
   <div><b style="font-size:1.05rem">Less storage</b><span>Compression reduces the amount of storage space a file needs.</span></div>
   <div><b style="font-size:1.05rem">Less bandwidth</b><span>Smaller files need less bandwidth when streaming or transferring.</span></div>
   <div><b style="font-size:1.05rem">Faster</b><span>Smaller files take less time to load, download or send.</span></div>
  </div>
  <p>It's possible to compress image, sound and text files to get these benefits. How each type of file is compressed depends on the scenario. There are two types of compression:</p>
  <div class="facts3" style="grid-template-columns:repeat(2,minmax(0,1fr))">
   <div><span class="eyebrow">Lossy</span><b style="font-size:1.05rem">Removes data permanently</b><span>The file is much smaller, but the original can never be rebuilt exactly.</span></div>
   <div><span class="eyebrow">Lossless</span><b style="font-size:1.05rem">No data is lost</b><span>The file is smaller, and the original can be rebuilt exactly when it's decompressed.</span></div>
  </div>
  <p>Choose a tab below for a closer look at each type of file.</p>
 </section>
 <section id="z-tabs">
  <div class="mtabs">
   <div class="tabs" role="tablist" style="flex-wrap:wrap">
    <button role="tab" id="zt-img" data-mtab="z-img" aria-selected="true">Images</button>
    <button role="tab" id="zt-snd" data-mtab="z-snd" aria-selected="false">Sound</button>
    <button role="tab" id="zt-txt" data-mtab="z-txt" aria-selected="false">Text</button>
    <button role="tab" id="zt-vid" data-mtab="z-vid" aria-selected="false">Video</button>
   </div>

   <div class="mpanel theory" id="z-img">
    <h2>Compressing image files</h2>
    <p>There are two types of compression used with images: <b>lossy</b> and <b>lossless</b>.</p>
    <h3>Lossy compression for images</h3>
    <p>Lossy compression permanently removes data from the image. It does this in ways people are unlikely to notice, for example:</p>
    <ul class="obj">
     <li><b>Reducing the colour depth</b>, so fewer bits are used for each pixel. Colours that are very similar are merged into one.</li>
     <li><b>Reducing the resolution</b>, so the image has fewer pixels.</li>
    </ul>
    <p>The <b>JPEG</b> format uses lossy compression. It's ideal for photographs on websites, where a small loss in quality is worth the much smaller file.</p>
    <h3>Lossless compression for images: run length encoding</h3>
    <p><b>Run length encoding (RLE)</b> is a lossless method. Instead of storing every pixel, it stores each <b>run</b> of same-coloured pixels as a <b>count</b> and a <b>colour</b>.</p>
    <div class="pixrow"><span style="background:#FFFFFF" title="W"></span><span style="background:#FFFFFF" title="W"></span><span style="background:#FFFFFF" title="W"></span><span style="background:#FFFFFF" title="W"></span><span style="background:#1B1B1B" title="B"></span><span style="background:#1B1B1B" title="B"></span><span style="background:#1B1B1B" title="B"></span><span style="background:#FFFFFF" title="W"></span><span style="background:#FFFFFF" title="W"></span><span style="background:#D9352B" title="R"></span><span style="background:#D9352B" title="R"></span><span style="background:#D9352B" title="R"></span><span style="background:#D9352B" title="R"></span><span style="background:#D9352B" title="R"></span><span style="background:#FFFFFF" title="W"></span><span style="background:#FFFFFF" title="W"></span></div>
    <p class="sum">WWWWBBBWWRRRRRWW → 4W 3B 2W 5R 2W</p>
    <p>16 pixel values are stored as 5 pairs, and the image can be rebuilt exactly. RLE works best on images with <b>large areas of the same colour</b>, such as logos and cartoons. The <b>PNG</b> and <b>GIF</b> formats use lossless compression.</p>
    <div class="callout tip"><span class="k">Which to use?</span><p>Use <b>lossy</b> when a small loss of quality doesn't matter and a small file does, such as photos on a website. Use <b>lossless</b> when every detail matters, such as medical scans or technical diagrams.</p></div>
   </div>

   <div class="mpanel theory" id="z-snd" hidden>
    <h2>Compressing sound files</h2>
    <p>Sound files have to be compressed all the time, as they're very often downloaded or streamed. Sound compression can be <b>lossy</b> or <b>lossless</b>.</p>
    <h3>Lossy compression</h3>
    <p>Lossy compression permanently removes parts of the sound that people are unlikely to notice:</p>
    <ul class="obj">
     <li>Sounds outside the range of human hearing are removed.</li>
     <li>Quiet sounds played at the same time as louder sounds are removed, because the louder sound hides them. This is called <b>perceptual music shaping</b>.</li>
     <li>The <b>sample rate</b> or <b>sample resolution</b> can be reduced, so less data is stored for each second of sound.</li>
    </ul>
    <p><b>MP3</b> is a common lossy format. It can make a music file around 10 times smaller, which is why music streaming services use lossy compression.</p>
    <h3>Lossless compression</h3>
    <p>Lossless compression finds patterns in the sound data and stores them more efficiently, so the original can be rebuilt exactly. The file is still bigger than a lossy one. <b>FLAC</b> is a lossless format, used when the best possible quality matters, for example in recording studios.</p>
    <div class="tscroll"><table class="pvt" style="max-width:640px">
     <tr><th></th><th>Lossy (e.g. MP3)</th><th>Lossless (e.g. FLAC)</th></tr>
     <tr><td class="lbl">File size</td><td>Much smaller</td><td>Smaller</td></tr>
     <tr><td class="lbl">Quality</td><td>Some loss, usually hard to hear</td><td>Same as the original</td></tr>
     <tr><td class="lbl">Original restored?</td><td>No</td><td>Yes</td></tr>
     <tr><td class="lbl">Good for</td><td>Streaming and downloads</td><td>Editing and archiving</td></tr>
    </table></div>
   </div>

   <div class="mpanel theory" id="z-txt" hidden>
    <h2>Compression of text files</h2>
    <p>We've already covered how images and sound can be compressed using both lossy and lossless methods, and how each has its own pros and cons.</p>
    <p><b>Text files</b>, whether a word processed document, an HTML file or some programming code, <b>cannot be compressed using lossy</b> compression. If any characters were removed, the meaning would change or the code wouldn't work:</p>
    <div class="facts3" style="grid-template-columns:repeat(2,minmax(0,1fr))">
     <div><span class="eyebrow">Original</span><b class="mono" style="font-size:1rem">Meet me at 10:30</b></div>
     <div><span class="eyebrow">With data lost</span><b class="mono" style="font-size:1rem">Meet me at 1:30</b></div>
    </div>
    <p>Program code is even more fragile. Lose just a few characters and the program either does the wrong thing or won't run at all:</p>
    <div class="codecmp">
     <div><span class="eyebrow">Original code</span><pre class="code">score = int(input("Score: "))
if score &gt;= 50:
    print("Pass")
else:
    print("Try again")</pre></div>
     <div><span class="eyebrow" style="color:var(--bad)">After lossy compression</span><pre class="code">score = int(input("Score: "))
if score &gt; 5<mark>&#8203;</mark>
<mark>print</mark>("Pas<mark>&#8203;</mark>")
else:
    print("Try again")</pre></div>
    </div>
    <ul class="obj">
     <li><span class="mono">&gt;= 50</span> has become <span class="mono">&gt; 5</span>, so a score of just 6 would now pass.</li>
     <li>The colon and the indentation are gone, so the program won't even run: it gives a <b>syntax error</b>.</li>
     <li>"Pass" has become "Pas", so the output is wrong too.</li>
    </ul>
    <p>So text and code are always compressed using <b>lossless</b> compression. Two common methods are the <b>pattern (dictionary) method</b> and <b>run length encoding</b>.</p>
    <h3>The pattern (dictionary) method</h3>
    <p>Text often repeats the same words or groups of characters. The pattern method finds these repeats, stores each one <b>once</b> in a dictionary, and replaces every occurrence with a short number that points to it.</p>
    <p class="sum">the cat sat on the mat and the cat ate the rat</p>
    <div class="stepline"><b>Step 1</b><span>Find each different word and give it a number in the dictionary.</span></div>
    <div class="tscroll"><table class="pvt" style="max-width:520px">
     <tr><th>Number</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th></tr>
     <tr><td class="lbl">Word</td><td>the</td><td>cat</td><td>sat</td><td>on</td><td>mat</td><td>and</td><td>ate</td><td>rat</td></tr>
    </table></div>
    <div class="stepline"><b>Step 2</b><span>Replace every word with its number, in order.</span></div>
    <p class="sum">1 2 3 4 1 5 6 1 2 7 1 8</p>
    <div class="stepline"><b>Step 3</b><span>To decompress, look each number up in the dictionary. The original text comes back exactly, so the method is lossless.</span></div>
    <p>"the" appears 4 times and "cat" twice, but each is stored only once. The more a text repeats itself, the more space the pattern method saves. That's why it works well on long documents.</p>
    <h3>Run length encoding</h3>
    <p>RLE replaces each run of repeated characters with a <b>count</b> followed by the <b>character</b>:</p>
    <p class="sum">AAAABBBCCD → 4A 3B 2C 1D</p>
    <div class="stepline"><b>Step 1</b><span>Split the text into runs of the same character: AAAA, BBB, CC, D.</span></div>
    <div class="stepline"><b>Step 2</b><span>Write each run as its length, then its character: 4A 3B 2C 1D.</span></div>
    <div class="stepline"><b>Step 3</b><span>Compare the sizes. The original is 10 characters (10 bytes). The RLE version is 4 runs × 2 bytes = 8 bytes.</span></div>
    <div class="callout warnbox"><span class="k">Watch out</span><p>RLE only saves space when characters repeat. Normal text like <span class="mono">HELLO</span> becomes <span class="mono">1H 1E 2L 1O</span>: 8 bytes instead of 5, so the file gets <b>bigger</b>. That's why RLE suits data with long runs, and other lossless methods are used for everyday text.</p></div>
    <div class="callout"><span class="k">Try it</span><p>Use the RLE tool on the <a href="#l-1-3-compression" data-tab="practice">Practice</a> tab to test your own text.</p></div>
   </div>

   <div class="mpanel theory" id="z-vid" hidden>
    <h2>Compressing video files</h2>
    <p>A video is a series of still images called <b>frames</b>, usually 25 to 60 every second, plus a sound track. That's a lot of data, so video is almost always compressed, especially for <b>streaming</b>. Both lossy and lossless methods can be used.</p>
    <h3>Lossy compression for video</h3>
    <ul class="obj">
     <li><b>Reduce the resolution</b> or <b>colour depth</b> of each frame, just like an image.</li>
     <li><b>Reduce the frame rate</b>, so fewer frames are stored each second.</li>
     <li><b>Motion estimation</b>: in most videos, very little changes from one frame to the next. Instead of storing every frame in full, only the <b>movement</b> of parts of the picture is stored, and the rest is reused from the previous frame.</li>
     <li>Compress the <b>sound track</b> using lossy sound compression.</li>
    </ul>
    <p>Too much lossy compression causes <b>artifacts</b>: blocky or blurry patches in the picture.</p>
    <h3>Lossless compression for video</h3>
    <p>A compression algorithm such as <b>RLE</b> looks for <b>repeating</b> pixels and frames. Because neighbouring frames are so similar (this is called <b>temporal redundancy</b>), the algorithm can store one frame and then record only the <b>differences</b> between each frame and the next. The original video can be rebuilt exactly.</p>
    <div class="tscroll"><table class="pvt deftab" style="max-width:640px">
     <tr><th></th><th>Lossy</th><th>Lossless</th></tr>
     <tr><td class="lbl">File size</td><td>Much smaller: less storage, less bandwidth, faster to download and less buffering when streaming</td><td>Larger</td></tr>
     <tr><td class="lbl">Quality</td><td>Reduced, and artifacts may appear</td><td>Same as the original</td></tr>
     <tr><td class="lbl">Original restored?</td><td>No</td><td>Yes</td></tr>
    </table></div>
   </div>
  </div>
 </section>
</div>
</template>
<template id="th-1-3-filesize">
<div class="theory airy">
 <section id="f-intro">
  <h2>Calculating file size</h2>
  <p class="lede">Once you understand how data is used to represent different types of file, you can calculate precisely how much memory a file will need to store it.</p>
  <p>Being able to calculate the size of a file from details about it shows a deep understanding of how files are represented by data. The steps are similar whatever the type of file:</p>
  <div class="stepline"><b>Step 1</b><span>Work out how many <b>items</b> are in the file.</span></div>
  <div class="stepline"><b>Step 2</b><span>Identify how many <b>bits</b> are used to represent each item.</span></div>
  <div class="stepline"><b>Step 3</b><span>Multiply: (number of bits for each item) × (number of items).</span></div>
  <div class="stepline"><b>Step 4</b><span>Divide as needed to get the unit asked for: ÷ 8 for bytes, then ÷ 1024 for each step up (KiB, MiB, GiB).</span></div>
  <p class="vfoot">"Items" means the parts that make up the file, for example pixels in an image or samples in a sound.</p>
  <div class="tscroll"><table class="pvt" style="max-width:560px">
   <tr><th>To convert</th><th>Do this</th></tr>
   <tr><td>bits → bytes</td><td>÷ 8</td></tr><tr><td>bytes → KiB</td><td>÷ 1024</td></tr><tr><td>KiB → MiB</td><td>÷ 1024</td></tr><tr><td>MiB → GiB</td><td>÷ 1024</td></tr>
  </table></div>
  <div class="callout"><span class="k">Remember</span><p>These calculations give the size of the <b>raw</b> image or sound data. Real files are slightly larger, because they also contain <b>metadata</b>: data about the file, such as its width, height and colour depth, or the date it was created.</p></div>
  <p>For the detailed steps for each type of file, choose a tab below.</p>
 </section>
 <section id="f-tabs">
  <div class="mtabs">
   <div class="tabs" role="tablist" style="flex-wrap:wrap">
    <button role="tab" id="ft-img" data-mtab="f-img" aria-selected="true">Image files</button>
    <button role="tab" id="ft-snd" data-mtab="f-snd" aria-selected="false">Sound files</button>
   </div>
   <div class="mpanel theory" id="f-img">
    <h2>Image files: calculating file size</h2>
    <p>To calculate the size of an image file you need to know:</p>
    <ul class="obj"><li>The total <b>number of pixels</b> in the image.</li><li>The <b>colour depth</b> of the image: how many bits are used for each pixel.</li></ul>
    <h3>Calculating the number of pixels</h3>
    <p>First you need the image <b>resolution</b>. It's usually given in this format: <span class="mono">3840 × 2160</span>. The first number (3840) is the width of the image in pixels, and the second number (2160) is the height in pixels. Multiply them to get the total number of pixels.</p>
    <h3>Example</h3>
    <p>An image with a resolution of 3840 × 2160 and a colour depth of 24 bits:</p>
    <div class="stepline"><b>Step 1</b><span>Number of pixels: 3840 × 2160 = <b>8,294,400 pixels</b>.</span></div>
    <div class="stepline"><b>Step 2</b><span>Bits for each pixel: the colour depth is <b>24 bits</b>.</span></div>
    <div class="stepline"><b>Step 3</b><span>Multiply: 8,294,400 × 24 = <b>199,065,600 bits</b>.</span></div>
    <div class="stepline"><b>Step 4</b><span>Convert: 199,065,600 ÷ 8 = 24,883,200 bytes. ÷ 1024 = 24,300 KiB. ÷ 1024 = about <b>23.73 MiB</b>.</span></div>
   </div>
   <div class="mpanel theory" id="f-snd" hidden>
    <h2>Sound files: calculating file size</h2>
    <p>To calculate the size of a sound file you need to know:</p>
    <ul class="obj"><li>The <b>sample rate</b>: how many samples are taken each second.</li><li>The <b>sample resolution</b>: how many bits are used for each sample.</li><li>The <b>length</b> of the sound in seconds.</li></ul>
    <h3>Calculating the number of samples</h3>
    <p>Multiply the sample rate by the length in seconds. A sound sampled at 44,100 Hz for 60 seconds has 44,100 × 60 = 2,646,000 samples.</p>
    <h3>Example</h3>
    <p>A 60-second sound with a sample rate of 44,100 Hz and a sample resolution of 16 bits:</p>
    <div class="stepline"><b>Step 1</b><span>Number of samples: 44,100 × 60 = <b>2,646,000 samples</b>.</span></div>
    <div class="stepline"><b>Step 2</b><span>Bits for each sample: the sample resolution is <b>16 bits</b>.</span></div>
    <div class="stepline"><b>Step 3</b><span>Multiply: 2,646,000 × 16 = <b>42,336,000 bits</b>.</span></div>
    <div class="stepline"><b>Step 4</b><span>Convert: 42,336,000 ÷ 8 = 5,292,000 bytes. ÷ 1024 = about 5,168 KiB. ÷ 1024 = about <b>5.05 MiB</b>.</span></div>
    <div class="callout tip"><span class="k">Watch the units</span><p>If the length is given in minutes, change it to seconds first: 2 minutes = 120 seconds.</p></div>
   </div>
  </div>
  <div class="callout"><span class="k">Try it</span><p>Check your own calculations with the file size calculator on the <a href="#l-1-3-filesize" data-tab="practice">Practice</a> tab.</p></div>
 </section>
</div>
</template>
<template id="th-1-3-measurement">
<div class="theory airy">
 <section id="m-intro">
  <h2>Units of memory</h2>
  <p>A computer's memory is measured by the number of bits it can store. A bit is just a single binary value, so it isn't a practical unit for describing devices with very large amounts of storage. To solve this, there are a number of commonly used units.</p>
  <p>The table below shows the commonly used units of memory, and how much bigger each one is than the unit before it. These units are used to describe both the storage capacity of devices and the size of digital files.</p>
  <div class="tscroll"><table class="pvt" style="max-width:720px">
   <tr><th>Unit name</th><th>Factor (bytes)</th><th>Value</th></tr>
   <tr><td>1 bit</td><td>—</td><td>A single 1 or 0</td></tr><tr><td>1 nibble</td><td>—</td><td>4 bits</td></tr><tr><td>1 byte</td><td>—</td><td>8 bits</td></tr><tr><td>1 kibibyte (KiB)</td><td>2<sup>10</sup></td><td>1024 bytes</td></tr><tr><td>1 mebibyte (MiB)</td><td>2<sup>20</sup></td><td>1024 kibibytes</td></tr><tr><td>1 gibibyte (GiB)</td><td>2<sup>30</sup></td><td>1024 mebibytes</td></tr><tr><td>1 tebibyte (TiB)</td><td>2<sup>40</sup></td><td>1024 gibibytes</td></tr><tr><td>1 pebibyte (PiB)</td><td>2<sup>50</sup></td><td>1024 tebibytes</td></tr><tr><td>1 exbibyte (EiB)</td><td>2<sup>60</sup></td><td>1024 pebibytes</td></tr>
  </table></div>
 </section>
 <section id="m-convert">
  <h2>Converting between units</h2>
  <p>From the byte upwards, each unit is <b>1024 times bigger</b> than the one before it. To go to a <b>bigger</b> unit, divide by 1024. To go to a <b>smaller</b> unit, multiply by 1024. Between bits and bytes, use 8.</p>
  <div class="ladder"><span class="rung"><b>byte</b></span><span class="arr">× 1024 →</span><span class="rung"><b>KiB</b></span><span class="arr">× 1024 →</span><span class="rung"><b>MiB</b></span><span class="arr">× 1024 →</span><span class="rung"><b>GiB</b></span><span class="arr">× 1024 →</span><span class="rung"><b>TiB</b></span><span class="arr">× 1024 →</span><span class="rung"><b>PiB</b></span><span class="arr">× 1024 →</span><span class="rung"><b>EiB</b></span></div>
  <div class="stepline"><b>Example 1</b><span>How many bytes are in 3 KiB? Smaller unit, so multiply: 3 × 1024 = <b>3072 bytes</b>.</span></div>
  <div class="stepline"><b>Example 2</b><span>How many MiB is 5120 KiB? Bigger unit, so divide: 5120 ÷ 1024 = <b>5 MiB</b>.</span></div>
  <div class="stepline"><b>Example 3</b><span>How many bits are in 2 KiB? 2 × 1024 = 2048 bytes, then × 8 = <b>16,384 bits</b>.</span></div>
  <div class="callout tip"><span class="k">KiB or KB?</span><p>You might also see <b>kilobyte (KB)</b>, which is 1000 bytes. The syllabus uses the binary units based on <b>1024</b>: kibibyte (KiB), mebibyte (MiB), gibibyte (GiB) and so on. Always use 1024 in your calculations.</p></div>
 </section>
</div>
</template>
<template id="th-2-1-transmission">
<div class="theory airy">
 <div class="toc" aria-label="On this page"><button data-jump="t-methods">Methods</button><button data-jump="t-speed">Speed</button><button data-jump="t-serial">Serial</button><button data-jump="t-parallel">Parallel</button><button data-jump="t-skew">Skew and crosstalk</button><button data-jump="t-dir">Direction</button></div>
 <section id="t-intro">
  <h2>Data transmission</h2>
  <p class="lede"><b>Data transmission is the process of transferring data from one point to another.</b></p>
  <p>It's an extremely important process in computer science. Think about it: what good would your keyboard be if your keystroke wasn't transferred to the CPU and then to your monitor? Your smartphone would look a little less smart if it couldn't make phone calls, send text messages or connect to the internet.</p>
 </section>
 <section id="t-methods">
  <h2>Methods of transmission</h2>
  <p>There are a number of different ways data can be transmitted from one point to another:</p>
  <div class="facts3" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
   <div><span class="eyebrow">Cable</span><b style="font-size:1.05rem">Copper cable</b><span>Electrical signals sent along metal wires.</span></div>
   <div><span class="eyebrow">Wireless</span><b style="font-size:1.05rem">Radio frequency</b><span>Radio waves, as used by Wi-Fi and Bluetooth.</span></div>
   <div><span class="eyebrow">Wireless</span><b style="font-size:1.05rem">Infrared</b><span>Invisible light, as used by TV remote controls.</span></div>
   <div><span class="eyebrow">Cable</span><b style="font-size:1.05rem">Fibre optic</b><span>Pulses of light sent along thin glass fibres.</span></div>
  </div>
 </section>
 <section id="t-speed">
  <h2>Speed of transmission</h2>
  <p>Nobody likes waiting around. When you set up new technology or buy equipment that involves data transmission, it's always wise to check exactly how fast it can get your data from A to B.</p>
  <div class="callout"><span class="k">Key term</span><p>The amount of data that can be transmitted at one time is called the <b>bandwidth</b>. It's usually measured in bits per second.</p></div>
 </section>
 <section id="t-serial">
  <h2>Serial data transmission</h2>
  <p><b>Serial</b> data transmission sends <b>one bit at a time</b>, one after another, over a <b>single wire</b>.</p>
  <div class="linkdemo" data-mode="serial"></div>
  <ul class="obj">
   <li>USB uses serial transmission. The name gives it away: Universal <b>Serial</b> Bus.</li>
   <li>Very high data transfer speeds can be achieved, and because there's only one wire, the data always arrives in order.</li>
   <li>Serial is reliable over <b>long distances</b> and the cables are cheaper.</li>
  </ul>
 </section>
 <section id="t-parallel">
  <h2>Parallel data transmission</h2>
  <p><b>Parallel</b> transmission uses a <b>number of wires side by side</b>, so several bits can be sent <b>at the same time</b>.</p>
  <div class="linkdemo" data-mode="parallel"></div>
  <h3>Data ribbons</h3>
  <p>One example of parallel cables is the <b>data ribbon</b>, or parallel ATA cable. These are used over small distances inside a computer to connect hardware such as optical drives. Depending on its size, a ribbon can send 8, 16 or 32 bits at the same time.</p>
  <div class="ribbon" role="img" aria-label="A ribbon cable made of many coloured wires side by side"><i style="background:#8A5A2B"></i><i style="background:#D9352B"></i><i style="background:#F28C28"></i><i style="background:#F2C230"></i><i style="background:#2E9E4A"></i><i style="background:#2F6FE0"></i><i style="background:#7C4DC2"></i><i style="background:#8A8A8A"></i><i style="background:#FFFFFF"></i><i style="background:#1B1B1B"></i><i style="background:#8A5A2B"></i><i style="background:#D9352B"></i><i style="background:#F28C28"></i><i style="background:#F2C230"></i><i style="background:#2E9E4A"></i><i style="background:#2F6FE0"></i><i style="background:#7C4DC2"></i><i style="background:#8A8A8A"></i><i style="background:#FFFFFF"></i><i style="background:#1B1B1B"></i></div>
 </section>
 <section id="t-skew">
  <h2>Skew (synchronisation errors)</h2>
  <p>Skew is a disadvantage of parallel transmission. Each wire in a parallel cable has <b>slightly different properties</b>, so each signal travels at a slightly different speed and arrives at the destination at a different time. The bits of one byte can get out of step with each other.</p>
  <p>The longer the cable, the bigger the problem. Think of a race: in a 100 m sprint the runners finish close together, but in a marathon they finish hours apart. Try it:</p>
  <div class="linkdemo" data-mode="skew"></div>
  <p>Because of skew, <b>parallel transmission is best suited to very short distances</b>.</p>
  <div class="callout tip"><span class="k">Important</span><p>The race is only an analogy. In a race it's the runners themselves that are faster or slower. In a parallel cable the data is all the same: it's the <b>physical properties of each wire</b> that change how long the data takes to arrive.</p></div>
  <h3>Crosstalk</h3>
  <p>Another disadvantage of parallel transmission is <b>crosstalk</b>. The wires are very close together, so the electrical signal in one wire can interfere with the wires next to it. This can cause errors in the data, which then has to be sent again.</p>
  <p>On a <b>half-duplex</b> connection, data travels both ways but only one way at a time. If both ends try to send at once there can be <b>data collisions</b>, so the data has to be sent again.</p>
  <div class="tscroll"><table class="pvt" style="max-width:640px">
   <tr><th></th><th>Serial</th><th>Parallel</th></tr>
   <tr><td class="lbl">Wires</td><td>One</td><td>Several, side by side</td></tr>
   <tr><td class="lbl">Bits sent</td><td>One at a time</td><td>Several at the same time</td></tr>
   <tr><td class="lbl">Best for</td><td>Long distances</td><td>Very short distances</td></tr>
   <tr><td class="lbl">Problems</td><td>Slower over short distances</td><td>Skew and crosstalk</td></tr>
   <tr><td class="lbl">Example</td><td>USB</td><td>Data ribbons inside a computer</td></tr>
  </table></div>
 </section>
 <section id="t-dir">
  <h2>Direction of transmission</h2>
  <p>Now that we know about the two types of transmission (serial and parallel), we need to consider the <b>direction</b> data can travel in. There are three terms for this: <b>simplex</b>, <b>half-duplex</b> and <b>full-duplex</b>.</p>
  <p>Each one has its own rules about which way data can travel. They can be combined with serial or parallel transmission, for example serial full-duplex.</p>
  <h3>Simplex</h3>
  <p><b>Simplex</b> transmission sends data in <b>one direction only</b>. <span class="vfoot">Example: sending data from a keyboard to the CPU.</span></p>
  <div class="linkdemo" data-mode="simplex"></div>
  <h3>Half-duplex</h3>
  <p><b>Half-duplex</b> transmission lets data travel in <b>both directions, but only one way at a time</b>. <span class="vfoot">Example: walkie-talkies, where only one person can talk at a time.</span></p>
  <div class="linkdemo" data-mode="half"></div>
  <h3>Full-duplex</h3>
  <p><b>Full-duplex</b> transmission lets data travel in <b>both directions at the same time</b>. <span class="vfoot">Example: an internet connection, which downloads and uploads at the same time.</span></p>
  <div class="linkdemo" data-mode="full"></div>
  <div class="callout"><span class="k">Exam tip</span><p>Scenario questions often ask you to choose a method and justify it. Name the method <b>and</b> link it to the scenario, for example: "serial, because the data is sent over a long distance and won't suffer from skew".</p></div>
 </section>
</div>
</template>
<template id="th-2-1-packets">
<div class="theory airy">
 <div class="toc" aria-label="On this page"><button data-jump="p-prot">Protocols</button><button data-jump="p-pk">Packets</button><button data-jump="p-struct">Packet structure</button><button data-jump="p-switch">Packet switching</button></div>
 <section id="p-intro">
  <h2>Packets for data transmission</h2>
  <p class="lede">Sending data across a network has a problem: most files are far too large to send in one go.</p>
  <div class="truckcmp" role="img" aria-label="One overloaded truck tipping over, compared with the same load split across four vans that arrive safely">
 <svg viewBox="0 0 300 172"><g transform="rotate(-12 150 120)"><rect x="30" y="18" width="190" height="92" rx="6" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="2"/><rect x="38" y="26" width="24" height="20" rx="3" fill="var(--warn)" opacity=".55"/><rect x="38" y="52" width="24" height="20" rx="3" fill="var(--warn)" opacity=".55"/><rect x="38" y="78" width="24" height="20" rx="3" fill="var(--warn)" opacity=".55"/><rect x="68" y="26" width="24" height="20" rx="3" fill="var(--warn)" opacity=".55"/><rect x="68" y="52" width="24" height="20" rx="3" fill="var(--warn)" opacity=".55"/><rect x="68" y="78" width="24" height="20" rx="3" fill="var(--warn)" opacity=".55"/><rect x="98" y="26" width="24" height="20" rx="3" fill="var(--warn)" opacity=".55"/><rect x="98" y="52" width="24" height="20" rx="3" fill="var(--warn)" opacity=".55"/><rect x="98" y="78" width="24" height="20" rx="3" fill="var(--warn)" opacity=".55"/><rect x="128" y="26" width="24" height="20" rx="3" fill="var(--warn)" opacity=".55"/><rect x="128" y="52" width="24" height="20" rx="3" fill="var(--warn)" opacity=".55"/><rect x="128" y="78" width="24" height="20" rx="3" fill="var(--warn)" opacity=".55"/><rect x="158" y="26" width="24" height="20" rx="3" fill="var(--warn)" opacity=".55"/><rect x="158" y="52" width="24" height="20" rx="3" fill="var(--warn)" opacity=".55"/><rect x="158" y="78" width="24" height="20" rx="3" fill="var(--warn)" opacity=".55"/><rect x="188" y="26" width="24" height="20" rx="3" fill="var(--warn)" opacity=".55"/><rect x="188" y="52" width="24" height="20" rx="3" fill="var(--warn)" opacity=".55"/><rect x="188" y="78" width="24" height="20" rx="3" fill="var(--warn)" opacity=".55"/><rect x="30" y="100" width="210" height="18" rx="4" fill="var(--ink)"/><rect x="240" y="84" width="38" height="34" rx="5" fill="var(--ink)"/><circle cx="70" cy="122" r="11" fill="var(--ink)"/><circle cx="250" cy="122" r="11" fill="var(--ink)"/></g><text x="150" y="166" text-anchor="middle" font-size="13" fill="var(--bad)" font-family="var(--body)" font-weight="700">One huge load: it fails</text></svg>
 <svg viewBox="0 0 300 172"><g transform="translate(10,10)"><rect x="0" y="6" width="80" height="28" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2"/><text x="40" y="25" text-anchor="middle" font-size="12" font-family="var(--mono)" fill="var(--accent)">part 1</text><rect x="80" y="14" width="30" height="20" rx="4" fill="var(--ink)"/><circle cx="20" cy="38" r="7" fill="var(--ink)"/><circle cx="96" cy="38" r="7" fill="var(--ink)"/></g><g transform="translate(155,10)"><rect x="0" y="6" width="80" height="28" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2"/><text x="40" y="25" text-anchor="middle" font-size="12" font-family="var(--mono)" fill="var(--accent)">part 2</text><rect x="80" y="14" width="30" height="20" rx="4" fill="var(--ink)"/><circle cx="20" cy="38" r="7" fill="var(--ink)"/><circle cx="96" cy="38" r="7" fill="var(--ink)"/></g><g transform="translate(10,68)"><rect x="0" y="6" width="80" height="28" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2"/><text x="40" y="25" text-anchor="middle" font-size="12" font-family="var(--mono)" fill="var(--accent)">part 3</text><rect x="80" y="14" width="30" height="20" rx="4" fill="var(--ink)"/><circle cx="20" cy="38" r="7" fill="var(--ink)"/><circle cx="96" cy="38" r="7" fill="var(--ink)"/></g><g transform="translate(155,68)"><rect x="0" y="6" width="80" height="28" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2"/><text x="40" y="25" text-anchor="middle" font-size="12" font-family="var(--mono)" fill="var(--accent)">part 4</text><rect x="80" y="14" width="30" height="20" rx="4" fill="var(--ink)"/><circle cx="20" cy="38" r="7" fill="var(--ink)"/><circle cx="96" cy="38" r="7" fill="var(--ink)"/></g><text x="150" y="166" text-anchor="middle" font-size="13" fill="var(--good)" font-family="var(--body)" font-weight="700">Split into packets: it arrives</text></svg>
</div>
  <p>Imagine a delivery driver trying to deliver far too much in one journey. The truck is overloaded and fails. On a network, trying to send a large file in one go fails too (less dramatically!), because the file is bigger than the network's bandwidth can handle and the risk of the data being corrupted increases.</p>
  <p>To solve this problem, data is split into <b>packets</b> and sent using <b>packet switching</b>.</p>
 </section>
 <section id="p-prot">
  <h2>Protocols</h2>
  <p>A protocol is a <b>set of rules</b>. For the internet to work smoothly, different protocols have been set up. Two important protocols for sending data across networks and the internet are:</p>
  <div class="facts3" style="grid-template-columns:repeat(2,minmax(0,1fr))">
   <div><b class="mono" style="font-size:1.1rem">TCP/IP</b><span>Transmission Control Protocol / Internet Protocol</span></div>
   <div><b class="mono" style="font-size:1.1rem">UDP</b><span>User Datagram Protocol</span></div>
  </div>
  <p>Both are used when data is sent across the internet. They set the rules for how data is broken down into smaller pieces (packets), how the packets are sent, and what extra data is attached to each packet.</p>
 </section>
 <section id="p-pk">
  <h2>The packets</h2>
  <p>Before a file is sent across the internet, it's split up into a series of <b>packets</b>: smaller chunks of the file that are sent one by one.</p>
  <p>Example: this image is far too large to send in one piece, so it's split into smaller sections. Click <b>Split into packets</b>.</p>
  <div class="splitdemo" id="splitdemo"></div>
  <p>Each section becomes one packet. But the raw sections can't just be sent across the internet on their own, because they would probably get lost. Each packet carries the raw data <b>plus extra data</b> that helps it reach the right destination and lets the file be rebuilt correctly.</p>
 </section>
 <section id="p-struct">
  <h2>Packet structure</h2>
  <p>Every packet is organised into 3 sections: the <b>header</b>, the <b>payload</b> and the <b>trailer</b>. Click each part of the packet to see what it holds.</p>
  <div class="pkstruct" id="pkstruct"></div>
 </section>
 <section id="p-switch">
  <h2>Packet switching</h2>
  <p><b>Packet switching</b> means breaking a large file into packets and sending each packet to the recipient <b>separately</b>. Each packet can take a <b>different route</b> to its destination. <b>Routers</b> decide which route each packet takes, sending it along whichever path is best at that moment.</p>
  <p>Because packets take different routes, they can <b>arrive out of order</b>. When the last packet arrives, the recipient uses the information in each header to check that every packet has been received and to <b>put them back in order</b>. If any packets are missing, a request is sent back to the sender asking for them to be sent again.</p>
  <p>Each packet also has a <b>hop count</b>: a limit on how many routers (hops) it can pass through. Every router reduces it by one, and if it reaches zero the packet is deleted. This stops lost packets travelling around the internet forever.</p>
  <div class="netdemo" id="netdemo"></div>
  <div class="callout"><span class="k">Exam tip</span><p>For packet switching, remember the sequence: data is broken into packets → each packet may take a different route → routers control the route → packets may arrive out of order → once the last packet arrives, they're put back in order.</p></div>
 </section>
</div>
</template>
<template id="th-2-1-usb">
<div class="theory airy">
 <div class="toc" aria-label="On this page"><button data-jump="u2-bus">The universal serial bus</button><button data-jump="u2-cable">The USB cable</button><button data-jump="u2-pnp">Plug and play</button><button data-jump="u2-pros">Benefits and drawbacks</button></div>
 <section id="u2-intro">
  <h2>USB: Universal Serial Bus</h2>
  <p class="lede">The term USB is widely known and used. It's used by a huge range of devices and is very simple to use. But have you really thought about how it works?</p>
 </section>
 <section id="u2-bus">
  <h2>The universal serial bus</h2>
  <svg class="usbplug" viewBox="0 0 520 120" role="img" aria-label="A USB plug and cable"><rect x="20" y="30" width="95" height="60" rx="3" fill="#B9BEC2" stroke="#6E767C" stroke-width="2"/><rect x="45" y="40" width="14" height="14" rx="2" fill="var(--surface)" stroke="#6E767C" stroke-width="2"/><rect x="45" y="66" width="14" height="14" rx="2" fill="var(--surface)" stroke="#6E767C" stroke-width="2"/><path d="M115 18 H225 L270 45 H330 V75 H270 L225 102 H115 Z" fill="#1B1B1B"/><rect x="135" y="32" width="85" height="56" rx="10" fill="#2E2E2E"/><rect x="330" y="53" width="175" height="14" rx="3" fill="#1B1B1B"/></svg>
  <p>USB is a <b>standard for data transmission</b>. USB stands for <b>Universal Serial Bus</b>, and its name gives away a lot about the interface:</p>
  <div class="facts3">
   <div><b style="font-size:1.05rem">Universal</b><span>A widely accepted standard that can work with most devices.</span></div>
   <div><b style="font-size:1.05rem">Serial</b><span>It uses serial data transmission: one bit at a time.</span></div>
   <div><b style="font-size:1.05rem">Bus</b><span>A communication system used for transmitting data.</span></div>
  </div>
  <p>USB is now the most commonly used input/output port on modern computers. Because it's universal, peripheral devices can be swapped and connected conveniently and easily.</p>
 </section>
 <section id="u2-cable">
  <h2>The USB cable</h2>
  <h3>What's inside a USB cable?</h3>
  <p>A standard USB cable actually contains <b>four smaller wires</b>:</p>
  <div class="usbwires" id="usbwires"><svg viewBox="0 0 560 230" role="img" aria-label="Inside a USB cable: four wires. Green is data minus, white is data plus, black is ground and red is plus 5 volts"><g class="uw" data-uw="data"><text x="10" y="40" font-size="15" font-family="var(--mono)" fill="var(--ink)" font-weight="600">Green (Data −)</text><path d="M190 35 C 250 35, 250 95, 300 95" fill="none" stroke="#6E767C" stroke-width="10" stroke-linecap="round"/><path d="M190 35 C 250 35, 250 95, 300 95" fill="none" stroke="#2E9E4A" stroke-width="7" stroke-linecap="round"/></g><g class="uw" data-uw="data"><text x="10" y="90" font-size="15" font-family="var(--mono)" fill="var(--ink)" font-weight="600">White (Data +)</text><path d="M190 85 C 250 85, 250 108, 300 108" fill="none" stroke="#6E767C" stroke-width="10" stroke-linecap="round"/><path d="M190 85 C 250 85, 250 108, 300 108" fill="none" stroke="#F4F4F4" stroke-width="7" stroke-linecap="round"/></g><g class="uw" data-uw="power"><text x="10" y="140" font-size="15" font-family="var(--mono)" fill="var(--ink)" font-weight="600">Black (Ground)</text><path d="M190 135 C 250 135, 250 121, 300 121" fill="none" stroke="#6E767C" stroke-width="10" stroke-linecap="round"/><path d="M190 135 C 250 135, 250 121, 300 121" fill="none" stroke="#1B1B1B" stroke-width="7" stroke-linecap="round"/></g><g class="uw" data-uw="power"><text x="10" y="190" font-size="15" font-family="var(--mono)" fill="var(--ink)" font-weight="600">Red (+5 V)</text><path d="M190 185 C 250 185, 250 134, 300 134" fill="none" stroke="#6E767C" stroke-width="10" stroke-linecap="round"/><path d="M190 185 C 250 185, 250 134, 300 134" fill="none" stroke="#D9352B" stroke-width="7" stroke-linecap="round"/></g><rect x="300" y="80" width="70" height="66" rx="3" fill="#B9BEC2" stroke="#6E767C" stroke-width="2"/><path d="M370 66 H450 L480 90 H540 V136 H480 L450 160 H370 Z" fill="#1B1B1B"/></svg><div class="seg" style="align-self:flex-start"><button data-uwv="all" aria-pressed="true">All wires</button><button data-uwv="power" aria-pressed="false">Power wires</button><button data-uwv="data" aria-pressed="false">Data wires</button></div><p class="vfoot" id="uw-note">The red and black wires carry power. The green and white wires carry data.</p></div>
  <p class="vfoot">This is the most common colour coding, although others exist.</p>
  <div class="callout"><span class="k">Great power!</span><p>Because the red and black wires carry power, any device connected by USB can be powered by the computer, with 5 V. Without this, every USB device would need its own power source, such as batteries or another cable. Imagine if your mouse, keyboard and memory stick all needed batteries. Not great!</p></div>
 </section>
 <section id="u2-pnp">
  <h2>Plug and play</h2>
  <p>One of the joys of USB is that it's <b>plug and play</b>: devices can simply be plugged in and they're ready to use with little or no setup. Pick a device and plug it in to see what happens:</p>
  <div class="pnpdemo" id="pnpdemo"></div>
  <div class="stepline"><b>Detect</b><span><b>Automatic detection:</b> when a USB device is plugged in, the computer automatically detects it.</span></div>
  <div class="stepline"><b>Identify</b><span><b>Automatic recognition and setup:</b> the computer works out what type of device it is and loads the correct <b>driver</b> software. The driver lets the computer communicate with the device. For example, plug in a new USB mouse and the computer recognises it as a mouse and loads the mouse driver, so it works straight away.</span></div>
  <div class="stepline"><b>Assist</b><span><b>Setup assistance:</b> if an unusual or new type of device is plugged in and the correct driver isn't already on the computer, the user is told that new software is needed. Some systems search for the driver and suggest it, while others need the user to find it themselves.</span></div>
 </section>
 <section id="u2-pros">
  <h2>Benefits and drawbacks</h2>
  <p>USB devices are incredibly convenient to use. Here are the pros and cons:</p>
  <div class="facts3" style="grid-template-columns:repeat(2,minmax(0,1fr));align-items:start">
   <div class="good"><span class="eyebrow" style="color:var(--good)">Benefits</span><ul class="obj">
    <li>A universally accepted standard, so it's convenient and widely supported.</li>
    <li>Devices are automatically detected when they're connected.</li>
    <li>Drivers are automatically found and loaded. If they're missing, the user is prompted to install them.</li>
    <li>No external power source is needed, because the cable supplies 5 V.</li>
    <li>If transmission errors are detected, the data is sent again.</li>
    <li>It's backwards compatible, so it still supports older USB devices.</li></ul></div>
   <div class="bad"><span class="eyebrow" style="color:var(--bad)">Drawbacks</span><ul class="obj">
    <li>The cable length is limited to about 5 metres.</li>
    <li>Extra devices, such as hubs, are needed to extend cables.</li>
    <li>It only supplies a small amount of power, which isn't enough for larger devices like printers.</li></ul></div>
  </div>
  <div class="callout"><span class="k">Exam tip</span><p>Questions often ask for a benefit and a drawback of USB. Make each point specific: "the cable supplies 5 V power, so the device doesn't need batteries" earns more than "it's convenient".</p></div>
 </section>
</div>
</template>
<template id="th-2-2-parity">
<div class="theory airy">
<section id="e-intro">
  <h2>Error checking</h2>
  <p class="lede">Think of the game <b>Telephone</b>: the first person whispers a message, and it's passed through a group of people until it reaches the last person. The message hardly ever arrives completely unchanged. That's an error in transmission.</p>
  <p>Transmission errors also happen when one digital device sends data to another. This can have a huge impact, so methods have been designed to <b>spot and correct</b> these errors.</p>
 </section>
 <section id="e-causes">
  <h2>What causes errors in transmission?</h2>
  <p>When data doesn't arrive correctly, we know there's been some sort of error. Some of the causes are:</p>
  <div class="facts3" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
   <div><b style="font-size:1.05rem">Electrical interference</b><span>Other signals disturb the data on its way.</span></div>
   <div><b style="font-size:1.05rem">Power surges</b><span>A sudden spike in power can change the signal.</span></div>
   <div><b style="font-size:1.05rem">Synchronisation issues</b><span>The sender and receiver get out of step, as with skew.</span></div>
   <div><b style="font-size:1.05rem">Damaged cables</b><span>A broken or worn cable can lose or change data.</span></div>
   <div><b style="font-size:1.05rem">Crosstalk</b><span>Signals in wires that are close together interfere with each other.</span></div>
   <div><b style="font-size:1.05rem">Data collisions</b><span>Two devices send at the same time on the same connection, and the data is corrupted.</span></div>
  </div>
  <p>These problems can cause a bit to be <b>flipped</b>: changed from 1 to 0, or from 0 to 1. Data can also be <b>lost</b> completely, or <b>gained</b> (extra bits added). With parallel transmission, bits can arrive <b>out of order</b> because of <b>skew</b>. On a large network, a packet can also be lost if it <b>times out</b> or reaches its <b>hop count</b> (the limit on how many routers it can pass through) before it arrives.</p>
 </section>
 <section>
    <h2>Parity checking</h2>
    <h3>Parity bits</h3>
    <p>The parity bit system starts by deciding whether <b>odd</b> or <b>even</b> parity will be used. This means the number of <b>1s</b> in each byte must be odd, or even.</p>
    <p>Before the data is sent, one extra bit, the <b>parity bit</b>, is added to make the number of 1s odd or even. In exam questions the parity bit is usually the <b>leftmost bit</b> (the MSB).</p>
    <div class="callout"><span class="k">Example</span>
     <p>A system uses <b>odd parity</b>. We want to send the 7 bits <span class="mono">1101001</span>. They contain <b>four</b> 1s, which is even, so the parity bit must be <b>1</b> to make the total odd:</p>
     <div class="tscroll"><table class="pvt" style="max-width:520px"><tr><th>Parity bit</th><th colspan="7">Data</th></tr><tr><td class="hi">1</td><td>1</td><td>1</td><td>0</td><td>1</td><td>0</td><td>0</td><td>1</td></tr></table></div>
     <p>With the parity bit there are now <b>five</b> 1s. Five is odd, so the odd parity rule is met.</p></div>
    <p>Try it yourself. Click the bits to change the data, and switch between odd and even parity:</p>
    <div class="parmaker" id="parmaker"></div>
    <h3>How parity bits work</h3>
    <div class="stepline"><b>Step 1</b><span>Before data is sent, the sender and receiver agree to use either odd or even parity.</span></div>
    <div class="stepline"><b>Step 2</b><span>The sender sets the parity bit for each byte.</span></div>
    <div class="stepline"><b>Step 3</b><span>The receiver counts the 1s in each byte. If the count doesn't match the agreed parity, an error has occurred.</span></div>
    <div class="stepline"><b>Step 4</b><span>The receiver tells the sender the parity check failed and asks for the data to be sent again.</span></div>
    <div class="callout warnbox"><span class="k">Warning</span><p>Parity checks aren't perfect. If <b>two bits</b> are flipped, or two bits swap places (a <b>transposition error</b>), the number of 1s is still odd (or even), so the parity looks correct and the error isn't detected. Parity also can't tell <b>which</b> bit is wrong. Parity blocks solve that.</p></div>
    <h3>Parity blocks</h3>
    <p>A parity block uses the same odd and even system, but instead of checking one byte it checks a whole <b>table of bytes</b>. A parity bit is added to <b>each row</b> and to <b>each column</b>. This means an error can be detected and the incorrect bit can be found.</p>
    <p>In this block, 7 bytes are being sent using <b>even parity</b>. Column 1 holds the parity bit for each row, and row 8 holds the parity bit for each column. All the data and parity bits are correct.</p>
    <div class="pbdemo" id="pbdemo"></div>
    <h3>Finding an error</h3>
    <div class="stepline"><b>Step 1</b><span>Check each <b>column</b> to make sure it still has an even number of 1s. Work through the columns until you find one that's odd.</span></div>
    <div class="stepline"><b>Step 2</b><span>Check each <b>row</b> (each byte) the same way until you find one that fails.</span></div>
    <div class="stepline"><b>Step 3</b><span>The bit where the incorrect row and the incorrect column cross is the bit that was flipped.</span></div>
    <p>Press <b>Show the example error</b> above, or click any bit to flip it, and see how the failing row and column point straight to it.</p>
 </section>
</div>
</template>
<template id="th-2-2-checksums">
<div class="theory airy">
<section>
    <h2>Checksums</h2>
    <p>A checksum is similar to a check digit, but instead of being used on a short string of numbers like a barcode, it's calculated from <b>all the data</b> in a file or block of data. The result is a value that's sent along with the data.</p>
    <p>Real systems use complex algorithms such as <b>MD5</b> and <b>SHA-1</b>, which produce long codes like <span class="mono">hwu4u25GB23…</span>. They're often used to check that software has downloaded correctly.</p>
    <h3>How it works</h3>
    <div class="stepline"><b>Step 1</b><span>The sender puts all the data through an algorithm, which produces a checksum.</span></div>
    <div class="stepline"><b>Step 2</b><span>The data is sent to the receiver, and the checksum is sent with it.</span></div>
    <div class="stepline"><b>Step 3</b><span>The receiver puts the data it received through the same algorithm to produce its own checksum.</span></div>
    <div class="stepline"><b>Step 4</b><span>The receiver compares the two checksums. If they match, the data is error free. If they don't, it asks for the data to be sent again.</span></div>
    <h3>Visualise the process</h3>
    <p>Follow the diagrams step by step to see how a checksum is used when a file is sent.</p>
<figure class="srfig"><figcaption><b>Step 1</b><span>The sender (red) has a file to send to the receiver (blue).</span></figcaption><svg viewBox="0 0 640 170" role="img" aria-label="The sender has a file to send to the receiver"><defs><marker id="sra1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="srhead"/></marker></defs><g><text x="80" y="68" text-anchor="middle" class="srlab">Sender</text><circle cx="80" cy="100" r="15" fill="#C8402F"/><path d="M56 150 v-14 a24 22 0 0 1 48 0 v14 z" fill="#C8402F"/></g><g><path d="M140 106 h16 l5 -6 h0 v0 M140 106" fill="none"/><path d="M140 100 h16 l5 6 h23 a3 3 0 0 1 3 3 v26 a3 3 0 0 1 -3 3 h-41 a3 3 0 0 1 -3 -3 v-32 a3 3 0 0 1 3 -3 z" fill="#3B8FE0"/><path d="M156 113 h10 l5 5 v12 h-15 z" fill="#fff" opacity=".85"/></g><line x1="205" y1="118" x2="505" y2="118" class="srarr" marker-end="url(#sra1)"/><g><text x="560" y="68" text-anchor="middle" class="srlab">Receiver</text><circle cx="560" cy="100" r="15" fill="#2F7FC8"/><path d="M536 150 v-14 a24 22 0 0 1 48 0 v14 z" fill="#2F7FC8"/></g></svg></figure><figure class="srfig"><figcaption><b>Step 2</b><span>They have agreed to use a checksum. Before the file is sent, the sender puts it through a checksum algorithm, which produces a checksum.</span></figcaption><svg viewBox="0 0 640 330" role="img" aria-label="The sender puts the file through the checksum algorithm, which produces the checksum hwu4u25GB23"><defs><marker id="sra2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="srhead"/></marker></defs><g><text x="80" y="68" text-anchor="middle" class="srlab">Sender</text><circle cx="80" cy="100" r="15" fill="#C8402F"/><path d="M56 150 v-14 a24 22 0 0 1 48 0 v14 z" fill="#C8402F"/></g><g><path d="M140 106 h16 l5 -6 h0 v0 M140 106" fill="none"/><path d="M140 100 h16 l5 6 h23 a3 3 0 0 1 3 3 v26 a3 3 0 0 1 -3 3 h-41 a3 3 0 0 1 -3 -3 v-32 a3 3 0 0 1 3 -3 z" fill="#3B8FE0"/><path d="M156 113 h10 l5 5 v12 h-15 z" fill="#fff" opacity=".85"/></g><line x1="162" y1="140" x2="162" y2="182" class="srarr" marker-end="url(#sra2)"/><g><rect x="87" y="186" width="150" height="48" rx="4" class="sralg"/><text x="162.0" y="206" text-anchor="middle" class="sralgt">Checksum</text><text x="162.0" y="224" text-anchor="middle" class="sralgt">algorithm</text></g><line x1="162" y1="236" x2="162" y2="268" class="srarr" marker-end="url(#sra2)"/><g><rect x="87" y="272" width="150" height="34" rx="3" class="srcs" stroke="#D63A2A"/><text x="162.0" y="294" text-anchor="middle" class="srmono">hwu4u25GB23</text></g><g><text x="560" y="68" text-anchor="middle" class="srlab">Receiver</text><circle cx="560" cy="100" r="15" fill="#2F7FC8"/><path d="M536 150 v-14 a24 22 0 0 1 48 0 v14 z" fill="#2F7FC8"/></g></svg></figure><figure class="srfig"><figcaption><b>Step 3</b><span>The sender sends the file <b>and</b> the checksum to the receiver.</span></figcaption><svg viewBox="0 0 640 330" role="img" aria-label="The sender sends the file and the checksum to the receiver"><defs><marker id="sra3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="srhead"/></marker></defs><g><text x="80" y="68" text-anchor="middle" class="srlab">Sender</text><circle cx="80" cy="100" r="15" fill="#C8402F"/><path d="M56 150 v-14 a24 22 0 0 1 48 0 v14 z" fill="#C8402F"/></g><g><path d="M140 106 h16 l5 -6 h0 v0 M140 106" fill="none"/><path d="M140 100 h16 l5 6 h23 a3 3 0 0 1 3 3 v26 a3 3 0 0 1 -3 3 h-41 a3 3 0 0 1 -3 -3 v-32 a3 3 0 0 1 3 -3 z" fill="#3B8FE0"/><path d="M156 113 h10 l5 5 v12 h-15 z" fill="#fff" opacity=".85"/></g><line x1="162" y1="140" x2="162" y2="182" class="srarr" marker-end="url(#sra3)"/><g><rect x="87" y="186" width="150" height="48" rx="4" class="sralg"/><text x="162.0" y="206" text-anchor="middle" class="sralgt">Checksum</text><text x="162.0" y="224" text-anchor="middle" class="sralgt">algorithm</text></g><line x1="162" y1="236" x2="162" y2="268" class="srarr" marker-end="url(#sra3)"/><g><rect x="87" y="272" width="150" height="34" rx="3" class="srcs" stroke="#D63A2A"/><text x="162.0" y="294" text-anchor="middle" class="srmono">hwu4u25GB23</text></g><line x1="205" y1="118" x2="440" y2="118" class="srarr" marker-end="url(#sra3)"/><g><path d="M450 106 h16 l5 -6 h0 v0 M450 106" fill="none"/><path d="M450 100 h16 l5 6 h23 a3 3 0 0 1 3 3 v26 a3 3 0 0 1 -3 3 h-41 a3 3 0 0 1 -3 -3 v-32 a3 3 0 0 1 3 -3 z" fill="#3B8FE0"/><path d="M466 113 h10 l5 5 v12 h-15 z" fill="#fff" opacity=".85"/></g><g><text x="560" y="68" text-anchor="middle" class="srlab">Receiver</text><circle cx="560" cy="100" r="15" fill="#2F7FC8"/><path d="M536 150 v-14 a24 22 0 0 1 48 0 v14 z" fill="#2F7FC8"/></g><line x1="245" y1="280" x2="425" y2="222" class="srarr" marker-end="url(#sra3)"/><g><rect x="430" y="196" width="150" height="34" rx="3" class="srcs" stroke="#D63A2A"/><text x="505.0" y="218" text-anchor="middle" class="srmono">hwu4u25GB23</text></g></svg></figure><figure class="srfig"><figcaption><b>Step 4</b><span>The receiver doesn&#39;t open the file yet. It puts the received file through the <b>same</b> checksum algorithm, which produces a second checksum.</span></figcaption><svg viewBox="0 0 640 320" role="img" aria-label="The receiver puts the received file through the same checksum algorithm, producing a second checksum"><defs><marker id="sra4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="srhead"/></marker></defs><text x="320" y="28" text-anchor="middle" class="srlab">Receiver</text><g><path d="M150 66 h16 l5 -6 h0 v0 M150 66" fill="none"/><path d="M150 60 h16 l5 6 h23 a3 3 0 0 1 3 3 v26 a3 3 0 0 1 -3 3 h-41 a3 3 0 0 1 -3 -3 v-32 a3 3 0 0 1 3 -3 z" fill="#3B8FE0"/><path d="M166 73 h10 l5 5 v12 h-15 z" fill="#fff" opacity=".85"/></g><text x="172" y="112" text-anchor="middle" class="srsm">received file</text><g><rect x="250" y="62" width="150" height="34" rx="3" class="srcs" stroke="#D63A2A"/><text x="325.0" y="84" text-anchor="middle" class="srmono">hwu4u25GB23</text></g><text x="325.0" y="112" text-anchor="middle" class="srsm">checksum from sender</text><line x1="172" y1="120" x2="172" y2="160" class="srarr" marker-end="url(#sra4)"/><g><rect x="97" y="164" width="150" height="48" rx="4" class="sralg"/><text x="172.0" y="184" text-anchor="middle" class="sralgt">Checksum</text><text x="172.0" y="202" text-anchor="middle" class="sralgt">algorithm</text></g><line x1="200" y1="214" x2="240" y2="250" class="srarr" marker-end="url(#sra4)"/><g><rect x="250" y="250" width="150" height="34" rx="3" class="srcs" stroke="#D63A2A"/><text x="325.0" y="272" text-anchor="middle" class="srmono">hwu4u25GB23</text></g><text x="325.0" y="300" text-anchor="middle" class="srsm">recalculated checksum</text><g><text x="520" y="117" text-anchor="middle" class="srlab"></text><circle cx="520" cy="168" r="24" fill="#2F7FC8"/><path d="M482 248 v-22 a38 35 0 0 1 76 0 v22 z" fill="#2F7FC8"/></g></svg></figure><figure class="srfig"><figcaption><b>Step 5</b><span>The receiver compares the two checksums. If they&#39;re identical, the file wasn&#39;t changed during transmission. If they&#39;re different, the file was corrupted, so the receiver asks for it to be sent again.</span></figcaption><div class=srtwo><div class="srpanel"><svg viewBox="0 0 320 260" role="img" aria-label="The two checksums match, so the data is error free"><defs><marker id="sra5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="srhead"/></marker></defs><rect x="0" y="0" width="320" height="260" rx="10" fill="var(--good-soft)"/><text x="160" y="30" text-anchor="middle" class="srlab">Checksums match</text><g><path d="M26 58 h16 l5 -6 h0 v0 M26 58" fill="none"/><path d="M26 52 h16 l5 6 h23 a3 3 0 0 1 3 3 v26 a3 3 0 0 1 -3 3 h-41 a3 3 0 0 1 -3 -3 v-32 a3 3 0 0 1 3 -3 z" fill="#3B8FE0"/><path d="M42 65 h10 l5 5 v12 h-15 z" fill="#fff" opacity=".85"/></g><line x1="48" y1="92" x2="48" y2="118" class="srarr" marker-end="url(#sra5)"/><g><rect x="20" y="122" width="120" height="48" rx="4" class="sralg"/><text x="80.0" y="142" text-anchor="middle" class="sralgt">Checksum</text><text x="80.0" y="160" text-anchor="middle" class="sralgt">algorithm</text></g><line x1="110" y1="172" x2="140" y2="196" class="srarr" marker-end="url(#sra5)"/><g><rect x="150" y="54" width="140" height="34" rx="3" class="srcs" stroke="#D63A2A"/><text x="220.0" y="76" text-anchor="middle" class="srmono">hwu4u25GB23</text></g><g><rect x="150" y="198" width="140" height="34" rx="3" class="srcs" stroke="#D63A2A"/><text x="220.0" y="220" text-anchor="middle" class="srmono">hwu4u25GB23</text></g><line x1="220" y1="94" x2="220" y2="192" class="srarr2" marker-start="url(#sra5)" marker-end="url(#sra5)"/><path d="M236 150 l14 14 l28 -34" fill="none" stroke="var(--good)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="srpanel"><svg viewBox="0 0 320 260" role="img" aria-label="The recalculated checksum gw56725GB23 does not match hwu4u25GB23, so an error has occurred"><defs><marker id="sra6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="srhead"/></marker></defs><rect x="0" y="0" width="320" height="260" rx="10" fill="var(--bad-soft)"/><text x="160" y="30" text-anchor="middle" class="srlab">Checksums don&#39;t match</text><g><path d="M26 58 h16 l5 -6 h0 v0 M26 58" fill="none"/><path d="M26 52 h16 l5 6 h23 a3 3 0 0 1 3 3 v26 a3 3 0 0 1 -3 3 h-41 a3 3 0 0 1 -3 -3 v-32 a3 3 0 0 1 3 -3 z" fill="#3B8FE0"/><path d="M42 65 h10 l5 5 v12 h-15 z" fill="#fff" opacity=".85"/></g><line x1="48" y1="92" x2="48" y2="118" class="srarr" marker-end="url(#sra6)"/><g><rect x="20" y="122" width="120" height="48" rx="4" class="sralg"/><text x="80.0" y="142" text-anchor="middle" class="sralgt">Checksum</text><text x="80.0" y="160" text-anchor="middle" class="sralgt">algorithm</text></g><line x1="110" y1="172" x2="140" y2="196" class="srarr" marker-end="url(#sra6)"/><g><rect x="150" y="54" width="140" height="34" rx="3" class="srcs" stroke="#D63A2A"/><text x="220.0" y="76" text-anchor="middle" class="srmono">hwu4u25GB23</text></g><g><rect x="150" y="198" width="140" height="34" rx="3" class="srcs" stroke="#D63A2A"/><text x="220.0" y="220" text-anchor="middle" class="srmono">gw56725GB23</text></g><line x1="220" y1="94" x2="220" y2="192" class="srarr2" marker-start="url(#sra6)" marker-end="url(#sra6)"/><path d="M238 128 l30 30 M268 128 l-30 30" stroke="var(--bad)" stroke-width="7" stroke-linecap="round"/></svg></div></div></figure>

<template id="th-2-2-echo">
<div class="theory airy">
<section>
    <h2>Echo checking</h2>
    <p>Echo checking lets the <b>sender</b> check whether the data was received correctly.</p>
    <h3>How it works</h3>
    <div class="stepline"><b>Step 1</b><span>The sender sends the data to the receiver.</span></div>
    <div class="stepline"><b>Step 2</b><span>The receiver automatically sends the data it received straight back to the sender.</span></div>
    <div class="stepline"><b>Step 3</b><span>The sender compares the data it sent with the data that came back.</span></div>
    <div class="stepline"><b>Step 4</b><span>If they don't match, an error in transmission has been found, and the data is sent again. If they match, the sender can be confident the data arrived correctly.</span></div>
    <h3>Visualise the process</h3>
<figure class="srfig"><figcaption><b>Step 1</b><span>The sender sends the data to the receiver.</span></figcaption><svg viewBox="0 0 640 170" role="img" aria-label="The sender sends the data to the receiver"><defs><marker id="sra7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="srhead"/></marker></defs><g><text x="80" y="68" text-anchor="middle" class="srlab">Sender</text><circle cx="80" cy="100" r="15" fill="#C8402F"/><path d="M56 150 v-14 a24 22 0 0 1 48 0 v14 z" fill="#C8402F"/></g><g><path d="M140 106 h16 l5 -6 h0 v0 M140 106" fill="none"/><path d="M140 100 h16 l5 6 h23 a3 3 0 0 1 3 3 v26 a3 3 0 0 1 -3 3 h-41 a3 3 0 0 1 -3 -3 v-32 a3 3 0 0 1 3 -3 z" fill="#3B8FE0"/><path d="M156 113 h10 l5 5 v12 h-15 z" fill="#fff" opacity=".85"/></g><text x="162" y="152" text-anchor="middle" class="srsm">original file</text><line x1="205" y1="118" x2="505" y2="118" class="srarr" marker-end="url(#sra7)"/><g><text x="560" y="68" text-anchor="middle" class="srlab">Receiver</text><circle cx="560" cy="100" r="15" fill="#2F7FC8"/><path d="M536 150 v-14 a24 22 0 0 1 48 0 v14 z" fill="#2F7FC8"/></g></svg></figure><figure class="srfig"><figcaption><b>Step 2</b><span>The data the receiver gets is automatically sent back to the sender.</span></figcaption><svg viewBox="0 0 640 200" role="img" aria-label="The receiver automatically sends the data it received back to the sender"><defs><marker id="sra8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="srhead"/></marker></defs><g><text x="80" y="83" text-anchor="middle" class="srlab">Sender</text><circle cx="80" cy="115" r="15" fill="#C8402F"/><path d="M56 165 v-14 a24 22 0 0 1 48 0 v14 z" fill="#C8402F"/></g><g><path d="M140 54 h16 l5 -6 h0 v0 M140 54" fill="none"/><path d="M140 48 h16 l5 6 h23 a3 3 0 0 1 3 3 v26 a3 3 0 0 1 -3 3 h-41 a3 3 0 0 1 -3 -3 v-32 a3 3 0 0 1 3 -3 z" fill="#3B8FE0"/><path d="M156 61 h10 l5 5 v12 h-15 z" fill="#fff" opacity=".85"/></g><text x="162" y="100" text-anchor="middle" class="srsm">returned file</text><g><path d="M140 124 h16 l5 -6 h0 v0 M140 124" fill="none"/><path d="M140 118 h16 l5 6 h23 a3 3 0 0 1 3 3 v26 a3 3 0 0 1 -3 3 h-41 a3 3 0 0 1 -3 -3 v-32 a3 3 0 0 1 3 -3 z" fill="#3B8FE0"/><path d="M156 131 h10 l5 5 v12 h-15 z" fill="#fff" opacity=".85"/></g><text x="162" y="170" text-anchor="middle" class="srsm">original file</text><line x1="200" y1="136" x2="440" y2="136" class="srarr" marker-end="url(#sra8)"/><g><path d="M450 124 h16 l5 -6 h0 v0 M450 124" fill="none"/><path d="M450 118 h16 l5 6 h23 a3 3 0 0 1 3 3 v26 a3 3 0 0 1 -3 3 h-41 a3 3 0 0 1 -3 -3 v-32 a3 3 0 0 1 3 -3 z" fill="#3B8FE0"/><path d="M466 131 h10 l5 5 v12 h-15 z" fill="#fff" opacity=".85"/></g><g><text x="560" y="83" text-anchor="middle" class="srlab">Receiver</text><circle cx="560" cy="115" r="15" fill="#2F7FC8"/><path d="M536 165 v-14 a24 22 0 0 1 48 0 v14 z" fill="#2F7FC8"/></g><polyline points="472,112 472,66 205,66" fill="none" class="srarr" marker-end="url(#sra8)"/></svg></figure><figure class="srfig"><figcaption><b>Step 3</b><span>The sender compares the data it sent with the data that was returned.</span></figcaption><svg viewBox="0 0 640 190" role="img" aria-label="The sender compares the returned file with the original file"><defs><marker id="sra9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="srhead"/></marker></defs><g><text x="250" y="68" text-anchor="middle" class="srlab">Sender</text><circle cx="250" cy="112" r="21" fill="#C8402F"/><path d="M217 182 v-19 a33 30 0 0 1 67 0 v19 z" fill="#C8402F"/></g><line x1="295" y1="110" x2="355" y2="80" class="srarr srsoft" marker-end="url(#sra9)"/><line x1="295" y1="140" x2="355" y2="160" class="srarr srsoft" marker-end="url(#sra9)"/><g><path d="M365 58 h16 l5 -6 h0 v0 M365 58" fill="none"/><path d="M365 52 h16 l5 6 h23 a3 3 0 0 1 3 3 v26 a3 3 0 0 1 -3 3 h-41 a3 3 0 0 1 -3 -3 v-32 a3 3 0 0 1 3 -3 z" fill="#3B8FE0"/><path d="M381 65 h10 l5 5 v12 h-15 z" fill="#fff" opacity=".85"/></g><text x="387" y="104" text-anchor="middle" class="srsm">returned file</text><g><path d="M365 138 h16 l5 -6 h0 v0 M365 138" fill="none"/><path d="M365 132 h16 l5 6 h23 a3 3 0 0 1 3 3 v26 a3 3 0 0 1 -3 3 h-41 a3 3 0 0 1 -3 -3 v-32 a3 3 0 0 1 3 -3 z" fill="#3B8FE0"/><path d="M381 145 h10 l5 5 v12 h-15 z" fill="#fff" opacity=".85"/></g><text x="387" y="184" text-anchor="middle" class="srsm">original file</text></svg></figure><figure class="srfig"><figcaption><b>Step 4</b><span>If they don&#39;t match, an error in transmission has been found and the data is sent again. If they match, the sender can be confident the data reached the receiver correctly.</span></figcaption><div class=srtwo><div class="srpanel"><svg viewBox="0 0 320 250" role="img" aria-label="The returned file is different from the original, so an error has been detected"><defs><marker id="sra10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="srhead"/></marker></defs><rect x="0" y="0" width="320" height="250" rx="10" fill="var(--bad-soft)"/><text x="160" y="30" text-anchor="middle" class="srlab">Files don&#39;t match</text><g><text x="80" y="88" text-anchor="middle" class="srlab"></text><circle cx="80" cy="120" r="15" fill="#C8402F"/><path d="M56 170 v-14 a24 22 0 0 1 48 0 v14 z" fill="#C8402F"/></g><line x1="118" y1="112" x2="170" y2="84" class="srarr" marker-end="url(#sra10)"/><line x1="118" y1="142" x2="170" y2="160" class="srarr" marker-end="url(#sra10)"/><g><path d="M180 64 h16 l5 -6 h0 v0 M180 64" fill="none"/><path d="M180 58 h16 l5 6 h23 a3 3 0 0 1 3 3 v26 a3 3 0 0 1 -3 3 h-41 a3 3 0 0 1 -3 -3 v-32 a3 3 0 0 1 3 -3 z" fill="#D23AB4"/><path d="M196 71 h10 l5 5 v12 h-15 z" fill="#fff" opacity=".85"/></g><text x="202" y="110" text-anchor="middle" class="srsm">returned file</text><g><path d="M180 140 h16 l5 -6 h0 v0 M180 140" fill="none"/><path d="M180 134 h16 l5 6 h23 a3 3 0 0 1 3 3 v26 a3 3 0 0 1 -3 3 h-41 a3 3 0 0 1 -3 -3 v-32 a3 3 0 0 1 3 -3 z" fill="#3B8FE0"/><path d="M196 147 h10 l5 5 v12 h-15 z" fill="#fff" opacity=".85"/></g><text x="202" y="186" text-anchor="middle" class="srsm">original file</text><path d="M140 206 l30 30 M170 206 l-30 30" stroke="var(--bad)" stroke-width="7" stroke-linecap="round"/></svg></div><div class="srpanel"><svg viewBox="0 0 320 250" role="img" aria-label="The returned file matches the original, so the data arrived correctly"><defs><marker id="sra11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="srhead"/></marker></defs><rect x="0" y="0" width="320" height="250" rx="10" fill="var(--good-soft)"/><text x="160" y="30" text-anchor="middle" class="srlab">Files match</text><g><text x="80" y="88" text-anchor="middle" class="srlab"></text><circle cx="80" cy="120" r="15" fill="#C8402F"/><path d="M56 170 v-14 a24 22 0 0 1 48 0 v14 z" fill="#C8402F"/></g><line x1="118" y1="112" x2="170" y2="84" class="srarr" marker-end="url(#sra11)"/><line x1="118" y1="142" x2="170" y2="160" class="srarr" marker-end="url(#sra11)"/><g><path d="M180 64 h16 l5 -6 h0 v0 M180 64" fill="none"/><path d="M180 58 h16 l5 6 h23 a3 3 0 0 1 3 3 v26 a3 3 0 0 1 -3 3 h-41 a3 3 0 0 1 -3 -3 v-32 a3 3 0 0 1 3 -3 z" fill="#3B8FE0"/><path d="M196 71 h10 l5 5 v12 h-15 z" fill="#fff" opacity=".85"/></g><text x="202" y="110" text-anchor="middle" class="srsm">returned file</text><g><path d="M180 140 h16 l5 -6 h0 v0 M180 140" fill="none"/><path d="M180 134 h16 l5 6 h23 a3 3 0 0 1 3 3 v26 a3 3 0 0 1 -3 3 h-41 a3 3 0 0 1 -3 -3 v-32 a3 3 0 0 1 3 -3 z" fill="#3B8FE0"/><path d="M196 147 h10 l5 5 v12 h-15 z" fill="#fff" opacity=".85"/></g><text x="202" y="186" text-anchor="middle" class="srsm">original file</text><path d="M130 226 l14 14 l28 -34" fill="none" stroke="var(--good)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div></figure>
    <h3>Try it yourself</h3>
    <p>Send a message, then add an error on the way to the receiver or on the way back:</p>
    <div class="echodemo" id="echodemo"></div>
    <div class="callout warnbox"><span class="k">Possible issues</span>
     <p>The data has to be transmitted <b>twice</b> before the check is complete. If the copies don't match, the sender can't tell whether the error happened on the way <b>to</b> the receiver or on the way <b>back</b>.</p>
     <p>If the error happened on the way back, the receiver actually got the data correctly, but the sender will think there was an error and send it again anyway. Try <b>Error on the way back</b> above to see this happen.</p></div>
 </section>
</div>

<template id="th-2-2-checkdigits">
<div class="theory airy">
<section>
    <h2>Check digits</h2>
    <p>A <b>check digit</b> is an extra digit added to the end of a string of numbers. It's calculated by putting the other digits through an algorithm, and the result is added to the end.</p>
    <p>When the number is transmitted or typed in, the same algorithm is run again. If it produces the same check digit, you can safely assume the data was entered correctly. If the digits don't match, an error has occurred. Check digits are especially good at catching <b>data entry errors</b>, such as a mistyped digit or two digits swapped round.</p>
    <p>Check digits are used in barcodes, ISBNs on books and credit card numbers. In this barcode, the check digit is the rightmost digit, <b>3</b>:</p>
    <div class="barcode" id="barcode"></div>
    <h3>Example: the Modulo 10 algorithm</h3>
    <p>Barcode check digits are calculated with the <b>Modulo 10</b> algorithm. Let's check the barcode above. If it's correct, we should get 3.</p>
    <div class="stepline"><b>Step 1</b><span>Starting from the leftmost digit, multiply each digit by 1 and 3 alternately.</span></div>
    <div class="stepline"><b>Step 2</b><span>Add up all the results: here the total is <b>47</b>.</span></div>
    <div class="stepline"><b>Step 3</b><span>Divide the total by 10 and find the remainder: 47 ÷ 10 = 4 remainder <b>7</b>.</span></div>
    <div class="stepline"><b>Step 4</b><span>Subtract the remainder from 10: 10 − 7 = <b>3</b>. If the remainder is 0, the check digit is 0.</span></div>
    <p>The result is <b>3</b>, which matches the check digit, so the barcode is correct. Change the digits below to try your own:</p>

 </section>
</div>

<template id="th-2-2-arq">
<div class="theory airy">
<section>
    <h2>ARQ: Automatic Repeat reQuest</h2>
    <p>ARQ is a system set up between the sender and the receiver so that both know about any errors that happen during transmission, and the right steps are taken to fix them. It uses <b>acknowledgements</b> and a <b>timeout</b>.</p>
    <h3>How it works</h3>
    <div class="stepline"><b>Step 1</b><span>At the start of the transmission, the sender starts a timer, for example 10 seconds.</span></div>
    <div class="stepline"><b>Step 2</b><span>The data is sent.</span></div>
    <div class="stepline"><b>Step 3</b><span>The receiver checks the data, usually with an error check such as parity or a checksum. If the data arrives correctly, the receiver sends a <b>positive acknowledgement</b> back to the sender, and the transmission is complete.</span></div>
    <div class="stepline"><b>Step 4</b><span>If the data has an error, the receiver sends a <b>negative acknowledgement</b>, or nothing at all.</span></div>
    <div class="stepline"><b>Step 5</b><span>If the timer runs out and no positive acknowledgement has arrived, the sender automatically sends the data again. This repeats until it's acknowledged, or a set number of attempts is reached.</span></div>
    <h3>ARQ as a flowchart</h3>
    <div class="flow" role="img" aria-label="Flowchart: send data and start the timer. Did a positive acknowledgement arrive before the timeout? Yes: transmission complete. No: resend the data and restart the timer.">
     <div class="fl term">Start</div><div class="fl arr">↓</div>
     <div class="fl proc">Send data and start the timer</div><div class="fl arr">↓</div>
     <div class="fl dec"><span>Positive acknowledgement received before the timeout?</span></div>
     <div class="flsplit"><div><span class="fllab yes">Yes</span><div class="fl arr">↓</div><div class="fl term ok">Transmission complete</div></div><div><span class="fllab no">No</span><div class="fl arr">↓</div><div class="fl proc">Resend the data and restart the timer</div><div class="fl arr">↺ back to the question</div></div></div>
    </div>
    <h3>See it happen</h3>

 </section>
</div>
