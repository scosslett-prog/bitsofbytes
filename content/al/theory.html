<template id="th-a8-2-stackqueue">
<div class="theory airy">
 <section>
  <h2>Fixed-length structures</h2>
  <p>A Python list can grow forever with <span class="mono">append()</span>, but the specification asks you to build stacks and queues in <b>fixed-length</b> lists, as they would be in an array. You create the list at its full size and keep <b>pointers</b> to track where the data is.</p>
  <pre class="pc py" data-run data-t="Try it: a fixed-length list">SIZE = 5
stack = [None] * SIZE
print(stack, len(stack))</pre>
  <p>Each structure needs three helper functions: <b>IsEmpty</b>, <b>IsFull</b> and <b>Size</b>. Check them <b>before</b> every push or pop so the pointers never go out of range.</p>
 </section>
 <section>
  <h2>A stack</h2>
  <p>A stack is <b>last in, first out</b>. One pointer, <span class="mono">top</span>, holds the index of the top item, and starts at −1 when the stack is empty.</p>
  <div class="alw" data-w="stack"></div>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Function</th><th>Test</th></tr>
   <tr><td>IsEmpty</td><td class="mono">top == -1</td></tr>
   <tr><td>IsFull</td><td class="mono">top == SIZE - 1</td></tr>
   <tr><td>Size</td><td class="mono">top + 1</td></tr></table></div>
  <div class="alw" data-w="trace" data-vars="top,stack" data-title="Try it: push and pop" data-steps='[{"e":"line","line":1,"stack":[{"fn":"&lt;module>","loc":{}}],"out":"","ret":null},{"e":"line","line":2,"stack":[{"fn":"&lt;module>","loc":{"SIZE":"3"}}],"out":"","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{"SIZE":"3","stack":"[None, None, None]"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{"SIZE":"3","stack":"[None, None, None]","top":"-1"}}],"out":"","ret":null},{"e":"line","line":5,"stack":[{"fn":"&lt;module>","loc":{"SIZE":"3","stack":"[None, None, None]","top":"-1","item":"&#39;a&#39;"}}],"out":"","ret":null},{"e":"line","line":8,"stack":[{"fn":"&lt;module>","loc":{"SIZE":"3","stack":"[None, None, None]","top":"-1","item":"&#39;a&#39;"}}],"out":"","ret":null},{"e":"line","line":9,"stack":[{"fn":"&lt;module>","loc":{"SIZE":"3","stack":"[None, None, None]","top":"0","item":"&#39;a&#39;"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{"SIZE":"3","stack":"[&#39;a&#39;, None, None]","top":"0","item":"&#39;a&#39;"}}],"out":"","ret":null},{"e":"line","line":5,"stack":[{"fn":"&lt;module>","loc":{"SIZE":"3","stack":"[&#39;a&#39;, None, None]","top":"0","item":"&#39;b&#39;"}}],"out":"","ret":null},{"e":"line","line":8,"stack":[{"fn":"&lt;module>","loc":{"SIZE":"3","stack":"[&#39;a&#39;, None, None]","top":"0","item":"&#39;b&#39;"}}],"out":"","ret":null},{"e":"line","line":9,"stack":[{"fn":"&lt;module>","loc":{"SIZE":"3","stack":"[&#39;a&#39;, None, None]","top":"1","item":"&#39;b&#39;"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{"SIZE":"3","stack":"[&#39;a&#39;, &#39;b&#39;, None]","top":"1","item":"&#39;b&#39;"}}],"out":"","ret":null},{"e":"line","line":5,"stack":[{"fn":"&lt;module>","loc":{"SIZE":"3","stack":"[&#39;a&#39;, &#39;b&#39;, None]","top":"1","item":"&#39;c&#39;"}}],"out":"","ret":null},{"e":"line","line":8,"stack":[{"fn":"&lt;module>","loc":{"SIZE":"3","stack":"[&#39;a&#39;, &#39;b&#39;, None]","top":"1","item":"&#39;c&#39;"}}],"out":"","ret":null},{"e":"line","line":9,"stack":[{"fn":"&lt;module>","loc":{"SIZE":"3","stack":"[&#39;a&#39;, &#39;b&#39;, None]","top":"2","item":"&#39;c&#39;"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{"SIZE":"3","stack":"[&#39;a&#39;, &#39;b&#39;, &#39;c&#39;]","top":"2","item":"&#39;c&#39;"}}],"out":"","ret":null},{"e":"line","line":5,"stack":[{"fn":"&lt;module>","loc":{"SIZE":"3","stack":"[&#39;a&#39;, &#39;b&#39;, &#39;c&#39;]","top":"2","item":"&#39;d&#39;"}}],"out":"","ret":null},{"e":"line","line":6,"stack":[{"fn":"&lt;module>","loc":{"SIZE":"3","stack":"[&#39;a&#39;, &#39;b&#39;, &#39;c&#39;]","top":"2","item":"&#39;d&#39;"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{"SIZE":"3","stack":"[&#39;a&#39;, &#39;b&#39;, &#39;c&#39;]","top":"2","item":"&#39;d&#39;"}}],"out":"Full, can&#39;t push d\n","ret":null},{"e":"line","line":10,"stack":[{"fn":"&lt;module>","loc":{"SIZE":"3","stack":"[&#39;a&#39;, &#39;b&#39;, &#39;c&#39;]","top":"2","item":"&#39;d&#39;"}}],"out":"Full, can&#39;t push d\n","ret":null},{"e":"line","line":11,"stack":[{"fn":"&lt;module>","loc":{"SIZE":"3","stack":"[&#39;a&#39;, &#39;b&#39;, &#39;c&#39;]","top":"2","item":"&#39;d&#39;"}}],"out":"Full, can&#39;t push d\n","ret":null},{"e":"line","line":12,"stack":[{"fn":"&lt;module>","loc":{"SIZE":"3","stack":"[&#39;a&#39;, &#39;b&#39;, &#39;c&#39;]","top":"2","item":"&#39;d&#39;"}}],"out":"Full, can&#39;t push d\nPop c\n","ret":null},{"e":"line","line":13,"stack":[{"fn":"&lt;module>","loc":{"SIZE":"3","stack":"[&#39;a&#39;, &#39;b&#39;, None]","top":"2","item":"&#39;d&#39;"}}],"out":"Full, can&#39;t push d\nPop c\n","ret":null},{"e":"line","line":10,"stack":[{"fn":"&lt;module>","loc":{"SIZE":"3","stack":"[&#39;a&#39;, &#39;b&#39;, None]","top":"1","item":"&#39;d&#39;"}}],"out":"Full, can&#39;t push d\nPop c\n","ret":null},{"e":"line","line":11,"stack":[{"fn":"&lt;module>","loc":{"SIZE":"3","stack":"[&#39;a&#39;, &#39;b&#39;, None]","top":"1","item":"&#39;d&#39;"}}],"out":"Full, can&#39;t push d\nPop c\n","ret":null},{"e":"line","line":12,"stack":[{"fn":"&lt;module>","loc":{"SIZE":"3","stack":"[&#39;a&#39;, &#39;b&#39;, None]","top":"1","item":"&#39;d&#39;"}}],"out":"Full, can&#39;t push d\nPop c\nPop b\n","ret":null},{"e":"line","line":13,"stack":[{"fn":"&lt;module>","loc":{"SIZE":"3","stack":"[&#39;a&#39;, None, None]","top":"1","item":"&#39;d&#39;"}}],"out":"Full, can&#39;t push d\nPop c\nPop b\n","ret":null},{"e":"line","line":10,"stack":[{"fn":"&lt;module>","loc":{"SIZE":"3","stack":"[&#39;a&#39;, None, None]","top":"0","item":"&#39;d&#39;"}}],"out":"Full, can&#39;t push d\nPop c\nPop b\n","ret":null},{"e":"line","line":11,"stack":[{"fn":"&lt;module>","loc":{"SIZE":"3","stack":"[&#39;a&#39;, None, None]","top":"0","item":"&#39;d&#39;"}}],"out":"Full, can&#39;t push d\nPop c\nPop b\n","ret":null},{"e":"line","line":12,"stack":[{"fn":"&lt;module>","loc":{"SIZE":"3","stack":"[&#39;a&#39;, None, None]","top":"0","item":"&#39;d&#39;"}}],"out":"Full, can&#39;t push d\nPop c\nPop b\nPop a\n","ret":null},{"e":"line","line":13,"stack":[{"fn":"&lt;module>","loc":{"SIZE":"3","stack":"[None, None, None]","top":"0","item":"&#39;d&#39;"}}],"out":"Full, can&#39;t push d\nPop c\nPop b\nPop a\n","ret":null},{"e":"line","line":10,"stack":[{"fn":"&lt;module>","loc":{"SIZE":"3","stack":"[None, None, None]","top":"-1","item":"&#39;d&#39;"}}],"out":"Full, can&#39;t push d\nPop c\nPop b\nPop a\n","ret":null},{"e":"end","line":null,"stack":[],"out":"Full, can&#39;t push d\nPop c\nPop b\nPop a\n","ret":null}]'><pre>SIZE = 3
stack = [None] * SIZE
top = -1
for item in ["a", "b", "c", "d"]:
    if top == SIZE - 1:
        print("Full, can't push", item)
    else:
        top = top + 1
        stack[top] = item
while top != -1:
    print("Pop", stack[top])
    stack[top] = None
    top = top - 1</pre></div>
  <div class="callout tip"><span class="k">Overflow and underflow</span><p>Pushing onto a full stack is <b>overflow</b>; popping from an empty one is <b>underflow</b>. Your functions should detect both and report them (for example by returning False or None) rather than crashing.</p></div>
 </section>
 <section>
  <h2>A queue</h2>
  <p>A queue is <b>first in, first out</b>. Items join at the <b>rear</b> and leave from the <b>front</b>. In a <b>circular</b> queue the pointers wrap back to 0 after the last index, so spaces freed at the front are reused. A <span class="mono">count</span> variable makes IsEmpty, IsFull and Size simple.</p>
  <div class="alw" data-w="queue"></div>
  <pre class="pc py" data-run data-t="Try it: a circular queue">SIZE = 3
queue = [None] * SIZE
front, rear, count = 0, -1, 0

def enqueue(item):
    global rear, count
    if count == SIZE:
        print("Full, can't add", item)
        return
    rear = (rear + 1) % SIZE
    queue[rear] = item
    count += 1

def dequeue():
    global front, count
    if count == 0:
        return None
    item = queue[front]
    front = (front + 1) % SIZE
    count -= 1
    return item

for x in ["A", "B", "C", "D"]:
    enqueue(x)
print("Out:", dequeue(), dequeue())
enqueue("E")
print(queue, "front =", front, "rear =", rear)
print("Out:", dequeue(), dequeue(), dequeue(), dequeue())</pre>
  <div class="callout warnbox"><span class="k">Remember global</span><p>A function that changes a pointer stored outside it needs <span class="mono">global top</span> (or <span class="mono">global front, count</span>). Without it, Python makes a new local variable and raises an UnboundLocalError.</p></div>
 </section>
</div>
</template>

<template id="th-a8-3-sqlcreate">
<div class="theory airy">
 <section>
  <h2>Databases from Python</h2>
  <p>A text file is fine for a short list, but searching, sorting and linking larger amounts of data is far easier in a <b>relational database</b>. Python's built-in <span class="mono">sqlite3</span> library lets a program create and use an SQLite database, which is stored as a single file. You talk to it in <b>SQL</b>.</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Step</th><th>Python</th></tr>
   <tr><td>1. Load the library</td><td class="mono">import sqlite3</td></tr>
   <tr><td>2. Connect (creates the file if it's new)</td><td class="mono">con = sqlite3.connect("pets.db")</td></tr>
   <tr><td>3. Make a cursor</td><td class="mono">cur = con.cursor()</td></tr>
   <tr><td>4. Run SQL</td><td class="mono">cur.execute("…")</td></tr>
   <tr><td>5. Save changes</td><td class="mono">con.commit()</td></tr>
   <tr><td>6. Finish</td><td class="mono">con.close()</td></tr></table></div>
  <div class="callout tip"><span class="k">In these lessons</span><p>The examples connect to <span class="mono">":memory:"</span>, a database held in RAM that disappears when the program ends, so every run starts fresh. In the exam you'll usually be given a <span class="mono">.db</span> file name instead; the code is otherwise the same.</p></div>
 </section>
 <section>
  <h2>Creating tables</h2>
  <p><span class="mono">CREATE TABLE</span> names the table and lists its fields, each with a data type. SQLite's main types are <b>INTEGER</b>, <b>REAL</b> and <b>TEXT</b>.</p>
  <pre class="pc py" data-run data-t="Try it: create two linked tables">import sqlite3
con = sqlite3.connect(":memory:")
cur = con.cursor()

cur.execute("""CREATE TABLE Owner (
    OwnerID INTEGER PRIMARY KEY,
    Name TEXT,
    Town TEXT)""")

cur.execute("""CREATE TABLE Pet (
    PetID INTEGER PRIMARY KEY,
    Name TEXT,
    Species TEXT,
    Age INTEGER,
    OwnerID INTEGER,
    FOREIGN KEY (OwnerID) REFERENCES Owner(OwnerID))""")
con.commit()

for row in cur.execute("SELECT name FROM sqlite_master WHERE type = 'table'"):
    print("Table:", row[0])
for col in cur.execute("PRAGMA table_info(Pet)"):
    print(" ", col[1], col[2], "(primary key)" if col[5] else "")
con.close()</pre>
  <p>The <b>primary key</b> uniquely identifies each record. The <b>foreign key</b> <span class="mono">Pet.OwnerID</span> holds an owner's primary key, which links every pet to one owner: a <b>one-to-many</b> relationship (one owner, many pets).</p>
  <div class="alw" data-w="erd"></div>
  <div class="callout warnbox"><span class="k">A common mistake!</span><p>Running <span class="mono">CREATE TABLE</span> on a table that already exists raises an error, which is a problem when a program is run a second time on the same file. Write <span class="mono">CREATE TABLE IF NOT EXISTS</span> to avoid it.</p></div>
 </section>
 <section>
  <h2>The tables used in this section</h2>
  <p>The rest of 8.3 uses these two tables.</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th colspan="3">Owner</th></tr><tr><th>OwnerID</th><th>Name</th><th>Town</th></tr><tr><td>1</td><td>Ana</td><td>Leeds</td></tr><tr><td>2</td><td>Ben</td><td>York</td></tr><tr><td>3</td><td>Cai</td><td>Leeds</td></tr></table></div>
  <div class="tscroll"><table class="pvt deftab"><tr><th colspan="5">Pet</th></tr><tr><th>PetID</th><th>Name</th><th>Species</th><th>Age</th><th>OwnerID</th></tr><tr><td>1</td><td>Rex</td><td>Dog</td><td>5</td><td>1</td></tr><tr><td>2</td><td>Tom</td><td>Cat</td><td>3</td><td>1</td></tr><tr><td>3</td><td>Bubbles</td><td>Fish</td><td>1</td><td>2</td></tr><tr><td>4</td><td>Luna</td><td>Cat</td><td>8</td><td>3</td></tr><tr><td>5</td><td>Max</td><td>Dog</td><td>2</td><td>3</td></tr></table></div>
 </section>
</div>
</template>

<template id="th-a8-3-sqlmodify">
<div class="theory airy">
 <section>
  <h2>Inserting records</h2>
  <p><span class="mono">INSERT INTO</span> adds a record. Values come from Python through <b>? placeholders</b>, passed as a tuple after the SQL. <span class="mono">executemany()</span> runs the same statement for every tuple in a list.</p>
  <pre class="pc py" data-run data-t="Try it: inserting records">import sqlite3
con = sqlite3.connect(":memory:")
cur = con.cursor()
cur.execute("CREATE TABLE Owner (OwnerID INTEGER PRIMARY KEY, Name TEXT, Town TEXT)")

cur.execute("INSERT INTO Owner VALUES (?, ?, ?)", (1, "Ana", "Leeds"))
owners = [(2, "Ben", "York"), (3, "Cai", "Leeds")]
cur.executemany("INSERT INTO Owner VALUES (?, ?, ?)", owners)
cur.execute("INSERT INTO Owner (Name) VALUES (?)", ("Dev",))  # ID chosen for us
con.commit()

print(cur.execute("SELECT * FROM Owner").fetchall())</pre>
  <div class="callout tip"><span class="k">A tuple of one</span><p>A single value still has to be passed as a tuple, so it needs a trailing comma: <span class="mono">("Dev",)</span>. Without it, <span class="mono">("Dev")</span> is just a string in brackets.</p></div>
 </section>
 <section>
  <h2>Why placeholders matter</h2>
  <p>It's tempting to build SQL by joining strings, but if the value comes from a user they can type text that changes the meaning of the statement. This is <b>SQL injection</b>. Placeholders pass the value separately, so it's always treated as data, never as SQL.</p>
  <pre class="pc py" data-run data-t="Try it: an injection attack" data-stdin="x' OR '1'='1">import sqlite3
con = sqlite3.connect(":memory:")
cur = con.cursor()
cur.execute("CREATE TABLE Users (Name TEXT, Secret TEXT)")
cur.executemany("INSERT INTO Users VALUES (?, ?)", [("ana", "cat123"), ("ben", "pa55")])

name = input("Username: ")
unsafe = "SELECT * FROM Users WHERE Name = '" + name + "'"
print("Joined into the SQL:", cur.execute(unsafe).fetchall())
safe = cur.execute("SELECT * FROM Users WHERE Name = ?", (name,)).fetchall()
print("With a placeholder:", safe)</pre>
 </section>
 <section>
  <h2>Updating and deleting</h2>
  <p><span class="mono">UPDATE</span> changes fields and <span class="mono">DELETE</span> removes whole records. The <span class="mono">WHERE</span> clause chooses which records are affected. <span class="mono">cur.rowcount</span> tells you how many were changed.</p>
  <pre class="pc py" data-run data-t="Try it: update and delete">import sqlite3
con = sqlite3.connect(":memory:")
cur = con.cursor()
cur.execute("CREATE TABLE Pet (PetID INTEGER PRIMARY KEY, Name TEXT, Species TEXT, Age INTEGER)")
cur.executemany("INSERT INTO Pet VALUES (?, ?, ?, ?)",
    [(1, "Rex", "Dog", 5), (2, "Tom", "Cat", 3), (3, "Bubbles", "Fish", 1), (4, "Luna", "Cat", 8)])

cur.execute("UPDATE Pet SET Age = Age + 1 WHERE Species = 'Cat'")
print("Updated", cur.rowcount, "rows")
cur.execute("DELETE FROM Pet WHERE Name = ?", ("Bubbles",))
print("Deleted", cur.rowcount, "row")
con.commit()
for row in cur.execute("SELECT * FROM Pet"):
    print(row)</pre>
  <div class="callout warnbox"><span class="k">Forget WHERE at your peril</span><p><span class="mono">UPDATE Pet SET Age = 1</span> sets <b>every</b> pet's age to 1, and <span class="mono">DELETE FROM Pet</span> empties the whole table. Always check the WHERE clause before you run a change.</p></div>
  <div class="callout tip"><span class="k">Commit</span><p>Changes aren't written to the file until <span class="mono">con.commit()</span>. If the program crashes first, they are lost. Reading data with SELECT doesn't need a commit.</p></div>
 </section>
</div>
</template>

<template id="th-a8-3-sqlselect">
<div class="theory airy">
 <section>
  <h2>SELECT queries</h2>
  <p>A query is built from clauses that always come in this order. Only SELECT and FROM are required.</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Clause</th><th>Job</th><th>Example</th></tr>
   <tr><td class="mono">SELECT</td><td>Which fields</td><td class="mono">SELECT Name, Age</td></tr>
   <tr><td class="mono">FROM</td><td>Which table</td><td class="mono">FROM Pet</td></tr>
   <tr><td class="mono">WHERE</td><td>Which records</td><td class="mono">WHERE Species = 'Cat'</td></tr>
   <tr><td class="mono">ORDER BY</td><td>Sort order</td><td class="mono">ORDER BY Age DESC</td></tr></table></div>
  <p>In Python, <span class="mono">fetchall()</span> returns the result as a <b>list of tuples</b>, one tuple per row. <span class="mono">fetchone()</span> returns just the next row, or <span class="mono">None</span>. You can also loop straight over the cursor.</p>
  <pre class="pc py" data-run data-t="Try it: queries on the Pet table">import sqlite3
con = sqlite3.connect(":memory:")
cur = con.cursor()
cur.execute("CREATE TABLE Pet (PetID INTEGER PRIMARY KEY, Name TEXT, Species TEXT, Age INTEGER, OwnerID INTEGER)")
cur.executemany("INSERT INTO Pet VALUES (?, ?, ?, ?, ?)", [(1, "Rex", "Dog", 5, 1),
    (2, "Tom", "Cat", 3, 1), (3, "Bubbles", "Fish", 1, 2), (4, "Luna", "Cat", 8, 3), (5, "Max", "Dog", 2, 3)])

print(cur.execute("SELECT Name, Age FROM Pet WHERE Species = 'Cat'").fetchall())
print(cur.execute("SELECT Name FROM Pet ORDER BY Age DESC").fetchone())
for name, age in cur.execute("SELECT Name, Age FROM Pet WHERE Age BETWEEN 2 AND 5 ORDER BY Name"):
    print(f"{name} is {age}")</pre>
 </section>
 <section>
  <h2>Conditions</h2>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Condition</th><th>Meaning</th></tr>
   <tr><td class="mono">= &lt;&gt; &lt; &gt; &lt;= &gt;=</td><td>Comparisons (<span class="mono">&lt;&gt;</span> or <span class="mono">!=</span> means not equal)</td></tr>
   <tr><td class="mono">AND / OR / NOT</td><td>Combine conditions</td></tr>
   <tr><td class="mono">BETWEEN 2 AND 5</td><td>In the range, including both ends</td></tr>
   <tr><td class="mono">LIKE 'B%'</td><td>Pattern: % is any number of characters, _ is exactly one</td></tr>
   <tr><td class="mono">IN ('Cat', 'Dog')</td><td>Matches any value in the list</td></tr></table></div>
  <pre class="pc py" data-run data-t="Try it: search with input" data-stdin="b">import sqlite3
con = sqlite3.connect(":memory:")
cur = con.cursor()
cur.execute("CREATE TABLE Pet (Name TEXT, Species TEXT, Age INTEGER)")
cur.executemany("INSERT INTO Pet VALUES (?, ?, ?)", [("Rex", "Dog", 5),
    ("Tom", "Cat", 3), ("Bubbles", "Fish", 1), ("Luna", "Cat", 8), ("Max", "Dog", 2)])

start = input("Names starting with: ")
rows = cur.execute("SELECT Name FROM Pet WHERE Name LIKE ? ORDER BY Name", (start + "%",)).fetchall()
if rows:
    print("Found:", ", ".join(r[0] for r in rows))
else:
    print("None found")</pre>
  <div class="callout tip"><span class="k">Getting plain values out</span><p>Each row is a tuple even when you select one field, so <span class="mono">[('Rex',), ('Max',)]</span> needs turning into a plain list: <span class="mono">[row[0] for row in rows]</span>.</p></div>
 </section>
</div>
</template>

<template id="th-a8-3-sqljoin">
<div class="theory airy">
 <section>
  <h2>Aggregate functions</h2>
  <p>An <b>aggregate function</b> works on many rows and returns a single value. With <span class="mono">GROUP BY</span>, it returns one value for each group instead.</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Function</th><th>Returns</th><th>On the Pet table</th></tr>
   <tr><td class="mono">COUNT(*)</td><td>Number of rows</td><td class="mono">5</td></tr>
   <tr><td class="mono">SUM(Age)</td><td>Total</td><td class="mono">19</td></tr>
   <tr><td class="mono">AVG(Age)</td><td>Mean</td><td class="mono">3.8</td></tr>
   <tr><td class="mono">MIN(Age) / MAX(Age)</td><td>Smallest / largest</td><td class="mono">1 / 8</td></tr></table></div>
  <pre class="pc py" data-run data-t="Try it: aggregates and GROUP BY">import sqlite3
con = sqlite3.connect(":memory:")
cur = con.cursor()
cur.execute("CREATE TABLE Pet (PetID INTEGER PRIMARY KEY, Name TEXT, Species TEXT, Age INTEGER, OwnerID INTEGER)")
cur.executemany("INSERT INTO Pet VALUES (?, ?, ?, ?, ?)", [(1, "Rex", "Dog", 5, 1),
    (2, "Tom", "Cat", 3, 1), (3, "Bubbles", "Fish", 1, 2), (4, "Luna", "Cat", 8, 3), (5, "Max", "Dog", 2, 3)])

n, total, mean = cur.execute("SELECT COUNT(*), SUM(Age), AVG(Age) FROM Pet").fetchone()
print(n, "pets, total age", total, "mean", mean)
print("Cats:", cur.execute("SELECT COUNT(*) FROM Pet WHERE Species = 'Cat'").fetchone()[0])
for species, count, oldest in cur.execute(
        "SELECT Species, COUNT(*), MAX(Age) FROM Pet GROUP BY Species ORDER BY Species"):
    print(f"{species}: {count}, oldest {oldest}")</pre>
  <div class="callout tip"><span class="k">One value back</span><p>An aggregate query still returns a row tuple, so a single total needs <span class="mono">fetchone()[0]</span>.</p></div>
 </section>
 <section>
  <h2>Joining tables</h2>
  <p>The owner's name isn't in the Pet table, only their OwnerID. An <b>INNER JOIN</b> combines each pet with the owner whose primary key matches the pet's foreign key. When both tables have a field with the same name, write <span class="mono">Table.Field</span> to say which you mean.</p>
  <pre class="pc py" data-run data-t="Try it: joining Pet and Owner" data-stdin="Leeds">import sqlite3
con = sqlite3.connect(":memory:")
cur = con.cursor()
cur.execute("CREATE TABLE Owner (OwnerID INTEGER PRIMARY KEY, Name TEXT, Town TEXT)")
cur.execute("CREATE TABLE Pet (PetID INTEGER PRIMARY KEY, Name TEXT, Species TEXT, Age INTEGER, OwnerID INTEGER)")
cur.executemany("INSERT INTO Owner VALUES (?, ?, ?)", [(1, "Ana", "Leeds"), (2, "Ben", "York"), (3, "Cai", "Leeds")])
cur.executemany("INSERT INTO Pet VALUES (?, ?, ?, ?, ?)", [(1, "Rex", "Dog", 5, 1),
    (2, "Tom", "Cat", 3, 1), (3, "Bubbles", "Fish", 1, 2), (4, "Luna", "Cat", 8, 3), (5, "Max", "Dog", 2, 3)])

town = input("Town: ")
rows = cur.execute("""SELECT Pet.Name, Pet.Species, Owner.Name
                      FROM Pet INNER JOIN Owner ON Pet.OwnerID = Owner.OwnerID
                      WHERE Owner.Town = ?
                      ORDER BY Pet.Name""", (town,)).fetchall()
for pet, species, owner in rows:
    print(f"{pet} the {species.lower()} belongs to {owner}")

print(cur.execute("""SELECT Owner.Name, COUNT(*) FROM Owner
                     INNER JOIN Pet ON Pet.OwnerID = Owner.OwnerID
                     GROUP BY Owner.Name""").fetchall())</pre>
  <div class="callout warnbox"><span class="k">A common mistake!</span><p>Leaving out the <span class="mono">ON</span> condition (or writing <span class="mono">FROM Pet, Owner</span> with no WHERE linking them) pairs <b>every</b> pet with <b>every</b> owner: 5 × 3 = 15 rows of nonsense.</p></div>
 </section>
</div>
</template>

<template id="th-a9-1-design">
<div class="theory airy">
 <section>
  <h2>Correct outcomes come from design</h2>
  <p>In the Unit 2 exam you're given a task and must produce a program that does exactly what it asks. Most mistakes come from starting to type before you've understood the problem. A few minutes of design saves a lot of debugging.</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Step</th><th>Questions to ask</th></tr>
   <tr><td>Requirements</td><td>What exactly must the program do? What counts as correct? Are there limits (ranges, formats, sizes)?</td></tr>
   <tr><td>Inputs</td><td>What data comes in, from the user, a file or a database? What type is it, and could it be invalid?</td></tr>
   <tr><td>Processing</td><td>What calculations, decisions and repeats are needed? In what order?</td></tr>
   <tr><td>Outputs</td><td>What must be displayed or saved, and in exactly what format?</td></tr>
   <tr><td>Test cases</td><td>For a few inputs, what should the output be? Work these out <b>before</b> you code.</td></tr></table></div>
 </section>
 <section>
  <h2>Decomposition</h2>
  <p><b>Decomposition</b> breaks a problem into sub-problems until each is small enough to write and test on its own. Each sub-problem usually becomes a subprogram.</p>
  <figure class="dgwrap"><svg class="dg" viewBox="0 0 600 190" role="img" aria-label="A cinema booking program decomposed into sub-problems">
   <rect x="210" y="10" width="180" height="40" rx="8" class="bi"/><text x="300" y="35" class="c">Cinema booking</text>
   <line x1="300" y1="50" x2="100" y2="80" class="l"/><line x1="300" y1="50" x2="300" y2="80" class="l"/><line x1="300" y1="50" x2="500" y2="80" class="l"/>
   <rect x="20" y="80" width="160" height="40" rx="8" class="b2"/><text x="100" y="105" class="c">Get the group's ages</text>
   <rect x="220" y="80" width="160" height="40" rx="8" class="b2"/><text x="300" y="105" class="c">Work out the price</text>
   <rect x="420" y="80" width="160" height="40" rx="8" class="b2"/><text x="500" y="105" class="c">Book the seats</text>
   <line x1="300" y1="120" x2="230" y2="140" class="l"/><line x1="300" y1="120" x2="370" y2="140" class="l"/>
   <rect x="160" y="140" width="140" height="40" rx="8" class="bw"/><text x="230" y="165" class="s c">ticket_price(age)</text>
   <rect x="310" y="140" width="140" height="40" rx="8" class="bw"/><text x="380" y="165" class="s c">group discount</text>
  </svg></figure>
  <pre class="pc py" data-run data-t="Try it: the decomposed program">def ticket_price(age):
    if age &lt; 12:
        return 5.50
    elif age &gt;= 65:
        return 6.00
    return 9.00

def booking_total(ages):
    total = 0
    for a in ages:
        total = total + ticket_price(a)
    if len(ages) &gt;= 6:          # group discount
        total = total * 0.9
    return round(total, 2)

print(booking_total([40, 38, 9]))
print(booking_total([20, 20, 20, 20, 70, 8]))</pre>
 </section>
 <section>
  <h2>Choosing constructs, structures and variables</h2>
  <div class="tscroll"><table class="pvt deftab"><tr><th>If the problem needs…</th><th>Use</th></tr>
   <tr><td>a choice between options</td><td><span class="mono">if</span> / <span class="mono">elif</span> / <span class="mono">else</span></td></tr>
   <tr><td>to repeat a known number of times, or visit every item</td><td><span class="mono">for</span></td></tr>
   <tr><td>to repeat until something happens</td><td><span class="mono">while</span></td></tr>
   <tr><td>to look things up by a key</td><td>a dictionary</td></tr>
   <tr><td>a grid, or a table of records</td><td>a 2D list</td></tr>
   <tr><td>unique items or fast membership tests</td><td>a set</td></tr>
   <tr><td>values that mustn't change</td><td>a tuple or named constants</td></tr></table></div>
  <div class="callout warnbox"><span class="k">A common mistake!</span><p>Clear logic means checking conditions in the right order. In an if–elif chain the <b>first</b> true condition wins, so test the most restrictive case first: <span class="mono">mark &gt;= 70</span> before <span class="mono">mark &gt;= 40</span>. And two separate <span class="mono">if</span>s are not the same as <span class="mono">if</span>–<span class="mono">elif</span>: both can run.</p></div>
  <div class="alw" data-w="trace" data-vars="age,group" data-title="Try it: two ifs where elif was meant" data-steps='[{"e":"line","line":1,"stack":[{"fn":"&lt;module>","loc":{}}],"out":"","ret":null},{"e":"line","line":2,"stack":[{"fn":"&lt;module>","loc":{"age":"10"}}],"out":"","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{"age":"10"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{"age":"10","group":"&#39;child&#39;"}}],"out":"","ret":null},{"e":"line","line":5,"stack":[{"fn":"&lt;module>","loc":{"age":"10","group":"&#39;child&#39;"}}],"out":"","ret":null},{"e":"line","line":8,"stack":[{"fn":"&lt;module>","loc":{"age":"10","group":"&#39;teen&#39;"}}],"out":"","ret":null},{"e":"line","line":1,"stack":[{"fn":"&lt;module>","loc":{"age":"10","group":"&#39;teen&#39;"}}],"out":"10 teen\n","ret":null},{"e":"line","line":2,"stack":[{"fn":"&lt;module>","loc":{"age":"15","group":"&#39;teen&#39;"}}],"out":"10 teen\n","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{"age":"15","group":"&#39;teen&#39;"}}],"out":"10 teen\n","ret":null},{"e":"line","line":5,"stack":[{"fn":"&lt;module>","loc":{"age":"15","group":"&#39;teen&#39;"}}],"out":"10 teen\n","ret":null},{"e":"line","line":8,"stack":[{"fn":"&lt;module>","loc":{"age":"15","group":"&#39;teen&#39;"}}],"out":"10 teen\n","ret":null},{"e":"line","line":1,"stack":[{"fn":"&lt;module>","loc":{"age":"15","group":"&#39;teen&#39;"}}],"out":"10 teen\n15 teen\n","ret":null},{"e":"line","line":2,"stack":[{"fn":"&lt;module>","loc":{"age":"30","group":"&#39;teen&#39;"}}],"out":"10 teen\n15 teen\n","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{"age":"30","group":"&#39;teen&#39;"}}],"out":"10 teen\n15 teen\n","ret":null},{"e":"line","line":7,"stack":[{"fn":"&lt;module>","loc":{"age":"30","group":"&#39;teen&#39;"}}],"out":"10 teen\n15 teen\n","ret":null},{"e":"line","line":8,"stack":[{"fn":"&lt;module>","loc":{"age":"30","group":"&#39;adult&#39;"}}],"out":"10 teen\n15 teen\n","ret":null},{"e":"line","line":1,"stack":[{"fn":"&lt;module>","loc":{"age":"30","group":"&#39;adult&#39;"}}],"out":"10 teen\n15 teen\n30 adult\n","ret":null},{"e":"end","line":null,"stack":[],"out":"10 teen\n15 teen\n30 adult\n","ret":null}]'><pre>for age in [10, 15, 30]:
    if age &lt; 13:
        group = "child"
    if age &lt; 18:
        group = "teen"
    else:
        group = "adult"
    print(age, group)</pre></div>
 </section>
</div>

<template id="th-a9-1-modular">
<div class="theory airy">
 <section>
  <h2>Modular programs</h2>
  <p>A <b>modular</b> program is built from subprograms that each do one job. The specification lists the qualities to aim for:</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Quality</th><th>Meaning</th></tr>
   <tr><td>Modularity</td><td>Code is split into self-contained subprograms that can be written, tested and changed separately.</td></tr>
   <tr><td>Separation of concerns</td><td>Input, processing and output are kept apart. A calculation function returns a value; it doesn't ask for input or print.</td></tr>
   <tr><td>Minimal side effects</td><td>A subprogram changes nothing outside itself except through what it returns.</td></tr>
   <tr><td>Scope isolation</td><td>Variables are local wherever possible, so one part of the program can't accidentally change another's data.</td></tr>
   <tr><td>Fit-for-purpose input and output</td><td>Ask for exactly what's needed with clear prompts; display results clearly in the format required.</td></tr>
   <tr><td>Efficiency</td><td>No unnecessary work, e.g. not recalculating a value inside a loop, using a set for frequent membership tests.</td></tr></table></div>
  <div class="alw" data-w="refactor" data-ex="modular"></div>
 </section>
 <section>
  <h2>Side effects</h2>
  <p>A list passed to a function is the <b>same</b> list, not a copy, so changing it inside the function changes it for the caller too. Sometimes that's what you want, but often it's a surprise. Returning a new list avoids it.</p>
  <pre class="pc py" data-run data-t="Try it: a side effect">def add_vat(prices):
    for i in range(len(prices)):
        prices[i] = round(prices[i] * 1.2, 2)
    return prices

def add_vat_safe(prices):
    return [round(p * 1.2, 2) for p in prices]

net = [10.0, 2.5]
gross = add_vat(net)
print("With a side effect:", net, gross)     # net has changed too!

net = [10.0, 2.5]
gross = add_vat_safe(net)
print("Without:           ", net, gross)</pre>
  <pre class="pc py" data-run data-t="Try it: global versus local">count = 0
def count_long_global(words):
    global count                      # changes a variable outside
    for w in words:
        if len(w) &gt;= 5:
            count = count + 1

def count_long(words, min_len):
    total = 0                         # local: nobody else can touch it
    for w in words:
        if len(w) &gt;= min_len:
            total = total + 1
    return total

words = ["to", "python", "loop", "variable"]
count_long_global(words)
count_long_global(words)
print("Global version after two calls:", count)   # 4, not 2
print("Local version:", count_long(words, 5), count_long(words, 5))</pre>
 </section>
 <section>
  <h2>Building blocks of modular code</h2>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Block</th><th>Example</th></tr>
   <tr><td>User-defined function</td><td class="mono">def area(w, h): return w * h</td></tr>
   <tr><td>User-defined procedure</td><td class="mono">def show_menu(): print("1. Play")</td></tr>
   <tr><td>Built-in subprogram</td><td class="mono">len(), sum(), max(), sorted(), round()</td></tr>
   <tr><td>Library</td><td class="mono">import math, random, statistics, sqlite3</td></tr>
   <tr><td>File</td><td>Data kept separately from code, e.g. a CSV file of questions read by a quiz</td></tr></table></div>
  <pre class="pc py" data-run data-t="Try it: using a library instead of writing it yourself">import statistics
from math import sqrt

data = [4, 8, 6, 5, 3, 7]
print("Mean:", statistics.mean(data))
print("Median:", statistics.median(data))
print("Standard deviation:", round(statistics.stdev(data), 2))
print("Square root of 50:", round(sqrt(50), 3))</pre>
  <div class="callout tip"><span class="k">Why libraries?</span><p>Library code has already been written, tested and optimised by other people. Reusing it is quicker and less error-prone than writing your own, as long as you check it does exactly what the task asks.</p></div>
 </section>
</div>
</template>

<template id="th-a9-2-style">
<div class="theory airy">
 <section>
  <h2>Why readability matters</h2>
  <p>Code is read far more often than it's written: by you next week, by teammates, and by examiners. Python's style guide, <b>PEP 8</b>, sets out conventions so that all Python code looks familiar. Step through the example to see messy code tidied up without changing what it does.</p>
  <div class="alw" data-w="refactor" data-ex="clean"></div>
 </section>
 <section>
  <h2>Consistency</h2>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Aspect</th><th>Convention</th><th>Example</th></tr>
   <tr><td>Indentation</td><td>4 spaces per level</td><td class="mono">····total = 0</td></tr>
   <tr><td>White space</td><td>Spaces around operators and after commas; blank lines between subprograms</td><td class="mono">total = price * qty</td></tr>
   <tr><td>Variables and functions</td><td>snake_case</td><td class="mono">high_score, get_marks()</td></tr>
   <tr><td>Constants</td><td>CAPITALS</td><td class="mono">MAX_LIVES = 3</td></tr>
   <tr><td>Line length</td><td>No more than about 79 characters</td><td>Split long expressions inside brackets</td></tr></table></div>
 </section>
 <section>
  <h2>Readability</h2>
  <p><b>Meaningful identifiers</b> make code explain itself. <b>Named constants</b> replace "magic numbers", so the meaning is clear and a change needs making in only one place. <b>Subprograms</b> give a name to a block of code and remove repetition. <b>Comments</b> explain <i>why</i>, where the reason isn't obvious from the code.</p>
  <pre class="pc py" data-run data-t="Try it: same program, two styles">def c(a,b):
  if a>b*0.2:return a-b*0.2
  return 0
print(c(30,100))

DEPOSIT_RATE = 0.2   # deposits are 20% of the full price

def amount_owed(paid, full_price):
    """Return what's still owed after the deposit, or 0 if paid in full."""
    deposit = full_price * DEPOSIT_RATE
    if paid &gt; deposit:
        return paid - deposit
    return 0

print(amount_owed(30, 100))</pre>
  <div class="callout warnbox"><span class="k">Comments that don't help</span><p><span class="mono">x = x + 1  # add 1 to x</span> just repeats the code. A good comment says something the code can't, such as <span class="mono"># skip the header row</span>. If you need a comment to explain what a variable is, rename the variable instead.</p></div>
  <pre class="pc py" data-run data-t="Try it: long lines split inside brackets">items = [("Pen", 1.5, 3), ("Pad", 2.25, 2)]
total = sum(price * qty
            for name, price, qty in items)
message = (f"You bought {len(items)} kinds of item "
           f"for a total of £{total:.2f}.")
print(message)</pre>
 </section>
</div>
</template>

<template id="th-a9-2-robust">
<div class="theory airy">
 <section>
  <h2>Boundary value analysis</h2>
  <p>Errors cluster at the edges of ranges, because it's easy to write <span class="mono">&lt;</span> where <span class="mono">&lt;=</span> was needed. <b>Boundary value analysis</b> chooses test data at each edge of the valid range <b>and just outside it</b>, alongside normal and erroneous data.</p>
  <div class="alw" data-w="bva"></div>
  <pre class="pc py" data-run data-t="Try it: a boundary bug">def valid_age(age):
    return age &gt; 11 and age &lt; 18     # meant 11 to 18 inclusive

for test in [10, 11, 14, 18, 19]:
    print(test, valid_age(test))</pre>
  <p>Normal data (14) passes, so without boundary tests this bug would go unnoticed. The fix is <span class="mono">11 &lt;= age &lt;= 18</span>.</p>
 </section>
 <section>
  <h2>Exception handling and type conversion</h2>
  <p>Converting user input is the most common source of crashes. Either check it first (<span class="mono">text.isdigit()</span>) or try the conversion and catch the <span class="mono">ValueError</span>. A validation loop keeps asking until the data is acceptable.</p>
  <pre class="pc py" data-run data-t="Try it: a robust input loop" data-stdin="ten|0|13|5">while True:
    text = input("Quantity (1-12): ")
    try:
        qty = int(text)
    except ValueError:
        print(repr(text), "isn't a whole number")
        continue
    if 1 &lt;= qty &lt;= 12:
        break
    print(qty, "is out of range")
print("Ordered", qty)</pre>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Exception</th><th>Typical cause</th></tr>
   <tr><td class="mono">ValueError</td><td><span class="mono">int("abc")</span>, <span class="mono">int("4.5")</span></td></tr>
   <tr><td class="mono">ZeroDivisionError</td><td>Dividing by zero, e.g. the average of an empty list</td></tr>
   <tr><td class="mono">IndexError</td><td>An index past the end of a list</td></tr>
   <tr><td class="mono">KeyError</td><td>A dictionary key that doesn't exist</td></tr>
   <tr><td class="mono">FileNotFoundError</td><td>Opening a missing file to read</td></tr>
   <tr><td class="mono">TypeError</td><td><span class="mono">"Age " + 16</span></td></tr></table></div>
  <div class="callout warnbox"><span class="k">Catch specific exceptions</span><p>A bare <span class="mono">except:</span> catches everything, including your own bugs, so problems are silently hidden. Name the exception you expect: <span class="mono">except ValueError:</span>.</p></div>
 </section>
 <section>
  <h2>Guard clauses and less nesting</h2>
  <p>Deeply nested ifs and loops are hard to follow. A <b>guard clause</b> deals with an invalid or special case at the top of a subprogram and returns immediately, so the main logic isn't buried.</p>
  <div class="alw" data-w="refactor" data-ex="guard"></div>
  <pre class="pc py" data-run data-t="Try it: guard clauses keep code flat">def mean(values):
    if not values:              # guard: nothing to average
        return None
    return sum(values) / len(values)

def first_word(text):
    if not isinstance(text, str):
        return ""
    words = text.split()
    if not words:
        return ""
    return words[0]

print(mean([]), mean([2, 4]))
print(repr(first_word("   ")), first_word("hello world"))</pre>
  <div class="callout tip"><span class="k">Fewer nested loops too</span><p>A nested loop that searches a list inside another list can often be replaced by a set or dictionary lookup, which is flatter and faster: <span class="mono">if name in registered:</span>.</p></div>
 </section>
</div>
</template>

<template id="th-a9-3-testing">
<div class="theory airy">
 <section>
  <h2>Types of error</h2>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Type</th><th>What happens</th><th>Example</th></tr>
   <tr><td>Syntax error</td><td>The program won't run at all; Python reports the line</td><td class="mono">if x &gt; 3</td></tr>
   <tr><td>Runtime error</td><td>It runs, then crashes when it reaches the problem</td><td class="mono">nums[10]</td></tr>
   <tr><td>Logic error</td><td>It runs to the end but gives the wrong result</td><td class="mono">(a + b / 2)</td></tr></table></div>
  <pre class="pc py" data-run data-err data-t="Try it: read the error message">marks = [55, 72, 61]
total = 0
for i in range(len(marks) + 1):
    total = total + marks[i]
print(total / len(marks))</pre>
  <p>The last line of the error message names the exception (<span class="mono">IndexError</span>) and the line above shows where. Logic errors give no message at all, which is why testing matters.</p>
 </section>
 <section>
  <h2>Testing</h2>
  <p>A <b>test plan</b> lists each test with its data, type and expected result, worked out <b>before</b> running. After running, the actual result is recorded. Any mismatch is a bug to fix, and every fix needs retesting.</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Test</th><th>Data</th><th>Type</th><th>Expected</th><th>Actual</th></tr>
   <tr><td>1</td><td>[39, 40, 41]</td><td>Boundary</td><td>2</td><td>1 ✗</td></tr>
   <tr><td>2</td><td>[10, 20]</td><td>Normal</td><td>0</td><td>0 ✓</td></tr>
   <tr><td>3</td><td>[]</td><td>Erroneous / extreme</td><td>0</td><td>0 ✓</td></tr></table></div>
  <pre class="pc py" data-run data-t="Try it: automated tests with assert">def count_passes(marks):
    count = 0
    for m in marks:
        if m &gt; 40:                    # the bug
            count = count + 1
    return count

tests = [([10, 20], 0), ([], 0), ([39, 40, 41], 2)]
for data, expected in tests:
    actual = count_passes(data)
    print(data, "expected", expected, "actual", actual, "✓" if actual == expected else "✗")</pre>
  <p>Writing the tests as code means they can be rerun after every change in a second.</p>
 </section>
 <section>
  <h2>Debugging</h2>
  <p>To find a logic error, look at what the variables actually hold as the program runs: with <b>print statements</b>, a <b>trace table</b>, or a <b>debugger</b>. A debugger pauses at a <b>breakpoint</b> and shows every variable. Try it below: the loop should add up the numbers 1 to 5, but gives the wrong answer.</p>
  <div class="alw" data-w="trace" data-bp data-bpl="4" data-vars="i,total" data-title="Try it: find the bug with a breakpoint" data-steps='[{"e":"line","line":1,"stack":[{"fn":"&lt;module>","loc":{}}],"out":"","ret":null},{"e":"line","line":2,"stack":[{"fn":"&lt;module>","loc":{"total":"0"}}],"out":"","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{"total":"0","i":"1"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{"total":"0","i":"1","square":"1"}}],"out":"","ret":null},{"e":"line","line":2,"stack":[{"fn":"&lt;module>","loc":{"total":"1","i":"1","square":"1"}}],"out":"","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{"total":"1","i":"2","square":"1"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{"total":"1","i":"2","square":"4"}}],"out":"","ret":null},{"e":"line","line":2,"stack":[{"fn":"&lt;module>","loc":{"total":"3","i":"2","square":"4"}}],"out":"","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{"total":"3","i":"3","square":"4"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{"total":"3","i":"3","square":"9"}}],"out":"","ret":null},{"e":"line","line":2,"stack":[{"fn":"&lt;module>","loc":{"total":"6","i":"3","square":"9"}}],"out":"","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{"total":"6","i":"4","square":"9"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{"total":"6","i":"4","square":"16"}}],"out":"","ret":null},{"e":"line","line":2,"stack":[{"fn":"&lt;module>","loc":{"total":"10","i":"4","square":"16"}}],"out":"","ret":null},{"e":"line","line":5,"stack":[{"fn":"&lt;module>","loc":{"total":"10","i":"4","square":"16"}}],"out":"","ret":null},{"e":"end","line":null,"stack":[],"out":"Total: 10\n","ret":null}]'><pre>total = 0
for i in range(1, 5):
    square = i * i
    total = total + i
print("Total:", total)</pre></div>
  <p>Watching <span class="mono">i</span> shows it stops at 4: <span class="mono">range(1, 5)</span> excludes 5. The fix is <span class="mono">range(1, 6)</span>.</p>
  <div class="callout tip"><span class="k">A debugging routine</span><p>1. Reproduce the bug with a specific input. 2. Work out what the variables <i>should</i> be. 3. Step through and find the first point where they differ. 4. Fix that one thing. 5. Rerun every test.</p></div>
 </section>
 <section>
  <h2>Reviewing and refining</h2>
  <p>Once the program works, review it against the requirements: does it do everything asked, in the format asked? Then <b>refine</b> it: clearer names, constants for magic numbers, guard clauses instead of nesting, a library function instead of hand-written code. Rerun the tests after each change to be sure nothing broke.</p>
 </section>
</div>
</template>
