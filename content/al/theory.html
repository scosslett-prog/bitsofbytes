<template id="th-a10-4-recursion2">
<div class="theory airy">
 <section>
  <h2>Recursion in Python</h2>
  <p>A <b>recursive</b> function solves a problem by calling itself on a smaller version of it. Every recursive function needs:</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Part</th><th>Job</th><th>In <span class="mono">factorial</span></th></tr>
   <tr><td>Base case</td><td>Returns an answer directly, with no further call</td><td class="mono">if n == 1: return 1</td></tr>
   <tr><td>Recursive case</td><td>Calls itself with an argument closer to the base case</td><td class="mono">return n * factorial(n - 1)</td></tr></table></div>
  <div class="alw" data-w="trace" data-stack data-title="Try it: the call stack grows, then unwinds" data-steps='[{"e":"line","line":1,"stack":[{"fn":"&lt;module>","loc":{}}],"out":"","ret":null},{"e":"line","line":6,"stack":[{"fn":"&lt;module>","loc":{}}],"out":"","ret":null},{"e":"line","line":2,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"factorial","loc":{"n":"4"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"factorial","loc":{"n":"4"}}],"out":"","ret":null},{"e":"line","line":2,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"factorial","loc":{"n":"4"}},{"fn":"factorial","loc":{"n":"3"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"factorial","loc":{"n":"4"}},{"fn":"factorial","loc":{"n":"3"}}],"out":"","ret":null},{"e":"line","line":2,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"factorial","loc":{"n":"4"}},{"fn":"factorial","loc":{"n":"3"}},{"fn":"factorial","loc":{"n":"2"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"factorial","loc":{"n":"4"}},{"fn":"factorial","loc":{"n":"3"}},{"fn":"factorial","loc":{"n":"2"}}],"out":"","ret":null},{"e":"line","line":2,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"factorial","loc":{"n":"4"}},{"fn":"factorial","loc":{"n":"3"}},{"fn":"factorial","loc":{"n":"2"}},{"fn":"factorial","loc":{"n":"1"}}],"out":"","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"factorial","loc":{"n":"4"}},{"fn":"factorial","loc":{"n":"3"}},{"fn":"factorial","loc":{"n":"2"}},{"fn":"factorial","loc":{"n":"1"}}],"out":"","ret":null},{"e":"return","line":3,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"factorial","loc":{"n":"4"}},{"fn":"factorial","loc":{"n":"3"}},{"fn":"factorial","loc":{"n":"2"}},{"fn":"factorial","loc":{"n":"1"}}],"out":"","ret":"1"},{"e":"return","line":4,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"factorial","loc":{"n":"4"}},{"fn":"factorial","loc":{"n":"3"}},{"fn":"factorial","loc":{"n":"2"}}],"out":"","ret":"2"},{"e":"return","line":4,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"factorial","loc":{"n":"4"}},{"fn":"factorial","loc":{"n":"3"}}],"out":"","ret":"6"},{"e":"return","line":4,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"factorial","loc":{"n":"4"}}],"out":"","ret":"24"},{"e":"end","line":null,"stack":[],"out":"24\n","ret":null}]'><pre>def factorial(n):
    if n == 1:
        return 1
    return n * factorial(n - 1)

print(factorial(4))</pre></div>
  <p>Each call gets its own <b>stack frame</b> with its own <span class="mono">n</span>. The calls pile up until the base case returns, then each frame finishes its multiplication and returns to the one below: the stack <b>unwinds</b>.</p>
 </section>
 <section>
  <h2>Writing recursive functions</h2>
  <p>Ask two questions: what's the simplest case I can answer straight away? And how can I express the answer using the answer to a slightly smaller problem?</p>
  <pre class="pc py" data-run data-t="Try it: recursive patterns">def sum_to(n):                    # 1 + 2 + ... + n
    if n == 0:
        return 0
    return n + sum_to(n - 1)

def power(base, exp):             # base ** exp
    if exp == 0:
        return 1
    return base * power(base, exp - 1)

def reverse(s):                   # a string backwards
    if s == "":
        return ""
    return reverse(s[1:]) + s[0]

def digit_sum(n):                 # 472 → 4 + 7 + 2
    if n &lt; 10:
        return n
    return n % 10 + digit_sum(n // 10)

print(sum_to(100), power(2, 10), reverse("python"), digit_sum(472))</pre>
  <pre class="pc py" data-run data-t="Try it: print before or after the call">def down(n):
    if n == 0:
        return
    print(n, end=" ")    # before the call: on the way in
    down(n - 1)

def up(n):
    if n == 0:
        return
    up(n - 1)
    print(n, end=" ")    # after the call: on the way back out

down(5)
print()
up(5)</pre>
 </section>
 <section>
  <h2>When recursion goes wrong</h2>
  <pre class="pc py" data-run data-t="Try it: a missing base case">import sys
def count_down(n):
    if n == 0:
        return "done"
    return count_down(n - 2)      # skips 0 when n is odd!

print(count_down(6))
try:
    print(count_down(5))
except RecursionError:
    print("RecursionError: more than", sys.getrecursionlimit(), "calls deep")</pre>
  <div class="callout warnbox"><span class="k">Recursion versus iteration</span><p>Any recursive function can be written with a loop. Recursion is often shorter and clearer for problems that are naturally self-similar (binary search, tree structures, factorials), but every call uses stack memory, so very deep recursion fails with a RecursionError where a loop wouldn't.</p></div>
 </section>
</div>
</template>

<template id="th-a7-1-selection">
<div class="theory airy">
 <section>
  <h2>Unit 2: programming in Python</h2>
  <p class="lede">Unit 2 is a <b>practical</b> exam: three hours at a computer, writing and fixing Python 3 programs. Everything in this unit is built around writing real code, so try every example and complete the Code it tasks.</p>
  <div class="callout tip"><span class="k">How to use these lessons</span><p>Press <b>Run</b> on any example to see what it does, then press <b>Edit</b> and change it. Breaking code on purpose and fixing it is one of the fastest ways to learn.</p></div>
 </section>
 <section>
  <h2>Sequence</h2>
  <p>A program runs its statements in <b>sequence</b>: one after another, top to bottom. The order matters. Swap two lines and the program can give a different answer, or crash.</p>
  <pre class="pc py" data-run data-t="Try it: sequence" data-stdin="Ana|2009">name = input("What's your name? ")
born = int(input("Year of birth: "))
age = 2026 - born
print("Hello", name + ".", "This year you turn", age)</pre>
 </section>
 <section>
  <h2>Selection with if, elif and else</h2>
  <p><b>Selection</b> lets a program choose what to do. Python checks each condition in turn and runs the <b>first</b> block whose condition is True; the rest are skipped. <span class="mono">else</span> runs only if none of the conditions were True.</p>
  <pre class="pc py" data-run data-t="Try it: grade boundaries" data-stdin="64">mark = int(input("Mark: "))
if mark &gt;= 70:
    print("A")
elif mark &gt;= 60:
    print("B")
elif mark &gt;= 50:
    print("C")
else:
    print("U")</pre>
  <div class="alw" data-w="trace" data-vars="mark" data-title="Try it: watch which branch runs" data-steps='[{"e":"line","line":1,"stack":[{"fn":"&lt;module>","loc":{}}],"out":"","ret":null},{"e":"line","line":2,"stack":[{"fn":"&lt;module>","loc":{"mark":"75"}}],"out":"","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{"mark":"75"}}],"out":"","ret":null},{"e":"line","line":8,"stack":[{"fn":"&lt;module>","loc":{"mark":"75","grade":"&#39;A&#39;"}}],"out":"","ret":null},{"e":"line","line":1,"stack":[{"fn":"&lt;module>","loc":{"mark":"75","grade":"&#39;A&#39;"}}],"out":"75 A\n","ret":null},{"e":"line","line":2,"stack":[{"fn":"&lt;module>","loc":{"mark":"64","grade":"&#39;A&#39;"}}],"out":"75 A\n","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{"mark":"64","grade":"&#39;A&#39;"}}],"out":"75 A\n","ret":null},{"e":"line","line":5,"stack":[{"fn":"&lt;module>","loc":{"mark":"64","grade":"&#39;A&#39;"}}],"out":"75 A\n","ret":null},{"e":"line","line":8,"stack":[{"fn":"&lt;module>","loc":{"mark":"64","grade":"&#39;B&#39;"}}],"out":"75 A\n","ret":null},{"e":"line","line":1,"stack":[{"fn":"&lt;module>","loc":{"mark":"64","grade":"&#39;B&#39;"}}],"out":"75 A\n64 B\n","ret":null},{"e":"line","line":2,"stack":[{"fn":"&lt;module>","loc":{"mark":"41","grade":"&#39;B&#39;"}}],"out":"75 A\n64 B\n","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{"mark":"41","grade":"&#39;B&#39;"}}],"out":"75 A\n64 B\n","ret":null},{"e":"line","line":7,"stack":[{"fn":"&lt;module>","loc":{"mark":"41","grade":"&#39;B&#39;"}}],"out":"75 A\n64 B\n","ret":null},{"e":"line","line":8,"stack":[{"fn":"&lt;module>","loc":{"mark":"41","grade":"&#39;U&#39;"}}],"out":"75 A\n64 B\n","ret":null},{"e":"line","line":1,"stack":[{"fn":"&lt;module>","loc":{"mark":"41","grade":"&#39;U&#39;"}}],"out":"75 A\n64 B\n41 U\n","ret":null},{"e":"end","line":null,"stack":[],"out":"75 A\n64 B\n41 U\n","ret":null}]'><pre>for mark in [75, 64, 41]:
    if mark &gt;= 70:
        grade = "A"
    elif mark &gt;= 60:
        grade = "B"
    else:
        grade = "U"
    print(mark, grade)</pre></div>
  <div class="callout warnbox"><span class="k">A common mistake!</span><p>Order matters in an if–elif chain. If <span class="mono">mark &gt;= 50</span> came first, a mark of 75 would get a C, because the first True condition wins. Test the <b>most restrictive</b> condition first.</p></div>
  <h3>Conditions</h3>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Operator</th><th>Meaning</th><th>Example (x = 7)</th></tr>
   <tr><td class="mono">==</td><td>equal to</td><td class="mono">x == 7 → True</td></tr>
   <tr><td class="mono">!=</td><td>not equal to</td><td class="mono">x != 7 → False</td></tr>
   <tr><td class="mono">&lt; &lt;= &gt; &gt;=</td><td>less than, less or equal, …</td><td class="mono">x &gt;= 7 → True</td></tr>
   <tr><td class="mono">and / or / not</td><td>combine conditions</td><td class="mono">x &gt; 5 and x &lt; 10 → True</td></tr></table></div>
  <p>Python also allows chained comparisons: <span class="mono">1 &lt;= x &lt;= 10</span> means x is between 1 and 10 inclusive. String comparisons are case-sensitive: <span class="mono">"Ana" == "ana"</span> is False.</p>
 </section>
 <section>
  <h2>Selection with match-case</h2>
  <p>When one value is compared with several fixed options, <span class="mono">match</span>-<span class="mono">case</span> is often clearer than a long if–elif chain. The <span class="mono">case _:</span> pattern matches anything not matched already, like <span class="mono">else</span>.</p>
  <pre class="pc py" data-run data-t="Try it: a menu" data-stdin="2">choice = input("1 New  2 Open  3 Quit: ")
match choice:
    case "1":
        print("Creating a new file")
    case "2":
        print("Opening a file")
    case "3":
        print("Goodbye")
    case _:
        print("Please choose 1, 2 or 3")</pre>
  <div class="callout tip"><span class="k">Exam tip</span><p>input() always returns a <b>string</b>. Either convert it (<span class="mono">int(choice)</span>) and match numbers, or match strings like <span class="mono">"1"</span> — but be consistent.</p></div>
  <h3>Nested selection</h3>
  <p>An if inside an if is <b>nested</b> selection. It's useful when the second question only makes sense if the first answer was yes — but deep nesting quickly becomes hard to read (Topic 9 shows ways to avoid it).</p>
 </section>
</div>
</template>

<template id="th-a7-1-iteration">
<div class="theory airy">
 <section>
  <h2>Count-controlled loops: for</h2>
  <p class="lede">A <b>count-controlled</b> loop repeats a set number of times. In Python, that's a <span class="mono">for</span> loop, usually with <span class="mono">range()</span>, or looping over the items in a list or string.</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>range(…)</th><th>Values</th></tr>
   <tr><td class="mono">range(5)</td><td class="mono">0 1 2 3 4</td></tr>
   <tr><td class="mono">range(1, 6)</td><td class="mono">1 2 3 4 5</td></tr>
   <tr><td class="mono">range(0, 20, 5)</td><td class="mono">0 5 10 15</td></tr>
   <tr><td class="mono">range(10, 0, -2)</td><td class="mono">10 8 6 4 2</td></tr></table></div>
  <div class="callout warnbox"><span class="k">A common mistake!</span><p>The <b>stop</b> value is never included. To count from 1 to 10 you need <span class="mono">range(1, 11)</span>.</p></div>
  <pre class="pc py" data-run data-t="Try it: for loops">for i in range(1, 6):
    print(i, "squared is", i * i)

for ch in "CPU":
    print(ch)

total = 0
for score in [12, 7, 15]:
    total = total + score
print("Total:", total)</pre>
 </section>
 <section>
  <h2>Condition-controlled loops: while</h2>
  <p>A <b>condition-controlled</b> loop repeats <b>while</b> a condition is True. Use it when you don't know in advance how many times to repeat: until the user gets the password right, until a value passes a limit, until 0 is entered.</p>
  <div class="alw" data-w="trace" data-vars="n,steps" data-title="Try it: a while loop" data-steps='[{"e":"line","line":1,"stack":[{"fn":"&lt;module>","loc":{}}],"out":"","ret":null},{"e":"line","line":2,"stack":[{"fn":"&lt;module>","loc":{"n":"50"}}],"out":"","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{"n":"50","steps":"0"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{"n":"50","steps":"0"}}],"out":"","ret":null},{"e":"line","line":5,"stack":[{"fn":"&lt;module>","loc":{"n":"25","steps":"0"}}],"out":"","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{"n":"25","steps":"1"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{"n":"25","steps":"1"}}],"out":"","ret":null},{"e":"line","line":5,"stack":[{"fn":"&lt;module>","loc":{"n":"12","steps":"1"}}],"out":"","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{"n":"12","steps":"2"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{"n":"12","steps":"2"}}],"out":"","ret":null},{"e":"line","line":5,"stack":[{"fn":"&lt;module>","loc":{"n":"6","steps":"2"}}],"out":"","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{"n":"6","steps":"3"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{"n":"6","steps":"3"}}],"out":"","ret":null},{"e":"line","line":5,"stack":[{"fn":"&lt;module>","loc":{"n":"3","steps":"3"}}],"out":"","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{"n":"3","steps":"4"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{"n":"3","steps":"4"}}],"out":"","ret":null},{"e":"line","line":5,"stack":[{"fn":"&lt;module>","loc":{"n":"1","steps":"4"}}],"out":"","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{"n":"1","steps":"5"}}],"out":"","ret":null},{"e":"line","line":6,"stack":[{"fn":"&lt;module>","loc":{"n":"1","steps":"5"}}],"out":"","ret":null},{"e":"end","line":null,"stack":[],"out":"5\n","ret":null}]'><pre>n = 50
steps = 0
while n &gt; 1:
    n = n // 2
    steps = steps + 1
print(steps)</pre></div>
  <p>The condition is checked <b>before</b> each pass, so a while loop might not run at all. Something inside the loop must change the condition eventually; otherwise you have an <b>infinite loop</b>.</p>
  <pre class="pc py" data-run data-t="Try it: keep asking" data-stdin="pasword|password123">secret = "password123"
guess = input("Password: ")
while guess != secret:
    print("Wrong, try again")
    guess = input("Password: ")
print("Welcome!")</pre>
  <h3>Leaving a loop early</h3>
  <p><span class="mono">break</span> jumps straight out of the loop. A common pattern is <span class="mono">while True:</span> with a break once valid input arrives. Use it sparingly: a clear loop condition is usually easier to follow.</p>
 </section>
 <section>
  <h2>Nested loops</h2>
  <p>A loop inside a loop runs the inner loop <b>completely</b> for every pass of the outer loop. 3 outer passes × 4 inner passes = 12 runs of the inner body. Nested loops are how you work through a 2D grid, or every pair of items.</p>
  <div class="alw" data-w="trace" data-vars="row,col" data-title="Try it: nested loops" data-steps='[{"e":"line","line":1,"stack":[{"fn":"&lt;module>","loc":{}}],"out":"","ret":null},{"e":"line","line":2,"stack":[{"fn":"&lt;module>","loc":{"row":"1"}}],"out":"","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{"row":"1","col":"1"}}],"out":"","ret":null},{"e":"line","line":2,"stack":[{"fn":"&lt;module>","loc":{"row":"1","col":"1"}}],"out":"1 x 1 = 1\n","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{"row":"1","col":"2"}}],"out":"1 x 1 = 1\n","ret":null},{"e":"line","line":2,"stack":[{"fn":"&lt;module>","loc":{"row":"1","col":"2"}}],"out":"1 x 1 = 1\n1 x 2 = 2\n","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{"row":"1","col":"3"}}],"out":"1 x 1 = 1\n1 x 2 = 2\n","ret":null},{"e":"line","line":2,"stack":[{"fn":"&lt;module>","loc":{"row":"1","col":"3"}}],"out":"1 x 1 = 1\n1 x 2 = 2\n1 x 3 = 3\n","ret":null},{"e":"line","line":1,"stack":[{"fn":"&lt;module>","loc":{"row":"1","col":"3"}}],"out":"1 x 1 = 1\n1 x 2 = 2\n1 x 3 = 3\n","ret":null},{"e":"line","line":2,"stack":[{"fn":"&lt;module>","loc":{"row":"2","col":"3"}}],"out":"1 x 1 = 1\n1 x 2 = 2\n1 x 3 = 3\n","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{"row":"2","col":"1"}}],"out":"1 x 1 = 1\n1 x 2 = 2\n1 x 3 = 3\n","ret":null},{"e":"line","line":2,"stack":[{"fn":"&lt;module>","loc":{"row":"2","col":"1"}}],"out":"1 x 1 = 1\n1 x 2 = 2\n1 x 3 = 3\n2 x 1 = 2\n","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{"row":"2","col":"2"}}],"out":"1 x 1 = 1\n1 x 2 = 2\n1 x 3 = 3\n2 x 1 = 2\n","ret":null},{"e":"line","line":2,"stack":[{"fn":"&lt;module>","loc":{"row":"2","col":"2"}}],"out":"1 x 1 = 1\n1 x 2 = 2\n1 x 3 = 3\n2 x 1 = 2\n2 x 2 = 4\n","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{"row":"2","col":"3"}}],"out":"1 x 1 = 1\n1 x 2 = 2\n1 x 3 = 3\n2 x 1 = 2\n2 x 2 = 4\n","ret":null},{"e":"line","line":2,"stack":[{"fn":"&lt;module>","loc":{"row":"2","col":"3"}}],"out":"1 x 1 = 1\n1 x 2 = 2\n1 x 3 = 3\n2 x 1 = 2\n2 x 2 = 4\n2 x 3 = 6\n","ret":null},{"e":"line","line":1,"stack":[{"fn":"&lt;module>","loc":{"row":"2","col":"3"}}],"out":"1 x 1 = 1\n1 x 2 = 2\n1 x 3 = 3\n2 x 1 = 2\n2 x 2 = 4\n2 x 3 = 6\n","ret":null},{"e":"end","line":null,"stack":[],"out":"1 x 1 = 1\n1 x 2 = 2\n1 x 3 = 3\n2 x 1 = 2\n2 x 2 = 4\n2 x 3 = 6\n","ret":null}]'><pre>for row in range(1, 3):
    for col in range(1, 4):
        print(row, "x", col, "=", row * col)</pre></div>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Use…</th><th>when…</th></tr>
   <tr><td class="lbl">for</td><td>you know how many times, or you're going through every item of a list, string or range</td></tr>
   <tr><td class="lbl">while</td><td>you repeat until something happens, and don't know when</td></tr></table></div>
 </section>
</div>
</template>

<template id="th-a7-1-exceptions">
<div class="theory airy">
 <section>
  <h2>When things go wrong</h2>
  <p class="lede">An <b>exception</b> is an error that happens while a program is running. If nothing handles it, the program stops with a red error message. In the exam, programs must cope with bad input without crashing.</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Exception</th><th>Caused by</th><th>Example</th></tr>
   <tr><td class="lbl">ValueError</td><td>the right type but an unsuitable value</td><td class="mono">int("abc")</td></tr>
   <tr><td class="lbl">TypeError</td><td>an operation on the wrong type</td><td class="mono">"5" + 3</td></tr>
   <tr><td class="lbl">ZeroDivisionError</td><td>dividing by zero</td><td class="mono">10 / 0</td></tr>
   <tr><td class="lbl">IndexError</td><td>a list or string index out of range</td><td class="mono">[1, 2][5]</td></tr>
   <tr><td class="lbl">KeyError</td><td>a dictionary key that doesn't exist</td><td class="mono">{"a": 1}["b"]</td></tr>
   <tr><td class="lbl">NameError</td><td>a variable that hasn't been created</td><td class="mono">print(totl)</td></tr>
   <tr><td class="lbl">FileNotFoundError</td><td>opening a missing file to read</td><td class="mono">open("nope.txt")</td></tr>
   <tr><td class="lbl">AttributeError</td><td>a method the value doesn't have</td><td class="mono">(5).upper()</td></tr></table></div>
  <p>Others listed for the exam include <span class="mono">ArithmeticError</span> (the parent of ZeroDivisionError), <span class="mono">EOFError</span> (input() reached the end of input), <span class="mono">UnboundLocalError</span> (a local variable used before it's given a value) and <span class="mono">Exception</span> (the parent of almost all of them).</p>
 </section>
 <section>
  <h2>try and except</h2>
  <p>Put code that might fail in a <span class="mono">try</span> block. If a named exception happens, Python jumps to the matching <span class="mono">except</span> block instead of crashing.</p>
  <pre class="pc py" data-run data-t="Try it: validating a number" data-stdin="twelve|-3|12">while True:
    text = input("How many tickets? ")
    try:
        tickets = int(text)
    except ValueError:
        print("Please type a whole number")
        continue
    if tickets &lt; 1:
        print("At least 1, please")
    else:
        break
print("Booking", tickets, "tickets")</pre>
  <p>You can have several except blocks, one for each kind of error, and Python uses the first that matches.</p>
  <pre class="pc py" data-run data-t="Try it: two kinds of error" data-stdin="0">try:
    n = int(input("Share 100 sweets between how many people? "))
    print("Each gets", 100 // n)
except ValueError:
    print("That wasn't a number")
except ZeroDivisionError:
    print("You can't share between nobody!")</pre>
  <div class="callout warnbox"><span class="k">Avoid a bare except</span><p><span class="mono">except:</span> on its own catches <b>every</b> error, including your own typos (NameError). The program then carries on silently doing the wrong thing. Name the exception you expect.</p></div>
  <div class="callout tip"><span class="k">Exam tip</span><p>Keep the try block small — just the line that might fail — so you know exactly which error you're handling.</p></div>
 </section>
</div>
</template>

<template id="th-a7-1-variables">
<div class="theory airy">
 <section>
  <h2>Variables and constants</h2>
  <p class="lede">A <b>variable</b> is a named place in memory that holds a value which can change. Python creates a variable the first time you <b>assign</b> to it with <span class="mono">=</span>; using one before it exists raises a NameError.</p>
  <p>A <b>constant</b> is a value that shouldn't change while the program runs, like a tax rate or the size of a board. Python has no special constant type, so the convention is to name constants in <b>CAPITALS</b> and set them at the top of the program.</p>
  <pre class="pc py" data-run data-t="Try it: constants make code clearer">VAT_RATE = 0.2
MAX_TICKETS = 6

price = 15.00
qty = 4
if qty &lt;= MAX_TICKETS:
    total = price * qty * (1 + VAT_RATE)
    print(f"Total: £{total:.2f}")</pre>
  <div class="kpgrid2">
   <div class="keypts"><h3>Why use constants?</h3><ul><li>The name explains what the number means.</li><li>Change it once at the top, and every use updates.</li><li>No "magic numbers" hidden in the code.</li></ul></div>
   <div class="keypts"><h3>Good variable names</h3><ul><li>Describe the contents: <span class="mono">total_price</span>, not <span class="mono">tp</span>.</li><li>Lower case with underscores (snake_case).</li><li>Can't start with a digit or be a keyword.</li></ul></div>
  </div>
 </section>
 <section>
  <h2>Operators</h2>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Kind</th><th>Operators</th><th>Example</th></tr>
   <tr><td class="lbl">Arithmetic</td><td class="mono">+ - * / // % **</td><td class="mono">17 // 5 → 3, 17 % 5 → 2, 2 ** 5 → 32</td></tr>
   <tr><td class="lbl">Relational</td><td class="mono">== != &lt; &lt;= &gt; &gt;=</td><td class="mono">3 &lt;= 4 → True</td></tr>
   <tr><td class="lbl">Boolean</td><td class="mono">and or not</td><td class="mono">not (3 &gt; 4) → True</td></tr>
   <tr><td class="lbl">Bitwise</td><td class="mono">&amp; | ^ ~ &lt;&lt; &gt;&gt;</td><td class="mono">6 &amp; 3 → 2, 1 &lt;&lt; 4 → 16</td></tr></table></div>
  <p><b>Order of operations</b> follows maths: <span class="mono">**</span>, then <span class="mono">* / // %</span>, then <span class="mono">+ -</span>, then comparisons, then <span class="mono">not</span>, <span class="mono">and</span>, <span class="mono">or</span>. Brackets override everything and make intentions clear.</p>
  <p><span class="mono">/</span> always gives a float (<span class="mono">10 / 2</span> is <span class="mono">5.0</span>). <span class="mono">//</span> rounds <b>down</b> towards minus infinity, so <span class="mono">-7 // 2</span> is <span class="mono">-4</span>. In Python, <span class="mono">&gt;&gt;</span> is an arithmetic shift, and <span class="mono">~x</span> is <span class="mono">-x - 1</span>.</p>
  <pre class="pc py" data-run data-t="Try it: operators">print(17 / 5, 17 // 5, 17 % 5, 2 ** 10)
print(-7 // 2, -7 % 2)
print(5 &gt; 3 and 2 &gt; 4, not 5 &gt; 3 or True)
print(6 &amp; 3, 6 | 3, 6 ^ 3, ~6, 6 &lt;&lt; 2, -16 &gt;&gt; 2)
a, b = 3, 8
a, b = b, a          # swap
print(a, b)</pre>
 </section>
</div>
</template>

<template id="th-a7-1-subprograms">
<div class="theory airy">
 <section>
  <h2>Subprograms</h2>
  <p class="lede">A <b>subprogram</b> is a named block of code that can be called whenever it's needed. Subprograms let you break a big problem into small parts, reuse code instead of copying it, and test each part on its own.</p>
  <div class="kpgrid2">
   <div class="keypts"><h3>Procedure</h3><p>Does a job but <b>doesn't return a value</b>. In Python it simply has no return statement (so it returns None).</p><p class="mono">def show_menu():<br>&nbsp;&nbsp;&nbsp;&nbsp;print("1 Play  2 Quit")</p></div>
   <div class="keypts"><h3>Function</h3><p>Works something out and <b>returns</b> it to the code that called it.</p><p class="mono">def area(w, h):<br>&nbsp;&nbsp;&nbsp;&nbsp;return w * h</p></div>
  </div>
 </section>
 <section>
  <h2>Parameters and arguments</h2>
  <p>A <b>parameter</b> is a name in the subprogram's definition. An <b>argument</b> is the actual value passed in when it's called. In <span class="mono">def area(w, h)</span> the parameters are w and h; in <span class="mono">area(3, 4)</span> the arguments are 3 and 4.</p>
  <div class="alw" data-w="trace" data-stack data-vars="room" data-title="Try it: calling a function" data-steps='[{"e":"line","line":1,"stack":[{"fn":"&lt;module>","loc":{}}],"out":"","ret":null},{"e":"line","line":5,"stack":[{"fn":"&lt;module>","loc":{}}],"out":"","ret":null},{"e":"line","line":2,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"area","loc":{"w":"3","h":"4"}}],"out":"","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"area","loc":{"w":"3","h":"4","result":"12"}}],"out":"","ret":null},{"e":"return","line":3,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"area","loc":{"w":"3","h":"4","result":"12"}}],"out":"","ret":"12"},{"e":"line","line":6,"stack":[{"fn":"&lt;module>","loc":{"room":"12"}}],"out":"","ret":null},{"e":"line","line":7,"stack":[{"fn":"&lt;module>","loc":{"room":"12"}}],"out":"Room: 12\n","ret":null},{"e":"line","line":2,"stack":[{"fn":"&lt;module>","loc":{"room":"12"}},{"fn":"area","loc":{"w":"2","h":"6"}}],"out":"Room: 12\n","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{"room":"12"}},{"fn":"area","loc":{"w":"2","h":"6","result":"12"}}],"out":"Room: 12\n","ret":null},{"e":"return","line":3,"stack":[{"fn":"&lt;module>","loc":{"room":"12"}},{"fn":"area","loc":{"w":"2","h":"6","result":"12"}}],"out":"Room: 12\n","ret":"12"},{"e":"end","line":null,"stack":[],"out":"Room: 12\nHall: 12\n","ret":null}]'><pre>def area(w, h):
    result = w * h
    return result

room = area(3, 4)
print("Room:", room)
print("Hall:", area(2, 6))</pre></div>
  <p>Arguments are matched to parameters by position, or by name: <span class="mono">area(h=4, w=3)</span>. A parameter can have a <b>default</b>: <span class="mono">def area(w, h=1)</span>. A function can return several values as a tuple: <span class="mono">return low, high</span>.</p>
 </section>
 <section>
  <h2>Scope: local and global</h2>
  <p>Variables created inside a subprogram are <b>local</b>: they exist only while it runs, and other code can't see them. Variables created outside all subprograms are <b>global</b>. A subprogram can read a global, but to <b>change</b> one it must say <span class="mono">global name</span> first; otherwise Python makes a new local variable with the same name.</p>
  <pre class="pc py" data-run data-t="Try it: local and global">score = 0

def add_points(n):
    global score
    score = score + n

def try_to_change():
    score = 99          # a new local variable!

add_points(5)
try_to_change()
print(score)            # 5, not 99</pre>
  <div class="callout tip"><span class="k">Good practice</span><p>Prefer passing values in as arguments and getting results back with return, rather than changing globals. Functions that only use their parameters are easier to test and reuse (Topic 9: minimising side effects).</p></div>
 </section>
</div>
</template>

<template id="th-a8-1-types">
<div class="theory airy">
 <section>
  <h2>Primitive data types</h2>
  <p>Every value in a program has a <b>data type</b>. The type decides what the value can hold and what you can do with it: you can divide two numbers, but not two names. Python works the type out from the value, and <span class="mono">type()</span> tells you what it decided.</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Type</th><th>Python</th><th>Examples</th><th>Typical use</th></tr>
   <tr><td>Integer</td><td class="mono">int</td><td class="mono">42, -7, 0</td><td>Counts, years, scores</td></tr>
   <tr><td>Real</td><td class="mono">float</td><td class="mono">3.75, -0.5, 2.0</td><td>Prices, measurements, averages</td></tr>
   <tr><td>Character</td><td class="mono">str</td><td class="mono">"A", "7", "?"</td><td>One letter or symbol (Python has no separate char type)</td></tr>
   <tr><td>String</td><td class="mono">str</td><td class="mono">"Hello", "SW1A 1AA"</td><td>Names, postcodes, phone numbers</td></tr>
   <tr><td>Boolean</td><td class="mono">bool</td><td class="mono">True, False</td><td>Flags: is it on loan? is the box ticked?</td></tr></table></div>
  <pre class="pc py" data-run data-t="Try it: what type is it?">for value in [42, 3.75, "A", "Hello", True, 2.0, "42"]:
    print(repr(value), "is", type(value).__name__)</pre>
  <div class="callout tip"><span class="k">Choosing a type</span><p>A phone number or postcode looks like a number, but it should be a <b>string</b>: you never do arithmetic on it, and a leading 0 would be lost as an integer (<span class="mono">int("07700")</span> is 7700).</p></div>
 </section>
 <section>
  <h2>Type conversion</h2>
  <p><span class="mono">input()</span> <b>always</b> returns a string, even when the user types a number. To do arithmetic you must <b>convert</b> (or <b>cast</b>) it first.</p>
  <pre class="pc py" data-run data-t="Try it: input is always a string" data-stdin="5|3">a = input("First number: ")
b = input("Second number: ")
print("Joined as strings:", a + b)
print("Added as integers:", int(a) + int(b))</pre>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Function</th><th>Converts to</th><th>Examples</th></tr>
   <tr><td class="mono">int()</td><td>Integer; a float is <b>truncated</b></td><td class="mono">int("42") → 42, int(7.9) → 7</td></tr>
   <tr><td class="mono">float()</td><td>Real</td><td class="mono">float("2") → 2.0, float(3) → 3.0</td></tr>
   <tr><td class="mono">str()</td><td>String</td><td class="mono">str(7) + "7" → "77"</td></tr>
   <tr><td class="mono">bool()</td><td>Boolean; 0, 0.0 and "" are False, everything else True</td><td class="mono">bool(0) → False, bool("no") → True</td></tr></table></div>
  <pre class="pc py" data-run data-t="Try it: conversions">print(int("42") + 1)
print(int(7.9), int(-7.9))
print(float("2") * 2)
print(str(3.50))
print(bool(0), bool(""), bool("False"), bool("no"))
print("3" * 3)</pre>
  <div class="callout warnbox"><span class="k">A common mistake!</span><p><span class="mono">bool("False")</span> is <b>True</b>, because any non-empty string is True. To turn a user's answer into a Boolean, compare the text instead: <span class="mono">answer.lower() == "yes"</span>.</p></div>
  <p>A conversion that doesn't make sense raises a <b>ValueError</b>, for example <span class="mono">int("ten")</span> or <span class="mono">int("3.5")</span>. You'll see how to handle that safely in the lesson on exceptions and in Best practice.</p>
  <pre class="pc py" data-run data-t="Try it: a conversion that fails" data-stdin="ten">text = input("Enter a whole number: ")
try:
    n = int(text)
    print("Doubled:", n * 2)
except ValueError:
    print(repr(text), "isn't a whole number")</pre>
 </section>
</div>
</template>

<template id="th-a8-1-structures">
<div class="theory airy">
 <section>
  <h2>Arrays and records</h2>
  <p>The specification talks about <b>arrays</b> and <b>records</b>. Python doesn't have either built in, so you use lists (and tuples) to play both roles.</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Structure</th><th>What it is</th><th>In Python</th></tr>
   <tr><td>One-dimensional array</td><td>Items of the <b>same type</b>, found by index</td><td class="mono">scores = [64, 71, 55]</td></tr>
   <tr><td>Two-dimensional array</td><td>A grid of rows and columns</td><td class="mono">grid = [[1, 2, 3], [4, 5, 6]]</td></tr>
   <tr><td>Record</td><td>Related <b>fields of different types</b> about one thing</td><td class="mono">pupil = ["Ana", "10B", 15]</td></tr>
   <tr><td>Array of records</td><td>A table: one record per row</td><td class="mono">pupils = [["Ana", "10B", 15], ["Ben", "11A", 16]]</td></tr></table></div>
 </section>
 <section>
  <h2>Two-dimensional lists</h2>
  <p>A 2D list is a list of lists. <span class="mono">grid[r]</span> is a whole row, and <span class="mono">grid[r][c]</span> is one item: row first, then column. A <b>nested loop</b> visits every item.</p>
  <div class="alw" data-w="trace" data-vars="r,c,total" data-title="Try it: adding up a 2D list" data-steps='[{"e":"line","line":1,"stack":[{"fn":"&lt;module>","loc":{}}],"out":"","ret":null},{"e":"line","line":2,"stack":[{"fn":"&lt;module>","loc":{}}],"out":"","ret":null},{"e":"line","line":1,"stack":[{"fn":"&lt;module>","loc":{}}],"out":"","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{"grid":"[[3, 1, 4], [1, 5, 9]]"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{"grid":"[[3, 1, 4], [1, 5, 9]]","total":"0"}}],"out":"","ret":null},{"e":"line","line":5,"stack":[{"fn":"&lt;module>","loc":{"grid":"[[3, 1, 4], [1, 5, 9]]","total":"0","r":"0"}}],"out":"","ret":null},{"e":"line","line":6,"stack":[{"fn":"&lt;module>","loc":{"grid":"[[3, 1, 4], [1, 5, 9]]","total":"0","r":"0","c":"0"}}],"out":"","ret":null},{"e":"line","line":5,"stack":[{"fn":"&lt;module>","loc":{"grid":"[[3, 1, 4], [1, 5, 9]]","total":"3","r":"0","c":"0"}}],"out":"","ret":null},{"e":"line","line":6,"stack":[{"fn":"&lt;module>","loc":{"grid":"[[3, 1, 4], [1, 5, 9]]","total":"3","r":"0","c":"1"}}],"out":"","ret":null},{"e":"line","line":5,"stack":[{"fn":"&lt;module>","loc":{"grid":"[[3, 1, 4], [1, 5, 9]]","total":"4","r":"0","c":"1"}}],"out":"","ret":null},{"e":"line","line":6,"stack":[{"fn":"&lt;module>","loc":{"grid":"[[3, 1, 4], [1, 5, 9]]","total":"4","r":"0","c":"2"}}],"out":"","ret":null},{"e":"line","line":5,"stack":[{"fn":"&lt;module>","loc":{"grid":"[[3, 1, 4], [1, 5, 9]]","total":"8","r":"0","c":"2"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{"grid":"[[3, 1, 4], [1, 5, 9]]","total":"8","r":"0","c":"2"}}],"out":"","ret":null},{"e":"line","line":5,"stack":[{"fn":"&lt;module>","loc":{"grid":"[[3, 1, 4], [1, 5, 9]]","total":"8","r":"1","c":"2"}}],"out":"","ret":null},{"e":"line","line":6,"stack":[{"fn":"&lt;module>","loc":{"grid":"[[3, 1, 4], [1, 5, 9]]","total":"8","r":"1","c":"0"}}],"out":"","ret":null},{"e":"line","line":5,"stack":[{"fn":"&lt;module>","loc":{"grid":"[[3, 1, 4], [1, 5, 9]]","total":"9","r":"1","c":"0"}}],"out":"","ret":null},{"e":"line","line":6,"stack":[{"fn":"&lt;module>","loc":{"grid":"[[3, 1, 4], [1, 5, 9]]","total":"9","r":"1","c":"1"}}],"out":"","ret":null},{"e":"line","line":5,"stack":[{"fn":"&lt;module>","loc":{"grid":"[[3, 1, 4], [1, 5, 9]]","total":"14","r":"1","c":"1"}}],"out":"","ret":null},{"e":"line","line":6,"stack":[{"fn":"&lt;module>","loc":{"grid":"[[3, 1, 4], [1, 5, 9]]","total":"14","r":"1","c":"2"}}],"out":"","ret":null},{"e":"line","line":5,"stack":[{"fn":"&lt;module>","loc":{"grid":"[[3, 1, 4], [1, 5, 9]]","total":"23","r":"1","c":"2"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{"grid":"[[3, 1, 4], [1, 5, 9]]","total":"23","r":"1","c":"2"}}],"out":"","ret":null},{"e":"line","line":7,"stack":[{"fn":"&lt;module>","loc":{"grid":"[[3, 1, 4], [1, 5, 9]]","total":"23","r":"1","c":"2"}}],"out":"","ret":null},{"e":"end","line":null,"stack":[],"out":"23\n","ret":null}]'><pre>grid = [[3, 1, 4],
        [1, 5, 9]]
total = 0
for r in range(len(grid)):
    for c in range(len(grid[r])):
        total = total + grid[r][c]
print(total)</pre></div>
  <pre class="pc py" data-run data-t="Try it: build and change a grid">board = [["." for c in range(3)] for r in range(3)]
board[1][1] = "X"
board[0][2] = "O"
for row in board:
    print(" ".join(row))
print("Rows:", len(board), "Columns:", len(board[0]))</pre>
  <div class="callout warnbox"><span class="k">A common mistake!</span><p><span class="mono">[[0] * 3] * 2</span> makes two references to the <b>same</b> row, so changing one row changes both. Build each row separately with a loop or <span class="mono">[[0] * 3 for _ in range(2)]</span>.</p></div>
  <pre class="pc py" data-run data-t="Try it: the shared-row trap">bad = [[0] * 3] * 2
bad[0][0] = 9
print("bad: ", bad)
good = [[0] * 3 for _ in range(2)]
good[0][0] = 9
print("good:", good)</pre>
 </section>
 <section>
  <h2>Choosing a structure</h2>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Structure</th><th>Ordered?</th><th>Changeable?</th><th>Duplicates?</th><th>Use it for</th></tr>
   <tr><td>List <span class="mono">[ ]</span></td><td>Yes</td><td>Yes</td><td>Yes</td><td>A collection you add to, sort or index</td></tr>
   <tr><td>Tuple <span class="mono">( )</span></td><td>Yes</td><td>No</td><td>Yes</td><td>Fixed values: a coordinate, an RGB colour</td></tr>
   <tr><td>Dictionary <span class="mono">{k: v}</span></td><td>By insertion</td><td>Yes</td><td>Keys unique</td><td>Looking things up by name</td></tr>
   <tr><td>Set <span class="mono">{ }</span></td><td>No</td><td>Yes</td><td>No</td><td>Unique items, membership, set operations</td></tr></table></div>
 </section>
 <section>
  <h2>Converting between structures</h2>
  <p>The functions <span class="mono">list()</span>, <span class="mono">tuple()</span>, <span class="mono">set()</span> and <span class="mono">dict()</span> each build a new structure from another one.</p>
  <pre class="pc py" data-run data-t="Try it: converting structures">nums = [3, 1, 3, 2, 1]
print(set(nums))              # duplicates removed
print(sorted(set(nums)))      # unique and sorted, back to a list
print(tuple(nums))            # list to tuple
print(list("abc"))            # string to a list of characters
pairs = [("Ana", 15), ("Ben", 16)]
ages = dict(pairs)            # list of pairs to dictionary
print(ages)
print(list(ages.keys()), list(ages.values()))
print(list(ages.items()))     # and back to pairs</pre>
  <div class="callout tip"><span class="k">Unpacking</span><p>A record's fields can be unpacked into separate variables in one line: <span class="mono">name, form, age = pupil</span>. The number of variables must match the number of fields.</p></div>
 </section>
</div>

<template id="th-a8-2-numbers">
<div class="theory airy">
 <section>
  <h2>Rounding and truncation</h2>
  <p><b>Rounding</b> moves a number to the <b>nearest</b> value with fewer decimal places. <b>Truncation</b> simply <b>chops off</b> the fractional part, whichever is nearer.</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Expression</th><th>Result</th><th>What happens</th></tr>
   <tr><td class="mono">round(3.14159, 2)</td><td class="mono">3.14</td><td>Rounds to 2 decimal places</td></tr>
   <tr><td class="mono">round(4.7)</td><td class="mono">5</td><td>Rounds to the nearest whole number</td></tr>
   <tr><td class="mono">int(4.7)</td><td class="mono">4</td><td>Truncates (towards zero)</td></tr>
   <tr><td class="mono">int(-4.7)</td><td class="mono">-4</td><td>Truncates towards zero</td></tr>
   <tr><td class="mono">math.floor(-4.7)</td><td class="mono">-5</td><td>Rounds <b>down</b></td></tr>
   <tr><td class="mono">math.ceil(4.1)</td><td class="mono">5</td><td>Rounds <b>up</b></td></tr>
   <tr><td class="mono">17 // 5</td><td class="mono">3</td><td>Integer division</td></tr></table></div>
  <pre class="pc py" data-run data-t="Try it: round, truncate, floor, ceil">import math
for x in [4.7, 4.2, -4.7, 2.5, 3.5]:
    print(x, "round:", round(x), "int:", int(x),
          "floor:", math.floor(x), "ceil:", math.ceil(x))</pre>
  <div class="callout warnbox"><span class="k">Something surprising!</span><p>Python rounds exact halves to the nearest <b>even</b> number ("banker's rounding"), so <span class="mono">round(2.5)</span> is 2 and <span class="mono">round(3.5)</span> is 4. And because floats are stored in binary, <span class="mono">round(2.675, 2)</span> gives 2.67: 2.675 is really stored as 2.67499999…</p></div>
  <pre class="pc py" data-run data-t="Try it: floats are approximations">print(0.1 + 0.2)
print(0.1 + 0.2 == 0.3)
print(abs((0.1 + 0.2) - 0.3) &lt; 0.000001)
print(f"{2.675:.20f}")</pre>
  <p>To compare floats, check that they are <b>close</b> rather than exactly equal. For money, many programs store whole pence as integers.</p>
 </section>
 <section>
  <h2>Randomisation</h2>
  <p>The <span class="mono">random</span> library generates pseudo-random values. You must <span class="mono">import random</span> first.</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Function</th><th>Returns</th></tr>
   <tr><td class="mono">random.randint(a, b)</td><td>A whole number from a to b, <b>including both</b></td></tr>
   <tr><td class="mono">random.random()</td><td>A real number from 0 up to, but not including, 1</td></tr>
   <tr><td class="mono">random.choice(lst)</td><td>One random item from a list</td></tr>
   <tr><td class="mono">random.shuffle(lst)</td><td>Shuffles the list in place</td></tr></table></div>
  <pre class="pc py" data-run data-t="Try it: random values (run it more than once)">import random
print("Dice:", random.randint(1, 6))
print("Chance:", round(random.random(), 3))
print("Pick:", random.choice(["rock", "paper", "scissors"]))
deck = list(range(1, 11))
random.shuffle(deck)
print("Shuffled:", deck)</pre>
  <pre class="pc py" data-run data-t="Try it: is the dice fair?">import random
counts = [0] * 7
for i in range(6000):
    counts[random.randint(1, 6)] += 1
for face in range(1, 7):
    print(face, "#" * (counts[face] // 50), counts[face])</pre>
 </section>
 <section>
  <h2>The math library</h2>
  <pre class="pc py" data-run data-t="Try it: math functions">import math
print(math.sqrt(49), math.pi)
print(math.floor(7.8), math.ceil(7.2))
print(abs(-4), pow(2, 10), 2 ** 10)
radius = 3
print("Area:", round(math.pi * radius ** 2, 2))</pre>

<template id="th-a8-2-strings">
<div class="theory airy">
 <section>
  <h2>Indexing and slicing</h2>
  <p>A string is a <b>sequence</b> of characters, numbered from 0. Negative indexes count from the end. A <b>slice</b> <span class="mono">s[start:stop]</span> includes start but <b>stops before</b> stop.</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Character</th><td class="mono">P</td><td class="mono">y</td><td class="mono">t</td><td class="mono">h</td><td class="mono">o</td><td class="mono">n</td></tr>
   <tr><th>Index</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td></tr>
   <tr><th>Negative</th><td>-6</td><td>-5</td><td>-4</td><td>-3</td><td>-2</td><td>-1</td></tr></table></div>
  <pre class="pc py" data-run data-t="Try it: indexing and slicing">s = "Python"
print(len(s), s[0], s[-1])
print(s[1:4])     # yth
print(s[:3])      # first three
print(s[3:])      # from index 3 to the end
print(s[::-1])    # reversed</pre>
  <div class="alw" data-w="trace" data-vars="i,ch,vowels" data-title="Try it: traversing a string" data-steps='[{"e":"line","line":1,"stack":[{"fn":"&lt;module>","loc":{}}],"out":"","ret":null},{"e":"line","line":2,"stack":[{"fn":"&lt;module>","loc":{"word":"&#39;banana&#39;"}}],"out":"","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{"word":"&#39;banana&#39;","vowels":"0"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{"word":"&#39;banana&#39;","vowels":"0","i":"0"}}],"out":"","ret":null},{"e":"line","line":5,"stack":[{"fn":"&lt;module>","loc":{"word":"&#39;banana&#39;","vowels":"0","i":"0","ch":"&#39;b&#39;"}}],"out":"","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{"word":"&#39;banana&#39;","vowels":"0","i":"0","ch":"&#39;b&#39;"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{"word":"&#39;banana&#39;","vowels":"0","i":"1","ch":"&#39;b&#39;"}}],"out":"","ret":null},{"e":"line","line":5,"stack":[{"fn":"&lt;module>","loc":{"word":"&#39;banana&#39;","vowels":"0","i":"1","ch":"&#39;a&#39;"}}],"out":"","ret":null},{"e":"line","line":6,"stack":[{"fn":"&lt;module>","loc":{"word":"&#39;banana&#39;","vowels":"0","i":"1","ch":"&#39;a&#39;"}}],"out":"","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{"word":"&#39;banana&#39;","vowels":"1","i":"1","ch":"&#39;a&#39;"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{"word":"&#39;banana&#39;","vowels":"1","i":"2","ch":"&#39;a&#39;"}}],"out":"","ret":null},{"e":"line","line":5,"stack":[{"fn":"&lt;module>","loc":{"word":"&#39;banana&#39;","vowels":"1","i":"2","ch":"&#39;n&#39;"}}],"out":"","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{"word":"&#39;banana&#39;","vowels":"1","i":"2","ch":"&#39;n&#39;"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{"word":"&#39;banana&#39;","vowels":"1","i":"3","ch":"&#39;n&#39;"}}],"out":"","ret":null},{"e":"line","line":5,"stack":[{"fn":"&lt;module>","loc":{"word":"&#39;banana&#39;","vowels":"1","i":"3","ch":"&#39;a&#39;"}}],"out":"","ret":null},{"e":"line","line":6,"stack":[{"fn":"&lt;module>","loc":{"word":"&#39;banana&#39;","vowels":"1","i":"3","ch":"&#39;a&#39;"}}],"out":"","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{"word":"&#39;banana&#39;","vowels":"2","i":"3","ch":"&#39;a&#39;"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{"word":"&#39;banana&#39;","vowels":"2","i":"4","ch":"&#39;a&#39;"}}],"out":"","ret":null},{"e":"line","line":5,"stack":[{"fn":"&lt;module>","loc":{"word":"&#39;banana&#39;","vowels":"2","i":"4","ch":"&#39;n&#39;"}}],"out":"","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{"word":"&#39;banana&#39;","vowels":"2","i":"4","ch":"&#39;n&#39;"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{"word":"&#39;banana&#39;","vowels":"2","i":"5","ch":"&#39;n&#39;"}}],"out":"","ret":null},{"e":"line","line":5,"stack":[{"fn":"&lt;module>","loc":{"word":"&#39;banana&#39;","vowels":"2","i":"5","ch":"&#39;a&#39;"}}],"out":"","ret":null},{"e":"line","line":6,"stack":[{"fn":"&lt;module>","loc":{"word":"&#39;banana&#39;","vowels":"2","i":"5","ch":"&#39;a&#39;"}}],"out":"","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{"word":"&#39;banana&#39;","vowels":"3","i":"5","ch":"&#39;a&#39;"}}],"out":"","ret":null},{"e":"line","line":7,"stack":[{"fn":"&lt;module>","loc":{"word":"&#39;banana&#39;","vowels":"3","i":"5","ch":"&#39;a&#39;"}}],"out":"","ret":null},{"e":"end","line":null,"stack":[],"out":"3\n","ret":null}]'><pre>word = "banana"
vowels = 0
for i in range(len(word)):
    ch = word[i]
    if ch in "aeiou":
        vowels = vowels + 1
print(vowels)</pre></div>
 </section>
 <section>
  <h2>Strings are immutable</h2>
  <p>You can't change a character in place: <span class="mono">s[0] = "b"</span> raises a TypeError. String methods <b>return a new string</b> instead, so you must store the result.</p>
  <pre class="pc py" data-run data-t="Try it: methods return new strings">name = "  ada lovelace "
name.upper()                 # does nothing on its own
print(repr(name))
name = name.strip().title()  # store the result
print(repr(name))</pre>
 </section>
 <section>
  <h2>String methods</h2>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Job</th><th>Methods</th><th>Example</th></tr>
   <tr><td>Change case</td><td class="mono">upper() lower() title() capitalize()</td><td class="mono">"abc".upper() → "ABC"</td></tr>
   <tr><td>Examine</td><td class="mono">isdigit() isalpha() isupper() startswith() endswith()</td><td class="mono">"42".isdigit() → True</td></tr>
   <tr><td>Find</td><td class="mono">find() index() count() in</td><td class="mono">"banana".find("n") → 2</td></tr>
   <tr><td>Clean</td><td class="mono">strip() replace()</td><td class="mono">" hi ".strip() → "hi"</td></tr>
   <tr><td>Split and join</td><td class="mono">split() join()</td><td class="mono">"a,b".split(",") → ['a', 'b']</td></tr></table></div>
  <pre class="pc py" data-run data-t="Try it: validating a password" data-stdin="Secret42">pw = input("Password: ")
has_digit = False
has_upper = False
for ch in pw:
    if ch.isdigit():
        has_digit = True
    if ch.isupper():
        has_upper = True
if len(pw) &gt;= 8 and has_digit and has_upper:
    print("Strong enough")
else:
    print("Needs 8+ characters, a capital and a digit")</pre>
  <pre class="pc py" data-run data-t="Try it: split and join">line = "Ana,10B,15"
fields = line.split(",")
print(fields)
print(fields[0], "is in", fields[1])
print("-".join(["2026", "10", "19"]))</pre>
 </section>
 <section>
  <h2>Formatting output</h2>
  <p>An <b>f-string</b> puts values straight into text inside <span class="mono">{ }</span>. A <b>format specifier</b> after a colon controls how they look.</p>
  <pre class="pc py" data-run data-t="Try it: f-strings">item, price, qty = "Pen", 1.5, 3
print(f"{item}: £{price:.2f}")           # 2 decimal places
print(f"{qty} x {item} = £{price * qty:.2f}")
print(f"[{item:&lt;8}] [{item:&gt;8}]")        # left and right aligned in 8
print(f"{0.4567:.1%}")                    # as a percentage
print("Old style: " + item + " costs £" + str(price))</pre>
  <div class="callout tip"><span class="k">Concatenation needs strings</span><p><span class="mono">"Age " + 16</span> raises a TypeError. Either convert with <span class="mono">str(16)</span> or use an f-string, which converts for you.</p></div>
 </section>
</div>

<template id="th-a8-2-files">
<div class="theory airy">
 <section>
  <h2>Why use text files?</h2>
  <p>Variables are lost when a program ends. A <b>text file</b> keeps data <b>persistent</b> so it can be loaded again next time. Data is often stored as one record per line, with fields separated by commas (a <b>CSV</b> file).</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Mode</th><th>Meaning</th><th>If the file exists</th><th>If it doesn't</th></tr>
   <tr><td class="mono">"r"</td><td>Read</td><td>Read from the start</td><td>FileNotFoundError</td></tr>
   <tr><td class="mono">"w"</td><td>Write</td><td><b>Contents are deleted</b></td><td>Created</td></tr>
   <tr><td class="mono">"a"</td><td>Append</td><td>Added to the end</td><td>Created</td></tr></table></div>
 </section>
 <section>
  <h2>Writing and appending</h2>
  <p><span class="mono">write()</span> writes exactly the string you give it. It does <b>not</b> add a new line, so add <span class="mono">"\n"</span> yourself. Using <span class="mono">with</span> closes the file for you at the end of the block, which makes sure the data is saved.</p>
  <pre class="pc py" data-run data-t="Try it: write, then append">with open("pupils.txt", "w") as f:
    f.write("Ana,10B,15\n")
    f.write("Ben,11A,16\n")

with open("pupils.txt", "a") as f:
    f.write("Cai,10B,15\n")

with open("pupils.txt", "r") as f:
    print(f.read())</pre>
  <pre class="pc py" data-run data-t="Try it: without with, you close it yourself">f = open("log.txt", "w")
f.write("first\n")
f.close()
f = open("log.txt", "w")      # "w" again: the old line is gone
f.write("second\n")
f.close()
print(open("log.txt").read())</pre>
 </section>
 <section>
  <h2>Reading</h2>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Method</th><th>Returns</th></tr>
   <tr><td class="mono">f.read()</td><td>The whole file as one string</td></tr>
   <tr><td class="mono">f.readline()</td><td>The next line (with its <span class="mono">\n</span>)</td></tr>
   <tr><td class="mono">f.readlines()</td><td>A list of all the lines</td></tr>
   <tr><td class="mono">for line in f:</td><td>Each line in turn, without loading the whole file</td></tr></table></div>
  <p>Each line ends with a newline character, so <span class="mono">strip()</span> it before using it. Then <span class="mono">split(",")</span> separates the fields, and each field is a string that may need converting.</p>
  <pre class="pc py" data-run data-t="Try it: reading records from a CSV file">with open("pupils.txt", "w") as f:
    f.write("Ana,10B,15\nBen,11A,16\nCai,10B,15\n")

pupils = []
with open("pupils.txt", "r") as f:
    for line in f:
        name, form, age = line.strip().split(",")
        pupils.append([name, form, int(age)])

print(pupils)
print("Average age:", sum(p[2] for p in pupils) / len(pupils))</pre>
  <div class="callout warnbox"><span class="k">A common mistake!</span><p>Forgetting <span class="mono">strip()</span> leaves a <span class="mono">"\n"</span> on the last field. <span class="mono">int("15\n")</span> happens to work, but comparing <span class="mono">"10B\n" == "10B"</span> is False.</p></div>
  <pre class="pc py" data-run data-t="Try it: handling a missing file">try:
    with open("missing.txt", "r") as f:
        print(f.read())
except FileNotFoundError:
    print("No saved data yet, starting fresh")</pre>
 </section>
</div>

<template id="th-a8-2-structops">
<div class="theory airy">
 <section>
  <h2>Create, insert, update, retrieve, delete</h2>
  <p>Whatever the structure, the same basic operations come up again and again.</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Operation</th><th>List</th><th>Dictionary</th><th>Set</th></tr>
   <tr><td>Create</td><td class="mono">lst = []</td><td class="mono">d = {}</td><td class="mono">s = set()</td></tr>
   <tr><td>Insert</td><td class="mono">lst.append(x)<br>lst.insert(i, x)</td><td class="mono">d[key] = value</td><td class="mono">s.add(x)</td></tr>
   <tr><td>Update</td><td class="mono">lst[i] = x</td><td class="mono">d[key] = new</td><td>(remove then add)</td></tr>
   <tr><td>Retrieve</td><td class="mono">lst[i]</td><td class="mono">d[key]<br>d.get(key)</td><td class="mono">x in s</td></tr>
   <tr><td>Delete</td><td class="mono">del lst[i]<br>lst.remove(x)<br>lst.pop()</td><td class="mono">del d[key]<br>d.pop(key)</td><td class="mono">s.remove(x)<br>s.discard(x)</td></tr></table></div>
  <div class="alw" data-w="list"></div>
  <pre class="pc py" data-run data-t="Try it: a phone book dictionary">book = {}                          # create
book["Ana"] = "07700 900001"       # insert
book["Ben"] = "07700 900002"
book["Ana"] = "07700 900099"       # update
print(book.get("Ana"))             # retrieve
print(book.get("Zed", "not found"))
del book["Ben"]                    # delete
print(book)</pre>
  <div class="callout warnbox"><span class="k">A common mistake!</span><p><span class="mono">d["Zed"]</span> raises a <b>KeyError</b> if the key isn't there, and <span class="mono">lst.remove(x)</span> raises a ValueError if x isn't in the list. Check with <span class="mono">in</span> first, or use <span class="mono">d.get()</span> and <span class="mono">s.discard()</span>.</p></div>
 </section>
 <section>
  <h2>Traversal</h2>
  <p>To <b>traverse</b> a structure is to visit every item, usually with a for loop. Many algorithms are just a traversal with a variable tracking something: a total, a count, or the best so far.</p>
  <div class="alw" data-w="trace" data-vars="name,s,best,top" data-title="Try it: finding the highest score" data-steps='[{"e":"line","line":1,"stack":[{"fn":"&lt;module>","loc":{}}],"out":"","ret":null},{"e":"line","line":2,"stack":[{"fn":"&lt;module>","loc":{"scores":"{&#39;Ana&#39;: 72, &#39;Ben&#39;: 88, &#39;Cai&#39;: 65}"}}],"out":"","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{"scores":"{&#39;Ana&#39;: 72, &#39;Ben&#39;: 88, &#39;Cai&#39;: 65}","best":"&#39;&#39;"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{"scores":"{&#39;Ana&#39;: 72, &#39;Ben&#39;: 88, &#39;Cai&#39;: 65}","best":"&#39;&#39;","top":"-1"}}],"out":"","ret":null},{"e":"line","line":5,"stack":[{"fn":"&lt;module>","loc":{"scores":"{&#39;Ana&#39;: 72, &#39;Ben&#39;: 88, &#39;Cai&#39;: 65}","best":"&#39;&#39;","top":"-1","name":"&#39;Ana&#39;","s":"72"}}],"out":"","ret":null},{"e":"line","line":6,"stack":[{"fn":"&lt;module>","loc":{"scores":"{&#39;Ana&#39;: 72, &#39;Ben&#39;: 88, &#39;Cai&#39;: 65}","best":"&#39;&#39;","top":"-1","name":"&#39;Ana&#39;","s":"72"}}],"out":"","ret":null},{"e":"line","line":7,"stack":[{"fn":"&lt;module>","loc":{"scores":"{&#39;Ana&#39;: 72, &#39;Ben&#39;: 88, &#39;Cai&#39;: 65}","best":"&#39;&#39;","top":"72","name":"&#39;Ana&#39;","s":"72"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{"scores":"{&#39;Ana&#39;: 72, &#39;Ben&#39;: 88, &#39;Cai&#39;: 65}","best":"&#39;Ana&#39;","top":"72","name":"&#39;Ana&#39;","s":"72"}}],"out":"","ret":null},{"e":"line","line":5,"stack":[{"fn":"&lt;module>","loc":{"scores":"{&#39;Ana&#39;: 72, &#39;Ben&#39;: 88, &#39;Cai&#39;: 65}","best":"&#39;Ana&#39;","top":"72","name":"&#39;Ben&#39;","s":"88"}}],"out":"","ret":null},{"e":"line","line":6,"stack":[{"fn":"&lt;module>","loc":{"scores":"{&#39;Ana&#39;: 72, &#39;Ben&#39;: 88, &#39;Cai&#39;: 65}","best":"&#39;Ana&#39;","top":"72","name":"&#39;Ben&#39;","s":"88"}}],"out":"","ret":null},{"e":"line","line":7,"stack":[{"fn":"&lt;module>","loc":{"scores":"{&#39;Ana&#39;: 72, &#39;Ben&#39;: 88, &#39;Cai&#39;: 65}","best":"&#39;Ana&#39;","top":"88","name":"&#39;Ben&#39;","s":"88"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{"scores":"{&#39;Ana&#39;: 72, &#39;Ben&#39;: 88, &#39;Cai&#39;: 65}","best":"&#39;Ben&#39;","top":"88","name":"&#39;Ben&#39;","s":"88"}}],"out":"","ret":null},{"e":"line","line":5,"stack":[{"fn":"&lt;module>","loc":{"scores":"{&#39;Ana&#39;: 72, &#39;Ben&#39;: 88, &#39;Cai&#39;: 65}","best":"&#39;Ben&#39;","top":"88","name":"&#39;Cai&#39;","s":"65"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{"scores":"{&#39;Ana&#39;: 72, &#39;Ben&#39;: 88, &#39;Cai&#39;: 65}","best":"&#39;Ben&#39;","top":"88","name":"&#39;Cai&#39;","s":"65"}}],"out":"","ret":null},{"e":"line","line":8,"stack":[{"fn":"&lt;module>","loc":{"scores":"{&#39;Ana&#39;: 72, &#39;Ben&#39;: 88, &#39;Cai&#39;: 65}","best":"&#39;Ben&#39;","top":"88","name":"&#39;Cai&#39;","s":"65"}}],"out":"","ret":null},{"e":"end","line":null,"stack":[],"out":"Ben 88\n","ret":null}]'><pre>scores = {"Ana": 72, "Ben": 88, "Cai": 65}
best = ""
top = -1
for name, s in scores.items():
    if s &gt; top:
        top = s
        best = name
print(best, top)</pre></div>
  <pre class="pc py" data-run data-t="Try it: counting with a dictionary">words = "the cat sat on the mat the end".split()
counts = {}
for w in words:
    if w in counts:
        counts[w] = counts[w] + 1
    else:
        counts[w] = 1
for w, n in counts.items():
    print(w, n)</pre>
 </section>
 <section>
  <h2>Set operations</h2>
  <p>Sets have operations for combining them, which are much quicker to write than nested loops.</p>
  <div class="alw" data-w="sets"></div>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Operation</th><th>Method</th><th>Operator</th><th>Gives</th></tr>
   <tr><td>Union</td><td class="mono">a.union(b)</td><td class="mono">a | b</td><td>Everything in either</td></tr>
   <tr><td>Intersection</td><td class="mono">a.intersection(b)</td><td class="mono">a &amp; b</td><td>Only what's in both</td></tr>
   <tr><td>Difference</td><td class="mono">a.difference(b)</td><td class="mono">a - b</td><td>In a but not b</td></tr>
   <tr><td>Symmetric difference</td><td class="mono">a.symmetric_difference(b)</td><td class="mono">a ^ b</td><td>In one but not both</td></tr></table></div>
  <pre class="pc py" data-run data-t="Try it: clubs">chess = {"Ana", "Ben", "Cai"}
coding = {"Ben", "Dev", "Cai", "Eve"}
print("In both:", sorted(chess &amp; coding))
print("Chess only:", sorted(chess - coding))
print("Either:", sorted(chess | coding))
print("Just one:", sorted(chess ^ coding))</pre>
 </section>
</div>
