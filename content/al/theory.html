  </svg></figure>
  </div>
  <p>The flowchart on the right adds numbers until 0 is entered, then outputs the total. The arrow from the process back to the input makes a <b>loop</b>; the decision decides when it ends.</p>
  <div class="alw" data-w="flow"></div>

 </section>
 <section>
  <h2>Finding and correcting errors</h2>
  <p>A <b>logic error</b> lets a program run but produces the wrong result. Common causes:</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Error</th><th>Example</th></tr>
   <tr><td class="lbl">Wrong comparison</td><td><span class="mono">&lt;</span> instead of <span class="mono">&gt;</span>, or <span class="mono">&gt;</span> instead of <span class="mono">&gt;=</span></td></tr>
   <tr><td class="lbl">Off by one</td><td><span class="mono">range(1, 10)</span> when 10 should be included</td></tr>
   <tr><td class="lbl">Wrong starting value</td><td>finding a maximum starting from 0 when all values could be negative</td></tr>
   <tr><td class="lbl">Wrong place</td><td>resetting a total inside the loop instead of before it</td></tr>
   <tr><td class="lbl">Loop never ends</td><td>a <span class="mono">while</span> condition whose variable never changes</td></tr></table></div>
  <div class="callout tip"><span class="k">Exam tip</span><p>To correct an algorithm, give the <b>line</b> and the <b>corrected code</b>, not just a description of the problem.</p></div>
 </section>
 <section>
  <h2>Efficiency</h2>
  <p>Two correct algorithms can need very different amounts of <b>time</b> (number of steps) and <b>memory</b>. What matters is how the work <b>grows</b> as the input gets bigger:</p>
  <div class="facts3"><div><b>Linear</b><span>double the data → double the work (e.g. linear search)</span></div><div><b>Quadratic</b><span>double the data → 4× the work (e.g. bubble sort)</span></div><div><b>Logarithmic</b><span>double the data → one more step (e.g. binary search)</span></div></div>
 </section>
</div>
</template>

<template id="th-a5-1-trace">
<div class="theory airy">
 <section>
  <h2>Trace tables</h2>
  <p class="lede">A <b>trace table</b> follows an algorithm line by line, recording each variable whenever it changes. It's how you find out what code does, and where it goes wrong, without a computer: a <b>dry run</b>.</p>
  <pre class="pc py" data-run data-t="Try it: the code being traced" data-stdin="">n = 4721
total = 0
while n &gt; 0:
    total = total + n % 10
    n = n // 10
print(total)</pre>
  <div class="tscroll"><table class="pvt mono"><tr><th>n</th><th>n &gt; 0?</th><th>n % 10</th><th>total</th><th>output</th></tr>
   <tr><td>4721</td><td></td><td></td><td>0</td><td></td></tr>
   <tr><td></td><td>True</td><td>1</td><td>1</td><td></td></tr>
   <tr><td>472</td><td>True</td><td>2</td><td>3</td><td></td></tr>
   <tr><td>47</td><td>True</td><td>7</td><td>10</td><td></td></tr>
   <tr><td>4</td><td>True</td><td>4</td><td>14</td><td></td></tr>
   <tr><td>0</td><td>False</td><td></td><td></td><td>14</td></tr></table></div>
  <p>The algorithm adds up the digits of n. <span class="mono">n % 10</span> gives the last digit and <span class="mono">n // 10</span> removes it.</p>
  <div class="alw" data-w="trace" data-vars="n,total" data-title="Try it: the trace table builds itself" data-steps='[{"e":"line","line":1,"stack":[{"fn":"&lt;module>","loc":{}}],"out":"","ret":null},{"e":"line","line":2,"stack":[{"fn":"&lt;module>","loc":{"n":"4721"}}],"out":"","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{"n":"4721","total":"0"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{"n":"4721","total":"0"}}],"out":"","ret":null},{"e":"line","line":5,"stack":[{"fn":"&lt;module>","loc":{"n":"4721","total":"1"}}],"out":"","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{"n":"472","total":"1"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{"n":"472","total":"1"}}],"out":"","ret":null},{"e":"line","line":5,"stack":[{"fn":"&lt;module>","loc":{"n":"472","total":"3"}}],"out":"","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{"n":"47","total":"3"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{"n":"47","total":"3"}}],"out":"","ret":null},{"e":"line","line":5,"stack":[{"fn":"&lt;module>","loc":{"n":"47","total":"10"}}],"out":"","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{"n":"4","total":"10"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{"n":"4","total":"10"}}],"out":"","ret":null},{"e":"line","line":5,"stack":[{"fn":"&lt;module>","loc":{"n":"4","total":"14"}}],"out":"","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{"n":"0","total":"14"}}],"out":"","ret":null},{"e":"line","line":6,"stack":[{"fn":"&lt;module>","loc":{"n":"0","total":"14"}}],"out":"","ret":null},{"e":"end","line":null,"stack":[],"out":"14\n","ret":null}]'><pre>n = 4721
total = 0
while n &gt; 0:
    total = total + n % 10
    n = n // 10
print(total)</pre></div>
  <p>Each time a variable changes, a value is written in its column. The highlighted line is the one <b>about to run</b>.</p>
  <div class="callout tip"><span class="k">How to trace</span><p>Give each variable a column, plus one for conditions and one for output. Move down a row when a value changes. Only write a value when it's <b>assigned</b>; a blank means "unchanged".</p></div>
 </section>
 <section>
  <h2>Useful operators</h2>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Operator</th><th>Meaning</th><th>17 and 5</th></tr>
   <tr><td class="mono">/</td><td>division (always a real number)</td><td>3.4</td></tr>
   <tr><td class="mono">//</td><td>integer division (whole number part)</td><td>3</td></tr>
   <tr><td class="mono">%</td><td>modulus (remainder)</td><td>2</td></tr>
   <tr><td class="mono">**</td><td>exponent</td><td>1419857</td></tr></table></div>
  <h3>Loops</h3>
  <p>A <b>count-controlled</b> loop (<span class="mono">for i in range(start, stop, step)</span>) runs a set number of times: <span class="mono">stop</span> is <b>not</b> included, so <span class="mono">range(2, 9, 3)</span> gives 2, 5, 8. A <b>condition-controlled</b> loop (<span class="mono">while</span>) runs as long as its condition is true, and might not run at all.</p>
 </section>
</div>
</template>

<template id="th-a5-1-recursion">
<div class="theory airy">
 <section>
  <h2>Recursion</h2>
  <p class="lede">A <b>recursive</b> subroutine solves a problem by calling <b>itself</b> on a smaller version of the same problem, until the problem is small enough to answer directly.</p>
  <div class="callout"><span class="k">Key idea</span><p>Every recursive subroutine needs:</p><ul><li>a <b>base case</b>, which returns an answer without calling itself, and</li><li>a <b>general case</b>, which calls itself with a smaller input, moving towards the base case.</li></ul></div>
  <pre class="pc py" data-run data-t="Try it: factorial">def factorial(n):
    if n &lt;= 1:              # base case
        return 1
    return n * factorial(n - 1)   # general case

print(factorial(4))</pre>
 </section>
 <section>
  <h2>Tracing recursion</h2>
  <p>Each call waits for the one it made to return. The calls build up on the <b>call stack</b> until the base case is reached, then <b>unwind</b> in reverse order.</p>
  <figure class="dgfig"><svg class="dg" viewBox="0 0 620 230" role="img" aria-label="factorial(4) calls factorial(3), which calls factorial(2), then factorial(1) returns 1; the results unwind: 2, 6, 24">
   <defs><marker id="rcA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs>
   <rect x="20" y="10" width="180" height="36" rx="6" class="b"/><text x="110" y="33" class="m c">factorial(4)</text>
   <rect x="70" y="62" width="180" height="36" rx="6" class="b"/><text x="160" y="85" class="m c">factorial(3)</text>
   <rect x="120" y="114" width="180" height="36" rx="6" class="b"/><text x="210" y="137" class="m c">factorial(2)</text>
   <rect x="170" y="166" width="180" height="36" rx="6" class="bw"/><text x="260" y="189" class="m c">factorial(1) base</text>
   <path d="M40 46 L40 80 L66 80" class="l" fill="none" marker-end="url(#rcA)"/><path d="M90 98 L90 132 L116 132" class="l" fill="none" marker-end="url(#rcA)"/><path d="M140 150 L140 184 L166 184" class="l" fill="none" marker-end="url(#rcA)"/>
   <text x="390" y="189" class="ta m">returns 1</text><text x="340" y="137" class="ta m">returns 2 × 1 = 2</text><text x="290" y="85" class="ta m">returns 3 × 2 = 6</text><text x="240" y="33" class="ta m">returns 4 × 6 = 24</text>
  </svg><figcaption>Calls go down to the base case; answers come back up.</figcaption></figure>
  <div class="alw" data-w="trace" data-stack data-ms="1100" data-title="Try it: watch the call stack" data-steps='[{"e":"line","line":1,"stack":[{"fn":"&lt;module>","loc":{}}],"out":"","ret":null},{"e":"line","line":6,"stack":[{"fn":"&lt;module>","loc":{}}],"out":"","ret":null},{"e":"line","line":2,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"factorial","loc":{"n":"4"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"factorial","loc":{"n":"4"}}],"out":"","ret":null},{"e":"line","line":2,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"factorial","loc":{"n":"4"}},{"fn":"factorial","loc":{"n":"3"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"factorial","loc":{"n":"4"}},{"fn":"factorial","loc":{"n":"3"}}],"out":"","ret":null},{"e":"line","line":2,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"factorial","loc":{"n":"4"}},{"fn":"factorial","loc":{"n":"3"}},{"fn":"factorial","loc":{"n":"2"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"factorial","loc":{"n":"4"}},{"fn":"factorial","loc":{"n":"3"}},{"fn":"factorial","loc":{"n":"2"}}],"out":"","ret":null},{"e":"line","line":2,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"factorial","loc":{"n":"4"}},{"fn":"factorial","loc":{"n":"3"}},{"fn":"factorial","loc":{"n":"2"}},{"fn":"factorial","loc":{"n":"1"}}],"out":"","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"factorial","loc":{"n":"4"}},{"fn":"factorial","loc":{"n":"3"}},{"fn":"factorial","loc":{"n":"2"}},{"fn":"factorial","loc":{"n":"1"}}],"out":"","ret":null},{"e":"return","line":3,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"factorial","loc":{"n":"4"}},{"fn":"factorial","loc":{"n":"3"}},{"fn":"factorial","loc":{"n":"2"}},{"fn":"factorial","loc":{"n":"1"}}],"out":"","ret":"1"},{"e":"return","line":4,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"factorial","loc":{"n":"4"}},{"fn":"factorial","loc":{"n":"3"}},{"fn":"factorial","loc":{"n":"2"}}],"out":"","ret":"2"},{"e":"return","line":4,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"factorial","loc":{"n":"4"}},{"fn":"factorial","loc":{"n":"3"}}],"out":"","ret":"6"},{"e":"return","line":4,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"factorial","loc":{"n":"4"}}],"out":"","ret":"24"},{"e":"line","line":7,"stack":[{"fn":"&lt;module>","loc":{"answer":"24"}}],"out":"","ret":null},{"e":"end","line":null,"stack":[],"out":"24\n","ret":null}]'><pre>def factorial(n):
    if n &lt;= 1:
        return 1
    return n * factorial(n - 1)

answer = factorial(4)
print(answer)</pre></div>
  <p>Each call adds a frame with its own <span class="mono">n</span>. When the base case returns, each frame finishes its multiplication and is removed, last in, first out.</p>
  <div class="callout warnbox"><span class="k">Watch out</span><p>With no base case, or one that's never reached, the calls never stop. Each one adds a <b>stack frame</b>, until the stack runs out of space: a <b>stack overflow</b>. Python stops it with a RecursionError.</p></div>
  <div class="kpgrid2">
   <div class="keypts"><h3>Benefits</h3><ul><li>Natural and short for problems that are defined in terms of themselves (trees, nested folders, divide and conquer).</li></ul></div>
   <div class="keypts"><h3>Drawbacks</h3><ul><li>Every call uses a stack frame, so it needs more memory than a loop.</li><li>Can be slower and harder to trace.</li></ul></div>
  </div>
  <pre class="pc py" data-run data-t="Try it: where does print go?">def show(n):
    if n &gt; 0:
        print("down", n)
        show(n - 1)
        print("up", n)      # runs as the calls unwind

show(3)</pre>
 </section>
</div>
</template>

<template id="th-a5-2-searching">
<div class="theory airy">
 <section>
  <h2>Linear search</h2>
  <p class="lede">A <b>linear search</b> checks each item in turn, from the start, until it finds the target or reaches the end. It works on <b>any</b> list, sorted or not.</p>
  <p>On a list of n items it makes up to <b>n comparisons</b>. If the list is <b>sorted</b>, it can stop early as soon as it passes the place where the target would be.</p>
 </section>
 <section>
  <h2>Binary search</h2>
  <p>A <b>binary search</b> only works on a <b>sorted</b> list. It checks the <b>middle</b> item; if that isn't the target, it throws away the half that can't contain it, and repeats on the other half.</p>
  <p>Search for <b>23</b>:</p>
  <div class="tscroll"><table class="pvt mono"><tr><th>index</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td></tr><tr><th>value</th><td>2</td><td>5</td><td>8</td><td>12</td><td>16</td><td>23</td><td>38</td><td>56</td><td>72</td></tr></table></div>
  <div class="tscroll"><table class="pvt mono"><tr><th>low</th><th>high</th><th>mid = (low + high) // 2</th><th>value at mid</th><th>action</th></tr>
   <tr><td>0</td><td>8</td><td>4</td><td>16</td><td>23 &gt; 16 → low = 5</td></tr>
   <tr><td>5</td><td>8</td><td>6</td><td>38</td><td>23 &lt; 38 → high = 5</td></tr>
   <tr><td>5</td><td>5</td><td>5</td><td>23</td><td>found at index 5</td></tr></table></div>
  <p>If <b>low</b> ever passes <b>high</b>, the range is empty and the target isn't in the list.</p>
  <div class="alw" data-w="search"></div>
  <div class="callout"><span class="k">Key idea</span><p>Each comparison <b>halves</b> what's left. 1,000 items need at most about 10 comparisons (2<sup>10</sup> = 1024); a million need about 20. A linear search could need a million.</p></div>
  <h3>Recursive binary search</h3>
  <p>The same algorithm can call itself on the half that's left. The base cases are "found" and "range empty".</p>
  <pre class="pc py" data-run data-t="Try it: recursive binary search">def search(items, target, low, high):
    if low &gt; high:
        return -1                      # base case: not found
    mid = (low + high) // 2
    print("checking", items[mid])
    if items[mid] == target:
        return mid                     # base case: found
    if items[mid] &lt; target:
        return search(items, target, mid + 1, high)
    return search(items, target, low, mid - 1)

data = [2, 5, 8, 12, 16, 23, 38, 56, 72]
print(search(data, 23, 0, len(data) - 1))</pre>
  <div class="tscroll"><table class="pvt deftab"><tr><th></th><th>Linear</th><th>Binary</th></tr>
   <tr><td class="lbl">Needs sorted data?</td><td>No</td><td>Yes</td></tr>
   <tr><td class="lbl">Worst case, n items</td><td>n comparisons</td><td>about log₂ n comparisons</td></tr>
   <tr><td class="lbl">Best for</td><td>Small or unsorted lists</td><td>Large sorted lists</td></tr></table></div>
 </section>
</div>
</template>

<template id="th-a5-2-bubble">
<div class="theory airy">
 <section>
  <h2>Bubble sort</h2>
  <p class="lede">A <b>bubble sort</b> passes through the list comparing each <b>pair of neighbours</b>, swapping them if they're in the wrong order. After each pass, the largest remaining item has "bubbled" to its final place at the end.</p>
  <h3>The first pass on 5, 1, 4, 2, 8</h3>
  <div class="tscroll"><table class="pvt mono"><tr><th>Compare</th><th>Swap?</th><th>List</th></tr>
   <tr><td>5 and 1</td><td>yes</td><td><b>1, 5</b>, 4, 2, 8</td></tr>
   <tr><td>5 and 4</td><td>yes</td><td>1, <b>4, 5</b>, 2, 8</td></tr>
   <tr><td>5 and 2</td><td>yes</td><td>1, 4, <b>2, 5</b>, 8</td></tr>
   <tr><td>5 and 8</td><td>no</td><td>1, 4, 2, <b>5, 8</b></td></tr></table></div>
  <p>Pass 2 gives 1, 2, 4, 5, 8. Pass 3 makes <b>no swaps</b>, so the list must be sorted and the algorithm stops.</p>
  <div class="callout"><span class="k">Key idea</span><p>An improved bubble sort uses a <b>swapped</b> flag. If a whole pass makes no swaps, it stops early. A list of n items needs at most n − 1 passes, each with up to n − 1 comparisons.</p></div>
  <pre class="pc py" data-run data-t="Try it: bubble sort, pass by pass">items = [5, 1, 4, 2, 8]
swapped = True
p = 0
while swapped:
    swapped = False
    for i in range(len(items) - 1):
        if items[i] &gt; items[i + 1]:
            items[i], items[i + 1] = items[i + 1], items[i]
            swapped = True
    p = p + 1
    print("after pass", p, items)</pre>
  <div class="alw" data-w="sort" data-kind="bubble"></div>
  <div class="kpgrid2">
   <div class="keypts"><h3>Benefits</h3><ul><li>Simple to understand and code.</li><li>Sorts in place, needing no extra list.</li><li>Fast on lists that are already nearly sorted (with the flag).</li></ul></div>
   <div class="keypts"><h3>Drawbacks</h3><ul><li>Very slow on large lists: the work grows with the <b>square</b> of the size.</li><li>Worst case: a list in reverse order.</li></ul></div>
  </div>
 </section>
</div>
</template>

<template id="th-a5-2-insertion">
<div class="theory airy">
 <section>
  <h2>Insertion sort</h2>
  <p class="lede">An <b>insertion sort</b> builds a <b>sorted part</b> at the start of the list. At first only the first item is in it. Each pass takes the next item and <b>inserts</b> it into the right place in the sorted part, shifting larger items one place right.</p>
  <h3>Sorting 7, 3, 5, 1</h3>
  <div class="tscroll"><table class="pvt mono"><tr><th>Pass</th><th>Current item</th><th>List afterwards (sorted part in bold)</th></tr>
   <tr><td>start</td><td></td><td><b>7</b>, 3, 5, 1</td></tr>
   <tr><td>1</td><td>3</td><td><b>3, 7</b>, 5, 1</td></tr>
   <tr><td>2</td><td>5</td><td><b>3, 5, 7</b>, 1</td></tr>
   <tr><td>3</td><td>1</td><td><b>1, 3, 5, 7</b></td></tr></table></div>
  <p>A list of n items always takes <b>n − 1 passes</b>. After pass p, the first p + 1 items are sorted (but not necessarily in their final places).</p>
  <pre class="pc py" data-run data-t="Try it: insertion sort">items = [7, 3, 5, 1]
for i in range(1, len(items)):
    current = items[i]
    j = i - 1
    while j &gt;= 0 and items[j] &gt; current:
        items[j + 1] = items[j]     # shift right
        j = j - 1
    items[j + 1] = current          # insert
    print("after pass", i, items)</pre>
  <div class="alw" data-w="sort" data-kind="insertion"></div>
 </section>
 <section>
  <h2>Comparing the two sorts</h2>
  <div class="tscroll"><table class="pvt deftab"><tr><th></th><th>Bubble sort</th><th>Insertion sort</th></tr>
   <tr><td class="lbl">Method</td><td>Swap neighbours, pass after pass</td><td>Insert each item into a growing sorted part</td></tr>
   <tr><td class="lbl">After pass 1</td><td>Largest item is at the end</td><td>First two items are in order</td></tr>
   <tr><td class="lbl">Already sorted list</td><td>One pass (with the flag)</td><td>n − 1 passes, each with one comparison</td></tr>
   <tr><td class="lbl">Reverse-ordered list</td><td>Slowest case</td><td>Slowest case</td></tr>
   <tr><td class="lbl">Large random lists</td><td colspan="2">Both slow: the work grows with the square of the size. Unit 4 covers faster sorts (merge and quick sort).</td></tr></table></div>
  <div class="callout tip"><span class="k">Exam tip</span><p>When asked for the list "after the second pass", write out the <b>whole list</b> each time, not just the items that moved.</p></div>
 </section>
</div>
</template>

<template id="th-a5-3-expressions">
<div class="theory airy">
 <section>
  <h2>Boolean logic</h2>
  <p class="lede">A <b>Boolean expression</b> evaluates to true (1) or false (0). Programs use them in every <span class="mono">if</span> and <span class="mono">while</span>; CPUs are built from circuits that compute them.</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Operator</th><th>Notation</th><th>True when…</th></tr>
   <tr><td class="lbl">AND</td><td class="mono">A.B</td><td>both inputs are true</td></tr>
   <tr><td class="lbl">OR</td><td class="mono">A+B</td><td>at least one input is true</td></tr>
   <tr><td class="lbl">NOT</td><td class="mono">A̅</td><td>the input is false</td></tr>
   <tr><td class="lbl">XOR</td><td class="mono">A ⊕ B</td><td>exactly one input is true (the inputs differ)</td></tr>
   <tr><td class="lbl">NAND</td><td class="mono"><span style="text-decoration:overline">A.B</span></td><td>not both are true</td></tr>
   <tr><td class="lbl">NOR</td><td class="mono"><span style="text-decoration:overline">A+B</span></td><td>neither is true</td></tr></table></div>
 </section>
 <section>
  <h2>Order of precedence</h2>
  <p>Like BIDMAS in maths, Boolean operators have an order: <b>brackets</b> first, then <b>NOT</b>, then <b>AND</b>, then <b>OR</b>. So <span class="mono">A OR B AND C</span> means <span class="mono">A OR (B AND C)</span>. When in doubt, add brackets.</p>
  <h3>Worked example</h3>
  <p>A = 1, B = 0, C = 1. Evaluate <span class="mono">NOT A OR B AND C</span>.</p>
  <p class="stepline"><b>1</b><span>NOT first: NOT A = 0.</span></p>
  <p class="stepline"><b>2</b><span>AND next: B AND C = 0 AND 1 = 0.</span></p>
  <p class="stepline"><b>3</b><span>OR last: 0 OR 0 = <b>0</b>.</span></p>
 </section>
 <section>
  <div class="alw" data-w="logic" data-title="Try it: evaluate an expression" data-ex="NOT A OR B AND C|A AND NOT B|(A AND B) OR NOT C|A XOR B|NOT (A AND B)|A NAND B|A NOR B"></div>
 </section>
 <section>
  <h2>Writing expressions from a problem</h2>
  <p>A greenhouse fan (F) turns on when it's hot (H) and the door (D) is shut, or when the humidity alarm (M) is on: <b>F = (H AND NOT D) OR M</b>, or in symbols <span class="mono">F = H.D̅ + M</span>, where D is 1 when the door is open.</p>
  <pre class="pc py" data-run data-t="Try it: Boolean expressions in Python">hot, door_open, humid = True, False, False
fan = (hot and not door_open) or humid
print(fan)
a, b = True, True
print(a != b)          # XOR of two Booleans
print(not (a and b))   # NAND</pre>
 </section>
</div>
</template>

<template id="th-a5-3-truthtables">
<div class="theory airy">
 <section>
  <h2>Truth tables</h2>
  <p class="lede">A <b>truth table</b> lists every possible combination of inputs and the output for each. With n inputs there are <b>2<sup>n</sup> rows</b>. Count up in binary to make sure you include every one.</p>
  <div class="tscroll"><table class="pvt mono"><tr><th>A</th><th>B</th><th>AND</th><th>OR</th><th>XOR</th><th>NAND</th><th>NOR</th></tr>
   <tr><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>1</td><td>1</td></tr>
   <tr><td>0</td><td>1</td><td>0</td><td>1</td><td>1</td><td>1</td><td>0</td></tr>
   <tr><td>1</td><td>0</td><td>0</td><td>1</td><td>1</td><td>1</td><td>0</td></tr>
   <tr><td>1</td><td>1</td><td>1</td><td>1</td><td>0</td><td>0</td><td>0</td></tr></table></div>
 </section>
 <section>
  <h2>Longer expressions</h2>
  <p>Add a column for each part of the expression, working inside brackets first. For <b>(A AND B) OR NOT C</b>:</p>
  <div class="tscroll"><table class="pvt mono"><tr><th>A</th><th>B</th><th>C</th><th>A AND B</th><th>NOT C</th><th>Output</th></tr>
   <tr><td>0</td><td>0</td><td>0</td><td>0</td><td>1</td><td><b>1</b></td></tr>
   <tr><td>0</td><td>0</td><td>1</td><td>0</td><td>0</td><td><b>0</b></td></tr>
   <tr><td>0</td><td>1</td><td>0</td><td>0</td><td>1</td><td><b>1</b></td></tr>
   <tr><td>0</td><td>1</td><td>1</td><td>0</td><td>0</td><td><b>0</b></td></tr>
   <tr><td>1</td><td>0</td><td>0</td><td>0</td><td>1</td><td><b>1</b></td></tr>
   <tr><td>1</td><td>0</td><td>1</td><td>0</td><td>0</td><td><b>0</b></td></tr>
   <tr><td>1</td><td>1</td><td>0</td><td>1</td><td>1</td><td><b>1</b></td></tr>
   <tr><td>1</td><td>1</td><td>1</td><td>1</td><td>0</td><td><b>1</b></td></tr></table></div>
  <div class="callout"><span class="k">Key idea</span><h3>Equivalent expressions</h3><p>Two expressions are <b>equivalent</b> if their output columns match in every row. De Morgan's laws are a famous pair: <b>NOT (A AND B) = NOT A OR NOT B</b>, and <b>NOT (A OR B) = NOT A AND NOT B</b>.</p></div>
  <div class="alw" data-w="logic" data-title="Try it: build any truth table" data-ex="(A AND B) OR NOT C|(A AND NOT B) OR (B AND C)|NOT (A AND B)|NOT A OR NOT B|NOT (A OR B)|NOT A AND NOT B|(A OR B) AND NOT (A AND B)|A XOR B"></div>
  <p>Compare <b>NOT (A AND B)</b> with <b>NOT A OR NOT B</b>: the output columns match, which proves De Morgan's law.</p>
  <pre class="pc py" data-run data-t="Try it: print a truth table">print("A B C | out")
for a in (0, 1):
    for b in (0, 1):
        for c in (0, 1):
            out = (a and b) or not c
            print(a, b, c, "|", int(out))</pre>
 </section>
</div>
</template>

<template id="th-a5-4-paradigms">
<div class="theory airy">
 <section>
  <h2>Programming paradigms</h2>
  <p class="lede">A <b>programming paradigm</b> is a style of programming: a way of thinking about how a problem is described to the computer. Some languages support several paradigms.</p>
 </section>
 <section>
  <h2>Procedural programming</h2>
  <p><b>Procedural</b> programs are a sequence of <b>instructions</b> that say exactly <b>how</b> to solve a problem, step by step, changing the values of variables as they go. Code is organised into <b>procedures and functions</b> (subroutines) that can be called and reused. Python, used as in this course, is procedural.</p>
  <pre class="pc py" data-run data-t="Try it: a procedural solution">def average(marks):
    total = 0
    for m in marks:
        total = total + m
    return total / len(marks)

students = {"Ana": [72, 65], "Ben": [58, 81], "Cai": [90, 77]}
for name, marks in students.items():
    if average(marks) &gt; 70:
        print(name)</pre>
 </section>
 <section>
  <h2>Declarative programming</h2>
  <p><b>Declarative</b> programs describe <b>what</b> result is wanted, not how to get it. The language (or system) works out the steps.</p>
  <div class="ccards">
   <div class="keypts"><h3>SQL</h3><p class="mono">SELECT Name FROM Student<br>WHERE Average &gt; 70;</p><p>You state which data you want; the database management system decides how to find it.</p></div>
   <div class="keypts"><h3>Logic programming (Prolog)</h3><p class="mono">parent(ana, ben).<br>parent(ben, cai).<br>grandparent(X, Z) :-<br>&nbsp;&nbsp;parent(X, Y), parent(Y, Z).</p><p>You state <b>facts</b> and <b>rules</b>; a query such as <span class="mono">grandparent(ana, Who)</span> is answered from them.</p></div>
  </div>
  <div class="alw" data-w="paradigm"></div>
  <div class="tscroll"><table class="pvt deftab"><tr><th></th><th>Procedural</th><th>Declarative</th></tr>
   <tr><td class="lbl">Describes</td><td>How: the steps</td><td>What: the result</td></tr>
   <tr><td class="lbl">Examples</td><td>Python, C, BASIC</td><td>SQL, Prolog</td></tr>
   <tr><td class="lbl">Benefits</td><td>Precise control; easy to follow the order of execution</td><td>Short, readable code; the system optimises how</td></tr>
   <tr><td class="lbl">Drawbacks</td><td>More code; the programmer must get every step right</td><td>Less control over how it's done; suited to particular kinds of problem</td></tr></table></div>
  <p class="vfoot">Unit 3 adds object-oriented and functional programming.</p>
 </section>
</div>
</template>

<template id="th-a6-1-bigdata">
<div class="theory airy">
 <section>
  <h2>What makes data "big"?</h2>
  <p class="lede">Every card payment, phone location ping, video upload and sensor reading is data. <b>Big data</b> describes data sets so large, fast-arriving or varied that ordinary software on a single computer can't store or process them in a useful time.</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>The five Vs</th><th>Meaning</th><th>Example</th></tr>
   <tr><td class="lbl">Volume</td><td>The <b>amount</b> of data</td><td>A streaming service storing petabytes of viewing history</td></tr>
   <tr><td class="lbl">Velocity</td><td>The <b>speed</b> at which data arrives and must be processed</td><td>Thousands of payments a second checked for fraud as they happen</td></tr>
   <tr><td class="lbl">Variety</td><td>The range of <b>types and formats</b>, much of it unstructured</td><td>Text, images, video, GPS traces and sensor logs together</td></tr>
   <tr><td class="lbl">Veracity</td><td>How <b>accurate and trustworthy</b> it is</td><td>Social media posts that may be false, biased or written by bots</td></tr>
   <tr><td class="lbl">Value</td><td>The useful <b>insight</b> it can give</td><td>Predicting which products will sell out next week</td></tr></table></div>
  <div class="callout"><span class="k">Key idea</span><p>Much big data is <b>unstructured</b>: it doesn't fit the fixed rows and columns of a relational table. That, plus its size and speed, is why new kinds of infrastructure are needed.</p></div>
 </section>
 <section>
  <h2>The infrastructure for big data</h2>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Stage</th><th>What's needed</th></tr>
   <tr><td class="lbl">Collecting</td><td>Sensors, apps, websites and APIs that capture data continuously</td></tr>
   <tr><td class="lbl">Storing</td><td>Many networked servers (often in the cloud), with data spread and copied across them so it isn't lost if one fails</td></tr>
   <tr><td class="lbl">Processing</td><td><b>Distributed processing</b>: the work is split so many machines process parts of the data at the same time</td></tr>
   <tr><td class="lbl">Analysing</td><td>Statistical and machine learning tools to find patterns and make predictions</td></tr>
   <tr><td class="lbl">Networking</td><td>Fast, high-bandwidth networks to move data between collectors, servers and users</td></tr>
   <tr><td class="lbl">Securing</td><td>Encryption, access control and monitoring, since big data often includes personal information</td></tr></table></div>
  <div class="alw" data-w="distrib"></div>
  <div class="callout warnbox"><span class="k">Think about</span><p>Big data raises questions about <b>privacy</b> (what's collected and who sees it), <b>consent</b>, and decisions being made about people from patterns that may be <b>biased</b>.</p></div>
 </section>
</div>
</template>

<template id="th-a6-1-datascience">
<div class="theory airy">
 <section>
  <h2>The data science process</h2>
  <p class="lede"><b>Data science</b> uses programming and statistics to turn raw data into useful information. Most projects follow the same stages.</p>
  <figure class="dgfig"><svg class="dg" viewBox="0 0 640 90" role="img" aria-label="Collect, then store, then clean, then analyse, then visualise">
   <defs><marker id="dsA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs>

   <rect x="395" y="25" width="105" height="40" rx="8" class="b"/><text x="447" y="50" class="s c">Analyse</text>
   <rect x="525" y="25" width="110" height="40" rx="8" class="bi"/><text x="580" y="50" class="s c">Visualise</text>
   <line x1="110" y1="45" x2="131" y2="45" class="l" marker-end="url(#dsA)"/><line x1="240" y1="45" x2="261" y2="45" class="l" marker-end="url(#dsA)"/><line x1="370" y1="45" x2="391" y2="45" class="l" marker-end="url(#dsA)"/><line x1="500" y1="45" x2="521" y2="45" class="l" marker-end="url(#dsA)"/>
  </svg></figure>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Stage</th><th>Tools and techniques</th></tr>
   <tr><td class="lbl">Collection</td><td>Sensors, online forms, transaction records, public data sets, <b>APIs</b>, and <b>web scraping</b> (a program that downloads pages and extracts data from them; it should respect the site's terms and not overload it).</td></tr>
   <tr><td class="lbl">Storage</td><td>Files (CSV, JSON), databases, and distributed storage for very large data.</td></tr>

  <div class="alw" data-w="clean"></div>
  <div class="callout tip"><span class="k">Garbage in, garbage out</span><p>Cleaning often takes the most time, but analysis of dirty data gives wrong conclusions, however clever the analysis.</p></div>
  <pre class="pc py" data-run data-t="Try it: clean, analyse, summarise">raw = ["14.2", "15.1", "", "16.4", "15.1", "error", "13.9"]
clean = []
for r in raw:
    try:
        clean.append(float(r))     # skip blanks and errors
    except ValueError:
        pass
print("readings kept:", len(clean))
print("mean:", round(sum(clean) / len(clean), 2))
print("range:", max(clean) - min(clean))</pre>

<template id="th-a6-2-ai">
<div class="theory airy">
 <section>
  <h2>Narrow, general and super AI</h2>
  <p class="lede"><b>Artificial intelligence</b> is the ability of computer systems to do tasks that normally need human intelligence: recognising images and speech, understanding language, making decisions.</p>
  <div class="ccards">
   <div class="keypts"><h3>Narrow AI</h3><p>Does <b>one task</b> (or a narrow range) very well: face unlock, film recommendations, spam filters, chess engines, chatbots. <b>All AI in use today is narrow.</b></p></div>
   <div class="keypts"><h3>General AI</h3><p><b>Hypothetical.</b> Would understand, learn and apply knowledge across <b>any</b> task, as flexibly as a person.</p></div>
   <div class="keypts"><h3>Super AI</h3><p><b>Hypothetical.</b> Would be more capable than humans in <b>every</b> area, raising big questions about control and safety.</p></div>
  </div>
 </section>
 <section>
  <h2>Machine learning</h2>
  <p>Traditional programs follow rules written by people. In <b>machine learning</b>, the system <b>learns patterns from data</b> and uses them to make predictions or decisions about new data.</p>
  <figure class="dgfig"><svg class="dg" viewBox="0 0 640 210" role="img" aria-label="Supervised learning: labelled training data trains a model which predicts labels for new data. Unsupervised learning: unlabelled data is grouped into clusters">
   <defs><marker id="mlA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs>
   <text x="10" y="20" class="h">Supervised</text>
   <rect x="10" y="32" width="160" height="56" rx="8" class="bw"/><text x="90" y="56" class="s c">emails + labels</text><text x="90" y="74" class="s c">spam / not spam</text>

   <line x1="170" y1="60" x2="236" y2="60" class="l" marker-end="url(#mlA)"/><line x1="350" y1="60" x2="416" y2="60" class="l" marker-end="url(#mlA)"/>
   <text x="10" y="125" class="h">Unsupervised</text>
   <rect x="10" y="137" width="160" height="56" rx="8" class="bw"/><text x="90" y="161" class="s c">shopping data</text><text x="90" y="179" class="s c">no labels</text>
   <rect x="240" y="145" width="110" height="40" rx="8" class="b2"/><text x="295" y="170" class="s c">find patterns</text>
   <line x1="170" y1="165" x2="236" y2="165" class="l" marker-end="url(#mlA)"/><line x1="350" y1="165" x2="416" y2="165" class="l" marker-end="url(#mlA)"/>

  </svg><figcaption>Supervised learning predicts labels; unsupervised learning finds groups nobody defined.</figcaption></figure>
  <h3>Supervised learning in action</h3>
  <p>Train a model on labelled fruit, then test it on fruit it hasn't seen:</p>
  <div class="mldemo" id="mldemo"></div>
  <h3>Unsupervised learning in action</h3>
  <div class="alw" data-w="cluster"></div>

  <div class="tscroll"><table class="pvt deftab"><tr><th></th><th>Supervised learning</th><th>Unsupervised learning</th></tr>
   <tr><td class="lbl">Training data</td><td><b>Labelled</b>: inputs with the correct answers</td><td><b>Unlabelled</b>: inputs only</td></tr>
   <tr><td class="lbl">Goal</td><td>Predict the label (classification) or a value (regression) for new data</td><td>Discover structure, e.g. <b>clusters</b> of similar items</td></tr>
   <tr><td class="lbl">Examples</td><td>Spam filters, diagnosing from scans, predicting house prices</td><td>Grouping customers, spotting unusual transactions, organising photos</td></tr>
   <tr><td class="lbl">Drawback</td><td>Labelling lots of data takes time and money</td><td>The groups found may be hard to interpret</td></tr></table></div>
  <div class="callout warnbox"><span class="k">Bias</span><p>A model is only as good as its data. If the training data under-represents a group, or contains past unfair decisions, the model will repeat them. That's why models are tested on <b>unseen</b> data and checked for fairness.</p></div>
 </section>

<template id="th-a6-2-llm">
<div class="theory airy">
 <section>
  <h2>Large language models</h2>
  <p class="lede">A <b>large language model (LLM)</b> is a machine learning model trained on a huge amount of text. It breaks text into <b>tokens</b> (words or parts of words) and generates a reply by repeatedly <b>predicting a likely next token</b>, given everything before it.</p>
  <figure class="dgfig"><svg class="dg" viewBox="0 0 640 120" role="img" aria-label="The prompt and context go into the model, which predicts the next token, adds it, and repeats">
   <defs><marker id="lmA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="currentColor"/></marker></defs>
   <rect x="10" y="30" width="200" height="50" rx="8" class="bw"/><text x="110" y="52" class="s c">context: prompt, chat so far,</text><text x="110" y="68" class="s c">documents supplied</text>
   <rect x="260" y="30" width="120" height="50" rx="8" class="b2"/><text x="320" y="60" class="s c">LLM</text>
   <rect x="430" y="30" width="200" height="50" rx="8" class="bi"/><text x="530" y="52" class="s c">next token, e.g.</text><text x="530" y="68" class="m c">"bus"</text>
   <line x1="210" y1="55" x2="256" y2="55" class="l" marker-end="url(#lmA)"/><line x1="380" y1="55" x2="426" y2="55" class="l" marker-end="url(#lmA)"/>
   <path d="M530 80 C530 112, 110 112, 110 84" class="ld" marker-end="url(#lmA)"/><text x="320" y="114" class="s c">added to the context; repeat</text>
  </svg></figure>
 </section>
 <section>
  <h2>Strengths and limits</h2>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Issue</th><th>What it means</th><th>What helps</th></tr>
   <tr><td class="lbl">Context</td><td>The model can only use what's in its <b>context window</b>: its training plus the prompt, conversation and documents given.</td><td>Clear, specific prompts with the relevant information included</td></tr>
   <tr><td class="lbl">Accuracy</td><td>Output is <b>plausible</b>, not guaranteed true. Models can <b>hallucinate</b>: invent facts, quotes or references fluently.</td><td>Check important facts against reliable sources</td></tr>
   <tr><td class="lbl">Knowledge limits</td><td>Training data stops at a <b>knowledge cut-off</b>, and some topics are poorly covered.</td><td>Supply up-to-date information, or use tools such as search</td></tr>
   <tr><td class="lbl">Bias and subjectivity</td><td>The training text contains opinions, stereotypes and imbalances, which can appear in output.</td><td>Critical reading; testing and adjusting models; varied training data</td></tr></table></div>
  <div class="alw" data-w="llm"></div>
  <div class="callout"><span class="k">Key idea</span><p>An LLM predicts language; it doesn't look facts up in a database. That's why it can explain things well and still be confidently wrong.</p></div>
  <div class="callout tip"><span class="k">Exam tip</span><p>For "explain a limitation" questions, give the limitation <b>and</b> its consequence, e.g. <i>the training data has a cut-off, <b>so</b> it may give out-of-date answers about recent events</i>.</p></div>
  <pre class="pc py" data-run data-t="Try it: a (very) small language model">import random
text = "the cpu fetches the instruction the cpu decodes the instruction the cpu executes it"
words = text.split()
nxt = {}
for a, b in zip(words, words[1:]):
    nxt.setdefault(a, []).append(b)     # which words followed each word
word, out = "the", ["the"]
for _ in range(8):
    if word not in nxt:
        break
    word = random.choice(nxt[word])     # predict a likely next word
    out.append(word)
print(" ".join(out))</pre>
  <p class="vfoot">Real LLMs use neural networks with billions of parameters instead of a table, but the idea of predicting the next token is the same.</p>
 </section>
</div>
</template>

<template id="th-a6-3-ide">
<div class="theory airy">
 <section>
  <h2>Integrated development environments</h2>
  <p class="lede">An <b>IDE</b> brings together everything needed to write, run, test and debug programs in one application. You'll use one throughout Units 2 and 4.</p>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Feature</th><th>How it helps</th></tr>
   <tr><td class="lbl">Text editor</td><td>Syntax highlighting, line numbers, auto-indentation and bracket matching make code easier to read and write.</td></tr>
   <tr><td class="lbl">Autocomplete</td><td>Suggests keywords, variable and function names as you type: faster, with fewer spelling mistakes.</td></tr>
   <tr><td class="lbl">Syntax checker</td><td>Underlines code that breaks the language rules (a missing colon or bracket) before you run it.</td></tr>
   <tr><td class="lbl">Run / console</td><td>Runs the program and shows output and error messages, with the line number where an error happened.</td></tr>
   <tr><td class="lbl">Debugger</td><td>Runs the program in a controlled way to find logic and runtime errors (below).</td></tr></table></div>
 </section>
 <section>
  <h2>Debugging</h2>
  <div class="ccards">
   <div class="keypts"><h3>Breakpoints</h3><p>Mark a line; the program pauses when it gets there, so you can look at its state at exactly that point.</p></div>
   <div class="keypts"><h3>Stepping</h3><p>Run one line at a time. <b>Step into</b> goes inside a called function; <b>step over</b> runs the function as a single step; <b>step out</b> finishes the current function.</p></div>
   <div class="keypts"><h3>Memory inspection</h3><p>See the current values of variables (a watch list), and sometimes the call stack and memory, while paused.</p></div>
  </div>
  <div class="alw" data-w="trace" data-bp data-bpl="5" data-vars="n,total" data-title="Try it: use the debugger" data-steps='[{"e":"line","line":1,"stack":[{"fn":"&lt;module>","loc":{}}],"out":"","ret":null},{"e":"line","line":8,"stack":[{"fn":"&lt;module>","loc":{}}],"out":"","ret":null},{"e":"line","line":2,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"average","loc":{"nums":"[4, 6, 8]"}}],"out":"","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"average","loc":{"nums":"[4, 6, 8]","total":"0"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"average","loc":{"nums":"[4, 6, 8]","total":"0","n":"4"}}],"out":"","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"average","loc":{"nums":"[4, 6, 8]","total":"4","n":"4"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"average","loc":{"nums":"[4, 6, 8]","total":"4","n":"6"}}],"out":"","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"average","loc":{"nums":"[4, 6, 8]","total":"10","n":"6"}}],"out":"","ret":null},{"e":"line","line":4,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"average","loc":{"nums":"[4, 6, 8]","total":"10","n":"8"}}],"out":"","ret":null},{"e":"line","line":3,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"average","loc":{"nums":"[4, 6, 8]","total":"18","n":"8"}}],"out":"","ret":null},{"e":"line","line":5,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"average","loc":{"nums":"[4, 6, 8]","total":"18","n":"8"}}],"out":"","ret":null},{"e":"line","line":6,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"average","loc":{"nums":"[4, 6, 8]","total":"18","n":"8","result":"7.0"}}],"out":"","ret":null},{"e":"return","line":6,"stack":[{"fn":"&lt;module>","loc":{}},{"fn":"average","loc":{"nums":"[4, 6, 8]","total":"18","n":"8","result":"7.0"}}],"out":"","ret":"7.0"},{"e":"end","line":null,"stack":[],"out":"7.0\n","ret":null}]'><pre>def average(nums):
    total = 0
    for n in nums:
        total = total + n
    result = total / len(nums) + 1
    return result

print(average([4, 6, 8]))</pre></div>
  <p>The average of 4, 6 and 8 should be 6, but the program prints 7. Press <b>Continue to next breakpoint</b> to run straight to line 5, look at <span class="mono">total</span> in the watch panel, and spot the bug.</p>
  <div class="callout"><span class="k">Key idea</span><p>A debugger is an automatic trace table. Instead of working the values out by hand, you watch them change and spot the line where they first go wrong.</p></div>
  <pre class="pc py" data-run data-t="Try it: find the bug by printing values">def average(nums):
    total = 0
    for n in nums:
        total = total + n
        print("n =", n, "total =", total)   # a 'poor man's debugger'
    return total / len(nums) + 1          # bug: why + 1?

print(average([4, 6, 8]))</pre>
  <p class="vfoot">Printing values works, but a debugger's breakpoints and watches do the same job without changing the code.</p>
 </section>
</div>
</template>

<template id="th-a6-3-collab">
<div class="theory airy">
 <section>
  <h2>Version control systems</h2>
  <p class="lede">A <b>version control system</b> (such as Git) records every change made to a project's files, who made it and why. It's essential when several people work on the same code, and useful even when you work alone.</p>
  <figure class="dgfig"><svg class="dg" viewBox="0 0 640 140" role="img" aria-label="Commits on the main branch; a feature branch splits off, has its own commits, and is merged back">
   <line x1="30" y1="40" x2="610" y2="40" class="l"/><text x="20" y="25" class="s">main</text>
   <circle cx="60" cy="40" r="10" class="b2"/><circle cx="160" cy="40" r="10" class="b2"/><circle cx="400" cy="40" r="10" class="b2"/><circle cx="560" cy="40" r="12" class="bi"/>
   <path d="M160 40 C200 100, 220 100, 260 100 L420 100 C470 100, 510 60, 560 40" class="la" fill="none"/><text x="230" y="125" class="ta s">feature branch</text>
   <circle cx="260" cy="100" r="10" class="bw"/><circle cx="340" cy="100" r="10" class="bw"/><circle cx="420" cy="100" r="10" class="bw"/>
   <text x="560" y="72" class="s c">merge</text><text x="60" y="68" class="s c">commit</text>
  </svg></figure>
  <div class="alw" data-w="git"></div>
  <div class="tscroll"><table class="pvt deftab"><tr><th>Idea</th><th>Meaning</th></tr>
   <tr><td class="lbl">Repository</td><td>The project's files plus their full history</td></tr>
   <tr><td class="lbl">Commit</td><td>A saved snapshot of changes, with a message saying what changed and why</td></tr>
   <tr><td class="lbl">Branch</td><td>A separate line of development, so a feature can be built without breaking the main code</td></tr>
   <tr><td class="lbl">Merge</td><td>Combining a branch's changes into another branch; a <b>conflict</b> happens if both changed the same lines</td></tr></table></div>
  <p><b>Benefits:</b> roll back to any earlier version; see exactly what changed when a bug appeared; many people can work at once; the history documents the project.</p>
 </section>
 <section>
  <h2>Open-source technologies</h2>
  <p><b>Open-source</b> software publishes its source code under a licence that lets anyone view, change and share it. Python, Linux, Firefox and SQLite are examples. <b>Proprietary</b> software keeps its code private; users buy a licence to use it.</p>
  <div class="kpgrid2">
   <div class="keypts"><h3>Open source: benefits</h3><ul><li>Usually free to use.</li><li>Anyone can inspect it for security problems and fix bugs.</li><li>Can be adapted to your needs.</li></ul></div>
   <div class="keypts"><h3>Open source: drawbacks</h3><ul><li>No guaranteed support or updates.</li><li>Documentation can be patchy.</li><li>Licences may require changes to be shared too.</li></ul></div>
  </div>
 </section>
 <section>
  <h2>Application programming interfaces</h2>
  <p>An <b>API</b> is a published set of functions and rules that lets one program use another's features or data, without knowing how it works inside. A weather app gets forecasts from a weather service's API; a Python program uses the <span class="mono">sqlite3</span> API to work with a database (Unit 2).</p>
  <pre class="pc py" data-run data-t="Try it: using an API (sqlite3)">import sqlite3
db = sqlite3.connect(":memory:")                 # the API hides how the database works
db.execute("CREATE TABLE Student (Name TEXT, Age INTEGER)")
db.executemany("INSERT INTO Student VALUES (?, ?)", [("Ana", 17), ("Ben", 16)])
for row in db.execute("SELECT Name FROM Student WHERE Age &gt; 16"):
    print(row[0])</pre>
 </section>
</div>
</template>
